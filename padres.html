// Vacía los campos de una tarjeta (Apoderado o un hijo/a específico) sin eliminarla ni
// afectar a las demás tarjetas ya llenadas.
function clearManualBlock(type, idx) {
  const ids = type === 'parent'
    ? ['mc-parent', 'mc-psurname', 'mc-phone']
    : ['mc-cname-' + idx, 'mc-csurname-' + idx, 'mc-colegio-' + idx, 'mc-nivel-' + idx, 'mc-grado-' + idx, 'mc-password-' + idx];

      + [1,2,3,4,5,6].map(g => `<option value="${g}">${g}°</option>`).join('');
  }
}
// Admin: crea una cuenta de padre/madre + alumno directamente, sin depender de que la
// familia haya enviado antes una solicitud de auto-registro. Reutiliza el mismo flujo de
// approveAccountRequest (misma generación de PIN, mismo alumno nuevo, mismo guardado) —
// simplemente se registra una "solicitud" ya con status 'pendiente' y se aprueba al toque,
// para que quede en el mismo historial de "Solicitudes de cuenta" con su clave asignada.
function createManualAccount() {
  const parentFirstName = document.getElementById('mc-parent').value.trim();
  const parentSurname = document.getElementById('mc-psurname').value.trim();
  const parentName = `${parentFirstName} ${parentSurname}`.trim();
  const phone = document.getElementById('mc-phone').value.trim();

  // Recolecta todas las tarjetas de hijo/a presentes en el DOM. Hijo/a 1 siempre existe;
  // las agregadas con "+ Agregar hijo/a" pueden no ser consecutivas si se quitó alguna con
  // "Quitar" (p.ej. quedan solo los índices 1 y 3) — por eso se leen por id en vez de asumir
  // un rango fijo.
  const childIdxs = Array.from(document.querySelectorAll('[id^="mc-child-block-"]'))
    .map(el => Number(el.id.slice('mc-child-block-'.length)))
    .sort((a, b) => a - b);
  const children = childIdxs.map(idx => ({
    childFirstName: document.getElementById('mc-cname-' + idx).value.trim(),
    childFirstSurname: document.getElementById('mc-csurname-' + idx).value.trim(),
    nivel: document.getElementById('mc-nivel-' + idx).value,
    grado: document.getElementById('mc-grado-' + idx).value,
    colegio: document.getElementById('mc-colegio-' + idx).value.trim(),
    // Contraseña manual del alumno/a (opcional, hasta 10 caracteres): es su PIN propio para
    // entrar a student.html/LEVEL ZONE. Si se deja vacía, approveAccountRequest genera una
    // clave automática de 4 dígitos, igual que antes.
    password: document.getElementById('mc-password-' + idx).value.trim().slice(0, 10)
  }));

  if (!parentFirstName || !parentSurname) {
    showToast('Completa el nombre y apellido del apoderado.');
    return;
  }
  if (!children.length || children.some(c => !c.childFirstName || !c.childFirstSurname)) {
    showToast('Completa el nombre y apellido de cada hijo/a.');
    return;
  }
  if (children.some(c => !c.nivel || !c.grado)) {
    showToast('Completa nivel y grado de cada hijo/a.');
    return;
  }
  const reg = {
    id: Date.now(),
    parentName, phone,
    children: children.map(c => ({ ...c, grado: Number(c.grado) })),
    status: 'pendiente',
    createdAt: new Date().toISOString(),
    source: 'manual'
  };
  DATA.accountRequests.push(reg);
  showManualCreateForm = false;
  // Tras crear la cuenta, regresa a la pestaña "Todas" (en vez de dejar la pestaña
  // "Nueva cuenta" abierta con el formulario ya vacío) y sincroniza la URL.

const _TMPL_DAY_NAMES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function _toMin(t) { var p=(t||'00:00').split(':').map(Number); return p[0]*60+p[1]; }
function _toTime(m) { return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

function saveTemplateForm() {
  const dayEl   = document.getElementById('tmpl-day');
  const wsEl    = document.getElementById('tmpl-wstart');
  const weEl    = document.getElementById('tmpl-wend');
  const durEl   = document.getElementById('tmpl-dur');
  const modEl   = document.getElementById('tmpl-mod');
  const bufEl   = document.getElementById('tmpl-buf');
  const scopeEl = document.getElementById('tmpl-scope');
  if (!wsEl.value || !weEl.value) { showToast('Indica la ventana de disponibilidad.'); return; }
  if (_toMin(wsEl.value) >= _toMin(weEl.value)) { showToast('La hora de inicio debe ser anterior al fin.'); return; }
  const scopeType = scopeEl ? scopeEl.value : 'cycle';
  var cycleId = null, dateFrom = null, dateTo = null;
  if (scopeType === 'cycle') {
    const cycEl = document.getElementById('tmpl-cycle');
    cycleId = (cycEl && cycEl.value !== '') ? cycEl.value : null;
  } else {
    const fromEl = document.getElementById('tmpl-from');
    const toEl   = document.getElementById('tmpl-to');
    dateFrom = fromEl ? fromEl.value : null;
    dateTo   = toEl   ? toEl.value   : null;
    if (!dateFrom || !dateTo) { showToast('Indica el rango de fechas.'); return; }
    if (dateFrom > dateTo) { showToast('La fecha de inicio debe ser anterior al fin.'); return; }
  }
  const tmpl = {
    id:          editingTemplateId === 'new' ? ('tmpl_' + Date.now()) : editingTemplateId,
    day:         parseInt(dayEl.value),
    scopeType,
    cycleId,
    dateFrom,
    dateTo,
    windowStart: wsEl.value,
    windowEnd:   weEl.value,
    slotDur:     parseInt(durEl.value),
    modality:    modEl.value,
    bufferMin:   parseInt(bufEl.value)
  };
  if (!DATA.templates) DATA.templates = [];
  // Validar solapamiento con otras plantillas del mismo día y ciclo
  const newS = _toMin(tmpl.windowStart), newE = _toMin(tmpl.windowEnd);
  const conflict = (DATA.templates||[]).find(function(t){
    if (t.id === tmpl.id) return false;                   // no comparar consigo misma al editar
    if (t.day !== tmpl.day) return false;                 // distinto día → ok
    // Mismo alcance: ambas cycle con mismo cycleId (o ambas sin cycleId)
    var sameScope = t.scopeType === tmpl.scopeType;
    if (!sameScope) return false;
    if (scopeType === 'cycle') {
      if (String(t.cycleId||'') !== String(tmpl.cycleId||'')) return false;
    } else {
      // dateRange: solapan si los rangos de fechas se cruzan
      if ((t.dateTo||'') < (tmpl.dateFrom||'') || (t.dateFrom||'') > (tmpl.dateTo||'')) return false;
    }
    // Ventanas de tiempo solapan?
    var tS = _toMin(t.windowStart), tE = _toMin(t.windowEnd);
    return newS < tE && newE > tS;
  });
  if (conflict) {
    showToast('La ventana de esta plantilla se solapa con otra del mismo día y ciclo ('+conflict.windowStart+'–'+conflict.windowEnd+').', 'error');
    return;
  }
  const idx = DATA.templates.findIndex(function(t){ return t.id === tmpl.id; });
  if (idx >= 0) DATA.templates[idx] = tmpl; else DATA.templates.push(tmpl);
  saveTemplates();
  editingTemplateId = null;
  render();
  showToast('Plantilla guardada.', 'success');
}

function _gapSlots(occupied, winStart, winEnd, dur, tmpl, extraProps) {
  occupied.sort(function(a,b){ return a[0]-b[0]; });
  var merged = [];
  occupied.forEach(function(iv){
    if (!merged.length || iv[0] >= merged[merged.length-1][1]) merged.push([iv[0],iv[1]]);
    else merged[merged.length-1][1] = Math.max(merged[merged.length-1][1],iv[1]);
  });
  var gaps = []; var cursor = winStart;
  merged.forEach(function(iv){
    var s = Math.max(iv[0],winStart), e = Math.min(iv[1],winEnd);
    if (s > cursor) gaps.push([cursor, Math.min(s, winEnd)]);
    if (e > cursor) cursor = e;
  });
  if (cursor < winEnd) gaps.push([cursor,winEnd]);
  var slots = [];
  gaps.forEach(function(gap){
    var t = gap[0];
    while (t+dur <= gap[1]) {
      var base = { id:'fs_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
        day:tmpl.day, start:_toTime(t), dur:dur, modality:tmpl.modality, bookedBy:null };
      Object.assign(base, extraProps);
      slots.push(base);
      t += dur;
    }
  });
  return slots;
}

function generateFromTemplate(tmplId) {
  const tmpl = (DATA.templates||[]).find(function(t){ return t.id === tmplId; });
  if (!tmpl) return;

  const winStart = _toMin(tmpl.windowStart);
  const winEnd   = _toMin(tmpl.windowEnd);
  const dur      = tmpl.slotDur;
  const buf      = tmpl.bufferMin || 0;
  var newSlots = [];

  // Helper: convierte una sesión en intervalo ocupado.
  // Domicilio → bloquea buf min ANTES y DESPUÉS (movilidad).
  // Virtual u otras → solo el tiempo de la sesión, sin buffer.
  function _sessInterval(s) {
    var st = _toMin(s.start), en = st + (s.dur||60);
    var mod = s.modality;
    var isDom = mod === 'Domicilio' || mod === 'domicilio';
    return isDom && buf > 0
      ? [Math.max(0, st - buf), en + buf]
      : [st, en];
  }

  if (tmpl.scopeType === 'dateRange') {
    // ── Rango de fechas ──
    if (!tmpl.dateFrom || !tmpl.dateTo) { showToast('Falta rango de fechas en la plantilla.','error'); return; }
    // Limpiar slots no reservados del rango antes de regenerar
    var _from = new Date(tmpl.dateFrom + 'T00:00:00');
    var _to   = new Date(tmpl.dateTo   + 'T00:00:00');
    DATA.freeSlots = (DATA.freeSlots||[]).filter(function(fs){
      if (fs.bookedBy) return true;
      if (fs.recurring !== false || !fs.oneTimeDate) return true;
      var fd = new Date(fs.oneTimeDate + 'T00:00:00');
      return !(fd >= _from && fd <= _to && fd.getDay() === tmpl.day);
    });
    var cur = new Date(tmpl.dateFrom + 'T00:00:00');
    var endD = new Date(tmpl.dateTo  + 'T00:00:00');
    while (cur <= endD) {
      if (cur.getDay() === tmpl.day) {
        var ds = cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
        var daySessions = (DATA.sessions||[]).filter(function(s){
          if (s.oneTimeDate) return s.oneTimeDate === ds;
          if (s.recurring === false || Number(s.day) !== tmpl.day) return false;
          if (Array.isArray(s.skipDates) && s.skipDates.indexOf(ds) !== -1) return false;
          var cutoff = cycleCutoffDate(s.cycleId);
          if (cutoff && cur > cutoff) return false;
          var cStart = cycleStartDate(s.cycleId);
          if (cStart && cur < cStart) return false;
          return true;
        });
        // Solo slots reservados (los no reservados ya fueron eliminados arriba)
        var dayFS = (DATA.freeSlots||[]).filter(function(fs){ return fs.bookedBy && fs.oneTimeDate === ds; });
        var occupied = [];
        daySessions.forEach(function(s){ occupied.push(_sessInterval(s)); });
        dayFS.forEach(function(fs){ var st=_toMin(fs.start); occupied.push([st, st+(fs.dur||60)]); });
        newSlots = newSlots.concat(_gapSlots(occupied, winStart, winEnd, dur, tmpl,
          { recurring:false, oneTimeDate:ds }));
      }
      cur.setDate(cur.getDate()+1);
    }
  } else {
    // ── Ciclo (recurrentes) ──
    // Limpieza unificada para el día completo:
    //   - Slots del propio cycleId → eliminar siempre (se van a regenerar).
    //   - Slots de otros cycleIds en el mismo día → conservar solo si caben
    //     dentro de la ventana de SU PROPIA plantilla; si no tienen plantilla
    //     propietaria, o si su hora está fuera de esa ventana, se eliminan.
    var _allDayTmpls = (DATA.templates||[]).filter(function(t){
      return t.scopeType !== 'dateRange' && Number(t.day) === tmpl.day;
    });
    var _tCyc = tmpl.cycleId == null ? null : String(tmpl.cycleId);
    DATA.freeSlots = (DATA.freeSlots||[]).filter(function(fs){
      if (fs.bookedBy) return true;
      // Slots de una sola vez generados por esta plantilla (skip-date): eliminar para regenerar
      if (fs.recurring === false && fs.tmplId != null && String(fs.tmplId) === String(tmpl.id)) return false;
      if (fs.recurring === false) return true;
      if (Number(fs.day) !== tmpl.day) return true;
      var fCyc = fs.cycleId == null ? null : String(fs.cycleId);
      if (fCyc === _tCyc) {
        // Mismo cycleId: conservar solo si OTRO template del mismo ciclo+día "posee" el slot
        // (es decir, el slot cae dentro de la ventana de esa otra plantilla).
        // Slots fuera de la ventana de cualquier otra plantilla → eliminar y regenerar.
        var fsS = _toMin(fs.start), fsE = fsS + (fs.dur || 60);
        var ownedByOther = _allDayTmpls.some(function(t){
          if (String(t.id) === String(tmpl.id)) return false; // ignorar plantilla actual
          if ((t.cycleId == null ? null : String(t.cycleId)) !== _tCyc) return false; // distinto ciclo
          var tS = _toMin(t.windowStart), tE = _toMin(t.windowEnd);
          return fsS >= tS && fsE <= tE; // slot completamente dentro de la otra ventana
        });
        return ownedByOther;
      }
      // Otro cycleId: conservar solo si está dentro de la ventana de su plantilla.
      var ownTmpl = _allDayTmpls.find(function(t){
        return (t.cycleId == null ? null : String(t.cycleId)) === fCyc;
      });
      if (!ownTmpl) return false; // sin plantilla → slot huérfano → eliminar
      var fsStart = _toMin(fs.start), fsEnd = fsStart + (fs.dur || 60);
      return fsStart >= _toMin(ownTmpl.windowStart) && fsEnd <= _toMin(ownTmpl.windowEnd);
    });
    // Excluir sesiones cuyas TODAS las ocurrencias en el ciclo están en skipDates
    function _allSkipped(s, cycleId, day) {
      if (!Array.isArray(s.skipDates) || !s.skipDates.length) return false;
      var cyc = (DATA.cycles||[]).find(function(c){ return String(c.id) === String(cycleId); });
      if (!cyc || !cyc.start || !cyc.end) return false;
      var cur = new Date(cyc.start + 'T00:00:00');
      var end = new Date(cyc.end   + 'T00:00:00');
      while (cur.getDay() !== day && cur <= end) cur.setDate(cur.getDate() + 1);
      if (cur > end) return true;
      while (cur <= end) {
        var ds = cur.toISOString().slice(0, 10);
        if (s.skipDates.indexOf(ds) === -1) return false;
        cur.setDate(cur.getDate() + 7);
      }
      return true;
    }
    var sessions = (DATA.sessions||[]).filter(function(s){
      if (!(s.recurring !== false && (Array.isArray(s.days) ? s.days.indexOf(tmpl.day)!==-1 : Number(s.day) === tmpl.day) &&
             (tmpl.cycleId == null || String(s.cycleId) === String(tmpl.cycleId)))) return false;
      if (s.nWeeks && s.weekStart) return false;
      if (tmpl.cycleId != null && _allSkipped(s, tmpl.cycleId, tmpl.day)) return false;
      return true;
    });
    // Solo slots reservados como ocupados (los no reservados ya fueron eliminados)
    var bookedFS = (DATA.freeSlots||[]).filter(function(fs){
      return fs.bookedBy && fs.recurring !== false && Number(fs.day) === tmpl.day &&
             (tmpl.cycleId == null || String(fs.cycleId) === String(tmpl.cycleId));
    });
    var occupied = [];
    sessions.forEach(function(s){ occupied.push(_sessInterval(s)); });
    bookedFS.forEach(function(fs){ var st=_toMin(fs.start); occupied.push([st, st+(fs.dur||60)]); });
    newSlots = _gapSlots(occupied, winStart, winEnd, dur, tmpl,
      { recurring:true, cycleId:tmpl.cycleId });

    // Generar slots puntuales para fechas donde sesiones recurrentes tienen skipDates.
    // Ejemplo: si la sesión de un alumno fue cancelada solo para una fecha, esa fecha
    // queda libre aunque el slot recurrente no pueda crearse (otros sábados aún están ocupados).
    sessions.forEach(function(sess) {
      if (!Array.isArray(sess.skipDates) || !sess.skipDates.length) return;
      sess.skipDates.forEach(function(sd) {
        var sdDate = new Date(sd + 'T00:00:00');
        if (sdDate.getDay() !== tmpl.day) return;
        // Verificar que la fecha cae dentro del ciclo
        var cycStart  = cycleStartDate(tmpl.cycleId);
        var cycCutoff = cycleCutoffDate(tmpl.cycleId);
        if (cycStart  && sdDate < cycStart)  return;
        if (cycCutoff && sdDate > cycCutoff) return;
        // Intervalos ocupados para esa fecha puntual, excluyendo las sesiones también skipeadas
        var dayOcc = [];
        sessions.forEach(function(s2) {
          if (s2.id === sess.id) return; // esta sesión está cancelada en esta fecha
          if (Array.isArray(s2.skipDates) && s2.skipDates.indexOf(sd) !== -1) return;
          dayOcc.push(_sessInterval(s2));
        });
        // Slots reservados (booked) de esa fecha específica
        (DATA.freeSlots||[]).filter(function(fs) {
          return fs.bookedBy && fs.oneTimeDate === sd;
        }).forEach(function(fs) { var st = _toMin(fs.start); dayOcc.push([st, st+(fs.dur||60)]); });
        // Generar slots puntuales; tmplId permite limpiarlos en la próxima regeneración
        var skipSlots = _gapSlots(dayOcc, winStart, winEnd, dur, tmpl,
          { recurring: false, oneTimeDate: sd, tmplId: tmpl.id });
        // Excluir rangos ya cubiertos por un slot recurrente recién generado
        skipSlots = skipSlots.filter(function(ns) {
          var nsS = _toMin(ns.start), nsE = nsS + (ns.dur||60);
          return !newSlots.some(function(rs) {
            if (rs.recurring === false) return false;
            var rsS = _toMin(rs.start), rsE = rsS + (rs.dur||60);
            return rsS <= nsS && rsE >= nsE;
          });
        });
        newSlots = newSlots.concat(skipSlots);
      });
    });

  }

  if (!DATA.freeSlots) DATA.freeSlots = [];
  if (!newSlots.length) {
    // La limpieza ya se aplicó en memoria (slots viejos fuera de ventana eliminados).
    // Guardar aunque no haya slots nuevos para que Firestore refleje la limpieza.
    saveFreeSlots();
    render();
    showToast('Ventana sin huecos disponibles (todas las horas están ocupadas por sesiones). Se actualizó el calendario.', 'info');
    return;
  }
  DATA.freeSlots = DATA.freeSlots.concat(newSlots);
  saveFreeSlots();
  render();
  showToast(newSlots.length + ' horario' + (newSlots.length!==1?'s':'') + ' libre' + (newSlots.length!==1?'s':'') + ' generado' + (newSlots.length!==1?'s':'') + '.', 'success');
}

              <div style="display:flex;gap:8px">
                <button class="btn-grn" style="padding:8px 14px;font-size:11px" onclick="approveAddChildRequest(${r.id})">✓ Aprobar y vincular</button>

          return st ? `${st.icon} ${st.name}` : `Alumno #${s.studentId}`;

      return `<div class="req-list-item" style="align-items:flex-start;margin-bottom:0">

          <div class="cs-meta">${(r.schedule||[]).join(' · ')}</div>
          <div class="cs-meta">S/. ${r.weekly}/semana · S/. ${r.total} mensual${r.cycleName ? ' · '+r.cycleName+(r.cycleWeeks ? ' ('+r.cycleWeeks+(r.cycleWeeks===1?' semana':' semanas')+')' : '') : ' (4 semanas)'}</div>

      ${editingCycleId === 'new' ? `

  const bodyPlantillas = `

      ${(DATA.templates||[]).length === 0 && editingTemplateId !== 'new' ? `

      ${(function(){

        function _tmplFormHtml(src, isNew) {
          const _last    = !isNew ? src : ((DATA.templates||[]).length ? DATA.templates[DATA.templates.length-1] : null);
          const _defDay  = !isNew && src ? src.day : (_last != null ? (_last.day + 1) % 7 : 1);
          const _defWs   = _last ? _last.windowStart     : '16:00';
          const _defWe   = _last ? _last.windowEnd       : '20:30';
          const _defDur  = _last ? _last.slotDur         : 60;
          // Normalizar modality de plantillas antiguas ('online'→'Virtual', 'domicilio'→'Domicilio')

          const _defMod = _rawDefMod === 'online' ? 'Virtual' : _rawDefMod === 'domicilio' ? 'Domicilio' : _rawDefMod;
          const _defBuf  = _last ? (_last.bufferMin||0)  : 30;
          const _defCyc  = _last ? (_last.cycleId||'')   : '';
          const _dayOpts = _TMPL_DAY_NAMES.map(function(n,i){ return '<option value="'+i+'"'+(_defDay===i?' selected':'')+'>'+n+'</option>'; }).join('');
          const _durOpts = [30,45,60,90,120].map(function(v){ return '<option value="'+v+'"'+(_defDur===v?' selected':'')+'>'+v+' min</option>'; }).join('');
          const _modOpts = ['Virtual','Domicilio'].map(function(v){ return '<option value="'+v+'"'+(_defMod===v?' selected':'')+'>'+v+'</option>'; }).join('');

                  <button id="tmpl-scope-btn-cycle" onclick="(function(){document.getElementById('tmpl-scope').value='cycle';document.getElementById('tmpl-scope-cycle-div').style.display='';document.getElementById('tmpl-scope-range-div').style.display='none';document.getElementById('tmpl-scope-btn-cycle').style.background='rgba(99,102,241,0.12)';document.getElementById('tmpl-scope-btn-range').style.background='transparent';})()" type="button" style="flex:1;padding:7px 8px;font-size:12px;border:none;cursor:pointer;background:rgba(99,102,241,0.12);font-weight:600">Ciclo</button>
                  <button id="tmpl-scope-btn-range" onclick="(function(){document.getElementById('tmpl-scope').value='dateRange';document.getElementById('tmpl-scope-cycle-div').style.display='none';document.getElementById('tmpl-scope-range-div').style.display='';document.getElementById('tmpl-scope-btn-range').style.background='rgba(99,102,241,0.12)';document.getElementById('tmpl-scope-btn-cycle').style.background='transparent';})()" type="button" style="flex:1;padding:7px 8px;font-size:12px;border:none;border-left:1px solid rgba(0,0,0,0.15);cursor:pointer;background:transparent">Fechas</button>
                </div>
              </div>
            </div>
            <div id="tmpl-scope-cycle-div" style="margin-bottom:8px">
              <label class="field-label" style="margin-top:0">Ciclo</label>
              <select class="fsm" id="tmpl-cycle" style="margin-bottom:0">${_cycOpts}</select>
            </div>
            <div id="tmpl-scope-range-div" style="display:none;margin-bottom:8px">
              <div style="display:flex;gap:8px">
                <div style="flex:1"><label class="field-label" style="margin-top:0">Desde</label><input class="fsm" id="tmpl-from" type="date" style="margin-bottom:0"></div>
                <div style="flex:1"><label class="field-label" style="margin-top:0">Hasta</label><input class="fsm" id="tmpl-to" type="date" style="margin-bottom:0"></div>

            </div>

            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
              <div style="flex:1;min-width:100px"><label class="field-label" style="margin-top:0">Duración bloque (min)</label><select class="fsm" id="tmpl-dur" style="margin-bottom:0">${_durOpts}</select></div>
              <div style="flex:1;min-width:100px"><label class="field-label" style="margin-top:0">Modalidad</label><select class="fsm" id="tmpl-mod" style="margin-bottom:0">${_modOpts}</select></div>
              <div style="flex:1;min-width:100px"><label class="field-label" style="margin-top:0">Buffer domicilio (min)</label><select class="fsm" id="tmpl-buf" style="margin-bottom:0">${_bufOpts}</select></div>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn-grn" style="width:auto;padding:9px 16px" onclick="saveTemplateForm()">Guardar</button>
              <button class="btn-ghost" style="margin-top:0;width:auto;padding:9px 16px" onclick="cancelEditTemplate()">Cancelar</button>
            </div>
          </div>`;
        }

        // Ordenar plantillas:
        // 1º ciclo más cercano a hoy (activo primero, luego próximos, luego pasados, "Todos" al final)
        // 2º día de la semana lunes→domingo (1,2,3,4,5,6,0)
        // 3º hora de inicio más temprana
        var _today0 = new Date(); _today0.setHours(0,0,0,0);
        function _cyclePriority(t) {
          if (t.scopeType === 'dateRange') {
            // Usar fecha de inicio del rango como referencia
            var s = t.dateFrom ? new Date(t.dateFrom+'T00:00:00') : _today0;
            return Math.abs(s - _today0);
          }
          if (!t.cycleId) return 9e15; // "Todos los ciclos" → al final
          var cyc = (DATA.cycles||[]).find(function(c){ return String(c.id)===String(t.cycleId); });
          if (!cyc) return 9e15;
          var cs = cyc.start ? new Date(cyc.start+'T00:00:00') : null;
          var ce = cyc.end   ? new Date(cyc.end  +'T00:00:00') : null;
          // Activo ahora → distancia 0
          if (cs && ce && _today0 >= cs && _today0 <= ce) return 0;
          // Próximo (aún no empieza) → distancia positiva hacia el futuro
          if (cs && _today0 < cs) return cs - _today0;
          // Pasado → penalizar (poner después de los futuros)
          if (ce) return 9e14 + (_today0 - ce);
          return 9e15;
        }
        function _dowSort(d) { return d === 0 ? 7 : d; } // domingo al final
        var sortedTemplates = (DATA.templates||[]).slice().sort(function(a, b){

        var html = sortedTemplates.map(function(tmpl){

            ? (tmpl.dateFrom||'').slice(5).replace('-','/') + '–' + (tmpl.dateTo||'').slice(5).replace('-','/')

          const isBeingEdited = editingTemplateId === tmpl.id;
          const card = `<div style="padding:12px 14px;border-bottom:1px solid rgba(0,0,0,0.06)${isBeingEdited?';background:rgba(99,102,241,0.03)':''}">

              </div>
              <div style="display:flex;gap:6px;flex-shrink:0">
                ${!editingTemplateId ? `<button class="btn-grn" style="padding:6px 14px;font-size:12px;margin:0;white-space:nowrap" onclick="generateFromTemplate('${tmpl.id}')">⚡ Generar</button>
                <button class="btn-ghost" style="padding:6px 12px;font-size:12px;margin:0;white-space:nowrap" onclick="startEditTemplate('${tmpl.id}')">✎ Editar</button>
                <button class="btn-ghost" style="padding:6px 12px;font-size:13px;margin:0;color:rgba(200,50,50,0.8);line-height:1" onclick="deleteTemplate(this,'${tmpl.id}')">✕</button>` : (isBeingEdited ? `<button class="btn-ghost" style="padding:6px 12px;font-size:12px;margin:0" onclick="cancelEditTemplate()">Cancelar</button>` : '')}
              </div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <span style="background:rgba(0,0,0,0.05);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;color:rgba(0,0,0,0.6)">${tmpl.slotDur} min</span>
              <span style="background:rgba(0,0,0,0.05);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;color:rgba(0,0,0,0.6)">${tmpl.modality||'—'}</span>
              <span style="background:rgba(0,0,0,0.05);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;color:rgba(0,0,0,0.6)">Buffer ${tmpl.bufferMin||0} min</span>
              <span style="background:rgba(99,102,241,0.1);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;color:rgba(99,102,241,0.9)">${cycleName}</span>
            </div>
          </div>`;
          return card + (isBeingEdited ? _tmplFormHtml(tmpl, false) : '');
        }).join('');

        // Formulario de nueva plantilla al final
        if (editingTemplateId === 'new') {
          html += _tmplFormHtml(null, true);
        } else if (!editingTemplateId) {
          html += `<div style="padding:10px 14px;${(DATA.templates||[]).length?'border-top:1px solid rgba(0,0,0,0.06)':''}">
            <button class="btn-ghost" style="margin-top:0;padding:5px 12px;font-size:12px" onclick="startAddTemplate()">+ Nueva plantilla</button>
          </div>`;
        }
        return html;
      })()}
    </div>
  `;

  const bodies = { clave: bodyClave, ciclo: bodyCiclo, plantillas: bodyPlantillas };

  return `

// Abrevia el nombre de un colegio para que quepa en la píldora de ancho fijo de
// vAdminFamilias(). Los colegios ya revisados usan la abreviatura exacta acordada;
// cualquier colegio nuevo que no esté en esta lista se abrevia automáticamente con el
// mismo criterio: se toma la inicial de cada palabra salvo la última (que queda completa),
// y las palabras de enlace ("de", "del", "la", "las", "los", "y") se omiten.
const COLEGIO_ABBREV = {
  'San Francisco de Asís': 'S. F. Asís',
  'Saco Oliveros': 'S. Oliveros',
  'San Ignacio de Recalde': 'S. I. Recalde',
  'San Agustín': 'San Agustín',
  'Santísima Trinidad': 'S. Trinidad',
  'Abraham Lincoln': 'Abraham Lincoln',
  'San Norberto': 'San Norberto',
  'Sagrados Corazones Belén': 'S. C. Belén',
  'Hans Christian Andersen': 'H. C. Andersen',
  'Jorge Basadre': 'Jorge Basadre',
  "St. George's": "St. George's",
  'Innova School': 'Innova School',
  'Arte Creative': 'Arte Creative'
};
const COLEGIO_STOPWORDS = ['de', 'del', 'la', 'las', 'los', 'y'];
function abbreviateColegio(name) {
  if (!name) return name;
  if (COLEGIO_ABBREV[name]) return COLEGIO_ABBREV[name];
  const words = name.trim().split(/\s+/);
  if (words.length <= 1) return name;
  if (words.length === 2) {
    // Con dos palabras, solo se abrevia si la primera tiene más de 7 letras
    // (ej. "Santísima Trinidad" → "S. Trinidad"); si es corta se deja igual
    // (ej. "Abraham Lincoln" no se toca).
    if (words[0].length > 7) return words[0].charAt(0).toUpperCase() + '. ' + words[1];
    return name;
  }
  const last = words[words.length - 1];
  const initials = words.slice(0, -1)
    .filter(w => !COLEGIO_STOPWORDS.includes(w.toLowerCase()))
    .map(w => w.charAt(0).toUpperCase() + '.');
  return initials.length ? (initials.join(' ') + ' ' + last) : last;
}

// Etiqueta de estado de datos de la familia (Nivel/Grado, Colegio y Teléfono),
// o "Ningún hijo asignado" si la cuenta todavía no tiene hijos/as vinculados. Usada en
// vAdminFamilias() junto al nombre de cada familia para detectar cuentas incompletas.
function familyStatusBadgeHtml(p, kids, id) {
  let text, bg, border, color;
  if (!kids.length) {
    text = 'Ningún hijo asignado';
    bg = 'rgba(0,0,0,0.06)'; border = 'rgba(0,0,0,0.15)'; color = 'rgba(0,0,0,0.55)';
  } else {
    const missing = [];
    if (kids.some(({s}) => !s.nivel || !s.grado)) missing.push('Nivel y Grado');
    if (kids.some(({s}) => !s.colegio)) missing.push('Colegio');
    if (!p.phone) missing.push('Teléfono');
    if (!missing.length) {
      text = 'Todo completo';
      bg = 'rgba(34,197,94,0.15)'; border = 'rgba(34,197,94,0.35)'; color = '#16a34a';
    } else {
      text = 'Falta ' + (missing.length === 1 ? missing[0]
        : missing.slice(0, -1).join(', ') + ' y ' + missing[missing.length - 1]);
      bg = 'rgba(239,68,68,0.12)'; border = 'rgba(239,68,68,0.32)'; color = '#dc2626';
    }
  }
  return `<div class="fam-pill"${id ? ' id="'+id+'"' : ''} style="background:${bg};border:1px solid ${border};color:${color}">${text}</div>`;
}

// true si a la familia le falta Nivel/Grado o Colegio en algún hijo/a, el Teléfono del
// padre/madre, o si todavía no tiene ningún hijo/a asignado. Usada para filtrar las
// sub-pestañas Incompletas/Completas de vAdminFamilias().
function isFamilyIncomplete(p, kids) {
  if (!kids.length) return true;
  if (kids.some(({s}) => !s.nivel || !s.grado)) return true;
  if (kids.some(({s}) => !s.colegio)) return true;
  if (!p.phone) return true;
  return false;
}

// Pestaña Familias → Recomendaciones (06/10/2026)
function _bodyRecomendaciones() {
  var opts = Object.entries(DATA.parents || {}).sort(function(a, b) { return a[1].name.localeCompare(b[1].name); })
    .map(function(e) { return '<option value="' + e[0] + '">' + e[1].name + '</option>'; }).join('');
  var hoyM = startOfWeek(new Date()).toISOString().slice(0, 10);
  var items = [];
  Object.keys(DATA.recomendaciones || {}).forEach(function(pid) {
    _recsDe(pid).forEach(function(r) {
      var wks = Object.keys(r.semanas || {}).sort();
      var usadas = wks.filter(function(w) { return w < hoyM; }).length;
      var activa = wks.some(function(w) { return w >= hoyM; }) || (wks.length < REC_SEMANAS);
      var estado = wks.length >= REC_SEMANAS && !wks.some(function(w) { return w >= hoyM; })
        ? '<span style="font-size:11px;font-weight:700;color:rgba(0,0,0,0.5);background:rgba(0,0,0,0.05);border-radius:8px;padding:3px 8px">Terminó</span>'
        : '<span style="font-size:11px;font-weight:700;color:#196e38;background:rgba(25,110,56,0.09);border-radius:8px;padding:3px 8px">Activa · ' + usadas + '/' + REC_SEMANAS + ' sem.</span>';
      var semTxt = wks.length ? wks.map(function(w) { return w.slice(8) + '/' + w.slice(5, 7); }).join(' · ') : 'Aún sin semanas';
      items.push('<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(0,0,0,0.07)">'
        + '<div style="min-width:0"><div style="font-size:13px;font-weight:700">' + ((DATA.parents[pid] || {}).name || pid) + ' ← ' + ((DATA.parents[r.refPid] || {}).name || r.refPid) + '</div>'
        + '<div style="font-size:11px;color:rgba(0,0,0,0.5);margin-top:2px">' + (r.pct || REC_PCT) + '% · desde ' + r.desde.slice(8) + '/' + r.desde.slice(5, 7) + ' · semanas: ' + semTxt + '</div></div>'
        + '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">' + estado
        + '<button onclick="deleteRecomendacion(\'' + pid + '\',\'' + r.id + '\')" style="border:1px solid rgba(0,0,0,0.12);background:#fff;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:11px">Quitar</button></div></div>');

            // Eliminar s si: other cubre TODOS los días de s (sDays ⊆ oDays)
            // Y además other tiene más días (superconjunto) O tiene igual cantidad pero
            // fue creado después (id mayor) → en duplicados exactos, queda el más reciente.
            return sDays.every(function(d){ return oDays.indexOf(d) !== -1; }) &&
                   (oDays.length > sDays.length || Number(other.id) > Number(s.id));
          });
        })
        .slice()
        .sort(function(a,b){ return a.day - b.day || a.start.localeCompare(b.start); })
        .map(function(s){
          var st = DATA.students[s.studentId] || {};
          var daysArr = Array.isArray(s.days) && s.days.length ? s.days : [Number(s.day)];
          // Ordenar días en orden lun→dom (domingo=0 va al final como 7)
          var sorted = daysArr.slice().sort(function(a,b){ return (a===0?7:a)-(b===0?7:b); });
          var daysLabel = sorted.map(function(d){ return DAY_NAMES[d]; }).join(' y ');
          return '<option value="'+s.id+'">'+(st.icon||'')+' '+(st.name||('Alumno '+s.studentId))+' — '+daysLabel+' '+s.start+'</option>';
        }).join('')

            var bDow = b.recurring === false ? new Date(b.date+'T00:00:00').getDay() : Number(b.day);
            return (aDow===0?7:aDow)-(bDow===0?7:bDow) || (a.start||'').localeCompare(b.start||'');
          })
          .filter(function(fs) {
            var key = (fs.recurring === false ? (fs.date||'') : String(fs.day)) + '|' + (fs.start||'');
            if (_seen[key]) return false;
            _seen[key] = true;

function openNewSession(opts) {
  smEditId = null; smEditFree = false; smEditOccDate = null;
  smType = (opts && opts.type) || 'session';
  _buildSM(opts && opts.prefill, false);
}

function openEditSession(id, isFree, occDate) {
  smEditId = id; smEditFree = !!isFree;
  smEditOccDate = occDate || null;
  smType = isFree ? 'free' : 'session';
  var src = isFree
    ? (DATA.freeSlots||[]).find(function(s){ return s.id==id; }) || {}
    : DATA.sessions.find(function(s){ return s.id==id; }) || {};
  // Sessions don't store parentId — look it up from children lists
  if (!isFree && src.studentId != null && !src.parentId) {
    var pe = Object.entries(DATA.parents).find(function(e) {
      return (e[1].children||[]).map(String).includes(String(src.studentId));
    });
    if (pe) src = Object.assign({}, src, { parentId: pe[0] });
  }
  _buildSM(src, true);
}

function closeSessionModal() {
  document.getElementById('session-modal').style.display = 'none';
  smEditId = null; smEditFree = false; smEditOccDate = null;
}

function convertFreeSlotToSession() {
  var fs = (DATA.freeSlots||[]).find(function(s){ return s.id==smEditId; });
  if (!fs) return;
  var occDate = smEditOccDate || fs.date || null;
  closeSessionModal();
  openNewSession({
    type: 'session',
    prefill: {
      day:      fs.day,
      start:    fs.start,
      dur:      fs.dur,
      modality: fs.modality || 'Virtual',
      date:     occDate
    }
  });
}

function smSetType(t) {
  smType = t;
  document.querySelectorAll('#sm-type-seg button').forEach(function(b){ b.classList.toggle('on', b.dataset.t===t); });
  document.getElementById('sm-sess-fields').style.display = t==='session' ? 'grid' : 'none';
  if (t === 'session') _smUpdateGradeDisplay();
}

function smToggleSeg(segId, btn) {
  document.querySelectorAll('#'+segId+' button').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
}

// Al elegir un alumno en el dropdown de reprogramación, sincroniza la modalidad del modal
// con la modalidad de la sesión seleccionada (Virtual / Domicilio).
function smSyncSwapModality(sessionId) {
  if (!sessionId) return;
  var sess = (DATA.sessions||[]).find(function(s){ return s.id == sessionId; });
  if (!sess || !sess.modality) return;
  var modBtns = document.querySelectorAll('#sm-mod-seg button');
  modBtns.forEach(function(b) {
    b.classList.toggle('on', b.textContent.trim() === sess.modality);
  });
}

function _smRebuildNWeeks(cycleEnd) {
  var nwEl     = document.getElementById('sm-nweeks');
  var nwStartEl = document.getElementById('sm-nw-start');
  if (!nwEl || !nwStartEl || !nwStartEl.value) return;
  var nwStart  = new Date(nwStartEl.value + 'T00:00:00');
  var endDate  = new Date(cycleEnd + 'T00:00:00');
  var maxW     = Math.max(1, Math.ceil((endDate - nwStart) / (7 * 24 * 60 * 60 * 1000)));
  var curVal   = Math.min(parseInt(nwEl.value) || 1, maxW);
  nwEl.innerHTML = Array.from({length: maxW}, function(_, i) {
    var n = i + 1;
    var ed = new Date(nwStart.getTime() + (n * 7 - 1) * 86400000);
    return '<option value="'+n+'"'+(n === curVal ? ' selected' : '')+'>'+n+' sem. · '+fmtDM(nwStart)+' – '+fmtDM(ed)+'</option>';
  }).join('');
}

function smToggleRec(btn, rec, cycleId) {
  document.querySelectorAll('#sm-rec-seg button').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  var isNWeeks  = rec === 'nweeks';
  var isRec     = rec === true || rec === 'true';
  var isOnce    = rec === false || rec === 'false';
  // Actualizar campo cycleId oculto
  var cycEl = document.getElementById('sm-cycle-id');
  if (cycEl) cycEl.value = (isRec && cycleId !== undefined && cycleId !== null) ? cycleId : '';
  // Reconstruir opciones de N° de semanas según el ciclo seleccionado
  if (isRec && cycleId != null) {
    var cycle = (DATA.cycles || []).find(function(c){ return String(c.id) === String(cycleId); });
    if (cycle && cycle.end) _smRebuildNWeeks(cycle.end);
  }
  // Visibilidad de sub-campos
  var dateWrap = document.getElementById('sm-date-wrap');
  if (dateWrap) dateWrap.style.display = isOnce ? '' : 'none';
  // N° de semanas siempre visible
  // Días multi-selección: solo para sesiones semanales de ciclo
  var daysWrap = document.getElementById('sm-days-wrap');
  if (daysWrap) daysWrap.style.display = (isRec || isNWeeks) ? '' : 'none';
  // "Aplicar a" solo tiene sentido en modo semanal
  var scopeWrap = document.getElementById('sm-scope-wrap');
  if (scopeWrap) scopeWrap.style.display = (isRec || isNWeeks) ? '' : 'none';
}

function _smGradeLabel(st) {
  if (!st) return '—';
  var nivel = st.nivel || '';
  var grado = st.grado || '';
  if (!nivel && !grado) return '—';
  var n = nivel === 'primaria' ? 'Primaria' : nivel === 'secundaria' ? 'Secundaria' : nivel === 'preuni' ? 'Pre-uni' : nivel;
  return grado ? grado + '° ' + n : n;
}
function _smUpdateModalityName() {
  var btn  = document.querySelector('#sm-mod-seg .on');
  var disp = document.getElementById('sm-modality-name');
  if (!disp) return;
  var mod = btn ? btn.textContent.trim() : 'Virtual';
  disp.textContent = mod === 'Domicilio' ? 'One to Family' : 'One to One';
}
function _smUpdateGradeDisplay() {
  var stuEl = document.getElementById('sm-student');
  var disp  = document.getElementById('sm-grade-display');
  if (!disp || !stuEl) return;
  var st = stuEl.value ? DATA.students[stuEl.value] : null;
  disp.textContent = st ? _smGradeLabel(st) : '—';
}
function smUpdateStudents() {
  var pid = document.getElementById('sm-parent').value;
  document.getElementById('sm-student').innerHTML = _smStudentOpts(pid, null);
  _smUpdateGradeDisplay();
}

// Toggle individual día en la sección multi-días (siempre debe haber al menos 1 activo)
function smToggleDay(btn) {
  var onCount = document.querySelectorAll('#sm-days-seg button.on').length;
  if (btn.classList.contains('on') && onCount <= 1) return;
  btn.classList.toggle('on');
  // Actualizar label del scope: si hay 2+ días → "Solo esta semana", si 1 → "Solo {fecha}"
  _smSyncScopeLabel();
}

// Maneja el clic en los botones de scope ("Todas las semanas" / "Solo esta semana").
// Cuando se selecciona "Todas las semanas" y la sesión es de una sola vez, auto-cambia
// la frecuencia al primer ciclo disponible para poder convertirla en recurrente.
function smScopeClicked(btn, scope) {
  smToggleSeg('sm-scope-seg', btn);
  if (scope === 'all') {
    // Si la frecuencia activa es el botón oculto "data-rec=false" (una sola vez),
    // auto-clic en el primer botón de ciclo para cambiar a recurrente.
    var onBtn = document.querySelector('#sm-rec-seg .on');
    if (onBtn && onBtn.dataset.rec === 'false') {
      var firstCycleBtn = document.querySelector('#sm-rec-seg button[data-rec="true"]');
      if (firstCycleBtn) firstCycleBtn.click();
    }
  }
  _smSyncScopeLabel();
}

// Actualiza el label del botón "Solo …" según la cantidad de días seleccionados.
function _smSyncScopeLabel() {
  var scopeOneBtn = document.querySelector('#sm-scope-seg button[data-scope="one"]');
  if (!scopeOneBtn || !smEditOccDate) return;
  var onCount = document.querySelectorAll('#sm-days-seg button.on').length;
  scopeOneBtn.textContent = onCount > 1
    ? 'Solo esta semana'
    : 'Solo ' + fmtDM(new Date(smEditOccDate + 'T00:00:00'));
}

// Sincroniza la sección "Días" cuando el usuario cambia el dropdown principal
// Solo actúa si el usuario no ha personalizado la selección (exactamente 1 día activo)
function smSyncDays(dowStr) {
  var daysWrap = document.getElementById('sm-days-wrap');
  if (!daysWrap || daysWrap.style.display === 'none') return;
  var sel = document.getElementById('sm-days-sel');
  if (sel) { sel.value = parseInt(dowStr); return; }
  var onBtns = document.querySelectorAll('#sm-days-seg button.on');
  if (onBtns.length !== 1) return; // ya tiene varios días → no sobreescribir
  onBtns.forEach(function(b){ b.classList.remove('on'); });
  var target = document.querySelector('#sm-days-seg button[data-dow="'+parseInt(dowStr)+'"]');
  if (target) target.classList.add('on');
}

// Cuando se edita "solo esta fecha" y se cambia el día de la semana, la excepción de una
// sola vez debe caer en la fecha real correspondiente a ese nuevo día (dentro de la misma
// semana lunes-domingo), no quedarse en la fecha original. Ej: sábado 20 → domingo, debe
// dar la fecha del domingo 21, no seguir guardando el 20.
function _shiftDateToDow(dateStr, newDow) {
  var d = new Date(dateStr + 'T00:00:00');
  var isoOrig = d.getDay() === 0 ? 7 : d.getDay();
  var isoNew  = newDow === 0 ? 7 : newDow;
  d.setDate(d.getDate() + (isoNew - isoOrig));
  return d.toISOString().slice(0, 10);
}

function submitSessionModal() {
  var dayEl   = document.getElementById('sm-day');
  var startEl = document.getElementById('sm-start');
  var durEl   = document.getElementById('sm-dur');
  if (!startEl || !startEl.value) { showToast('Indica la hora de inicio.'); return; }
  var day      = parseInt(dayEl.value);
  var start    = startEl.value;
  var dur      = parseInt(durEl.value);
  var modBtn   = document.querySelector('#sm-mod-seg .on');
  var modality = modBtn ? modBtn.textContent.trim() : 'Virtual';
  var recBtn   = document.querySelector('#sm-rec-seg .on');
  var freqType = recBtn ? recBtn.dataset.rec : 'true'; // 'true', 'false', 'nweeks'
  var isNWeeks = freqType === 'nweeks';
  var recurring = freqType !== 'false';
  var cycleIdEl  = document.getElementById('sm-cycle-id');
  var cycleIdVal = (cycleIdEl && cycleIdEl.value !== '') ? cycleIdEl.value : null;
  var dateEl   = document.getElementById('sm-date');
  var date     = recurring ? null : (dateEl ? dateEl.value || null : null);
  if (!recurring && !date) { showToast('Indica la fecha específica.'); return; }
  // N° de semanas siempre limita la duración (el selector siempre está visible)
  var nwEl = document.getElementById('sm-nweeks');
  var nWeeksVal = nwEl ? (parseInt(nwEl.value) || 1) : 1;
  var nwStartEl = document.getElementById('sm-nw-start');
  var weekStartVal = (nwStartEl && nwStartEl.value) ? nwStartEl.value : null;
  if (!weekStartVal) {
    var _td = new Date(); _td.setHours(0,0,0,0);
    var _diff = (day - _td.getDay() + 7) % 7;
    var _ws = new Date(_td.getTime() + _diff * 86400000);
    var _wsDow = _ws.getDay();
    _ws.setDate(_ws.getDate() - (_wsDow === 0 ? 6 : _wsDow - 1));
    weekStartVal = _ws.toISOString().slice(0, 10);
  }
  // Forzar nWeeks para que el campo siempre controle la duración
  isNWeeks = recurring;
  // Días seleccionados en la sección multi-días (solo para sesiones de ciclo)
  var selectedDays;
  var daysWrapEl = document.getElementById('sm-days-wrap');
  if (recurring && daysWrapEl && daysWrapEl.style.display !== 'none') {
    var _daysSel = document.getElementById('sm-days-sel');
    if (_daysSel) {
      selectedDays = [parseInt(_daysSel.value)];
    } else {
      var onDayBtns = document.querySelectorAll('#sm-days-seg button.on');
      selectedDays = Array.from(onDayBtns).map(function(b){ return parseInt(b.dataset.dow); });
      if (!selectedDays.length) selectedDays = [day];
    }
  } else {
    selectedDays = [day];
  }
  // El día principal es el del dropdown si está en la selección, si no el primero
  day = selectedDays.indexOf(day) !== -1 ? day : selectedDays[0];
  var curEditId = smEditId;
  // "Solo esta fecha": al editar una clase/horario que sigue siendo semanal, en vez de
  // reescribir la regla completa (lo que afectaría TODAS las semanas del ciclo) se le
  // agrega smEditOccDate al skipDates[] de la regla base (para que esa fecha puntual deje
  // de generarse con los valores viejos) y se crea una entrada nueva de una sola vez con
  // los valores editados. El resto de semanas de la serie quedan intactas.
  var scopeBtn = document.querySelector('#sm-scope-seg .on');
  var onlyThisDate = recurring && curEditId !== null && !!smEditOccDate
    && scopeBtn && scopeBtn.dataset.scope === 'one';
  if (smType === 'free') {
    if (!DATA.freeSlots) DATA.freeSlots = [];
    if (onlyThisDate) {
      var baseFs = DATA.freeSlots.find(function(s){ return s.id==curEditId; });
      if (baseFs) {
        if (!Array.isArray(baseFs.skipDates)) baseFs.skipDates = [];
        if (baseFs.skipDates.indexOf(smEditOccDate) === -1) baseFs.skipDates.push(smEditOccDate);
      }
      DATA.freeSlots.push({ id:'fs_'+Date.now(), day:day, start:start, dur:dur, modality:modality, recurring:false, date:_shiftDateToDow(smEditOccDate, day), bookedBy:null });
    } else {
      var fs = { id: curEditId !== null ? curEditId : ('fs_'+Date.now()), day:day, start:start, dur:dur, modality:modality, recurring:recurring, date:date, bookedBy:null };
      if (recurring && !isNWeeks) { fs.cycleId = cycleIdVal; fs.days = selectedDays; }
      if (isNWeeks) { fs.nWeeks = nWeeksVal; fs.weekStart = weekStartVal; }
      if (curEditId !== null) {
        var idx = DATA.freeSlots.findIndex(function(s){ return s.id==curEditId; });
        if (idx>=0) { fs.bookedBy = DATA.freeSlots[idx].bookedBy; DATA.freeSlots[idx]=fs; }
        else DATA.freeSlots.push(fs);
      } else { DATA.freeSlots.push(fs); }
    }
    saveFreeSlots();
  } else {
    var parEl = document.getElementById('sm-parent');
    var stuEl = document.getElementById('sm-student');
    if (!parEl || !stuEl || !stuEl.value) { showToast('Selecciona padre y alumno.'); return; }
    var studentId = parseInt(stuEl.value);
    var topicEl = document.getElementById('sm-topic');
    var topic = (topicEl && topicEl.value.trim()) || (modality === 'Virtual' ? 'One to One' : 'One to Family');
    if (onlyThisDate) {
      var baseSess = DATA.sessions.find(function(s){ return s.id==curEditId; });
      if (selectedDays.length > 1) {
        // "Solo esta semana" con múltiples días: crear una sesión de una sola vez por cada
        // día seleccionado en la misma semana ISO que smEditOccDate, y agregar cada fecha
        // a skipDates de la regla base para que esa semana no use los valores antiguos.
        if (baseSess && !Array.isArray(baseSess.skipDates)) baseSess.skipDates = [];
        selectedDays.forEach(function(dow, i) {
          var occDate = _shiftDateToDow(smEditOccDate, dow);
          if (baseSess && baseSess.skipDates.indexOf(occDate) === -1) baseSess.skipDates.push(occDate);
          DATA.sessions.push({ id: Date.now() + i + 1, studentId:studentId, day:dow, start:start, dur:dur, modality:modality, topic:topic, recurring:false, date:occDate });
        });
      } else {
        // "Solo esta fecha": comportamiento original (un solo día)
        if (baseSess) {
          if (!Array.isArray(baseSess.skipDates)) baseSess.skipDates = [];
          if (baseSess.skipDates.indexOf(smEditOccDate) === -1) baseSess.skipDates.push(smEditOccDate);
        }
        DATA.sessions.push({ id:Date.now(), studentId:studentId, day:day, start:start, dur:dur, modality:modality, topic:topic, recurring:false, date:_shiftDateToDow(smEditOccDate, day) });
      }
    } else {
      var sess = { id: curEditId !== null ? curEditId : Date.now(), studentId:studentId, day:day, start:start, dur:dur, modality:modality, topic:topic, recurring:recurring, date:date };
      if (recurring) {
        sess.nWeeks = nWeeksVal; sess.weekStart = weekStartVal; sess.days = selectedDays;
        if (cycleIdVal) sess.cycleId = cycleIdVal;
      }
      if (curEditId !== null) {
        var idx2 = DATA.sessions.findIndex(function(s){ return s.id==curEditId; });
        if (idx2>=0) DATA.sessions[idx2]=sess; else DATA.sessions.push(sess);
      } else { DATA.sessions.push(sess); }
    }
    saveSessions();
  }
  closeSessionModal();
  render();
  showToast(onlyThisDate
    ? (selectedDays.length > 1 ? 'Cambios guardados solo para esta semana.' : 'Cambios guardados solo para esa fecha.')
    : (curEditId !== null ? 'Cambios guardados.' : 'Creado correctamente.'), 'success');
}

// Reprogramación rápida: intercambia el horario libre que se está editando con la clase
// semanal de un alumno seleccionado. El horario libre pasa a tener el día/hora/duración/
// modalidad que tenía esa clase (queda libre ahí), y la clase del alumno se muda al día/
// hora que tenía este horario libre (conserva su propia duración y modalidad).
// Respeta el mismo selector "Aplicar este cambio a" (Todas las semanas / Solo esa fecha)
// que usa la edición normal de horario: si se eligió "Solo esa fecha", el intercambio NO
// toca las reglas semanales de ninguno de los dos — solo crea excepciones puntuales para
// esa semana (vía skipDates + una entrada de una sola vez), igual que el resto del ciclo
// sigue normal.
// Al elegir un horario libre en el dropdown "Reprogramar a", muestra popup de confirmación.
function _swapFreeSelected() {
  var sel = document.getElementById('sm-swap-free');
  if (!sel || !sel.value || !smEditOccDate) return;

  // Calcular fecha efectiva de la ocurrencia según offset de semana
  var weekOffset = parseInt((document.getElementById('sm-swap-week')||{value:'0'}).value, 10) || 0;
  var d = new Date(smEditOccDate + 'T00:00:00');
  d.setDate(d.getDate() + weekOffset * 7);
  var label = DAY_NAMES[d.getDay()] + ' ' + fmtDM(d);

  // Calcular repeticiones restantes para decidir si mostrar "en adelante"
  var _sess = (DATA.sessions||[]).find(function(s){ return s.id == smEditId; });
  var _remaining = null;
  if (_sess && _sess.nWeeks && _sess.weekStart) {
    var _occDow = d.getDay();
    var _occMon = new Date(d); _occMon.setDate(d.getDate() - (_occDow===0?6:_occDow-1));
    var _wsMon  = new Date(_sess.weekStart+'T00:00:00');
    _remaining  = _sess.nWeeks - Math.round((_occMon - _wsMon)/(7*24*60*60*1000));
  } else if (_sess && _sess.cycleId != null) {
    var _cyc = (DATA.cycles||[]).find(function(c){ return String(c.id)===String(_sess.cycleId); });
    if (_cyc && _cyc.end) {
      var _occDow2 = d.getDay();
      var _occMon2 = new Date(d); _occMon2.setDate(d.getDate() - (_occDow2===0?6:_occDow2-1));
      _remaining = Math.ceil((new Date(_cyc.end+'T00:00:00') - _occMon2)/(7*24*60*60*1000));
    }
  }
  var _showFwd = _remaining === null || _remaining > 1;

  var existing = document.getElementById('sm-del-popup');
  if (existing) existing.remove();
  var popup = document.createElement('div');
  popup.id = 'sm-del-popup';
  popup.innerHTML =
      '<div class="sm-del-popup-bg" onclick="_swapCancelPopup()"></div>'
    + '<div class="sm-del-popup-card">'
    + '<div class="sm-del-popup-title">¿A qué fecha reprogramar?</div>'
    + '<button class="sm-del-popup-btn sm-reprog-btn" onclick="_swapExecOne()">Solo ' + label + '</button>'
    + (_showFwd
        ? '<button class="sm-del-popup-btn sm-reprog-btn" onclick="_swapExecForward()">Desde ' + label + ' en adelante</button>'
        : '')
    + '<button class="sm-del-popup-cancel" onclick="_swapCancelPopup()">Cancelar</button>'
    + '</div>';
  document.body.appendChild(popup);
}
function _swapCancelPopup() {
  _delCancelPopup();
  var sel = document.getElementById('sm-swap-free');
  if (sel) sel.value = '';
}
function _swapExecOne()     { var wo=parseInt((document.getElementById('sm-swap-week')||{value:'0'}).value,10)||0; _delCancelPopup(); swapSessionWithFreeSlot('one', wo); }
function _swapExecForward() { var wo=parseInt((document.getElementById('sm-swap-week')||{value:'0'}).value,10)||0; _delCancelPopup(); swapSessionWithFreeSlot('all', wo); }

// Reprogramación desde sesión: mueve la/s ocurrencia/s de smEditOccDate al horario libre.
// mode='one' → solo esa fecha.  mode='all' → desde esa fecha en adelante (serie truncada).
function swapSessionWithFreeSlot(mode, weekOffset) {
  var sel = document.getElementById('sm-swap-free');
  var fsId = sel ? sel.value : null;
  if (!fsId || smEditId == null || !smEditOccDate) return;
  var _weekOff = weekOffset || 0;

  var fsIdx   = (DATA.freeSlots||[]).findIndex(function(s){ return s.id == fsId; });
  var sessIdx = (DATA.sessions||[]).findIndex(function(s){ return s.id == smEditId; });
  if (fsIdx < 0 || sessIdx < 0) { showToast('No se encontró el horario seleccionado.'); return; }

  var fs   = DATA.freeSlots[fsIdx];
  var sess = DATA.sessions[sessIdx];
  // Fecha efectiva de la ocurrencia de la sesión (ajustada por offset de semana)
  var effectiveOccDate = (function(){
    var d = new Date(smEditOccDate+'T00:00:00');
    d.setDate(d.getDate() + _weekOff * 7);
    return d.toISOString().slice(0,10);
  })();
  // Fecha del horario libre en la misma semana que effectiveOccDate
  var fsFreeDate = (fs.recurring === false && fs.date)
    ? fs.date : _shiftDateToDow(effectiveOccDate, Number(fs.day));
  var fsFreeDow = new Date(fsFreeDate+'T00:00:00').getDay();

  if (mode === 'one') {
    // ── Solo esta fecha ──
    if (!Array.isArray(sess.skipDates)) sess.skipDates = [];
    if (sess.skipDates.indexOf(effectiveOccDate) === -1) sess.skipDates.push(effectiveOccDate);
    DATA.sessions.push({ id:Date.now(), studentId:sess.studentId,
      day:fsFreeDow, start:fs.start, dur:sess.dur, modality:sess.modality, topic:sess.topic,
      recurring:false, date:fsFreeDate });
    if (fs.recurring === false) {
      DATA.freeSlots.splice(DATA.freeSlots.findIndex(function(s){ return s.id==fsId; }), 1);
    } else {
      if (!Array.isArray(fs.skipDates)) fs.skipDates = [];
      if (fs.skipDates.indexOf(fsFreeDate) === -1) fs.skipDates.push(fsFreeDate);
    }
    DATA.freeSlots.push({ id:'fs_'+(Date.now()+1), day:Number(sess.day), start:sess.start,
      dur:fs.dur||sess.dur||60, modality:fs.modality||sess.modality, recurring:false, date:effectiveOccDate });

  } else {
    // ── Desde esta fecha en adelante: truncar ambas series y crear nuevas ──
    var occDate  = new Date(effectiveOccDate+'T00:00:00');
    var occDow   = occDate.getDay();
    var occMon   = new Date(occDate); occMon.setDate(occDate.getDate()-(occDow===0?6:occDow-1));
    var fsFreeMon= new Date(fsFreeDate+'T00:00:00'); var ffd=fsFreeMon.getDay();
    fsFreeMon.setDate(fsFreeMon.getDate()-(ffd===0?6:ffd-1));

    // Truncar sesión original antes de esta semana
    function _truncSess(rec) {
      var ws = rec.weekStart ? new Date(rec.weekStart+'T00:00:00')
        : (function(){ var cyc=(DATA.cycles||[]).find(function(c){return String(c.id)===String(rec.cycleId);});
            var cs=cyc&&cyc.start?new Date(cyc.start+'T00:00:00'):null;
            if(cs){var d2=new Date(cs);var dow2=cs.getDay();d2.setDate(cs.getDate()-(dow2===0?6:dow2-1));return d2;}
            return occMon; })();
      var keep = Math.round((occMon - ws)/(7*24*60*60*1000));
      if (keep <= 0) return false;
      rec.weekStart = ws.toISOString().slice(0,10); rec.nWeeks = keep; return true;
    }
    // Truncar free slot antes de su semana correspondiente
    function _truncFs(rec) {
      var ws = rec.weekStart ? new Date(rec.weekStart+'T00:00:00')
        : (function(){ var cyc=(DATA.cycles||[]).find(function(c){return String(c.id)===String(rec.cycleId);});
            var cs=cyc&&cyc.start?new Date(cyc.start+'T00:00:00'):null;
            if(cs){var d2=new Date(cs);var dow2=cs.getDay();d2.setDate(cs.getDate()-(dow2===0?6:dow2-1));return d2;}
            return fsFreeMon; })();
      var keep = Math.round((fsFreeMon - ws)/(7*24*60*60*1000));
      if (keep <= 0) return false;
      rec.weekStart = ws.toISOString().slice(0,10); rec.nWeeks = keep; return true;
    }

    var sessKept = _truncSess(sess);
    if (!sessKept) DATA.sessions.splice(sessIdx, 1);

    var fsKept = (fs.recurring !== false) ? _truncFs(fs) : false;
    if (!fsKept) DATA.freeSlots.splice(DATA.freeSlots.findIndex(function(s){ return s.id==fsId; }), 1);

    // Nueva sesión desde fsFreeDate con el día/hora del horario libre
    // Calcular semanas restantes a partir de la sesión original
    var _remCalc = null;
    if (sess.nWeeks && sess.weekStart) {
      var _ws2 = new Date(sess.weekStart+'T00:00:00');
      _remCalc = sess.nWeeks - Math.round((occMon - _ws2)/(7*24*60*60*1000));
    } else if (sess.cycleId != null) {
      var _cyc2 = (DATA.cycles||[]).find(function(c){ return String(c.id)===String(sess.cycleId); });
      if (_cyc2 && _cyc2.end) _remCalc = Math.ceil((new Date(_cyc2.end+'T00:00:00') - occMon)/(7*24*60*60*1000));
    }
    var newSessWeeks = _remCalc || 4;
    DATA.sessions.push({ id:Date.now(), studentId:sess.studentId, day:fsFreeDow,
      start:fs.start, dur:sess.dur, modality:sess.modality, topic:sess.topic,
      recurring:true, weekStart:fsFreeMon.toISOString().slice(0,10), nWeeks:newSessWeeks });

    // Nuevo horario libre desde effectiveOccDate con el día/hora de la sesión original
    DATA.freeSlots.push({ id:'fs_'+(Date.now()+1), day:Number(sess.day), start:sess.start,
      dur:fs.dur||sess.dur||60, modality:fs.modality||sess.modality,
      recurring:true, weekStart:occMon.toISOString().slice(0,10), nWeeks:newSessWeeks });
  }

  REF.set({ freeSlots:DATA.freeSlots, sessions:DATA.sessions }, { merge:true })
    .catch(function(e){ console.error(e); showToast('Error al guardar el cambio.'); });
  closeSessionModal(); render();
  showToast('Clase reprogramada al '+fmtDM(new Date(fsFreeDate+'T00:00:00'))+'.', 'success');
}

function swapFreeSlotWithSession() {
  var sel = document.getElementById('sm-swap-session');
  if (!sel || !sel.value) { showToast('Selecciona un alumno y horario para reprogramar.'); return; }
  if (smEditId == null) return;
  var fsIdx   = (DATA.freeSlots||[]).findIndex(function(s){ return s.id == smEditId; });
  var sessIdx = (DATA.sessions||[]).findIndex(function(s){ return s.id == sel.value; });
  if (fsIdx < 0 || sessIdx < 0) { showToast('No se encontró el horario seleccionado.'); return; }
  var fs   = DATA.freeSlots[fsIdx];
  var sess = DATA.sessions[sessIdx];

  var recBtn   = document.querySelector('#sm-rec-seg .on');
  var recurring = recBtn ? recBtn.dataset.rec !== 'false' : true;
  var scopeBtn = document.querySelector('#sm-scope-seg .on');
  var onlyThisDate = recurring && !!smEditOccDate && scopeBtn && scopeBtn.dataset.scope === 'one';

  if (onlyThisDate) {
    // Fecha del alumno (su ocurrencia semanal normal) dentro de la misma semana que la
    // fecha del horario libre que se está editando — la que va a quedar libre.
    var sessOccDate = _shiftDateToDow(smEditOccDate, sess.day);
    if (!Array.isArray(fs.skipDates)) fs.skipDates = [];
    if (fs.skipDates.indexOf(smEditOccDate) === -1) fs.skipDates.push(smEditOccDate);
    if (!Array.isArray(sess.skipDates)) sess.skipDates = [];
    if (sess.skipDates.indexOf(sessOccDate) === -1) sess.skipDates.push(sessOccDate);
    // Ese día, el horario que normalmente tiene el alumno queda libre por una sola vez.
    DATA.freeSlots.push({ id:'fs_'+Date.now(), day:sess.day, start:sess.start, dur:sess.dur, modality:sess.modality, recurring:false, date:sessOccDate, bookedBy:null });
    // Y el alumno toma, por una sola vez, el horario que estaba libre.
    DATA.sessions.push({ id:Date.now(), studentId:sess.studentId, day:fs.day, start:fs.start, dur:sess.dur, modality:sess.modality, topic:sess.topic, recurring:false, date:smEditOccDate });
  } else {
    var newFreeDay = sess.day, newFreeStart = sess.start, newFreeDur = sess.dur, newFreeMod = sess.modality;
    // Leer día/hora/días del FORMULARIO (no del dato guardado), porque el usuario
    // puede haber modificado los días en el modal antes de hacer clic en Intercambiar.
    var _formDay   = parseInt((document.getElementById('sm-day')||{}).value) || fs.day;
    var _formStart = (document.getElementById('sm-start')||{}).value || fs.start;
    var _daysWrap  = document.getElementById('sm-days-wrap');
    var _formDays;
    if (_daysWrap && _daysWrap.style.display !== 'none') {
      var _daysSel2 = document.getElementById('sm-days-sel');
      if (_daysSel2) {
        _formDays = [parseInt(_daysSel2.value)];
      } else {
        var _onBtns = document.querySelectorAll('#sm-days-seg button.on');
        _formDays = Array.from(_onBtns).map(function(b){ return parseInt(b.dataset.dow); });
        if (!_formDays.length) _formDays = [_formDay];
      }
    } else {
      _formDays = [_formDay];
    }
    _formDay = _formDays.indexOf(_formDay) !== -1 ? _formDay : _formDays[0];
    var newSessDay = _formDay, newSessStart = _formStart;
    var newSessDays = _formDays.length > 1 ? _formDays : [];
    var newFs = { id: fs.id, day: newFreeDay, start: newFreeStart, dur: newFreeDur, modality: newFreeMod, recurring: true, date: null, bookedBy: null };
    if (fs.cycleId != null) newFs.cycleId = fs.cycleId;
    DATA.freeSlots[fsIdx] = newFs;
    // days: newSessDays copia los días del horario libre (vacío=un solo día).
    // Sin esto, si la sesión tenía days:[0,6] (sáb+dom), Object.assign lo copiaría
    // y el alumno seguiría apareciendo en sus días originales.
    DATA.sessions[sessIdx] = Object.assign({}, sess, { day: newSessDay, days: newSessDays, start: newSessStart, recurring: true, date: null, skipDates: Array.isArray(sess.skipDates) ? sess.skipDates : [] });
  }
  // Importante: freeSlots y sessions se guardan en UNA sola escritura (no dos llamadas
  // separadas a saveFreeSlots()/saveSessions()). Si se guardan por separado, el snapshot
  // de Firestore puede "hacer eco" del primer guardado antes de que el segundo se complete,
  // y ese eco trae de vuelta el campo que todavía no se guardó con su valor viejo —
  // pisando localmente el cambio recién hecho y haciendo que el horario anterior reaparezca
  // en el desplegable de "Reprogramar alumno" (o en el calendario) por un momento, o de forma
  // persistente si la segunda escritura nunca llega a aplicarse bien. Una sola escritura
  // atómica con ambos campos evita esa condición de carrera.
  REF.set({ freeSlots: DATA.freeSlots, sessions: DATA.sessions }, { merge:true })
    .catch(function(e){ console.error(e); showToast('Error al guardar el cambio.'); });
  closeSessionModal();
  render();
  showToast(onlyThisDate ? 'Horario reprogramado solo para esa fecha.' : 'Horario reprogramado: el alumno se mudó, y su horario anterior ahora está libre.', 'success');
}

function deleteSessionFromModal() {
  var wrap = document.getElementById('sm-del-wrap');
  if (!wrap) return;

  // Si tenemos fecha de ocurrencia, siempre mostramos el popup (incluso para puntales).
  // Sin fecha de ocurrencia: doble-tap directo.
  if (!smEditOccDate) {
    var btn = wrap.querySelector('.sm-del-btn');
    if (!btn) return;
    if (!btn.dataset.confirmed) {
      btn.textContent = '¿Confirmar? Toca de nuevo para eliminar.';
      btn.style.background = 'rgba(0,0,0,0.07)';
      btn.dataset.confirmed = '1';
      return;
    }
    _execDelete('all');
    return;
  }

  var d = new Date(smEditOccDate + 'T00:00:00');
  var label = DAY_NAMES[d.getDay()] + ' ' + fmtDM(d);

  // ¿Es recurrente? Determina si mostrar "Desde aquí en adelante"
  var _rec = smEditFree
    ? (DATA.freeSlots||[]).find(function(x){ return x.id==smEditId; })
    : (DATA.sessions||[]).find(function(x){ return x.id==smEditId; });
  var isRecurring = _rec && _rec.recurring !== false;

  var _remainingWeeks = null;
  if (isRecurring && _rec) {
    if (_rec.nWeeks && _rec.weekStart) {
      var _occDow  = d.getDay();
      var _occMon  = new Date(d); _occMon.setDate(d.getDate() - (_occDow === 0 ? 6 : _occDow - 1));
      var _wsMon   = new Date(_rec.weekStart + 'T00:00:00');
      _remainingWeeks = _rec.nWeeks - Math.round((_occMon - _wsMon) / (7 * 24 * 60 * 60 * 1000));
    } else if (_rec.cycleId != null) {
      var _cycle = (DATA.cycles||[]).find(function(c){ return String(c.id)===String(_rec.cycleId); });
      if (_cycle && _cycle.end) {
        var _occDow2 = d.getDay();
        var _occMon2 = new Date(d); _occMon2.setDate(d.getDate() - (_occDow2 === 0 ? 6 : _occDow2 - 1));
        _remainingWeeks = Math.ceil((new Date(_cycle.end + 'T00:00:00') - _occMon2) / (7 * 24 * 60 * 60 * 1000));
      }
    }
  }
  // Mostrar "Desde aquí en adelante" siempre que sea recurrente (remaining >= 1).
  // Deshabilitarla cuando solo queda 1 repetición (esta misma): así el usuario entiende
  // visualmente que no hay más ocurrencias en este ciclo sin ocultar la opción.
  var _showForward    = isRecurring && (_remainingWeeks === null || _remainingWeeks >= 1);
  var _forwardEnabled = isRecurring && (_remainingWeeks === null || _remainingWeeks > 1);

  var existing = document.getElementById('sm-del-popup');
  if (existing) existing.remove();
  var popup = document.createElement('div');
  popup.id = 'sm-del-popup';
  popup.innerHTML =
      '<div class="sm-del-popup-bg" onclick="_delCancelPopup()"></div>'
    + '<div class="sm-del-popup-card">'
    + '<div class="sm-del-popup-title">¿Qué deseas eliminar?</div>'
    + '<button class="sm-del-popup-btn" onclick="_delOnlyThisDate()">Solo ' + label + '</button>'
    + (_showForward
        ? '<button class="sm-del-popup-btn'+ (_forwardEnabled ? '' : ' sm-del-popup-btn--disabled') +'"'
          + (_forwardEnabled ? ' onclick="_delFromHereForward()"' : ' disabled title="No hay más repeticiones en este ciclo"')
          + '>Desde ' + label + ' en adelante</button>'
        : '')
    + '<button class="sm-del-popup-cancel" onclick="_delCancelPopup()">Cancelar</button>'
    + '</div>';
  document.body.appendChild(popup);
}

function _delCancelPopup() {
  var el = document.getElementById('sm-del-popup');
  if (el) el.remove();
}

function _delOnlyThisDate() {
  _delCancelPopup();
  if (smEditFree) {
    var fs = (DATA.freeSlots||[]).find(function(s){ return s.id==smEditId; });
    if (fs) {
      if (fs.recurring === false) {
        // Slot de una sola vez: eliminar del array (skipDates no se checa para estos)
        DATA.freeSlots = (DATA.freeSlots||[]).filter(function(s){ return s.id !== smEditId; });
      } else {
        if (!Array.isArray(fs.skipDates)) fs.skipDates = [];
        if (fs.skipDates.indexOf(smEditOccDate) === -1) fs.skipDates.push(smEditOccDate);
      }
    }
    saveFreeSlots();
  } else {
    var sess = (DATA.sessions||[]).find(function(s){ return s.id==smEditId; });
    if (sess) {
      if (sess.recurring === false) {
        // Sesión de una sola vez: eliminar del array
        DATA.sessions = (DATA.sessions||[]).filter(function(s){ return s.id !== smEditId; });
      } else {
        if (!Array.isArray(sess.skipDates)) sess.skipDates = [];
        if (sess.skipDates.indexOf(smEditOccDate) === -1) sess.skipDates.push(smEditOccDate);
      }
    }
    saveSessions();
  }
  closeSessionModal(); render();
  showToast('Horario cancelado solo para esa fecha.', 'success');
}

function _delFromHereForward() {
  _delCancelPopup();
  var occDate  = new Date(smEditOccDate + 'T00:00:00');
  var occDow   = occDate.getDay();
  var occMonday = new Date(occDate);
  occMonday.setDate(occDate.getDate() - (occDow === 0 ? 6 : occDow - 1));

  function _truncate(rec) {
    // Calcular weekStart si no existe
    var ws = null;
    if (rec.weekStart) {
      ws = new Date(rec.weekStart + 'T00:00:00');
    } else {
      // Ciclo-based: usar lunes de inicio del ciclo como weekStart
      var cycle = rec.cycleId != null ? (DATA.cycles||[]).find(function(c){ return String(c.id)===String(rec.cycleId); }) : null;
      var csDate = (cycle && cycle.start) ? new Date(cycle.start + 'T00:00:00') : null;
      if (csDate) {
        ws = new Date(csDate);
        var csDow = csDate.getDay();
        ws.setDate(csDate.getDate() - (csDow === 0 ? 6 : csDow - 1));
      } else {
        ws = occMonday; // fallback: truncar desde esta semana (deja 0 semanas → eliminar)
      }
    }
    var weeksToKeep = Math.round((occMonday - ws) / (7 * 24 * 60 * 60 * 1000));
    if (weeksToKeep <= 0) return false; // eliminar toda la sesión
    rec.weekStart = ws.toISOString().slice(0, 10);
    rec.nWeeks = weeksToKeep;
    return true; // sesión modificada, no eliminada
  }

  if (smEditFree) {
    var fs = (DATA.freeSlots||[]).find(function(s){ return s.id==smEditId; });
    if (fs) {
      var kept = _truncate(fs);
      if (!kept) DATA.freeSlots = (DATA.freeSlots||[]).filter(function(s){ return s.id!=smEditId; });
    }
    saveFreeSlots();
  } else {
    var sess = (DATA.sessions||[]).find(function(s){ return s.id==smEditId; });
    if (sess) {
      var kept = _truncate(sess);
      if (!kept) DATA.sessions = DATA.sessions.filter(function(s){ return s.id!=smEditId; });
    }
    saveSessions();
  }
  closeSessionModal(); render();
  showToast('Eliminado desde esa fecha en adelante.', 'success');
}

function _execDelete(scope) {
  if (smEditFree) {
    DATA.freeSlots = (DATA.freeSlots||[]).filter(function(s){ return s.id!=smEditId; });
    saveFreeSlots();
  } else {
    DATA.sessions = DATA.sessions.filter(function(s){ return s.id!=smEditId; });
    saveSessions();
  }
  closeSessionModal(); render();
  showToast('Eliminado.', 'success');
}

function bookFreeSlot(fsId) {
  var parentId = getLoggedParent();
  if (!parentId) return;
  var parent = DATA.parents[parentId];
  if (!parent) return;
  var fs = (DATA.freeSlots||[]).find(function(s){ return s.id===fsId; });
  if (!fs || fs.bookedBy) { showToast('Este horario ya no está disponible.'); return; }
  var kids = (parent.children||[]).map(function(id){ var st=DATA.students[id]||{}; return Object.assign({id:id},st); }).filter(function(c){ return c.name; });
  if (!kids.length) return;
  if (kids.length === 1) {
    fs.bookedBy = { parentId:parentId, studentId:kids[0].id };
    saveFreeSlots(); render();
    showToast('Horario reservado para '+kids[0].name.split(' ')[0]+'.', 'success');
  } else {
    var sel = prompt('¿Para qué alumno?\n'+kids.map(function(k,i){ return (i+1)+'. '+k.name; }).join('\n'));
    var ix = parseInt(sel) - 1;
    if (ix >= 0 && ix < kids.length) {
      fs.bookedBy = { parentId:parentId, studentId:kids[ix].id };
      saveFreeSlots(); render();
      showToast('Horario reservado.', 'success');
    }
  }
}

// ════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════
function boot() {
  document.getElementById('initial-loading').classList.add('hidden');
  const parentId  = getLoggedParent();
  const parent    = parentId !== null ? DATA.parents[parentId] : null;
  const adminMode = isLoggedAdmin();
  if (parent || adminMode) {
    if (parent) selectedChild = (parent.children||[])[0] || null;
    // Deep link (ej. se abrió /parents/familias ya con sesión iniciada, por bookmark o
    // recarga): aterrizar directo en esa pestaña en vez de siempre en Inicio.
    const target = _pendingDeepLinkSlug ? slugToView(_pendingDeepLinkSlug, adminMode) : null;
    currentView = target || (adminMode ? 'a-inicio' : 'inicio');
    if (currentView === 'a-solicitudes') solicitudesSubTab = resolveSolicitudesSubTab();
    if (currentView === 'a-config') configSubTab = resolveConfigSubTab();
    if (currentView === 'a-familias') familiasSubTab = resolveFamiliasSubTab();
    _pendingDeepLinkSlug = null;
  } else {
    currentView = 'login';
  }
  render();
}

loadData();
</script>
