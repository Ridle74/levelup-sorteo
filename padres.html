<style>

.vw { animation: vIn 0.18s ease-out; }

#bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; background: rgba(255,255,255,0.97); backdrop-filter: blur(16px); border-top: 1px solid rgba(0,0,0,0.08); padding-bottom: env(safe-area-inset-bottom); }

.hist-btn { border:none; background: rgba(0,0,0,0.06); color: #111; width:38px; height:34px; border-radius:10px; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition: background 0.15s; -webkit-tap-highlight-color: transparent; }
.hist-btn:not(:disabled):active { background: rgba(0,0,0,0.14); }

.hist-em { background:#8cb800 !important; color:#fff !important; font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:13px; letter-spacing:-0.01em; margin-left:auto; }

.nav-row { display: flex; max-width: 600px; margin: 0 auto; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 10px 2px 8px; border: none; background: none; cursor: pointer; color: rgba(0,0,0,0.3); font-family: 'Barlow Condensed', sans-serif; font-size: 8px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; transition: color 0.15s; -webkit-tap-highlight-color: transparent; }
.nav-btn .ni { font-size: 22px; line-height: 1; display: block; }
.nav-btn.active { color: #111; }
.nav-btn.active .ni { filter: none; }

.dash-hero { background: #fff; border: 1px solid rgba(0,0,0,0.08); border-radius: 20px; padding: 20px; margin-bottom: 10px; position: relative; overflow: hidden; }
.dash-hero::before { display:none; }

.fsm { width:100%; background:#fff; border:1px solid rgba(0,0,0,0.14); border-radius:10px; padding:11px 12px; color:#111; font-family:'Barlow',sans-serif; font-size:14px; box-sizing:border-box; margin-bottom:10px; outline:none; }

.btn-grn { width:100%; border:none; border-radius:12px; padding:13px; cursor:pointer; font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:14px; letter-spacing:0.12em; text-transform:uppercase; background:#111; color:#fff; transition: opacity 0.15s; }

/* Child chips */
.child-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.child-chip { display:flex; align-items:center; gap:6px; border:1px solid rgba(0,0,0,0.15); border-radius:14px; padding:8px 14px; cursor:pointer; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:900; color:rgba(0,0,0,0.45); background:#fff; transition:all .15s; -webkit-tap-highlight-color:transparent; }

/* ── Time-grid calendar ─────────────────────────────────── */
.pcal-outer { display:flex; flex-direction:column; height:calc(100dvh - 64px - env(safe-area-inset-bottom)); overflow:hidden; background:transparent; }

.pcal-range-bar { flex-shrink:0; padding:0 14px 8px; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; color:rgba(0,0,0,0.4); letter-spacing:0.08em; text-transform:uppercase; }

.dash-link { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid rgba(0,0,0,0.08); border-radius:14px; padding:14px 16px; margin-bottom:8px; cursor:pointer; color:#111; font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:900; text-transform:uppercase; letter-spacing:0.05em; transition:background 0.12s; -webkit-tap-highlight-color:transparent; }

.pcal-edit-btn { border:1px solid rgba(0,0,0,0.14); background:#fff; color:rgba(0,0,0,0.55); font-size:12px; padding:7px 11px; border-radius:8px; cursor:pointer; font-family:'Barlow Condensed',sans-serif; font-weight:900; letter-spacing:0.06em; text-transform:uppercase; transition:all 0.15s; }

.pcal-ev-edit-ico { position:absolute; top:3px; right:3px; background:rgba(255,255,255,0.92); border:1px solid rgba(0,0,0,0.1); border-radius:5px; font-size:10px; padding:2px 5px; cursor:pointer; z-index:2; line-height:1.4; }
.pcal-free-slot { position:absolute; border-radius:8px; padding:4px 6px 3px; overflow:hidden; cursor:pointer; background:rgba(0,0,0,0.02); border:1.5px dashed rgba(0,0,0,0.3); }
.pcal-free-lbl { font-size:8px; font-weight:900; letter-spacing:0.12em; color:rgba(0,0,0,0.4); text-transform:uppercase; }
.pcal-free-booked { background:rgba(0,0,0,0.05) !important; border-style:solid !important; border-color:rgba(0,0,0,0.18) !important; }
.pcal-fab { position:fixed; bottom:calc(78px + env(safe-area-inset-bottom)); right:16px; width:50px; height:50px; border-radius:25px; background:#111; color:#fff; font-size:24px; border:none; cursor:pointer; z-index:300; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,0.3); -webkit-tap-highlight-color:transparent; }
.sm-overlay { position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.45); display:flex; align-items:flex-end; }
.sm-sheet { background:#fff; border-radius:20px 20px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom)); width:100%; max-height:88vh; overflow-y:auto; }
.sm-title { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:900; color:#111; }

.sm-seg button { flex:1; border:none; background:transparent; color:rgba(0,0,0,0.4); font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; padding:8px; cursor:pointer; transition:all 0.15s; }

.sm-del-btn { width:100%; border:1px solid rgba(0,0,0,0.15); border-radius:12px; padding:11px; cursor:pointer; font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; background:#fff; color:rgba(0,0,0,0.45); margin-top:8px; }
</style>

<body>
<div id="initial-loading"><div class="login-logo"><div class="lt">MATHS LEVEL UP</div><div class="ll">Portal de Padres</div></div><div style="color:rgba(0,0,0,0.4);font-size:12px">Cargando…</div></div>
<div id="hist-bar">
  <button class="hist-btn" id="hist-back" onclick="navBack()" title="Atrás">◀</button>
  <button class="hist-btn" id="hist-home" onclick="navHome()" title="Inicio">🏠</button>
  <button class="hist-btn" id="hist-fwd" onclick="navForward()" title="Adelante">▶</button>
  <button class="hist-btn hist-em" onclick="window.location.href='/'" title="easyMaths"><img src="/favicon.svg" style="width:22px;height:22px;border-radius:4px;display:block"></button>
</div>
<div id="app"></div>
<div id="bottom-nav"><div class="nav-row" id="nav-row"></div></div>
<div id="toast"><span id="toast-icon">⚠️</span><span id="toast-msg">–</span></div>
<div id="session-modal" style="display:none"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// ════════════════════════════════════════════════════════
// FIREBASE  (mismo proyecto que /student)
// ════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey:            "AIzaSyB8M29ujqCEatEZMaNHbGEyDmfygipG_Y0",
  authDomain:        "maths-level-up.firebaseapp.com",
  projectId:         "maths-level-up",
  storageBucket:     "maths-level-up.firebasestorage.app",
  messagingSenderId: "854549565666",
  appId:             "1:854549565666:web:2613613306c6cb16b30ebb"
};
firebase.initializeApp(firebaseConfig);
const db  = firebase.firestore();
// Documento dedicado para el portal de padres (no toca 'sorteo/main').
const REF = db.collection('padres').doc('main');
const SORTEO_REF = db.collection('sorteo').doc('main');
// Documento compartido de autenticación admin — el MISMO usado por /student,
// así que cambiar la clave admin aquí también la cambia allá (y viceversa).
const AUTH_REF = db.collection('shared').doc('auth');

// ── Sync de nombre alumno → /student ────────────────────────────────────
// IMPORTANTE: los ids de alumno de /padres y de /student son espacios de
// numeración INDEPENDIENTES (el mismo alumno puede tener id distinto en cada
// sistema). Por eso nunca se debe sincronizar por id — se busca por NOMBRE
// (antes de la edición) para encontrar al alumno correspondiente del otro lado.
// STUDENT_DEFAULT_NAMES son los 10 alumnos originales de /student (mismos
// que DEFAULT_STUDENTS en student.html); cualquier alumno agregado después
// solo existe como override en sorteo/main.overrides.
const STUDENT_DEFAULT_NAMES = {
  1:"Mikela Villena", 2:"Lucio Prado", 3:"Joanna Prado", 4:"Manuel Villacorta",
  5:"Maria Villalobos", 6:"Augusto Giuffra", 7:"Santiago Quinto", 8:"Tiago Poma",
  9:"Mateo Ríos", 10:"Rafaela Villena"
};
function normName(s) {
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
}
// Busca, dentro de los overrides de /student, el id cuyo nombre actual (antes
// de la edición) coincide con oldName. Si encuentra exactamente un candidato,
// actualiza su nombre. Si no hay coincidencia única, no hace nada (fail-safe).
function syncNameToStudent(oldName, newName) {
  if (!oldName || normName(oldName) === normName(newName)) return;
  const oldKey = normName(oldName);
  SORTEO_REF.get().then(function(snap) {
    const overrides = (snap.exists ? snap.data().overrides : null) || {};
    const allIds = new Set([
      ...Object.keys(STUDENT_DEFAULT_NAMES),
      ...Object.keys(overrides)
    ]);
    const matches = [];
    allIds.forEach(function(idStr) {
      const ov = overrides[idStr] || {};
      if (ov.deleted) return;
      const curName = ov.name !== undefined ? ov.name : STUDENT_DEFAULT_NAMES[idStr];
      if (curName && normName(curName) === oldKey) matches.push(idStr);
    });
    if (matches.length !== 1) return; // ambiguo o sin coincidencia: no tocar nada
    const path = {};
    path['overrides.' + matches[0] + '.name'] = newName;
    return SORTEO_REF.update(path);
  }).catch(function(e){ console.error('[sync nombre -> student]', e); });
}

// ════════════════════════════════════════════════════════
// ESQUEMA DE DATOS (diseño)
// ────────────────────────────────────────────────────────
// padres/main = {
//   parents: {
//     "<parentId>": {
//        name, pin, phone, children: [studentId, ...]
//     }
//   },
//   students: {            // espejo ligero de los alumnos (nombre + color + icono)
//     "<studentId>": { name, color, icon, modality: 'Virtual' | 'Domicilio' }
//   },
//   sessions: [            // clases programadas (recurrentes semanales, o de una sola vez)
//     { id, studentId, day: 0-6 (0=Dom), start:"HH:MM", dur: minutos,
//       modality:'Virtual'|'Domicilio', topic,
//       recurring: true|false, date:"YYYY-MM-DD"|null,   // false+date = clase suelta de una sola vez
//       skipDates: ["YYYY-MM-DD", ...] }                 // fechas puntuales en las que esta regla
//                                                          // semanal NO se debe generar (porque esa
//                                                          // fecha se editó "solo esta fecha" y existe
//                                                          // como otra entrada one-time con id distinto)
//   ],
//   requests: [            // solicitudes de clases adicionales hechas por padres
//     { id, parentId, studentId, day, start, dur, modality, note,
//       status:'pendiente'|'aprobada'|'rechazada', createdAt }
//   ]
// }
// ════════════════════════════════════════════════════════
// Semilla inicial — agrupa alumnos existentes de /student por apellido familiar.
// Esto puebla Firestore la primera vez que alguien entra (merge:true, no pisa
// datos reales que el profesor edite después desde el panel admin).
// Datos reales tomados de la agenda "ProGrid Ecosystem" que el profesor ya
// tenía armada (INITIAL_PARENTS + FULL_MASTER_DATA). day = día de la semana
// (0=Domingo … 6=Sábado, igual que Date.getDay()/dateOffset original);
// modality 'One to One' → Virtual y 'One to Family' → Domicilio.
const SEED = {
  // Ciclos del curso — cada uno con nombre propio, fecha de inicio y fecha de fin. El admin
  // puede editarlos/renombrarlos libremente desde el panel (Cuentas → Ciclos del curso). El
  // horario semanal recurrente solo se muestra hasta el final del ciclo más lejano definido
  // aquí (ver getCycleHorizon()); start=null significa "sin límite inferior".
  cycles: [
    { id:1, name:"MATHS ONEX", start:null, end:"2026-07-05" }
  ],
  parents: {
    "fprado":      { name:"Fernando Prado",     pin:"6611", phone:"", children:[3,4,10,16,17] },

function startOfWeek(d) {
  const x = new Date(d); const day = x.getDay();
  // Start on Monday (day 1); Sunday (0) goes back 6 days
  x.setDate(x.getDate() - (day === 0 ? 6 : day - 1)); x.setHours(0,0,0,0); return x;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function stripTitle(name) {
  return (name||'').replace(/^(Sra\.?|Sr\.?|Dra\.?|Dr\.?)\s*/i, '').trim();
}
function fmtDM(d) { return d.toLocaleDateString('es-PE',{ day:'numeric', month:'short' }); }
function fmtCycleDate(iso) {
  const d = new Date(iso+'T00:00:00');
  const s = d.toLocaleDateString('es-PE',{ weekday:'long', day:'numeric', month:'long', year:'numeric' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
// Duración en semanas de un ciclo (solo calculable si tiene inicio Y fin definidos).
function fmtCycleWeeks(start, end) {
  if (!start || !end) return '';
  const s = new Date(start+'T00:00:00');
  const e = new Date(end+'T00:00:00');
  const days = Math.round((e - s) / 86400000) + 1; // inclusivo
  if (days <= 0) return '';
  const weeks = Math.round((days / 7) * 10) / 10;
  const label = (weeks % 1 === 0) ? String(weeks) : weeks.toFixed(1);
  return ' · ' + label + (weeks === 1 ? ' semana' : ' semanas');
}

// ════════════════════════════════════════════════════════
// CICLOS DEL CURSO — el admin define libremente nombre + fecha de inicio/fin de
// cada ciclo o preciclo. "Ciclo actual" es el que contiene hoy; el horario semanal
// recurrente se muestra hasta getCycleHorizon() (el fin más lejano de todos los ciclos).
// ════════════════════════════════════════════════════════
function getCurrentCycle(list) {
  list = list || DATA.cycles || [];
  const t = new Date(); t.setHours(0,0,0,0);
  for (let i=0;i<list.length;i++){
    const c = list[i];
    const s = c.start ? new Date(c.start+'T00:00:00') : null;
    const e = c.end   ? new Date(c.end+'T00:00:00')   : null;
    if ((!s || t>=s) && (!e || t<=e)) return c;
  }
  return null;
}
function getCycleHorizon(list) {
  list = list || DATA.cycles || [];
  let max = null;
  list.forEach(c => {
    if (!c.end) return;
    const e = new Date(c.end+'T00:00:00');
    if (!max || e>max) max = e;
  });
  return max; // Date u null
}
function cycleHorizonISO(list) {
  const d = getCycleHorizon(list);
  if (!d) return null;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// Ciclo sugerido para una clase/horario NUEVO: si el ciclo vigente hoy está a 14 días o menos
// de terminar, se adelanta al siguiente ciclo cronológico (y así sucesivamente, por si ese
// también es muy corto) — así las clases que se crean cerca del cambio de ciclo ya quedan
// asignadas al ciclo que sigue, en vez de al que está por terminar.
const CYCLE_LOOKAHEAD_DAYS = 14;
function pickCycleForNewSession(list) {
  list = (list || DATA.cycles || []).slice().sort(function(a,b){
    if (!a.start && !b.start) return 0;
    if (!a.start) return -1;
    if (!b.start) return 1;
    return a.start.localeCompare(b.start);
  });
  if (!list.length) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  let idx = list.findIndex(function(c){
    const s = c.start ? new Date(c.start+'T00:00:00') : null;
    const e = c.end   ? new Date(c.end+'T00:00:00')   : null;
    return (!s || t>=s) && (!e || t<=e);
  });
  if (idx === -1) {
    idx = list.findIndex(function(c){ return c.start && new Date(c.start+'T00:00:00') > t; });
    if (idx === -1) return list[list.length-1];
  }
  while (idx < list.length - 1) {
    const c = list[idx];
    if (!c.end) return c;
    const daysLeft = Math.round((new Date(c.end+'T00:00:00') - t) / 86400000);
    if (daysLeft > CYCLE_LOOKAHEAD_DAYS) return c;
    idx++;
  }
  return list[idx];
}
// Fecha límite hasta la que debe mostrarse una clase/horario recurrente: el fin de SU propio
// ciclo asignado (cycleId). Si no tiene cycleId (no debería pasar tras migrateCycleIds, pero
// por si acaso) cae al horizonte global, igual que antes de esta funcionalidad.
function cycleCutoffDate(cycleId) {
  if (cycleId != null) {
    const c = (DATA.cycles||[]).find(function(cc){ return String(cc.id) === String(cycleId); });
    if (c) return c.end ? new Date(c.end+'T00:00:00') : null;
  }
  return getCycleHorizon();
}
function cycleStartDate(cycleId) {
  if (cycleId != null) {
    const c = (DATA.cycles||[]).find(function(cc){ return String(cc.id) === String(cycleId); });
    if (c) return c.start ? new Date(c.start+'T00:00:00') : null;
  }
  return null;
}
// Migración única: clases/horarios libres recurrentes creados antes de esta funcionalidad no
// tienen cycleId, así que sin esto seguirían repitiéndose más allá del fin de su ciclo (ver
// cycleCutoffDate). Se les asigna el ciclo vigente HOY, una sola vez; después de eso el campo
// queda fijo (no se reasigna aunque cambie el "ciclo actual" en visitas futuras).
function migrateCycleIds() {
  const curId = (getCurrentCycle(DATA.cycles)||{}).id;
  const cid = curId != null ? curId : null;
  let changed = false;
  (DATA.sessions||[]).forEach(function(s){
    if (s.recurring !== false && s.cycleId === undefined) { s.cycleId = cid; changed = true; }
  });
  (DATA.freeSlots||[]).forEach(function(fs){
    if (fs.recurring !== false && fs.cycleId === undefined) { fs.cycleId = cid; changed = true; }
  });
  return changed;
}

// FIREBASE LOAD / SAVE
// ════════════════════════════════════════════════════════
function loadData() {
  let pending = 2;
  const done = () => { if (--pending === 0) { appReady = true; boot(); } };

  REF.get().then(snap => {
    if (snap.exists) {
      const d = snap.data();
      if ((d.seedVersion || 0) < SEED_VERSION) {
        // Datos nuevos del ciclo (horarios, alumnos, padres) — sobrescribir,
        // conservando solicitudes y cuentas pendientes ya existentes.
        DATA.parents         = SEED.parents;
        DATA.students        = SEED.students;
        DATA.sessions        = SEED.sessions;
        // Los ciclos NO se pisan con SEED en un bump de versión — son datos que el admin
        // edita libremente desde el panel, así que se preservan igual que freeSlots/requests.
        // Si el documento es de antes de esta funcionalidad (sin campo cycles todavía), se
        // migran una sola vez desde los campos viejos cycleName/cycleEnd.
        DATA.cycles          = d.cycles || (d.cycleName || d.cycleEnd
          ? [{ id:1, name: d.cycleName || 'Ciclo actual', start:null, end: d.cycleEnd || null }]
          : SEED.cycles);
        DATA.requests        = d.requests        || [];
        DATA.accountRequests = d.accountRequests || [];
        DATA.freeSlots       = d.freeSlots       || [];
        DATA.quoteRequests   = d.quoteRequests   || [];
        DATA.templates       = d.templates       || [];
        // Las cuentas/alumnos viejos que ya no están en SEED quedan como mapas
        // "huérfanos" en Firestore (merge no borra claves) — hay que eliminarlos
        // explícitamente con FieldValue.delete() antes de escribir los nuevos.
        const delFields = {};
        Object.keys(d.parents  || {}).forEach(pid => { if (!(pid in SEED.parents))  delFields['parents.'+pid]  = firebase.firestore.FieldValue.delete(); });
        Object.keys(d.students || {}).forEach(sid => { if (!(sid in SEED.students)) delFields['students.'+sid] = firebase.firestore.FieldValue.delete(); });
        const cleanup = Object.keys(delFields).length ? REF.update(delFields).catch(()=>{}) : Promise.resolve();
        cleanup.then(() => REF.set({
          parents: SEED.parents, students: SEED.students, sessions: SEED.sessions,
          cycles: DATA.cycles,
          cycleEnd: cycleHorizonISO(DATA.cycles), cycleName: (getCurrentCycle(DATA.cycles)||{}).name || null,
          seedVersion: SEED_VERSION
        }, { merge:true })).catch(()=>{});
      } else {
        DATA.parents         = d.parents         || SEED.parents;
        DATA.students        = d.students        || SEED.students;
        DATA.sessions        = d.sessions        || SEED.sessions;
        // Migración igual que arriba para documentos que aún no tienen el campo cycles.
        DATA.cycles          = d.cycles || (d.cycleName || d.cycleEnd
          ? [{ id:1, name: d.cycleName || 'Ciclo actual', start:null, end: d.cycleEnd || null }]
          : SEED.cycles);
        DATA.requests        = d.requests        || [];
        DATA.accountRequests = d.accountRequests || [];
        DATA.freeSlots       = d.freeSlots       || [];
        DATA.quoteRequests   = d.quoteRequests   || [];
        DATA.templates       = d.templates       || [];
      }
    } else {
      // Primera vez: sembrar Firestore con datos base. DATA ya es una copia de SEED
      // (ver declaración de DATA), así que DATA.cycles ya está poblado.
      REF.set(Object.assign({}, SEED, {
        seedVersion: SEED_VERSION,
        cycleEnd: cycleHorizonISO(SEED.cycles), cycleName: (getCurrentCycle(SEED.cycles)||{}).name || null
      })).catch(()=>{});
    }
    if (migrateCycleIds()) {
      REF.set({ sessions: DATA.sessions, freeSlots: DATA.freeSlots }, { merge:true }).catch(()=>{});
    }
    done();
  }).catch(e => {
    console.error(e);
    done(); // seguimos con SEED local si Firestore falla
  });

  // Clave admin compartida con /student — un solo documento, una sola clave.
  AUTH_REF.get().then(snap => {
    if (snap.exists && snap.data().adminPin) {
      DATA.adminPin = snap.data().adminPin;
    } else {
      AUTH_REF.set({ adminPin: ADMIN_PIN_DEFAULT }, { merge:true }).catch(()=>{});
      DATA.adminPin = ADMIN_PIN_DEFAULT;
    }
    done();
  }).catch(e => {
    console.error(e);
    DATA.adminPin = ADMIN_PIN_DEFAULT;
    done();
  });
}

let _tt;
function showToast(msg, type='error') {
  const el = document.getElementById('toast'); if (!el) return;
  document.getElementById('toast-icon').textContent = type==='success'?'✅':'⚠️';
  document.getElementById('toast-msg').textContent  = msg;
  el.classList.add('show'); clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('show'), 3000);
}

// ROUTER
// ════════════════════════════════════════════════════════
function go(view) {
  if (view !== currentView) {
    // Si veníamos de navegar atrás, descartamos el "futuro" antes de añadir la nueva vista.
    navHistory = navHistory.slice(0, navIndex + 1);
    navHistory.push(view);
    navIndex = navHistory.length - 1;
  }
  currentView = view;
  render();
}
function navBack() {
  if (navIndex <= 0) return;
  navIndex--;
  currentView = navHistory[navIndex];
  render();
}
function navForward() {
  if (navIndex >= navHistory.length - 1) return;
  navIndex++;
  currentView = navHistory[navIndex];
  render();
}
function navHome() {
  go(isLoggedAdmin() ? 'a-inicio' : 'inicio');
}

function render() {
  if (!appReady) return;
  const parentId  = getLoggedParent();
  const adminMode = isLoggedAdmin();
  const app = document.getElementById('app');
  const nav = document.getElementById('bottom-nav');

  const loggedIn = adminMode || parentId !== null;
  if (!loggedIn && currentView !== 'login') currentView = 'login';
  if (loggedIn && currentView === 'login') currentView = adminMode ? 'a-inicio' : 'inicio';

  // Historial de navegación (botones atrás / inicio / adelante)
  if (!loggedIn) {
    navHistory = []; navIndex = -1;
  } else if (navIndex < 0 || navHistory[navIndex] !== currentView) {
    if (navIndex >= 0 && navHistory[navIndex] !== currentView) {
      navHistory = navHistory.slice(0, navIndex + 1);
    }
    navHistory.push(currentView);
    navIndex = navHistory.length - 1;
  }
  const histBar = document.getElementById('hist-bar');
  if (histBar) {
    histBar.classList.toggle('visible', loggedIn);
    document.body.classList.toggle('hist-visible', loggedIn);
    const backBtn = document.getElementById('hist-back');
    const fwdBtn  = document.getElementById('hist-fwd');
    if (backBtn) backBtn.disabled = navIndex <= 0;
    if (fwdBtn)  fwdBtn.disabled  = navIndex >= navHistory.length - 1;
  }

  const views = adminMode
    ? { 'a-inicio': vAdminInicio, 'a-cuentas': vAdminCuentas, 'a-solicitudes': vAdminSolicitudes, 'a-calendario': vAdminCalendario, 'a-cotizaciones': vAdminCotizaciones }
    : { login: vLogin, inicio: vInicio, calendario: vCalendario, solicitar: vSolicitar, perfil: vPerfil };
  app.innerHTML = `<div class="vw">${(views[currentView]||(adminMode?vAdminInicio:vLogin))()}</div>`;

  document.body.classList.toggle('nav-visible', loggedIn);
  if (loggedIn) {
    nav.classList.add('visible');
    const navItems = adminMode
      ? [
          {r:'a-inicio',       i:'🛠️', l:'Inicio'},
          {r:'a-calendario',   i:'📅', l:'Calendario'},
          {r:'a-solicitudes',  i:'📥', l:'Solicitudes'},
          {r:'a-cotizaciones', i:'🧾', l:'Cotizaciones'},
          {r:'a-cuentas',      i:'🔑', l:'Cuentas'}
        ]
      : [
          {r:'inicio',     i:'🏠', l:'Inicio'},
          {r:'calendario', i:'📅', l:'Calendario'},
          {r:'solicitar',  i:'➕', l:'Solicitar'},
          {r:'perfil',     i:'👤', l:'Perfil'}
        ];
    nav.querySelector('#nav-row').innerHTML = navItems.map(n =>
      `<button class="nav-btn${currentView===n.r?' active':''}" onclick="go('${n.r}')"><span class="ni">${n.i}</span><span>${n.l}</span></button>`
    ).join('');
  } else {
    nav.classList.remove('visible');
  }
  bindView();
}

function bindView() {
  if (currentView === 'login') {
    const form = document.getElementById('login-form');
    if (form) {
      // Populate parent selector
      const sel = document.getElementById('sel-parent');
      if (sel && sel.options.length === 1) {
        Object.entries(DATA.parents)
          .sort(([,a],[,b]) => a.name.localeCompare(b.name, 'es'))
          .forEach(([id, p]) => {
            const o = document.createElement('option');
            o.value = id;
            const parts = p.name.split(' ');
            o.textContent = parts.slice(0, 2).join(' ');
            sel.appendChild(o);
          });
        const adm = document.createElement('option');
        adm.value = '__admin__';
        adm.textContent = '— Administrador —';
        sel.appendChild(adm);
      }
      form.addEventListener('submit', e => {
        e.preventDefault();
        const pin      = document.getElementById('login-pin').value.trim();
        const selEl    = document.getElementById('sel-parent');
        const parentId = selEl ? selEl.value : '';
        if (pin === DATA.adminPin) {
          setLoggedAdmin(true);
          currentView = 'a-inicio';
          render();
          return;
        }
        if (parentId === '__admin__' && pin === DATA.adminPin) {
          setLoggedAdmin(true); currentView = 'a-inicio'; render(); return;
        }
        const parent = parentId ? DATA.parents[parentId] : null;
        if (parent && parent.pin === pin) {
          setLoggedParent(parentId);
          selectedChild = null;
          currentView = 'inicio';
          render();
        } else {
          document.getElementById('login-err').style.display = 'block';
        }
      });
    }
    const cform = document.getElementById('crear-form');
    if (cform) cform.addEventListener('submit', e => {
      e.preventDefault();
      const reg = {
        id: Date.now(),
        parentName: document.getElementById('cr-parent').value.trim(),
        phone:      document.getElementById('cr-phone').value.trim(),
        childFirstName:    document.getElementById('cr-cname').value.trim(),
        childFirstSurname: document.getElementById('cr-csurname').value.trim(),
        note: document.getElementById('cr-note').value.trim(),
        status: 'pendiente',
        createdAt: new Date().toISOString()
      };
      if (!reg.parentName || !reg.childFirstName || !reg.childFirstSurname) return;
      DATA.accountRequests.push(reg);
      saveAccountRequests();
      showToast('Solicitud enviada. El profesor revisará tus datos y activará tu cuenta.', 'success');
      e.target.reset();
      loginTab = 'familia';
      render();
    });
  }
}

function setLoginTab(t) { loginTab = t; render(); }

function logout() {
  setLoggedParent(null);
  setLoggedAdmin(false);
  selectedChild = null;
  editingParentId = null;
  currentView = 'login';
  navHistory = []; navIndex = -1;
  render();
}
function selectChild(id) { selectedChild = id === null ? null : Number(id); render(); }
function setCalMode(m) { calMode = m; render(); }
function calStep(dir) {
  const span = calMode === 'week' ? 7 : 4;
  calAnchor = addDays(calAnchor, dir * span);
  render();
}

function buildPadCalGrid(dayList, activeSids, showParent) {
  const ROW_H = 56;
  const today = new Date(); today.setHours(0,0,0,0);

  const toH  = function(t){ var p=t.split(':').map(Number); return p[0]+p[1]/60; };
  const addM = function(t,m){ var p=t.split(':').map(Number),tot=p[0]*60+p[1]+m; return String(Math.floor(tot/60)%24).padStart(2,'0')+':'+String(tot%60).padStart(2,'0'); };

  // Build slot map (recurring: key='dDOW|HH:MM'; one-time: key='DATE|HH:MM')
  const _dStr = function(d){ return d.toISOString().slice(0,10); };
  const slotMap = {};
  DATA.sessions.forEach(function(s) {
    if (!activeSids.includes(Number(s.studentId))) return;
    const isOneTime = s.recurring === false && s.date;
    const key = isOneTime ? (s.date+'|'+s.start) : ('d'+s.day+'|'+s.start);
    if (!slotMap[key]) slotMap[key] = { day:Number(s.day), oneTimeDate:isOneTime?s.date:null, start:s.start, maxDur:0, students:[] };
    const dur = s.dur || 60;
    if (dur > slotMap[key].maxDur) slotMap[key].maxDur = dur;
    slotMap[key].students.push({ sid:s.studentId, dur:dur, modality:s.modality, sessionId:s.id, skipDates:Array.isArray(s.skipDates)?s.skipDates:[], cycleId:s.cycleId });
  });

  // ── Smart time range: fit to actual sessions ─────────────────
  var dynMin = 23, dynMax = 0;
  Object.values(slotMap).forEach(function(sl) {
    var h = toH(sl.start);
    if (h < dynMin) dynMin = h;
    var endH = h + sl.maxDur / 60;
    if (endH > dynMax) dynMax = endH;
  });
  const hasSlots = Object.keys(slotMap).length > 0;
  // ── Smart day filter: single child → only their class days ───
  // (Solo aplica en vista "4 días": en "Semana" siempre se ven los 7 días,
  // de lunes a domingo, sin importar si ese alumno tiene clase ese día.)
  const singleChild = activeSids.length === 1 && !showParent && calMode !== 'week';
  // MIN_H: if session starts on exact hour go one earlier, else floor
  const rawMinH = hasSlots ? (Number.isInteger(dynMin) ? dynMin - 1 : Math.floor(dynMin)) : 8;
  const MIN_H = Math.max(0, rawMinH);
  // MAX_H: for single child → same padding below as above (centering); otherwise ceil
  var MAX_H;
  if (!hasSlots) { MAX_H = 22; }
  else if (singleChild) { MAX_H = Math.min(24, Math.ceil(dynMax) + (dynMin - MIN_H)); }
  else { MAX_H = Math.min(24, Math.ceil(dynMax)); }
  const HOURS = Array.from({length: MAX_H - MIN_H}, function(_, i){ return MIN_H + i; });
  const totalH = HOURS.length * ROW_H;
  const activeDows  = new Set(Object.values(slotMap).map(function(sl){ return sl.day; }));
  const filteredDayList = singleChild
    ? dayList.filter(function(d){ return activeDows.has(d.getDay()); })
    : dayList;

  // No sessions message
  if (!hasSlots) {
    return '<div class="pcal-head-row"><div class="pcal-gutter"></div></div>'
      +'<div style="padding:40px;text-align:center;color:rgba(0,0,0,0.3);font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase">Sin clases programadas</div>';
  }

  // Parent map
  const studentParent = {};
  if (showParent) {
    Object.entries(DATA.parents).forEach(function(e) {
      var pid = e[0], p = e[1];
      (p.children||[]).forEach(function(cid){ studentParent[String(cid)] = p.name; });
    });
  }

  // Column width based on filtered days
  const appEl = document.getElementById('app');
  const appW  = appEl ? appEl.offsetWidth : (window.innerWidth||390);
  const numCols = filteredDayList.length;
  const colW  = showParent
    ? Math.floor((appW - 42) / numCols)
    : Math.max(Math.floor((appW - 42) / numCols), 60);

  // Day headers
  const hdrs = filteredDayList.map(function(d) {
    const isPast = d < today, isTod = d.getTime()===today.getTime();
    const cls = 'pcal-dh'+(isTod?' is-today':'')+(isPast?' is-past':'');
    return '<div class="'+cls+'" style="width:'+colW+'px">'
      +'<div class="pcal-dh-name">'+DAY_SHORT[d.getDay()]+'</div>'
      +'<div class="pcal-dh-num">'+d.getDate()+'</div>'
      +(isTod?'<div><span class="pcal-dh-hoy">HOY</span></div>':'')
      +'</div>';
  }).join('');

  // Time labels
  const tls = HOURS.map(function(h){
    return '<div class="pcal-tl-slot" style="height:'+ROW_H+'px">'+String(h).padStart(2,'0')+'h</div>';
  }).join('');

  // Day columns
  const freeSlotList = DATA.freeSlots || [];
  const cols = filteredDayList.map(function(d) {
    const dow  = d.getDay();
    const dstr = _dStr(d);
    const isPast = d < today, isTod = d.getTime()===today.getTime();
    const cls = 'pcal-day-col'+(isTod?' is-today':'')+(isPast?' is-past':'');
    const lines = HOURS.map(function(){ return '<div class="pcal-hour-line" style="height:'+ROW_H+'px"></div>'; }).join('');
    // Las clases recurrentes solo se muestran dentro de SU propio ciclo (cycleId → ver
    // cycleCutoffDate); las de una sola vez siempre se muestran en su fecha puntual.
    const slots = Object.values(slotMap).filter(function(sl){
      if (sl.oneTimeDate) return sl.oneTimeDate === dstr;
      return sl.day === dow;
    });
    const cards = slots.flatMap(function(slot) {
      // Si la sesión es recurrente, en esta fecha puntual se excluye a los alumnos cuya
      // sesión tiene este día en skipDates (porque se editó "solo esta fecha" — ya tienen
      // su propia tarjeta de una sola vez en otro lugar con los valores nuevos).
      const activeStudents = slot.oneTimeDate ? slot.students
        : slot.students.filter(function(st){
            if (st.skipDates.includes(dstr)) return false;
            const cutoff = cycleCutoffDate(st.cycleId);
            if (cutoff && d > cutoff) return false;
            const cStart = cycleStartDate(st.cycleId);
            if (cStart && d < cStart) return false;
            return true;
          });
      if (!activeStudents.length) return [];
      const topPx = (toH(slot.start) - MIN_H) * ROW_H;
      const hPx   = Math.max((slot.maxDur / 60) * ROW_H - 3, 28);
      const total = activeStudents.length;
      return activeStudents.map(function(st, idx) {
        const stData = DATA.students[st.sid] || {};
        const end    = addM(slot.start, st.dur);
        const lPx    = 2 + Math.round((colW-4)*(idx/total));
        const wPx    = Math.round((colW-4)/total) - (idx<total-1?2:0);
        const short  = hPx < 42;
        const pName  = showParent ? (studentParent[String(st.sid)]||'') : '';
        const editIco = (showParent && calEditMode && st.sessionId)
          ? '<div class="pcal-ev-edit-ico" onclick="openEditSession('+st.sessionId+',false,\''+dstr+'\');event.stopPropagation()">✏️</div>' : '';
        return '<div class="pcal-ev" style="top:'+topPx+'px;height:'+hPx+'px;left:'+lPx+'px;width:'+wPx+'px;background:rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.12)">'
          +editIco
          +(pName?'<div class="pcal-ev-parent">'+pName+'</div>':'')
          +'<div class="pcal-ev-name">'+(stData.icon||'')+' '+(stData.name||'').split(' ')[0]+'</div>'
          +(short?'':'<div class="pcal-ev-time">'+slot.start+'–'+end+'</div>')
          +(short?'':'<div class="pcal-ev-badge">'+st.modality+'</div>')
          +'</div>';
      });
    }).join('');
    const freeCards = freeSlotList.filter(function(fs){
      if (!showParent && fs.bookedBy) return false;
      if (fs.recurring===false && fs.date) return fs.date === dstr;
      if (Array.isArray(fs.skipDates) && fs.skipDates.includes(dstr)) return false;
      const fsCutoff = cycleCutoffDate(fs.cycleId);
      if (fsCutoff && d > fsCutoff) return false;
      const fsStart = cycleStartDate(fs.cycleId);
      if (fsStart && d < fsStart) return false;
      return Number(fs.day) === dow;
    }).map(function(fs){
      const topPx = Math.max((toH(fs.start) - MIN_H) * ROW_H, 0);
      const hPx   = Math.max((fs.dur / 60) * ROW_H - 3, 28);
      const end   = addM(fs.start, fs.dur);
      const booked = !!fs.bookedBy;
      const bookedSt = booked ? (DATA.students[fs.bookedBy.studentId]||{}) : null;
      const clsFree = 'pcal-free-slot'+(booked?' pcal-free-booked':'');
      const editIco = (showParent && calEditMode)
        ? '<div class="pcal-ev-edit-ico" onclick="openEditSession(\''+fs.id+'\',true,\''+dstr+'\');event.stopPropagation()">✏️</div>' : '';
      const bookTap = (!showParent && !booked) ? ' onclick="bookFreeSlot(\''+fs.id+'\')"' : '';
      return '<div class="'+clsFree+'" style="top:'+topPx+'px;height:'+hPx+'px;left:2px;width:'+(colW-4)+'px;position:absolute"'+bookTap+'>'
        +editIco
        +(booked && bookedSt ? '<div class="pcal-ev-name">'+bookedSt.icon+' '+bookedSt.name.split(' ')[0]+'</div>'
          : '<div class="pcal-free-lbl">Libre</div>')
        +'<div class="pcal-ev-time">'+fs.start+'–'+end+'</div>'
        +'<div class="pcal-ev-badge">'+fs.modality+'</div>'
        +'</div>';

    return '<div class="'+cls+'" style="width:'+colW+'px;height:'+totalH+'px">'+lines+cards+freeCards+'</div>';
  }).join('');

  // Current time indicator
  var nowHtml = '';
  var now = new Date(); var curH = now.getHours()+now.getMinutes()/60;

    var todayIdx = filteredDayList.findIndex(function(d){ return d.getTime()===today.getTime(); });

      nowHtml = '<div class="pcal-now" style="top:'+topNow+'px;left:'+(todayIdx*colW)+'px;width:'+colW+'px">'
        +'<div class="pcal-now-dot"></div><div class="pcal-now-line"></div></div>';
    }
  }

}

function nextStudentId() {
  const ids = Object.keys(DATA.students).map(Number).filter(n=>!isNaN(n));
  return (ids.length ? Math.max(...ids) : 0) + 1;
}
function genPin(len=4) {
  let p; let tries=0;
  do {
    p = String(Math.floor(Math.random()*Math.pow(10,len))).padStart(len,'0');
    tries++;
  } while (tries<30 && (p===DATA.adminPin || Object.values(DATA.parents).some(par=>par.pin===p)));
  return p;
}
function findStudentByName(first, last) {
  const f = first.trim().toLowerCase(), l = last.trim().toLowerCase();
  const entries = Object.entries(DATA.students);
  for (const [id, s] of entries) {
    const parts = s.name.toLowerCase().split(/\s+/);
    if (parts.includes(f) && parts.includes(l)) return parseInt(id);
  }
  return null;
}

function approveAccountRequest(reqId) {
  const reg = DATA.accountRequests.find(r => r.id === reqId);
  if (!reg || reg.status !== 'pendiente') return;

  let studentId = findStudentByName(reg.childFirstName, reg.childFirstSurname);
  let createdNew = false;
  if (!studentId) {
    studentId = nextStudentId();
    DATA.students[studentId] = {
      name: `${reg.childFirstName} ${reg.childFirstSurname}`.trim(),
      color: '#888', icon: '👤', modality: 'Virtual'
    };
    createdNew = true;
  }

  const pin = genPin(4);
  const parentId = 'fam_' + reg.id;
  DATA.parents[parentId] = { name: reg.parentName, pin, phone: reg.phone || '', children: [studentId] };

  reg.status = 'aprobada';
  reg.assignedParentId = parentId;
  reg.assignedStudentId = studentId;
  reg.assignedPin = pin;
  reg.resolvedAt = new Date().toISOString();

  REF.set({ parents: DATA.parents, students: DATA.students, accountRequests: DATA.accountRequests }, { merge:true })
    .then(() => showToast(`Cuenta creada. Clave para ${reg.parentName}: ${pin}${createdNew?' (se creó un nuevo alumno en la lista)':''}`, 'success'))
    .catch(e => { console.error(e); showToast('Error al crear la cuenta.'); });
  render();
}
function rejectAccountRequest(reqId) {
  const reg = DATA.accountRequests.find(r => r.id === reqId);
  if (!reg || reg.status !== 'pendiente') return;
  reg.status = 'rechazada';

function _gapSlots(occupied, winStart, winEnd, dur, tmpl, extraProps) {
  occupied.sort(function(a,b){ return a[0]-b[0]; });
  var merged = [];
  occupied.forEach(function(iv){
    if (!merged.length || iv[0] >= merged[merged.length-1][1]) merged.push([iv[0],iv[1]]);
    else merged[merged.length-1][1] = Math.max(merged[merged.length-1][1],iv[1]);
  });
  var gaps = []; var cursor = winStart;
  merged.forEach(function(iv){
    var s = Math.max(iv[0],winStart), e = Math.min(iv[1],winEnd);
    if (s > cursor) gaps.push([cursor,s]);
    if (e > cursor) cursor = e;
  });
  if (cursor < winEnd) gaps.push([cursor,winEnd]);
  var slots = [];
  gaps.forEach(function(gap){
    var t = gap[0];
    while (t+dur <= gap[1]) {
      var base = { id:'fs_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
        day:tmpl.day, start:_toTime(t), dur:dur, modality:tmpl.modality, bookedBy:null };
      Object.assign(base, extraProps);
      slots.push(base);
      t += dur;
    }
  });
  return slots;
}

function generateFromTemplate(tmplId) {
  const tmpl = (DATA.templates||[]).find(function(t){ return t.id === tmplId; });
  if (!tmpl) return;
  const winStart = _toMin(tmpl.windowStart);
  const winEnd   = _toMin(tmpl.windowEnd);
  const dur      = tmpl.slotDur;
  const buf      = tmpl.bufferMin || 0;
  var newSlots = [];

  if (tmpl.scopeType === 'dateRange') {
    // ── Rango de fechas: genera horarios one-time para cada ocurrencia del día ──
    if (!tmpl.dateFrom || !tmpl.dateTo) { showToast('Falta rango de fechas en la plantilla.','error'); return; }
    var cur = new Date(tmpl.dateFrom + 'T00:00:00');
    var endD = new Date(tmpl.dateTo  + 'T00:00:00');
    while (cur <= endD) {
      if (cur.getDay() === tmpl.day) {
        var ds = cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
        // Sesiones que aplican a esta fecha
        var daySessions = (DATA.sessions||[]).filter(function(s){
          if (s.oneTimeDate) return s.oneTimeDate === ds;
          if (s.recurring === false || Number(s.day) !== tmpl.day) return false;
          if (Array.isArray(s.skipDates) && s.skipDates.indexOf(ds) !== -1) return false;
          var cutoff = cycleCutoffDate(s.cycleId);
          if (cutoff && cur > cutoff) return false;
          var cStart = cycleStartDate(s.cycleId);
          if (cStart && cur < cStart) return false;
          return true;
        });
        // Horarios libres ya existentes en esa fecha concreta
        var dayFS = (DATA.freeSlots||[]).filter(function(fs){ return fs.oneTimeDate === ds; });
        var occupied = [];
        daySessions.forEach(function(s){ var st=_toMin(s.start); occupied.push([st, st+(s.dur||60)+buf]); });
        dayFS.forEach(function(fs){ var st=_toMin(fs.start); occupied.push([st, st+(fs.dur||60)]); });
        newSlots = newSlots.concat(_gapSlots(occupied, winStart, winEnd, dur, tmpl,
          { recurring:false, oneTimeDate:ds }));
      }
      cur.setDate(cur.getDate()+1);
    }
  } else {
    // ── Ciclo (recurrentes) ──
    var sessions = (DATA.sessions||[]).filter(function(s){
      return s.recurring !== false && Number(s.day) === tmpl.day &&
             (tmpl.cycleId == null || String(s.cycleId) === String(tmpl.cycleId));
    });
    var existingFS = (DATA.freeSlots||[]).filter(function(fs){
      return fs.recurring !== false && Number(fs.day) === tmpl.day &&
             (tmpl.cycleId == null || String(fs.cycleId) === String(tmpl.cycleId));
    });
    var occupied = [];
    sessions.forEach(function(s){ var st=_toMin(s.start); occupied.push([st, st+(s.dur||60)+buf]); });
    existingFS.forEach(function(fs){ var st=_toMin(fs.start); occupied.push([st, st+(fs.dur||60)]); });
    newSlots = _gapSlots(occupied, winStart, winEnd, dur, tmpl,
      { recurring:true, cycleId:tmpl.cycleId });
  }

  if (!newSlots.length) { showToast('No hay huecos disponibles — todos los bloques ya existen o están ocupados.','error'); return; }
  if (!DATA.freeSlots) DATA.freeSlots = [];
  DATA.freeSlots = DATA.freeSlots.concat(newSlots);
  saveFreeSlots();
  render();
  showToast(newSlots.length + ' horario' + (newSlots.length!==1?'s':'') + ' libre' + (newSlots.length!==1?'s':'') + ' generado' + (newSlots.length!==1?'s':'') + '.', 'success');
}

function _smStudentOpts(parentId, selId) {
  var par = DATA.parents[parentId] || {};
  return (par.children||[]).map(function(id){
    var st = DATA.students[id] || {};
    return '<option value="'+id+'"'+(String(id)===String(selId)?' selected':'')+'>'+( st.icon||'')+' '+(st.name||id)+'</option>';
  }).join('');
}

function _buildSM(prefill, isEdit) {
  var p   = prefill || {};
  var dayVal = p.day !== undefined ? Number(p.day) : 1;
  var durVal = p.dur || 60;
  var modVal = p.modality || 'Virtual';
  var recVal = p.recurring !== false;
  // Ciclo al que queda atado este horario semanal: si se está editando uno que ya tiene
  // cycleId, se respeta ese (no se reasigna solo por reabrir el modal); si es nuevo, se
  // sugiere el ciclo correspondiente vía pickCycleForNewSession (adelanta al siguiente ciclo
  // si el actual está por terminar).
  var smCycle = (isEdit && p.cycleId != null)
    ? (DATA.cycles||[]).find(function(c){ return String(c.id) === String(p.cycleId); })
    : null;
  if (!smCycle) smCycle = pickCycleForNewSession();
  var initPid = p.parentId || Object.keys(DATA.parents)[0] || '';
  var stuOpts = smType === 'session' ? _smStudentOpts(initPid, p.studentId) : '';
  var parOpts = Object.entries(DATA.parents)
    .sort(function(a,b){ return a[1].name.localeCompare(b[1].name); })
    .map(function(e){ return '<option value="'+e[0]+'"'+(e[0]===initPid?' selected':'')+'>'+e[1].name+'</option>'; }).join('');
  // Reprogramación rápida: al editar un horario libre, permite elegir la clase semanal de
  // un alumno y la intercambia con este horario libre (el alumno se muda aquí, y su horario
  // anterior queda libre).
  var swapOpts = (isEdit && smType === 'free')
    ? DATA.sessions.filter(function(s){ return s.recurring !== false; })
        .slice()
        .sort(function(a,b){ return a.day - b.day || a.start.localeCompare(b.start); })
        .map(function(s){
          var st = DATA.students[s.studentId] || {};
          return '<option value="'+s.id+'">'+(st.icon||'')+' '+(st.name||('Alumno '+s.studentId))+' — '+DAY_NAMES[s.day]+' '+s.start+'</option>';
        }).join('')
    : '';
  var html = '<div class="sm-overlay" onclick="if(event.target===this)closeSessionModal()">'
    +'<div class="sm-sheet">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
    +'<div class="sm-title">'+(isEdit?'Editar':'Nueva '+(smType==='free'?'horario libre':'clase'))+'</div>'
    +'<button onclick="closeSessionModal()" style="border:none;background:rgba(0,0,0,0.07);border-radius:8px;width:32px;height:32px;font-size:18px;cursor:pointer">×</button>'
    +'</div>'
    +(!isEdit
      ? '<div class="sm-seg" id="sm-type-seg" style="margin-bottom:14px">'
        +'<button data-t="session" class="'+(smType==='session'?'on':'')+'" onclick="smSetType(\'session\')">Clase de alumno</button>'
        +'<button data-t="free" class="'+(smType==='free'?'on':'')+'" onclick="smSetType(\'free\')">Horario libre</button>'
        +'</div>'
      : '')
    +'<div id="sm-sess-fields" style="display:'+(smType==='session'?'':'none')+'">'
    +'<label class="field-label">Padre / madre</label>'
    +'<select class="fsm" id="sm-parent" onchange="smUpdateStudents()" style="appearance:auto">'+parOpts+'</select>'
    +'<label class="field-label">Alumno</label>'
    +'<select class="fsm" id="sm-student" style="appearance:auto">'+stuOpts+'</select>'
    +'</div>'
    +'<label class="field-label">Día de la semana</label>'
    +'<select class="fsm" id="sm-day" style="appearance:auto">'
    +DAY_NAMES.map(function(n,i){ return '<option value="'+i+'"'+(i===dayVal?' selected':'')+'>'+n+'</option>'; }).join('')
    +'</select>'
    +'<label class="field-label">Hora de inicio</label>'
    +'<input class="fsm" id="sm-start" type="time" value="'+(p.start||'16:00')+'">'
    +'<label class="field-label">Duración</label>'
    +'<select class="fsm" id="sm-dur" style="appearance:auto">'
    +[60,90,120,180].map(function(d){ return '<option value="'+d+'"'+(d===durVal?' selected':'')+'>'+d+' min</option>'; }).join('')
    +'</select>'
    +'<label class="field-label">Modalidad</label>'
    +'<div class="sm-seg" id="sm-mod-seg">'
    +'<button class="'+(modVal==='Virtual'?'on':'')+'" onclick="smToggleSeg(\'sm-mod-seg\',this)">Virtual</button>'
    +'<button class="'+(modVal==='Domicilio'?'on':'')+'" onclick="smToggleSeg(\'sm-mod-seg\',this)">Domicilio</button>'
    +'</div>'
    +'<input type="hidden" id="sm-cycle-id" value="'+(smCycle?smCycle.id:'')+'">'
    +'<label class="field-label">Frecuencia</label>'
    +'<div class="sm-seg" id="sm-rec-seg">'
    +'<button class="'+(recVal?'on':'')+'" data-rec="true" onclick="smToggleRec(this,true)">Semanal'+(smCycle&&smCycle.name ? ' (ciclo '+smCycle.name+')' : '')+'</button>'
    +'<button class="'+(recVal?'':'on')+'" data-rec="false" onclick="smToggleRec(this,false)">Solo una vez</button>'
    +'</div>'
    +'<div id="sm-date-wrap" style="display:'+(recVal?'none':'')+'">'
    +'<label class="field-label">Fecha específica</label>'
    +'<input class="fsm" id="sm-date" type="date" value="'+(p.date||'')+'">'
    +'</div>'
    +(isEdit && smEditOccDate
      ? '<div id="sm-scope-wrap" style="display:'+(recVal?'':'none')+'">'
        +'<label class="field-label">Aplicar este cambio a</label>'
        +'<div class="sm-seg" id="sm-scope-seg">'
        +'<button class="on" data-scope="all" onclick="smToggleSeg(\'sm-scope-seg\',this)">Todas las semanas</button>'
        +'<button data-scope="one" onclick="smToggleSeg(\'sm-scope-seg\',this)">Solo '+fmtDM(new Date(smEditOccDate+'T00:00:00'))+'</button>'
        +'</div>'
        +'</div>'
      : '')
    +(isEdit && smType==='free'
      ? '<div style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(0,0,0,0.08)">'
        +'<label class="field-label">🔄 Reprogramar un alumno a este horario</label>'
        +'<select class="fsm" id="sm-swap-session" style="appearance:auto">'
          +'<option value="">— Elegir alumno y horario actual —</option>'
          +swapOpts
        +'</select>'
        +'<button class="btn-grn" style="margin-top:8px;background:rgba(0,0,0,0.85)" onclick="swapFreeSlotWithSession()">Intercambiar horarios</button>'
        +'<div style="font-size:11px;color:rgba(0,0,0,0.45);margin-top:6px;line-height:1.4">El horario actual del alumno seleccionado quedará libre, y este horario libre pasará a ser su nueva clase. Útil para reprogramaciones.</div>'
        +'</div>'
      : '')
    +'<button class="btn-grn" style="margin-top:4px" onclick="submitSessionModal()">'+(isEdit?'Guardar cambios':'Crear')+'</button>'
    +(isEdit ? '<button class="sm-del-btn" onclick="deleteSessionFromModal()">⊘ Eliminar este horario</button>' : '')
    +'</div></div>';
  var el = document.getElementById('session-modal');
  el.innerHTML = html;
  el.style.display = '';
}

function openNewSession(opts) {
  smEditId = null; smEditFree = false; smEditOccDate = null;
  smType = (opts && opts.type) || 'session';
  _buildSM(opts && opts.prefill, false);
}

function openEditSession(id, isFree, occDate) {
  smEditId = id; smEditFree = !!isFree;
  smEditOccDate = occDate || null;
  smType = isFree ? 'free' : 'session';
  var src = isFree
    ? (DATA.freeSlots||[]).find(function(s){ return s.id==id; }) || {}
    : DATA.sessions.find(function(s){ return s.id==id; }) || {};
  // Sessions don't store parentId — look it up from children lists
  if (!isFree && src.studentId != null && !src.parentId) {
    var pe = Object.entries(DATA.parents).find(function(e) {
      return (e[1].children||[]).map(String).includes(String(src.studentId));
    });
    if (pe) src = Object.assign({}, src, { parentId: pe[0] });
  }
  _buildSM(src, true);
}

function closeSessionModal() {

function smSetType(t) {

function smToggleSeg(segId, btn) {

function smToggleRec(btn, rec) {
  document.querySelectorAll('#sm-rec-seg button').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  document.getElementById('sm-date-wrap').style.display = rec ? 'none' : '';
  // El selector "aplicar a todas las semanas / solo esta fecha" únicamente tiene sentido
  // mientras la regla sigue siendo semanal — si se cambia a "Solo una vez" ya se está
  // convirtiendo toda la regla, así que se oculta.
  var scopeWrap = document.getElementById('sm-scope-wrap');

// Cuando se edita "solo esta fecha" y se cambia el día de la semana, la excepción de una
// sola vez debe caer en la fecha real correspondiente a ese nuevo día (dentro de la misma
// semana lunes-domingo), no quedarse en la fecha original. Ej: sábado 20 → domingo, debe
// dar la fecha del domingo 21, no seguir guardando el 20.
function _shiftDateToDow(dateStr, newDow) {
  var d = new Date(dateStr + 'T00:00:00');
  var isoOrig = d.getDay() === 0 ? 7 : d.getDay();
  var isoNew  = newDow === 0 ? 7 : newDow;
  d.setDate(d.getDate() + (isoNew - isoOrig));
  return d.toISOString().slice(0, 10);
}

function submitSessionModal() {
  var dayEl   = document.getElementById('sm-day');
  var startEl = document.getElementById('sm-start');
  var durEl   = document.getElementById('sm-dur');
  if (!startEl || !startEl.value) { showToast('Indica la hora de inicio.'); return; }
  var day      = parseInt(dayEl.value);
  var start    = startEl.value;
  var dur      = parseInt(durEl.value);
  var modBtn   = document.querySelector('#sm-mod-seg .on');
  var modality = modBtn ? modBtn.textContent.trim() : 'Virtual';
  var recBtn   = document.querySelector('#sm-rec-seg .on');
  var recurring = recBtn ? recBtn.dataset.rec !== 'false' : true;
  var cycleIdEl  = document.getElementById('sm-cycle-id');
  var cycleIdVal = cycleIdEl && cycleIdEl.value !== '' ? cycleIdEl.value : null;
  var dateEl   = document.getElementById('sm-date');
  var date     = recurring ? null : (dateEl ? dateEl.value || null : null);
  if (!recurring && !date) { showToast('Indica la fecha específica.'); return; }
  var curEditId = smEditId;
  // "Solo esta fecha": al editar una clase/horario que sigue siendo semanal, en vez de
  // reescribir la regla completa (lo que afectaría TODAS las semanas del ciclo) se le
  // agrega smEditOccDate al skipDates[] de la regla base (para que esa fecha puntual deje
  // de generarse con los valores viejos) y se crea una entrada nueva de una sola vez con
  // los valores editados. El resto de semanas de la serie quedan intactas.
  var scopeBtn = document.querySelector('#sm-scope-seg .on');
  var onlyThisDate = recurring && curEditId !== null && !!smEditOccDate
    && scopeBtn && scopeBtn.dataset.scope === 'one';
  if (smType === 'free') {
    if (!DATA.freeSlots) DATA.freeSlots = [];
    if (onlyThisDate) {
      var baseFs = DATA.freeSlots.find(function(s){ return s.id==curEditId; });
      if (baseFs) {
        if (!Array.isArray(baseFs.skipDates)) baseFs.skipDates = [];
        if (baseFs.skipDates.indexOf(smEditOccDate) === -1) baseFs.skipDates.push(smEditOccDate);
      }
      DATA.freeSlots.push({ id:'fs_'+Date.now(), day:day, start:start, dur:dur, modality:modality, recurring:false, date:_shiftDateToDow(smEditOccDate, day), bookedBy:null });
    } else {
      var fs = { id: curEditId !== null ? curEditId : ('fs_'+Date.now()), day:day, start:start, dur:dur, modality:modality, recurring:recurring, date:date, bookedBy:null };
      if (recurring) fs.cycleId = cycleIdVal;
      if (curEditId !== null) {
        var idx = DATA.freeSlots.findIndex(function(s){ return s.id==curEditId; });
        if (idx>=0) { fs.bookedBy = DATA.freeSlots[idx].bookedBy; DATA.freeSlots[idx]=fs; }
        else DATA.freeSlots.push(fs);
      } else { DATA.freeSlots.push(fs); }
    }
    saveFreeSlots();
  } else {
    var parEl = document.getElementById('sm-parent');
    var stuEl = document.getElementById('sm-student');
    if (!parEl || !stuEl || !stuEl.value) { showToast('Selecciona padre y alumno.'); return; }
    var studentId = parseInt(stuEl.value);
    var topic = modality === 'Virtual' ? 'One to One' : 'One to Family';
    if (onlyThisDate) {
      var baseSess = DATA.sessions.find(function(s){ return s.id==curEditId; });
      if (baseSess) {
        if (!Array.isArray(baseSess.skipDates)) baseSess.skipDates = [];
        if (baseSess.skipDates.indexOf(smEditOccDate) === -1) baseSess.skipDates.push(smEditOccDate);
      }
      DATA.sessions.push({ id:Date.now(), studentId:studentId, day:day, start:start, dur:dur, modality:modality, topic:topic, recurring:false, date:_shiftDateToDow(smEditOccDate, day) });
    } else {
      var sess = { id: curEditId !== null ? curEditId : Date.now(), studentId:studentId, day:day, start:start, dur:dur, modality:modality, topic:topic, recurring:recurring, date:date };
      if (recurring) sess.cycleId = cycleIdVal;
      if (curEditId !== null) {
        var idx2 = DATA.sessions.findIndex(function(s){ return s.id==curEditId; });
        if (idx2>=0) DATA.sessions[idx2]=sess; else DATA.sessions.push(sess);
      } else { DATA.sessions.push(sess); }
    }
    saveSessions();
  }
  closeSessionModal();
  render();
  showToast(onlyThisDate ? 'Cambios guardados solo para esa fecha.' : (curEditId !== null ? 'Cambios guardados.' : 'Creado correctamente.'), 'success');
}

// Reprogramación rápida: intercambia el horario libre que se está editando con la clase
// semanal de un alumno seleccionado. El horario libre pasa a tener el día/hora/duración/
// modalidad que tenía esa clase (queda libre ahí), y la clase del alumno se muda al día/
// hora que tenía este horario libre (conserva su propia duración y modalidad).
// Respeta el mismo selector "Aplicar este cambio a" (Todas las semanas / Solo esa fecha)
// que usa la edición normal de horario: si se eligió "Solo esa fecha", el intercambio NO
// toca las reglas semanales de ninguno de los dos — solo crea excepciones puntuales para
// esa semana (vía skipDates + una entrada de una sola vez), igual que el resto del ciclo
// sigue normal.
function swapFreeSlotWithSession() {
  var sel = document.getElementById('sm-swap-session');
  if (!sel || !sel.value) { showToast('Selecciona un alumno y horario para reprogramar.'); return; }
  if (smEditId == null) return;
  var sessionId = parseInt(sel.value);
  var fsIdx   = (DATA.freeSlots||[]).findIndex(function(s){ return s.id == smEditId; });
  var sessIdx = (DATA.sessions||[]).findIndex(function(s){ return s.id === sessionId; });
  if (fsIdx < 0 || sessIdx < 0) { showToast('No se encontró el horario seleccionado.'); return; }
  var fs   = DATA.freeSlots[fsIdx];
  var sess = DATA.sessions[sessIdx];

  var recBtn   = document.querySelector('#sm-rec-seg .on');
  var recurring = recBtn ? recBtn.dataset.rec !== 'false' : true;
  var scopeBtn = document.querySelector('#sm-scope-seg .on');
  var onlyThisDate = recurring && !!smEditOccDate && scopeBtn && scopeBtn.dataset.scope === 'one';

  if (onlyThisDate) {
    // Fecha del alumno (su ocurrencia semanal normal) dentro de la misma semana que la
    // fecha del horario libre que se está editando — la que va a quedar libre.
    var sessOccDate = _shiftDateToDow(smEditOccDate, sess.day);
    if (!Array.isArray(fs.skipDates)) fs.skipDates = [];
    if (fs.skipDates.indexOf(smEditOccDate) === -1) fs.skipDates.push(smEditOccDate);
    if (!Array.isArray(sess.skipDates)) sess.skipDates = [];
    if (sess.skipDates.indexOf(sessOccDate) === -1) sess.skipDates.push(sessOccDate);
    // Ese día, el horario que normalmente tiene el alumno queda libre por una sola vez.
    DATA.freeSlots.push({ id:'fs_'+Date.now(), day:sess.day, start:sess.start, dur:sess.dur, modality:sess.modality, recurring:false, date:sessOccDate, bookedBy:null });
    // Y el alumno toma, por una sola vez, el horario que estaba libre.
    DATA.sessions.push({ id:Date.now(), studentId:sess.studentId, day:fs.day, start:fs.start, dur:sess.dur, modality:sess.modality, topic:sess.topic, recurring:false, date:smEditOccDate });
  } else {
    var newFreeDay = sess.day, newFreeStart = sess.start, newFreeDur = sess.dur, newFreeMod = sess.modality;
    var newSessDay = fs.day, newSessStart = fs.start;
    var newFs = { id: fs.id, day: newFreeDay, start: newFreeStart, dur: newFreeDur, modality: newFreeMod, recurring: true, date: null, bookedBy: null };
    if (fs.cycleId != null) newFs.cycleId = fs.cycleId;
    DATA.freeSlots[fsIdx] = newFs;
    DATA.sessions[sessIdx] = Object.assign({}, sess, { day: newSessDay, start: newSessStart, recurring: true, date: null, skipDates: Array.isArray(sess.skipDates) ? sess.skipDates : [] });
  }
  // Importante: freeSlots y sessions se guardan en UNA sola escritura (no dos llamadas
  // separadas a saveFreeSlots()/saveSessions()). Si se guardan por separado, el snapshot
  // de Firestore puede "hacer eco" del primer guardado antes de que el segundo se complete,
  // y ese eco trae de vuelta el campo que todavía no se guardó con su valor viejo —
  // pisando localmente el cambio recién hecho y haciendo que el horario anterior reaparezca
  // en el desplegable de "Reprogramar alumno" (o en el calendario) por un momento, o de forma
  // persistente si la segunda escritura nunca llega a aplicarse bien. Una sola escritura
  // atómica con ambos campos evita esa condición de carrera.
  REF.set({ freeSlots: DATA.freeSlots, sessions: DATA.sessions }, { merge:true })
    .catch(function(e){ console.error(e); showToast('Error al guardar el cambio.'); });
  closeSessionModal();
  render();
  showToast(onlyThisDate ? 'Horario reprogramado solo para esa fecha.' : 'Horario reprogramado: el alumno se mudó, y su horario anterior ahora está libre.', 'success');
}

function deleteSessionFromModal() {
  var btn = document.querySelector('.sm-del-btn');
  if (!btn) return;
  if (!btn.dataset.confirmed) {
    btn.textContent = '¿Confirmar? Toca de nuevo para eliminar.';
    btn.style.background = 'rgba(0,0,0,0.07)';
    btn.dataset.confirmed = '1';
    return;
  }
  // Si la regla sigue siendo semanal y se eligió "Solo esta fecha", NO se borra toda la
  // serie — solo se agrega smEditOccDate a skipDates[] para cancelar esa ocurrencia puntual;
  // el resto de semanas del ciclo siguen intactas. Aplica tanto a horarios libres como a
  // horarios ya tomados (por alumno/padre de familia).
  var scopeBtn = document.querySelector('#sm-scope-seg .on');
  var onlyThisDate = !!smEditOccDate && scopeBtn && scopeBtn.dataset.scope === 'one';
  if (smEditFree) {
    var baseFs = (DATA.freeSlots||[]).find(function(s){ return s.id==smEditId; });
    if (onlyThisDate && baseFs && baseFs.recurring !== false) {
      if (!Array.isArray(baseFs.skipDates)) baseFs.skipDates = [];
      if (baseFs.skipDates.indexOf(smEditOccDate) === -1) baseFs.skipDates.push(smEditOccDate);
    } else {
      onlyThisDate = false;
      DATA.freeSlots = (DATA.freeSlots||[]).filter(function(s){ return s.id!=smEditId; });
    }
    saveFreeSlots();
  } else {
    var baseSess = (DATA.sessions||[]).find(function(s){ return s.id==smEditId; });
    if (onlyThisDate && baseSess && baseSess.recurring !== false) {
      if (!Array.isArray(baseSess.skipDates)) baseSess.skipDates = [];
      if (baseSess.skipDates.indexOf(smEditOccDate) === -1) baseSess.skipDates.push(smEditOccDate);
    } else {
      onlyThisDate = false;
      DATA.sessions = DATA.sessions.filter(function(s){ return s.id!=smEditId; });
    }
    saveSessions();
  }
  closeSessionModal();
  render();
  showToast(onlyThisDate ? 'Horario cancelado solo para esa fecha.' : 'Eliminado.', 'success');
}

function bookFreeSlot(fsId) {
  var parentId = getLoggedParent();
  if (!parentId) return;
  var parent = DATA.parents[parentId];
  if (!parent) return;
  var fs = (DATA.freeSlots||[]).find(function(s){ return s.id===fsId; });
  if (!fs || fs.bookedBy) { showToast('Este horario ya no está disponible.'); return; }
  var kids = (parent.children||[]).map(function(id){ var st=DATA.students[id]||{}; return Object.assign({id:id},st); }).filter(function(c){ return c.name; });
  if (!kids.length) return;
  if (kids.length === 1) {
    fs.bookedBy = { parentId:parentId, studentId:kids[0].id };
    saveFreeSlots(); render();
    showToast('Horario reservado para '+kids[0].name.split(' ')[0]+'.', 'success');
  } else {
    var sel = prompt('¿Para qué alumno?\n'+kids.map(function(k,i){ return (i+1)+'. '+k.name; }).join('\n'));
    var ix = parseInt(sel) - 1;
    if (ix >= 0 && ix < kids.length) {
      fs.bookedBy = { parentId:parentId, studentId:kids[ix].id };
      saveFreeSlots(); render();
      showToast('Horario reservado.', 'success');
    }
  }
}

// ════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════
function boot() {
  document.getElementById('initial-loading').classList.add('hidden');
  const parentId = getLoggedParent();
  const parent = parentId !== null ? DATA.parents[parentId] : null;
  if (parent) {
    selectedChild = (parent.children||[])[0] || null;
    currentView = 'inicio';
  } else {
    currentView = 'login';
  }
  render();
}

loadData();
</script>
