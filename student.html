// Lógica pura de "editar prompt" sobre UN objeto prompts dado (no toca variables globales):
// reusada para la actualización local optimista y dentro de la transacción de guardado (sobre
// el dato fresco del servidor), para que ninguna de las dos copias pueda desincronizarse.
// getStudents() es una lista independiente (no forma parte del documento de Firestore que se
// está leyendo/escribiendo aquí), así que es seguro usarla igual en ambas llamadas.
function _applyEditPrompt(promptsObj, editingId, name, text) {
  const p = JSON.parse(JSON.stringify(promptsObj || {}));
  let origPrompt = null;
  for (const sid of Object.keys(p)) {
    const found = (p[sid]||[]).find(x => x.id === editingId);
    if (found) { origPrompt = found; break; }
  }
  if (!origPrompt) return { prompts: p, sharedId: null, found: false };

  let sharedId = origPrompt.sharedId || null;
  // Prompts viejos sin sharedId: detectar copias por nombre+texto y vincularlas
  if (!sharedId) {
    const origName = origPrompt.name;
    const origText = origPrompt.text;
    const matchingSids = getStudents()
      .map(s => String(s.id))
      .filter(sid => (p[sid]||[]).some(x => x.name === origName && x.text === origText));
    if (matchingSids.length > 1) {
      sharedId = 'shared_' + Date.now().toString();
      matchingSids.forEach(sid => {
        p[sid] = p[sid].map(x =>
          x.name === origName && x.text === origText ? { ...x, sharedId } : x
        );
      });
    }
  }
  // Actualizar todas las copias vinculadas, guardando versión anterior en history
  getStudents().forEach(s => {
    const sid = String(s.id);
    if (!p[sid]) return;
    p[sid] = p[sid].map(x => {
      const match = x.id === editingId || (sharedId && x.sharedId === sharedId);
      if (!match) return x;
      const hist = [...(x.history||[]), { name: x.name, text: x.text, ts: x.ts||Date.now() }]
        .slice(-10); // máximo 10 versiones
      return { ...x, name, text, ts: Date.now(), history: hist };
    });
  });
  return { prompts: p, sharedId, found: true };
}
// Igual idea para "crear prompt": lógica pura sobre un objeto prompts dado. id/sharedId/ts se
// calculan UNA SOLA VEZ afuera (no con Date.now() adentro) para que el resultado sea idéntico
// sin importar cuántas veces Firestore tenga que reintentar la transacción internamente.
function _applyCreatePrompt(promptsObj, studentId, alsoSids, entry, sharedId) {
  const p = JSON.parse(JSON.stringify(promptsObj || {}));
  const key = String(studentId);
  if (!p[key]) p[key] = [];
  p[key].push({ ...entry });
  alsoSids.forEach((sid, i) => {
    if (!p[sid]) p[sid] = [];
    p[sid].push({ ...entry, id: sharedId + '_' + i + '_' + sid });
  });
  return p;
}
function savePrompt(studentId) {
  if (!firestoreDataReady()) return;
  const name = (document.getElementById('prompt-name')?.value||'').trim();
  const text = (document.getElementById('prompt-text')?.value||'').trim();
  if (!name) { showToast('Escribe un nombre para el prompt.'); return; }
  if (!text) { showToast('Escribe el texto del prompt.'); return; }

  const editingId = document.getElementById('prompt-editing-id')?.value || '';

  if (editingId) {
    const localResult = _applyEditPrompt(prompts, editingId, name, text);
    if (!localResult.found) { showToast('Prompt no encontrado.'); return; }
    prompts = localResult.prompts;
    // El guardado vuelve a aplicar la misma edición sobre el dato fresco del servidor (no sobre
    // esta copia local), dentro de una transacción — ver saveLmsFieldTx.
    savePrompts(fresh => _applyEditPrompt(fresh, editingId, name, text).prompts);
    showToast('Prompt actualizado.' + (localResult.sharedId ? ' (aplicado a todos los alumnos compartidos)' : ''), 'success');
    router();
    return;
  }

  // CREATE MODE
  const alsoSids = [...padChecked];
  const isShared = alsoSids.length > 0;
  const ts = Date.now();
  const sharedId = isShared ? ts.toString() : undefined;
  const id = ts.toString() + '_' + String(studentId);
  const entry = { id, name, text, ts, ...(isShared ? {sharedId} : {}), ...(promptTag ? {tag: promptTag} : {}) };
  prompts = _applyCreatePrompt(prompts, studentId, alsoSids, entry, sharedId);
  savePrompts(fresh => _applyCreatePrompt(fresh, studentId, alsoSids, entry, sharedId));
  padGroupOpen = null;
  padChecked = new Set();
  promptTag = null;
  showToast('Prompt guardado.', 'success');
  router();
}

function _applyRestorePromptVersion(promptsObj, promptId, histIdx) {
  const p = JSON.parse(JSON.stringify(promptsObj || {}));
  let sharedId = null;
  for (const sid of Object.keys(p)) {
    const found = (p[sid]||[]).find(x => x.id === promptId);
    if (found) { sharedId = found.sharedId || null; break; }
  }
  getStudents().forEach(s => {
    const sid = String(s.id);
    if (!p[sid]) return;
    p[sid] = p[sid].map(x => {
      const match = x.id === promptId || (sharedId && x.sharedId === sharedId);
      if (!match) return x;
      const hist = x.history || [];
      const version = hist[histIdx];
      if (!version) return x;
      // Save current as new history entry, then restore
      const newHist = [...hist.filter((_,i)=>i!==histIdx), { name: x.name, text: x.text, ts: x.ts }]
        .slice(-10); // máximo 10 versiones
      return { ...x, name: version.name, text: version.text, ts: Date.now(), history: newHist };
    });
  });
  return p;
}
function restorePromptVersion(promptId, studentId, histIdx) {
  if (!firestoreDataReady()) return;
  prompts = _applyRestorePromptVersion(prompts, promptId, histIdx);
  savePrompts(fresh => _applyRestorePromptVersion(fresh, promptId, histIdx));
  showToast('Versión restaurada.', 'success');
  _promptHistOpen = null;
  router();
}

function _computeFilteredPrompts() {
  let groups = getAllUniquePrompts();
  if (promptTagFilter) groups = groups.filter(g => g.tag === promptTagFilter);
  if (promptSearchQuery && promptSearchQuery.trim()) {
    const q = normName(promptSearchQuery);
    groups = groups.filter(g => normName(g.name).includes(q) || normName(g.text).includes(q) || (g.tag && normName(_tagInfo(g.tag)?.label||'').includes(q)));
  }
  return [...groups].sort((a,b) => promptSort === 'old' ? (a.ts||0)-(b.ts||0) : (b.ts||0)-(a.ts||0));
}

// Junta en una sola lista los prompts de todos los alumnos, sin repetir las
// copias compartidas (mismo sharedId, o mismo nombre para prompts viejos sin
// sharedId). Cada tarjeta muestra con qué alumnos está vinculado el prompt.
function getAllUniquePrompts() {
  const groups = [];
  const idxByKey = {};
  getStudents().forEach(s => {
    (prompts[String(s.id)] || []).forEach(p => {
      const key = p.sharedId ? ('s:' + p.sharedId) : ('n:' + p.name);
      if (idxByKey[key] !== undefined) {
        groups[idxByKey[key]].students.push(s);
        return;
      }
      idxByKey[key] = groups.length;
      groups.push({ id: p.id, name: p.name, text: p.text, ts: p.ts, tag: p.tag, history: p.history, students: [s] });
    });
  });
  return groups.sort((a, b) => (b.ts || 0) - (a.ts || 0));
}

          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:5px">
            ${g.tag&&_tagInfo(g.tag)?`<span style="font-size:11px;background:rgba(186,255,41,0.12);border:1px solid rgba(186,255,41,0.35);color:#baff29;border-radius:8px;padding:2px 6px;font-weight:700">${_tagInfo(g.tag).icon} ${_tagInfo(g.tag).label}</span>`:''}

function copyPromptGlobal(promptId) {
  let p = null;
  for (const sid of Object.keys(prompts)) {
    p = (prompts[sid]||[]).find(x => x.id === promptId);
    if (p) break;
  }
  if (!p) return;
  const txt = p.name + '\n\n' + p.text;
  navigator.clipboard.writeText(txt).then(()=>showToast('Prompt copiado.','success')).catch(()=>showToast('No se pudo copiar.'));
}
// Borra el prompt de TODOS los alumnos vinculados (mismo sharedId), a diferencia
// de deletePrompt() que solo borra la copia de un alumno puntual.
function _applyDeleteAllLinkedPrompt(promptsObj, promptId) {
  const p = JSON.parse(JSON.stringify(promptsObj || {}));
  let sharedId = null;
  for (const sid of Object.keys(p)) {
    const found = (p[sid]||[]).find(x => x.id === promptId);
    if (found) { sharedId = found.sharedId || null; break; }
  }
  Object.keys(p).forEach(sid => {
    p[sid] = (p[sid]||[]).filter(x => {
      if (x.id === promptId) return false;
      if (sharedId && x.sharedId === sharedId) return false;
      return true;
    });
  });
  return p;
}
function deleteAllLinkedPrompt(promptId) {
  if (!firestoreDataReady()) return;
  prompts = _applyDeleteAllLinkedPrompt(prompts, promptId);
  savePrompts(fresh => _applyDeleteAllLinkedPrompt(fresh, promptId));
  showToast('Prompt eliminado.', 'success');
  router();
}

function _applyGlobalPrompt(promptsObj, sids, ts, isShared, sharedId, name, text, tag) {
  const p = JSON.parse(JSON.stringify(promptsObj || {}));
  sids.forEach((sid, i) => {
    const entry = { id: ts + '_' + i + '_' + sid, name, text, ts, ...(isShared ? {sharedId} : {}), ...(tag ? {tag} : {}) };
    if (!p[sid]) p[sid] = [];
    p[sid].push(entry);
  });
  return p;
}
function saveGlobalPrompt() {
  if (!firestoreDataReady()) return;
  const name = (document.getElementById('gprompt-name')?.value||'').trim();
  const text = (document.getElementById('gprompt-text')?.value||'').trim();
  if (!name) { showToast('Escribe un nombre para el prompt.'); return; }
  if (!text) { showToast('Escribe el texto del prompt.'); return; }
  const sids = [...gpromptChecked];
  if (sids.length === 0) { showToast('Selecciona al menos un alumno.'); return; }
  const ts = Date.now();
  const isShared = sids.length > 1;
  const sharedId = isShared ? String(ts) : undefined;
  prompts = _applyGlobalPrompt(prompts, sids, ts, isShared, sharedId, name, text, gpromptTag);
  savePrompts(fresh => _applyGlobalPrompt(fresh, sids, ts, isShared, sharedId, name, text, gpromptTag));
  gpromptGroupOpen = null;
  gpromptChecked = new Set();
  gpromptTag = null;
  showToast('Prompt guardado.', 'success');
  router();
}

function taskAssignedTo(t, sid) {
  if (!t.assignTo || t.assignTo === 'all') return true;
  if (Array.isArray(t.assignTo)) return t.assignTo.map(String).includes(String(sid));
  return String(t.assignTo) === String(sid);
}
// Para tareas asignadas a un solo alumno: cuántas de SUS tareas de este mes
// (creadas este mes, hechas o no) están completadas — en vez de "X de Y alumnos".
function studentMonthTaskStat(sid) {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const list = tasks.filter(x => {
    const ts = parseInt(x.id, 10);
    if (!ts) return false;
    const d = new Date(ts);
    return d.getFullYear() === y && d.getMonth() === m && taskAssignedTo(x, sid);
  });
  const done = list.filter(x => (x.completedBy||[]).map(String).includes(String(sid))).length;
  return { done, total: list.length };
}

async function addTask() {
  if (!firestoreDataReady()) return;
  const title=(document.getElementById('t-title')?.value||'').trim();
  if (!title) { showToast('Escribe un título.'); return; }
  const editingId = document.getElementById('t-editing-id')?.value||'';
  // Resolve attachment
  let att = null;
  const linkUrl=(document.getElementById('task-link-url')?.value||'').trim();
  const linkName=(document.getElementById('task-link-name')?.value||'').trim();
  if (_taskFileObj) {
    const isImg = _taskFileObj.type.startsWith('image/');
    if (isImg) {
      try {
        const b64 = await _compressImgB64(_taskFileObj,900,0.72);
        if (b64.length > 700000){ showToast('Imagen muy grande. Usa una de menor resolución.'); return; }
        att = { type:'image', url:b64, name:_taskFileObj.name };
      } catch(e){ showToast('Error al procesar imagen.'); return; }
    } else {
      try {
        const ref = firebase.storage().ref('task-files/'+Date.now()+'_'+_taskFileObj.name);
        const snap = await ref.put(_taskFileObj);
        const url = await snap.ref.getDownloadURL();
        att = { type:'file', url, name:_taskFileObj.name };
      } catch(e){
        showToast('Error al subir archivo (' + (e.code||e.message||'error') + ').');
        console.error('task file upload', e);
        return;
      }
    }
  } else if (linkUrl) {
    att = { type:'link', url:/^https?:\/\//i.test(linkUrl)?linkUrl:'https://'+linkUrl, name:linkName||linkUrl };
  }
  const assignTo = getTaskAssignTo();
  const taskData = {
    title,
    desc:     (document.getElementById('t-desc')?.value||'').trim(),
    due:       document.getElementById('t-due')?.value||'',
    time:      document.getElementById('t-time')?.value||'',
    assignTo,
    tag: taskTag || '',
    promptId: '', promptName: '',
    ...(att ? {att} : {})
  };
  const newId = Date.now().toString();
  if (editingId) {
    const idx = tasks.findIndex(t=>t.id===editingId);
    if (idx > -1) { tasks[idx] = { ...tasks[idx], ...taskData }; if (!att) delete tasks[idx].att; }
    showToast('Tarea actualizada.','success');
  } else {
    tasks.push({ id: newId, completedBy: [], pendingReview: [], notDoneBy: [], ...taskData });
    showToast('Tarea guardada.','success');
  }
  // El transform se vuelve a aplicar sobre el arreglo FRESCO leído del servidor dentro de la
  // transacción (saveLmsFieldTx) — no asume que "tasks" en memoria sigue siendo la fuente de
  // verdad, así que una tarea creada/editada en otro dispositivo mientras esta pestaña estaba
  // desactualizada no se pierde.
  saveTasks(arr => {
    if (editingId) {
      return arr.map(t => {
        if (t.id !== editingId) return t;
        const merged = { ...t, ...taskData };
        if (!att) delete merged.att;
        return merged;
      });
    }
    return [...arr, { id: newId, completedBy: [], pendingReview: [], notDoneBy: [], ...taskData }];
  });
  _taskFileObj = null;
  go('tareas');
}
function deleteTask(id) {
  if (!firestoreDataReady()) return;
  tasks=tasks.filter(t=>t.id!==id);
  saveTasks(arr => arr.filter(t=>t.id!==id));
  const el=document.getElementById('tc-'+id);
  if (el) el.remove();
  showToast('Tarea eliminada.','success');
}
function deleteTaskFromForm() {
  const id = document.getElementById('t-editing-id')?.value || '';

  if (!confirm('¿Eliminar esta tarea?')) return;

// "Marcar como no hecha" es un toggle persistente (igual que el botón de hecha): el primer clic
// guarda loggedId en notDoneBy (el botón queda en rojo sólido) y un segundo clic lo quita,
// volviendo la tarea a su estado neutral/sin marcar. Siempre limpia completedBy/pendingReview
// porque hecha y no-hecha son mutuamente excluyentes.
function markTaskUndone(id) {
  if (!firestoreDataReady()) return;
  const loggedId = getLoggedId();
  const idx = tasks.findIndex(t=>t.id===id); if (idx<0) return;
  const wasMarked = (tasks[idx].notDoneBy||[]).includes(loggedId);
  const toggle = t => {
    const isMarked = (t.notDoneBy||[]).includes(loggedId);
    const notDoneBy = isMarked
      ? (t.notDoneBy||[]).filter(x=>String(x)!==String(loggedId))
      : [...(t.notDoneBy||[]), loggedId];
    return {
      ...t,
      completedBy:   (t.completedBy||[]).filter(x=>String(x)!==String(loggedId)),
      pendingReview: (t.pendingReview||[]).filter(x=>String(x)!==String(loggedId)),
      notDoneBy,
    };
  };
  tasks[idx] = toggle(tasks[idx]);
  saveTasks(arr => arr.map(t => t.id===id ? toggle(t) : t));
  showToast(wasMarked ? 'Marca de no hecha quitada.' : 'Marcada como no hecha.','success');
  router();
}
// Aplica la lógica de marcar/desmarcar una tarea como hecha sobre UN objeto de tarea dado, sin
// tocar variables globales — se usa tanto para la actualización local optimista como dentro de
// la transacción de guardado (sobre el dato fresco del servidor), para que ambas copias se
// calculen exactamente igual y no puedan desincronizarse entre sí.
function _toggleTaskDoneOnTask(task, loggedId, admin) {
  const t = { ...task, completedBy:[...(task.completedBy||[])], pendingReview:[...(task.pendingReview||[])], notDoneBy:[...(task.notDoneBy||[])] };
  // Marcar/enviar como hecha quita cualquier marca previa de "no hecha" (son mutuamente excluyentes).
  const ndi = t.notDoneBy.indexOf(loggedId); if (ndi>-1) t.notDoneBy.splice(ndi,1);
  if (admin) {
    // El admin marca/desmarca directamente, sin pasar por aprobación (es su propio criterio).
    const idx=t.completedBy.indexOf(loggedId);
    if (idx>-1) t.completedBy.splice(idx,1);
    else { t.completedBy.push(loggedId); const ri=t.pendingReview.indexOf(loggedId); if (ri>-1) t.pendingReview.splice(ri,1); }
  } else {
    // El alumno: "MARCAR COMO HECHA" envía la tarea a revisión (pendingReview), no la completa
    // directamente. Si ya está aprobada (completedBy) puede desmarcarla. Si está esperando
    // aprobación, puede cancelar su propia entrega (volver a pendiente).
    const doneIdx = t.completedBy.indexOf(loggedId);
    const revIdx  = t.pendingReview.indexOf(loggedId);
    if (doneIdx>-1) {
      t.completedBy.splice(doneIdx,1);
    } else if (revIdx>-1) {
      t.pendingReview.splice(revIdx,1);
    } else {
      t.pendingReview.push(loggedId);
    }
  }
  return t;
}
function toggleTaskDone(id) {
  if (!firestoreDataReady()) return;
  const loggedId=getLoggedId();
  const idx=tasks.findIndex(t=>t.id===id); if (idx<0) return;
  const task = tasks[idx];
  const admin = isAdmin();
  const wasPending = (task.pendingReview||[]).includes(loggedId);
  const wasDone    = (task.completedBy||[]).includes(loggedId);
  tasks[idx] = _toggleTaskDoneOnTask(task, loggedId, admin);
  if (!admin && !wasPending && !wasDone) showToast('Marcada como hecha. Esperando aprobación del profesor.','success');
  saveTasks(arr => arr.map(t => t.id===id ? _toggleTaskDoneOnTask(t, loggedId, admin) : t));
  router(); // re-render completo para que el filtro Pendientes/Completadas se aplique correctamente
}
// Igual que _toggleTaskDoneOnTask: lógica pura sobre un objeto de tarea, reusada en la
// actualización local y dentro de la transacción de guardado.
function _approveTaskOnTask(task, studentId) {
  const t = { ...task, completedBy:[...(task.completedBy||[])], pendingReview:[...(task.pendingReview||[])] };
  const ri=t.pendingReview.findIndex(x=>String(x)===String(studentId));
  // Reusar el valor ya almacenado en pendingReview (no el string del onclick) para que el tipo
  // coincida con el que el alumno usa al comparar su propio loggedId con completedBy.includes(...).
  const storedId = ri>-1 ? t.pendingReview[ri] : studentId;
  if (ri>-1) t.pendingReview.splice(ri,1);
  if (!t.completedBy.some(x=>String(x)===String(storedId))) t.completedBy.push(storedId);
  return t;
}
function approveTask(id, studentId) {
  if (!firestoreDataReady()) return;
  const idx=tasks.findIndex(t=>t.id===id); if (idx<0) return;
  tasks[idx] = _approveTaskOnTask(tasks[idx], studentId);
  saveTasks(arr => arr.map(t => t.id===id ? _approveTaskOnTask(t, studentId) : t));
  showToast('Tarea aprobada.','success');
  router();
}
function _rejectTaskOnTask(task, studentId) {
  const t = { ...task, pendingReview:[...(task.pendingReview||[])] };
  const ri=t.pendingReview.findIndex(x=>String(x)===String(studentId));
  if (ri>-1) t.pendingReview.splice(ri,1);
  return t;
}
function rejectTask(id, studentId) {
  if (!firestoreDataReady()) return;
  const idx=tasks.findIndex(t=>t.id===id); if (idx<0) return;
  tasks[idx] = _rejectTaskOnTask(tasks[idx], studentId);
  saveTasks(arr => arr.map(t => t.id===id ? _rejectTaskOnTask(t, studentId) : t));
  showToast('Entrega devuelta al alumno.','success');
  router();
}

// Ganadores del sorteo por mes (clave 'YYYY-MM'). El top-3 de puntos se calcula solo;
// el ganador del sorteo es un resultado al azar que no se puede derivar de los puntos,
// así que se guarda aquí — basta con agregar una línea cuando termine cada sorteo.
const SORTEO_WINNERS = {
  '2026-04': 'Manuel Villacorta',
  '2026-05': 'Brunella Varillas'
};
const MESES_ES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];

// Calcula automáticamente el top-3 de puntos de un mes pasado (monthOffset negativo) a partir
// del historial guardado en pointsLog — sin necesidad de capturar nada a mano.
function getMonthTop3(monthOffset) {
  const students = getStudents();
  return [...students]
    .map(s => ({ id:s.id, nombre:s.name, pts: getTotalPts2(s.id, monthOffset) }))
    .sort((a,b) => b.pts - a.pts)
    .slice(0,3);
}
function getTotalPts2(id, monthOffset) {
  const p = getStudentPoints(id, monthOffset);
  return p.hours + p.progress + p.tasks;
}

// Cuando empieza un mes nuevo, archiva automáticamente el podio (top-3) del mes que acaba de
// terminar — calculado a partir de los puntos guardados ese mes — para que quede guardado para
// siempre en HISTORIAL sin necesidad de capturarlo a mano. Solo el admin persiste el guardado
// (para no generar choques de escritura entre varios alumnos conectados a la vez).
function archiveMonthIfNeeded() {
  try {
    const now = new Date();
    const newEntries = {}; // {ym: top3} — meses detectados como pendientes de archivar
    for (let off = -1; off >= -6; off--) {
      const d = new Date(now); d.setMonth(d.getMonth()+off);
      const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      if (pointsHistory[ym]) continue; // ya archivado (según copia local)
      const top3 = getMonthTop3(off).filter(p => p.pts > 0);
      if (top3.length === 0) continue; // ese mes no tiene puntos registrados
      newEntries[ym] = top3;
    }
    const ymKeys = Object.keys(newEntries);
    if (ymKeys.length && isAdmin()) {
      Object.assign(pointsHistory, newEntries); // optimista local
      // Al guardar, vuelve a leer pointsHistory fresco del servidor y solo agrega los meses que
      // SIGAN faltando ahí — si otra pestaña ya los archivó mientras tanto, no los pisa.
      savePointsHistory(fresh => {
        const merged = {...fresh};
        for (const ym of ymKeys) if (!merged[ym]) merged[ym] = newEntries[ym];
        return merged;
      });
    }
  } catch(e) { /* silencioso: no debe romper la carga si algo falla aquí */ }
}

      </div>`).join('')}
      <div style="margin-top:12px;display:flex;align-items:center;gap:10px;background:rgba(255,210,63,0.08);border:1px solid rgba(255,210,63,0.25);border-radius:12px;padding:10px 12px">

// Panel admin: botón para expandir/contraer el checklist de fechas de clase del alumno (mes actual o navegado).
function vPtsAdminPanel(s) {
  const open = expandedPtsStudent === s.id;

// Permite al admin ajustar, sin tocar código, cuánto vale cada cuadradito de Tareas para un alumno
// (p.ej. si en el futuro otro alumno lleva temas de nivel avanzado como Joanna, basta con poner 3 aquí).
let _multTimer=null;
// Misma idea que _ptsPendingEdits: acumula los cambios de multiplicador todavía no guardados
// para reproducirlos sobre el dato fresco del servidor al momento de guardar (ver saveLmsFieldTx).
let _multPendingEdits = []; // [{studentId, value}]
function _flushTaskMultipliers() {
  const edits = _multPendingEdits.splice(0);
  if (!edits.length) return;
  saveTaskMultipliers(fresh => {
    const obj = {...fresh};
    for (const e of edits) obj[String(e.studentId)] = e.value;
    return obj;
  });
}
function setTaskMult(studentId, value) {
  if (!firestoreDataReady()) return;
  _lastPtsLocalEdit = Date.now();
  const v = Math.max(1, Math.min(10, Math.round(value||1)));
  taskMultipliers[String(studentId)] = v;
  _multPendingEdits.push({studentId, value:v});
  const totalEl=document.getElementById(`pts-total-${studentId}`);
  if (totalEl) totalEl.textContent=getTotalPts2(studentId, getPubMonthOffset());
  clearTimeout(_multTimer);
  _multTimer=setTimeout(()=>{ _flushTaskMultipliers(); showToast('Multiplicador de Tareas guardado.','success'); },800);
}

// Genera N casillas (checkboxes) para un campo (hours/progress/tasks) de una fecha, según el arreglo guardado.
function ptsCheckRow(studentId, dateKey, field, count, savedArr, color, disabled) {
  const arr = Array.isArray(savedArr) ? savedArr : (savedArr ? [true] : []);
  let html = '';
  for (let i=0; i<count; i++) {
    const checked = !!arr[i];
    html += `<input type="checkbox" ${checked?'checked':''} ${disabled?'disabled':''} onchange="togglePointMark(${studentId},'${dateKey}','${field}',${i},${count},this.checked)" style="width:16px;height:16px;margin:1px;accent-color:${color};cursor:pointer">`;
  }
  return html;
}

  const MONTHS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const fmtDate = d => { const [,m,day] = d.split('-').map(Number); return `${day} ${MONTHS[m-1]}`; };

  sbLog.innerHTML = allEntries.slice(0, 14).map(e => {

function renderHorariosCalendar() {
  closeHorPop(); // evita dejar una ventana emergente abierta apuntando a una tarjeta que ya no existe
  const sessions    = padresRaw.sessions || [];
  const pStudents   = padresRaw.students || {};
  const lmsStudents = getStudents();
  const lmsMap = {};
  lmsStudents.forEach(s => { lmsMap[normName(s.name)] = s; });

  const ROW_H = 64, MIN_H = 8, MAX_H = 21;
  const HOURS = Array.from({length: MAX_H - MIN_H}, (_, i) => MIN_H + i);
  const MONTHS_S = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const DAY_NAMES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

  // Mon of current week + offset
  const getMon = (weekOff) => {
    const tod = new Date(); tod.setHours(0,0,0,0);
    const dow = tod.getDay();
    const mon = new Date(tod); mon.setDate(tod.getDate() + (dow===0?-6:1-dow) + weekOff*7);
    return mon;
  };
  // Get N days starting from absolute day offset (from this week's Monday)
  const getDays = (weekOff, startDay, count) => {
    const mon = getMon(weekOff);
    return Array.from({length: count}, (_, i) => {
      const d = new Date(mon); d.setDate(mon.getDate() + startDay + i); return d;
    });
  };
  const fmtRange = (dates) => {
    const a=dates[0], b=dates[dates.length-1];
    if(a.getMonth()===b.getMonth()) return a.getDate()+'–'+b.getDate()+' '+MONTHS_S[a.getMonth()]+' '+a.getFullYear();
    return a.getDate()+' '+MONTHS_S[a.getMonth()]+' – '+b.getDate()+' '+MONTHS_S[b.getMonth()];
  };
  const addM = (t, m) => {
    const [h,mn]=t.split(':').map(Number), tot=h*60+mn+m;
    return String(Math.floor(tot/60)%24).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');
  };
  const toH = t => { const [h,m]=t.split(':').map(Number); return h+m/60; };

  const today = new Date(); today.setHours(0,0,0,0);
  const nowDt = new Date();
  const curHNow = nowDt.getHours() + nowDt.getMinutes()/60;
  const appW = document.getElementById('app') ? document.getElementById('app').offsetWidth : (window.innerWidth||390);
  // Medimos el ancho REAL del contenedor que hace scroll (hor-body-scroll), no el de #app.
  // hor-body-scroll reserva siempre el espacio de su scrollbar vertical (overflow-y:scroll),
  // así que su clientWidth ya excluye ese espacio de forma estable — evita que las columnas
  // se calculen más anchas de lo que realmente cabe y queden recortadas a la derecha,
  // forzando un scroll horizontal mínimo para verlas completas.
  const scrollEl = document.getElementById('hor-body-scroll');
  const containerW = scrollEl && scrollEl.clientWidth ? scrollEl.clientWidth : appW;
  const isMobile = appW < 640;
  const daysCount = isMobile ? 2 : 7;
  const dates = isMobile
    ? getDays(horWeekOffset, horDayOffset, 2)
    : getDays(horWeekOffset, 0, 7);
  const wLabel = fmtRange(dates);
  const colW = isMobile
    ? Math.max(Math.floor((containerW - 44) / daysCount), 120)
    : Math.floor((containerW - 44) / daysCount);

  // Build slotMap: group by day+start (recurring) or date+start (excepción puntual),
  // multiple students por slot — mismo patrón que buildPadCalGrid() en padres.html.
  const slotMap = {};
  sessions.forEach(s => {
    const sid = String(s.studentId);
    const pSt = pStudents[sid];
    if (!pSt || !pSt.name || !s.start) return;
    const lms  = lmsMap[normName(pSt.name)] || {};
    const isOneTime = s.recurring === false && s.date;
    const key  = isOneTime ? (s.date+'|'+s.start) : ('d'+s.day+'|'+s.start);
    if (!slotMap[key]) slotMap[key] = { day:Number(s.day), oneTimeDate:isOneTime?s.date:null, start:s.start, maxDur:0, students:[] };
    const dur = s.dur || 60;
    if (dur > slotMap[key].maxDur) slotMap[key].maxDur = dur;
    slotMap[key].students.push({
      name: pSt.name.split(' ')[0],
      icon: lms.icon  || '👤',
      color: lms.color || '#4fb6ff',
      modality: s.modality || '',
      dur,
      skipDates: Array.isArray(s.skipDates) ? s.skipDates : [],
      // id del alumno en /student (LMS) — null si no hay match por nombre con /padres.
      // Necesario para la ventana emergente: saber de quién son los puntos/podios/enlace.
      id: lms.id !== undefined ? lms.id : null
    });
  });

  // Update week label
  const wlEl = document.getElementById('hor-week-lbl');
  if (wlEl) wlEl.textContent = wLabel;

  // Day headers
  const hdrEl = document.getElementById('hor-days-header');
  if (hdrEl) hdrEl.innerHTML = dates.map(function(date) {
    const isPast = date < today, isTod = date.getTime()===today.getTime();
    const cls = 'hor-day-head' + (isTod?' is-today':'') + (isPast?' is-past':'');
    return '<div class="'+cls+'" style="width:'+colW+'px">'
      +'<div class="hor-dh-name">'+DAY_NAMES[date.getDay()]+'</div>'
      +'<div class="hor-dh-num">'+date.getDate()+'</div>'
      +(isTod ? '<div><span class="hor-dh-hoy">HOY</span></div>' : '')
      +'</div>';
  }).join('');

  // Time labels
  const tlEl = document.getElementById('hor-time-labels');
  if (tlEl) tlEl.innerHTML = HOURS.map(function(h) {
    return '<div class="hor-tl-slot" style="height:'+ROW_H+'px">'+String(h).padStart(2,'0')+':00</div>';
  }).join('');

  // Day columns
  const bodyEl = document.getElementById('hor-days-body');
  if (!bodyEl) return;
  const totalH = HOURS.length * ROW_H;
  const _dStr = function(d){ return d.toISOString().slice(0,10); };
  const cycleEndDate = padresRaw.cycleEnd ? new Date(padresRaw.cycleEnd+'T00:00:00') : null;

  bodyEl.innerHTML = dates.map(function(date) {
    const jsDay = date.getDay();
    const dstr = _dStr(date);
    const isPast = date < today, isTod = date.getTime()===today.getTime();
    const cls = 'hor-day-col' + (isTod?' is-today':'') + (isPast?' is-past':'');
    const lines = HOURS.map(function() { return '<div class="hor-hour-line" style="height:'+ROW_H+'px"></div>'; }).join('');

    // Las sesiones recurrentes solo se muestran dentro del ciclo; las de una sola
    // fecha (excepción) siempre se muestran en su fecha exacta.
    const afterCycle = cycleEndDate && date > cycleEndDate;
    const slots = Object.values(slotMap).filter(function(sl) {
      if (sl.oneTimeDate) return sl.oneTimeDate === dstr;
      if (afterCycle) return false;
      return sl.day === jsDay;
    });
    const cards = slots.flatMap(function(slot) {
      // Si la sesión es recurrente, en esta fecha puntual se excluye a los alumnos cuya
      // sesión tiene este día en skipDates (porque se editó "solo esta fecha" — ya tienen
      // su propia tarjeta de una sola vez con los valores nuevos, en otra entrada del slotMap).
      const activeStudents = slot.oneTimeDate ? slot.students
        : slot.students.filter(function(st){ return !st.skipDates.includes(dstr); });
      if (!activeStudents.length) return [];
      const topPx = (toH(slot.start) - MIN_H) * ROW_H;
      const hPx   = (slot.maxDur / 60) * ROW_H - 3;
      const total = activeStudents.length;
      return activeStudents.map(function(st, idx) {
        const end  = addM(slot.start, st.dur);
        const lPx  = 2 + Math.round((colW-4) * (idx/total));
        const wPx  = Math.round((colW-4)/total) - (idx<total-1?2:0);
        const short = hPx < 44;
        return '<div class="hor-ev-card" data-sid="'+(st.id==null?'':st.id)+'" data-date="'+dstr+'" data-start="'+slot.start+'" data-end="'+end+'" data-modality="'+escAttr(st.modality)+'" data-name="'+escAttr(st.name)+'" data-icon="'+escAttr(st.icon)+'" data-color="'+escAttr(st.color)+'" style="top:'+topPx+'px;height:'+hPx+'px;left:'+lPx+'px;width:'+wPx+'px;background:linear-gradient(160deg,'+st.color+'30,'+st.color+'12);border:1px solid '+st.color+'55;box-shadow:0 0 14px -6px '+st.color+'60 inset" onclick="openHorPop(event,this)">'
          +'<div class="hor-ev-icon">'+st.icon+'</div>'
          +'<div class="hor-ev-name">'+st.name+'</div>'
          +(short?'':'<div class="hor-ev-time" style="color:'+st.color+'">'+slot.start+'–'+end+'</div><div class="hor-ev-badge">'+st.modality+'</div>')
          +'</div>';
      });
    }).join('');

    // En el día de hoy, las horas ya pasadas se ven apagadas (igual que los días
    // anteriores), y las horas que faltan se ven con normalidad ("vivas").
    let pastOvl = '';
    if (isTod) {
      const pastH = curHNow <= MIN_H ? 0 : (curHNow >= MAX_H ? totalH : (curHNow - MIN_H) * ROW_H);
      if (pastH > 0) pastOvl = '<div class="hor-hours-past-ovl" style="height:'+pastH+'px"></div>';
    }

    return '<div class="'+cls+'" style="width:'+colW+'px;height:'+totalH+'px">'+lines+cards+pastOvl+'</div>';
  }).join('');

  renderHorariosTimeNow();
}

function renderHorariosTimeNow() {
  const prev = document.getElementById('hor-time-now');
  if (prev) prev.remove();
  const ROW_H = 64, MIN_H = 8, MAX_H = 21;
  const now  = new Date();
  const curH = now.getHours() + now.getMinutes()/60;
  if (curH < MIN_H || curH >= MAX_H) return;
  const today = new Date(); today.setHours(0,0,0,0);
  // Mismo cálculo de ancho de columna que renderHorariosCalendar(): medido sobre
  // hor-body-scroll (que reserva el scrollbar vertical de forma estable), no sobre #app.
  // Antes esto se calculaba por separado con la fórmula vieja, así que la línea de
  // "ahora" quedaba desalineada con las columnas reales tras el fix del scroll horizontal.
  const appW = document.getElementById('app') ? document.getElementById('app').offsetWidth : (window.innerWidth||390);
  const scrollEl = document.getElementById('hor-body-scroll');
  const containerW = scrollEl && scrollEl.clientWidth ? scrollEl.clientWidth : appW;
  const isMob = appW < 640;
  const dCnt = isMob ? 2 : 7;
  const colW = isMob
    ? Math.max(Math.floor((containerW - 44) / dCnt), 120)
    : Math.floor((containerW - 44) / dCnt);
  const getMon2 = (weekOff) => {
    const tod2 = new Date(); tod2.setHours(0,0,0,0);
    const dow2 = tod2.getDay();
    const m = new Date(tod2); m.setDate(tod2.getDate() + (dow2===0?-6:1-dow2) + weekOff*7); return m;
  };
  const mon2 = getMon2(horWeekOffset);
  const dates = Array.from({length: isMob?2:7}, function(_, i) {
    const d = new Date(mon2); d.setDate(mon2.getDate() + (isMob?horDayOffset:0) + i); return d;
  });
  const todayIdx = dates.findIndex(function(d) { return d.getTime()===today.getTime(); });
  if (todayIdx === -1) return;
  const el = document.createElement('div');
  el.id = 'hor-time-now';
  el.className = 'hor-time-now';
  el.style.top   = ((curH - MIN_H) * ROW_H) + 'px';
  el.style.left  = (todayIdx * colW) + 'px';
  el.style.width = colW + 'px';
  el.innerHTML = '<div class="hor-time-now-dot"></div><div class="hor-time-now-line"></div>';
  const body = document.getElementById('hor-days-body');
  if (body) body.appendChild(el);
}

function setHorariosTab(t) {
  const cal = document.getElementById('hor-cal-content');
  const pts = document.getElementById('hor-pts-content');
  const tc  = document.getElementById('hor-tab-cal');
  const tp  = document.getElementById('hor-tab-pts');
  if (!cal || !pts || !tc || !tp) return;
  tc.className = 'hor-tab-pill ' + (t==='cal'?'on':'off');
  tp.className = 'hor-tab-pill ' + (t==='pts'?'on':'off');
  cal.style.display = t==='cal'?'flex':'none';
  pts.style.display = t==='pts'?'flex':'none';
  if (t==='cal') renderHorariosCalendar();
  if (t==='pts') renderHorariosSidebar();
}

function vHorariosSetup() {
  // Al entrar a Horarios, ubicar siempre el día actual — en móvil (vista de 2 días)
  // antes se quedaba fijo en lunes sin importar qué día era hoy realmente.
  horWeekOffset = 0;
  const appW0 = document.getElementById('app') ? document.getElementById('app').offsetWidth : (window.innerWidth||390);
  if (appW0 < 640) {
    const dow0 = new Date().getDay();
    horDayOffset = (dow0 === 0 ? 6 : dow0 - 1); // Mon=0 … Sun=6
  } else {
    horDayOffset = 0;
  }
  renderHorariosCalendar();
  renderHorariosSidebar();
  setInterval(renderHorariosTimeNow, 60000);
  setTimeout(() => {
    const scroll = document.getElementById('hor-body-scroll');
    if (!scroll) return;
    const nowH = new Date().getHours();
    scroll.scrollTop = Math.max(0, (Math.max(8, nowH-1) - 8)) * 64;
  }, 100);
}

function _clampCrop() {
  if (!_cropImg) return;
  const iw = _cropImg.width  * _cropScale;
  const ih = _cropImg.height * _cropScale;
  _cropX = Math.min(0, Math.max(220 - iw, _cropX));
  _cropY = Math.min(0, Math.max(220 - ih, _cropY));
}
function perfilDrawCrop() {
  const canvas=document.getElementById('perfil-crop-canvas');
  if(!canvas||!_cropImg)return;
  const ctx=canvas.getContext('2d');
  _clampCrop();
  ctx.clearRect(0,0,220,220);
  ctx.drawImage(_cropImg,_cropX,_cropY,_cropImg.width*_cropScale,_cropImg.height*_cropScale);

function perfilCropZoom() {

  const old=_cropScale;
  _cropScale=(220/Math.min(_cropImg.width,_cropImg.height))*z;
  const r=_cropScale/old;
  _cropX=110-(110-_cropX)*r; _cropY=110-(110-_cropY)*r;

}

    el.addEventListener('mouseup',    function(){_cropDragging=false;el.style.cursor='grab';});
    el.addEventListener('mouseleave', function(){_cropDragging=false;el.style.cursor='grab';});
    el.addEventListener('touchstart', function(e){_cropDragging=true;_cropLX=e.touches[0].clientX;_cropLY=e.touches[0].clientY;e.preventDefault();},{passive:false});
    el.addEventListener('touchmove',  function(e){if(!_cropDragging)return;_cropX+=e.touches[0].clientX-_cropLX;_cropY+=e.touches[0].clientY-_cropLY;_cropLX=e.touches[0].clientX;_cropLY=e.touches[0].clientY;perfilDrawCrop();e.preventDefault();},{passive:false});

// ════════════════════════════════════════════════════════
// VENTANA EMERGENTE DE CLASE (calendario de Horarios)
// Se abre al hacer clic en una tarjeta de clase; se cierra al hacer clic afuera
// o al alejar el mouse de la tarjeta y de la propia ventana (estilo hover-card).
// Puntos y podios anteriores los puede ver cualquiera. El enlace de videollamada
// solo lo ve el admin o el propio alumno dueño de esa clase, y solo si es Virtual.
// ════════════════════════════════════════════════════════
let _horPopEl = null, _horPopCard = null, _horPopCloseTimer = null, _horPopState = null;
// Margen (px) de tolerancia: la ventana solo se cierra si el mouse se aleja BASTANTE de la
// tarjeta + la propia ventana, no si se aleja un poquito (cruzando el espacio entre ambas).
const HOR_POP_BUFFER = 70;

function openHorPop(evt, cardEl) {
  evt.stopPropagation();
  closeHorPop();

  const sidRaw = cardEl.dataset.sid;
  const sid    = sidRaw === '' ? null : Number(sidRaw);
  _horPopState = {
    sid, date: cardEl.dataset.date, start: cardEl.dataset.start, end: cardEl.dataset.end,
    modality: cardEl.dataset.modality, name: cardEl.dataset.name, icon: cardEl.dataset.icon,
    color: cardEl.dataset.color || '#4fb6ff', linkEditing: false
  };

  const pop = document.createElement('div');
  pop.className = 'hor-pop';
  pop.innerHTML = renderHorPopContent(_horPopState);
  // Tiñe el fondo, borde y resplandor de la ventana con el color elegido en el perfil del
  // alumno (el mismo que ya se usa en su tarjeta del calendario), para que sea reconocible.
  // El degradado oscuro de abajo asegura que siga siendo opaco y legible (texto blanco).
  pop.style.background = 'linear-gradient(160deg,'+_horPopState.color+'38,'+_horPopState.color+'12), linear-gradient(160deg,#11142a,#0a0c18)';
  pop.style.borderColor = _horPopState.color + '55';
  pop.style.boxShadow = '0 12px 32px -8px rgba(0,0,0,0.65), 0 0 22px -4px '+_horPopState.color+'45, 0 0 0 1px rgba(255,255,255,0.03)';
  document.body.appendChild(pop);
  positionHorPop(pop, cardEl);

  _horPopEl = pop;
  _horPopCard = cardEl;
  document.addEventListener('click', _horPopOutsideHandler);
  document.addEventListener('mousemove', _horPopMoveHandler);
}

function _horPopOutsideHandler(e) {
  if (!_horPopEl) return;
  if (_horPopEl.contains(e.target) || (_horPopCard && _horPopCard.contains(e.target))) return;
  closeHorPop();
}

// Calcula qué tan lejos está el mouse del rectángulo combinado (tarjeta + ventana emergente)
// y solo programa el cierre si esa distancia supera HOR_POP_BUFFER — así moverse un poco
// (incluso por el espacio vacío entre la tarjeta y la ventana) no la cierra de golpe.
function _horPopMoveHandler(e) {
  if (!_horPopEl || !_horPopCard) return;
  const r1 = _horPopCard.getBoundingClientRect();
  const r2 = _horPopEl.getBoundingClientRect();
  const u = {
    left:   Math.min(r1.left, r2.left),
    right:  Math.max(r1.right, r2.right),
    top:    Math.min(r1.top, r2.top),
    bottom: Math.max(r1.bottom, r2.bottom)
  };
  const dx = Math.max(u.left - e.clientX, 0, e.clientX - u.right);
  const dy = Math.max(u.top - e.clientY, 0, e.clientY - u.bottom);
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist > HOR_POP_BUFFER) {
    if (!_horPopCloseTimer) _horPopCloseTimer = setTimeout(closeHorPop, 220);
  } else {
    clearTimeout(_horPopCloseTimer);
    _horPopCloseTimer = null;
  }
}

function closeHorPop() {
  clearTimeout(_horPopCloseTimer);
  _horPopCloseTimer = null;
  if (_horPopEl && _horPopEl.parentNode) _horPopEl.parentNode.removeChild(_horPopEl);
  _horPopEl = null;
  _horPopCard = null;
  _horPopState = null;
  document.removeEventListener('click', _horPopOutsideHandler);
  document.removeEventListener('mousemove', _horPopMoveHandler);
}

function positionHorPop(pop, anchorEl) {
  const r = anchorEl.getBoundingClientRect();
  const margin = 8;
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.left;
  let top  = r.bottom + margin;
  if (left + pw > window.innerWidth - margin) left = window.innerWidth - pw - margin;
  if (left < margin) left = margin;
  if (top + ph > window.innerHeight - margin) top = r.top - ph - margin; // sin espacio abajo: se abre hacia arriba
  if (top < margin) top = margin;
  pop.style.left = left + 'px';
  pop.style.top  = top + 'px';
}

// Activa/desactiva el modo edición del enlace (botón "Editar" arriba a la derecha, en la
// misma línea que el nombre del alumno). Vuelve a pintar el contenido sin cerrar la ventana.
function toggleHorPopLinkEdit(evt) {
  // Evita que el clic burbujee hasta el listener "click afuera cierra la ventana": como esta
  // función reemplaza el innerHTML de _horPopEl en el mismo tick, el botón original quedaría
  // desconectado del DOM y _horPopEl.contains(e.target) daría falso, cerrando la ventana sola.
  if (evt) evt.stopPropagation();
  if (!_horPopState || !_horPopEl) return;
  _horPopState.linkEditing = !_horPopState.linkEditing;
  _horPopEl.innerHTML = renderHorPopContent(_horPopState);
  if (_horPopCard) positionHorPop(_horPopEl, _horPopCard);
}

function renderHorPopContent(st) {
  const { sid, name, icon, color, date, start, end, modality, linkEditing } = st;
  const isDom = (modality||'').toLowerCase().includes('dom');
  const dt = new Date(date+'T00:00:00');
  const DAY_NAMES_L = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const dayLbl = DAY_NAMES_L[dt.getDay()]+' '+dt.getDate()+'/'+(dt.getMonth()+1);
  const hasSid = sid != null && !isNaN(sid);
  const link = hasSid ? ((overrides[String(sid)]||{}).link || '') : '';
  // El botón "Editar" solo aparece si el admin ve una clase virtual que YA tiene enlace
  // guardado (si no tiene enlace, el formulario de guardar ya está visible directamente).
  const showEditBtn = hasSid && isAdmin() && !isDom && !!link;

  let html = '<div class="hor-pop-head">'
    +'<div class="hor-pop-icon">'+icon+'</div>'
    +'<div style="flex:1;min-width:0">'
    +'<div style="display:flex;align-items:baseline;justify-content:space-between;gap:6px">'
    +'<div class="hor-pop-name">'+name+'</div>'
    +(showEditBtn?'<button class="hor-pop-edit-link-btn" onclick="toggleHorPopLinkEdit(event)">'+(linkEditing?'✕ Cancelar':'✏️ Editar')+'</button>':'')
    +'</div>'
    +'<div class="hor-pop-sub">'+dayLbl+' · '+start+'–'+end+'</div>'
    +'<span class="hor-pop-badge" style="background:'+(isDom?'rgba(239,68,68,0.15)':'rgba(79,182,255,0.15)')+';color:'+(isDom?'#ef4444':'#4fb6ff')+'">'+modality+'</span>'
    +'</div></div>';

  if (hasSid) {
    const pts = getStudentPoints(sid);
    html += '<div class="hor-pop-sec"><div class="hor-pop-lbl">Puntos de este mes</div>'
      +'<div class="hor-pop-pts-row">'
      +'<div class="hor-pop-pts-chip"><div class="hor-pop-pts-v" style="color:'+color+'">'+pts.hours+'</div><div class="hor-pop-pts-l">Horas</div></div>'
      +'<div class="hor-pop-pts-chip"><div class="hor-pop-pts-v" style="color:'+color+'">'+pts.progress+'</div><div class="hor-pop-pts-l">Avance</div></div>'
      +'<div class="hor-pop-pts-chip"><div class="hor-pop-pts-v" style="color:'+color+'">'+pts.tasks+'</div><div class="hor-pop-pts-l">Tareas</div></div>'
      +'</div></div>';

    const podiums = getStudentPodiumHistory(sid, name);
    if (podiums.length) {
      html += '<div class="hor-pop-sec"><div class="hor-pop-lbl">Podios anteriores</div>'
        +'<div class="hor-pop-medals">'+podiums.map(function(p){ return '<span class="hor-pop-medal">'+p.medal+' '+p.label+'</span>'; }).join('')+'</div></div>';
    }

    if (!isDom) {
      const canSee = isAdmin() || getLoggedId()===sid;
      if (canSee) {
        if (isAdmin()) {
          // Botón "Guardar enlace" solo si todavía no tiene enlace, o si se entró en modo
          // edición desde el botón "Editar" de arriba — si ya tiene y no se está editando,
          // se muestra el enlace guardado en su lugar (sin botón de guardar).
          if (!link || linkEditing) {
            html += '<div class="hor-pop-sec"><div class="hor-pop-lbl">Enlace de la clase</div>'
              +'<input type="text" class="hor-pop-link-input" id="hor-pop-link-inp" placeholder="https://meet.google.com/..." value="'+escAttr(link)+'">'
              +'<button class="hor-pop-link-btn" style="background:'+color+'26;border-color:'+color+'66;color:'+color+'" onclick="saveHorPopLink('+sid+')">Guardar enlace</button></div>';
          } else {
            html += '<div class="hor-pop-sec"><div class="hor-pop-lbl">Enlace de la clase</div>'
              +'<a class="hor-pop-link-join" style="background:linear-gradient(135deg,'+color+'cc,'+color+'88)" href="'+escAttr(normalizeLinkUrl(link))+'" target="_blank" rel="noopener">🔗 Abrir enlace</a></div>';
          }
        } else if (link) {
          html += '<div class="hor-pop-sec"><div class="hor-pop-lbl">Enlace de la clase</div>'
            +'<a class="hor-pop-link-join" style="background:linear-gradient(135deg,'+color+'cc,'+color+'88)" href="'+escAttr(normalizeLinkUrl(link))+'" target="_blank" rel="noopener">🔗 Unirse a la clase</a></div>';
        } else {
          html += '<div class="hor-pop-sec"><div class="hor-pop-lbl">Enlace de la clase</div>'
            +'<div style="font-size:11px;color:rgba(255,255,255,0.4)">Aún no hay enlace para esta clase.</div></div>';
        }
      }
    }
  }
  return html;
}

// Busca en pointsHistory (archivado automático) y en HISTORIAL_SEED (meses previos al
// archivado) si este alumno quedó 1°/2°/3° en algún mes anterior. Empareja por id cuando
// está disponible; los meses semilla (sin id) emparejan por nombre normalizado.
function getStudentPodiumHistory(id, name) {
  const now = new Date();
  const MESES_S = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const medals = ['🥇','🥈','🥉'];
  const results = [];
  for (let off = -1; off >= -12; off--) {
    const d = new Date(now); d.setMonth(d.getMonth()+off);
    const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const podio = pointsHistory[ym] || HISTORIAL_SEED[ym];
    if (!podio) continue;
    const idx = podio.findIndex(function(p){
      return (p.id!=null && p.id===id) || (p.id==null && normName(p.nombre)===normName(name));
    });
    if (idx === -1) continue;
    results.push({ ym, medal: medals[idx], label: MESES_S[d.getMonth()]+' '+d.getFullYear() });
  }
  return results;
}

// Guarda/actualiza el enlace de videollamada de un alumno (uno por alumno, compartido
// entre todas sus clases virtuales). Mismo patrón de lectura+merge que perfilSaveProfile().
async function saveHorPopLink(sid) {
  const inp = document.getElementById('hor-pop-link-inp');
  if (!inp) return;
  const val = normalizeLinkUrl(inp.value);
  const snap = await REF.get();
  const data = snap.exists ? snap.data() : {};
  const ov = data.overrides || {};
  const key = String(sid);
  ov[key] = ov[key] || {};
  ov[key].link = val;
  await REF.set({ overrides: ov }, { merge: true });
  overrides = ov;
  showToast('Enlace guardado ✓');
  if (_horPopState && _horPopState.sid === sid && _horPopEl) {
    _horPopState.linkEditing = false;
    _horPopEl.innerHTML = renderHorPopContent(_horPopState);
    positionHorPop(_horPopEl, _horPopCard);
  }
}

function changeHorWeek(delta) {
  const appW = document.getElementById('app') ? document.getElementById('app').offsetWidth : (window.innerWidth||390);
  if (appW < 640) {
    horDayOffset += delta;
    // when going beyond week boundaries, shift the week
    if (horDayOffset > 5) { horWeekOffset += 1; horDayOffset -= 7; }
    if (horDayOffset < 0) { horWeekOffset -= 1; horDayOffset += 7; }
  } else {
    horWeekOffset += delta;
  }
  renderHorariosCalendar();
}
function horGoToday() {
  horWeekOffset = 0;
  horDayOffset = 0;
  const appW2 = document.getElementById('app') ? document.getElementById('app').offsetWidth : (window.innerWidth||390);
  if (appW2 < 640) {
    const dow = new Date().getDay();
    horDayOffset = (dow === 0 ? 6 : dow - 1); // Mon=0 … Sun=6
  }
  renderHorariosCalendar();
}

let _ptsTimer=null;
// Cola de ediciones de Puntos todavía no guardadas (se vacía al disparar _flushPointsLog).
// Como togglePointMark/toggleAbsent comparten un mismo timer debounced (para no mandar un
// guardado por cada clic), varias ediciones pueden acumularse antes de guardar. Por eso el
// guardado real no escribe directo la copia local de "pointsLog": vuelve a leer el dato fresco
// del servidor (saveLmsFieldTx) y "reproduce" aquí, en orden, cada edición pendiente sobre ESE
// dato fresco — así una edición hecha desde otro dispositivo mientras esta pestaña estaba
// desactualizada no se pierde ni se pisa.
let _ptsPendingEdits = [];
function _applyPtsEditsToLog(freshLog, edits) {
  const log = JSON.parse(JSON.stringify(freshLog || {}));
  for (const edit of edits) {
    const key = String(edit.studentId);
    if (!log[key]) log[key]={};
    if (!log[key][edit.dateKey]) log[key][edit.dateKey]={hours:[],progress:[],tasks:[]};
    const entry = log[key][edit.dateKey];
    if (edit.type === 'mark') {
      if (!Array.isArray(entry[edit.field])) entry[edit.field]=[];
      while (entry[edit.field].length < edit.count) entry[edit.field].push(false);
      entry[edit.field][edit.idx]=!!edit.checked;
    } else { // 'absent'
      entry.absent = !!edit.checked;
      if (edit.checked) { entry.hours=[]; entry.progress=[]; entry.tasks=[]; }
    }
  }
  return log;
}
function _flushPointsLog() {
  const edits = _ptsPendingEdits.splice(0); // toma todas las ediciones pendientes y vacía la cola
  if (!edits.length) return;
  savePointsLog(fresh => _applyPtsEditsToLog(fresh, edits));
}
// idx = posición del cuadradito dentro del campo (0..count-1); count = tamaño esperado del arreglo (para rellenar huecos).
function togglePointMark(studentId, dateKey, field, idx, count, checked) {
  if (!firestoreDataReady()) return;
  _lastPtsLocalEdit = Date.now();
  const key=String(studentId);
  if (!pointsLog[key]) pointsLog[key]={};
  if (!pointsLog[key][dateKey]) pointsLog[key][dateKey]={hours:[],progress:[],tasks:[]};
  const entry = pointsLog[key][dateKey];
  if (!Array.isArray(entry[field])) entry[field]=[];
  while (entry[field].length < count) entry[field].push(false);
  entry[field][idx]=!!checked;
  _ptsPendingEdits.push({type:'mark', studentId, dateKey, field, idx, count, checked});
  // Refresca el total mostrado en la cabecera de la fila sin re-render completo
  const totalEl=document.getElementById(`pts-total-${studentId}`);
  if (totalEl) totalEl.textContent=getTotalPts2(studentId, getPubMonthOffset());
  clearTimeout(_ptsTimer);
  _ptsTimer=setTimeout(()=>{ _flushPointsLog(); showToast('Puntos guardados.','success'); },800);
}

// Marca/desmarca una fecha como "faltó a clase": al marcarla se borran las casillas de
// Horas/Progreso/Tareas de ese día y se excluye del cálculo de puntos (no suma ni resta).
function toggleAbsent(studentId, dateKey, checked) {
  if (!firestoreDataReady()) return;
  _lastPtsLocalEdit = Date.now();
  const key=String(studentId);
  if (!pointsLog[key]) pointsLog[key]={};
  if (!pointsLog[key][dateKey]) pointsLog[key][dateKey]={hours:[],progress:[],tasks:[]};
  const entry = pointsLog[key][dateKey];
  entry.absent = !!checked;
  if (checked) { entry.hours=[]; entry.progress=[]; entry.tasks=[]; }
  _ptsPendingEdits.push({type:'absent', studentId, dateKey, checked});
  const totalEl=document.getElementById(`pts-total-${studentId}`);
  if (totalEl) totalEl.textContent=getTotalPts2(studentId, getPubMonthOffset());
  const cont=document.getElementById(`pts-dates-${studentId}`);
  const st=getStudents().find(x=>String(x.id)===key);
  if (cont && st) cont.outerHTML = vPtsDateChecklist(st);
  clearTimeout(_ptsTimer);
  _ptsTimer=setTimeout(()=>{ _flushPointsLog(); showToast(checked?'Marcado como ausente: esta fecha no sumará puntos.':'Asistencia restaurada.','success'); },400);
}

// Mantiene la clave del admin sincronizada con /padres (mismo documento compartido).
AUTH_REF.onSnapshot(doc => {
  const a = doc.exists ? doc.data() : {};
  ADMIN.pin = a.adminPin || "80808";
}, err => console.error('[Firebase auth]', err));

// Normaliza nombres para emparejar alumnos entre /student y /padres (minúsculas, sin tildes, sin espacios extra).
function normName(s) {
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
}
PADRES_REF.onSnapshot(doc => {
  const d = doc.exists ? doc.data() : {};
  const pStudents = d.students || {};
  const pSessions = Array.isArray(d.sessions) ? d.sessions : [];
  padresRaw = { students: pStudents, sessions: pSessions, cycleEnd: d.cycleEnd || null };
  const map = {}, slotMap = {}, sessMap = {};
  Object.entries(pStudents).forEach(([sid, st]) => {
    const mySessions = pSessions.filter(s => String(s.studentId)===String(sid));
    // días de clase con su total de horas ese día (suma de duraciones / 60), p.ej. {1: 2, 4: 1}
    // NOTA: este patrón semanal NO distingue sesiones de una sola vez (excepciones puntuales) ni
    // skipDates — se mantiene solo por compatibilidad. getClassDatesForStudent() ya NO lo usa para
    // generar las fechas exactas de clase; usa sessMap (classSessByName) directamente para respetar
    // recurring/date/skipDates fecha por fecha.
    const hoursByDay = {}, slotsByDay = {};
    mySessions.forEach(s => {
      const h = Math.max(1, Math.round((s.dur||60)/60));
      hoursByDay[s.day] = (hoursByDay[s.day]||0) + h;
      if (!slotsByDay[s.day]) slotsByDay[s.day] = [];
      slotsByDay[s.day].push({ start: s.start || '', dur: s.dur || 60, modality: s.modality || '' });
    });
    // ordenar los slots de cada día cronológicamente por hora de inicio
    Object.keys(slotsByDay).forEach(d => slotsByDay[d].sort((a,b)=>(a.start||'').localeCompare(b.start||'')));
    const key = normName(st.name);
    map[key] = hoursByDay;
    slotMap[key] = slotsByDay;
    sessMap[key] = mySessions;
  });
  classDaysByName  = map;
  classSlotsByName = slotMap;
  classSessByName  = sessMap;
  if (currentView === 'puntos') {
    const app=document.getElementById('app');
    if (app) app.innerHTML=`<div class="vw">${vPuntos()}</div>`;
  }
  if (currentView === 'horarios') {
    const app=document.getElementById('app');
    if (app) app.innerHTML=`<div class="vw">${vHorarios()}</div>`;
    renderHorariosSidebar();
  }
  // Si el panel de admin está abierto, refresca en vivo solicitudes nuevas y
  // nombres vinculados (un padre puede registrarse o editar un nombre en
  // cualquier momento mientras el admin tiene el panel abierto).
  if (isAdmin() && document.getElementById('admin-panel')?.classList.contains('open')) {
    syncPadresLinks();
    cacheLiveNames();
    renderStudentList();
    renderPadresRequests();
  }
}, err => console.error('[Firebase padres]', err));

REF.onSnapshot(doc => {
  const data = doc.exists ? doc.data() : {};
  allocations = data.allocations || {};
  overrides   = data.overrides   || {};
  appConfig   = data.config      || { startTime:'', endTime:'', totalNumbers: 200 };
  if (!appConfig.totalNumbers) appConfig.totalNumbers = 200;
  const lms   = data.lms || {};
  tasks       = Array.isArray(lms.tasks)  ? lms.tasks  : [];
  points      = typeof lms.points==='object' ? lms.points : {};
  pointsLog   = typeof lms.pointsLog==='object' && lms.pointsLog ? lms.pointsLog : {};
  pointsHistory = typeof lms.pointsHistory==='object' && lms.pointsHistory ? lms.pointsHistory : {};
  taskMultipliers = typeof lms.taskMultipliers==='object' && lms.taskMultipliers ? lms.taskMultipliers : {};
  prompts = typeof lms.prompts==='object' && lms.prompts ? lms.prompts : {};
  // lmsDataLoaded solo se marca true cuando el documento REALMENTE existe en Firestore.
  // Si por algún motivo llega doc.exists=false (no debería pasar en producción, pero es
  // la misma situación de riesgo que un error de red: variables locales en blanco), NO
  // habilitamos los guardados ni las migraciones automáticas de abajo — así nunca se
  // sobrescriben datos reales con el estado vacío por defecto.
  if (doc.exists) {
    lmsDataLoaded = true;
    archiveMonthIfNeeded();
    // Migración inicial única: si "Joanna Prado" todavía no tiene multiplicador configurado, se le asigna ×3
    // (caso conocido actual: lleva temas de un nivel más avanzado). El admin puede cambiarlo luego desde el panel.
    (function seedJoannaMult(){
      const joanna = getStudents().find(s => normName(s.name)===normName('Joanna Prado'));
      if (joanna && taskMultipliers[String(joanna.id)]===undefined) {
        taskMultipliers[String(joanna.id)] = 3;
        saveTaskMultipliers(fresh => ({ ...fresh, [String(joanna.id)]: 3 }));
      }
    })();
  } else {
    console.error('[Firebase] sorteo/main no existe en el snapshot recibido — se bloquean los guardados.');
  }

  if (!appReady) {
    appReady = true;
    document.getElementById('initial-loading').classList.add('hidden');
    router();
  } else {
    // Live-update tablero if it's open
    const hash = currentView;
    if (hash === 'tablero') {
      const loggedId = getLoggedId();
      if (loggedId !== null) renderAll(loggedId);
    }
    if (hash === 'ranking')   vRankingSetup();
    if (hash === 'numeros')   vNumerosSetup();
    if (hash === 'dashboard') {
      const app=document.getElementById('app');
      if (app) app.innerHTML=`<div class="vw">${vDashboard()}</div>`;
    }
    if (hash === 'puntos') {
      // Evita re-render completo (parpadeo/salto) justo después de marcar una casilla:
      // la actualización optimista ya refleja el cambio en pantalla; el snapshot que
      // confirma nuestro propio guardado llega ~1s después y no necesita re-pintar todo.
      if (Date.now() - _lastPtsLocalEdit > 2500) {
        const app=document.getElementById('app');
        if (app) app.innerHTML=`<div class="vw">${vPuntos()}</div>`;
      }
    }
    if (hash === 'horarios') renderHorariosSidebar();
    if (hash === 'tareas' && taskFilter !== 'msgs') {
      // Refresca la vista de Tareas si llega un cambio remoto (ej. un alumno entrega una
      // tarea, o el admin la aprueba desde otro dispositivo) mientras está abierta.
      const app=document.getElementById('app');
      if (app) { app.innerHTML=`<div class="vw">${vTareas()}</div>`; vTareasSetup(); }
    }
  }
}, err => {
  console.error('[Firebase]', err);
  document.getElementById('initial-loading').classList.add('hidden');
  // OJO: appReady se pone en true para no dejar al usuario atascado en la pantalla de carga,
  // pero lmsDataLoaded queda en false (nunca se tocó arriba) — eso bloquea los guardados de lms (saveTasks/savePointsLog/savePrompts/saveTaskMultipliers/savePointsHistory) y saveMeta()
  // y los REF.set() de setTotalNumbers()/doReset() mientras dure el problema de conexión, para
  // que la app no pueda guardar por accidente el estado vacío por defecto y borrar los datos
  // reales en la nube. En cuanto Firestore reconecte y llegue un snapshot real, se desbloquea solo.
  appReady = true;
  router();
  showToast('No se pudo conectar a la base de datos. Tus cambios NO se guardarán hasta reconectar — revisa tu conexión o recarga la página.');
});

// Image viewer modal
function openImgViewer(url, name){
  let modal = document.getElementById('img-viewer-modal');
  if (!modal){
    modal = document.createElement('div');
    modal.id = 'img-viewer-modal';
    modal.style.cssText = 'display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.93);z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:16px;box-sizing:border-box';
    modal.innerHTML = `<img id="img-viewer-img" style="max-width:100%;max-height:75dvh;border-radius:10px;object-fit:contain;box-shadow:0 4px 32px rgba(0,0,0,0.6)">
      <div style="display:flex;gap:10px;margin-top:16px">
        <a id="img-viewer-dl" download="" style="background:rgba(79,182,255,0.2);border:1px solid rgba(79,182,255,0.4);color:#4fb6ff;border-radius:12px;padding:10px 22px;font-weight:900;font-size:13px;text-decoration:none;letter-spacing:0.08em">⬇ DESCARGAR</a>
        <button onclick="closeImgViewer()" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);border-radius:12px;padding:10px 22px;font-weight:900;font-size:13px;cursor:pointer;letter-spacing:0.08em">✕ CERRAR</button>
      </div>`;
    modal.addEventListener('click', e=>{ if(e.target===modal) closeImgViewer(); });
    document.body.appendChild(modal);
  }
  document.getElementById('img-viewer-img').src = url;
  const dl = document.getElementById('img-viewer-dl');
  dl.href = url; dl.download = name||'imagen.jpg';
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeImgViewer(){
  const m = document.getElementById('img-viewer-modal');
  if (m) m.style.display = 'none';
  document.body.style.overflow = '';
}
