// Clic en casilla de cartón mientras hay un poder activo
function _bingoCellPowerClick(cardIdx, num, rivalUid) {
  if (!bingoActivePower) return;
  const pw = bingoActivePower;
  const isRival = !!rivalUid;
  const rivalPowers = new Set(['sabotaje','congelar']);
  const ownPowers   = new Set(['robo']);

  // Robo de Marca: paso 1 = casilla del rival, paso 2 = casilla propia de la misma columna
  if (pw === 'robo') {
    if (!_bingoPowerStep) {
      // Paso 1: elegir casilla del rival
      if (!isRival) { showToast('Primero ve al cartón de un rival y toca la casilla que quieres intercambiar.','error'); return; }
      const rivalPlayer = (bingoGame.players||{})[rivalUid];
      const rCard = (rivalPlayer?.cards||{})[cardIdx];
      if (!rCard || !rCard.includes(num)) return;
      const col = rCard.indexOf(num) % 5;
      const colLetter = 'BINGO'[col];
      _bingoPowerStep = { rivalUid, rivalCardIdx: cardIdx, rivalNum: num, col };
      showToast(`📋 Objetivo: ${colLetter}-${num} de ${rivalPlayer.name} — ahora toca tu casilla en la columna ${colLetter}.`,'info');
      _bingoViewingPlayer = null; // navegar a propios cartones
      _renderBingoPane();
      return;
    } else {
      // Paso 2: elegir casilla propia en la misma columna
      if (isRival) { showToast('Ahora toca una de TUS casillas en la columna correspondiente.','error'); return; }
      const { rivalUid: ruid, rivalCardIdx, rivalNum, col } = _bingoPowerStep;
      const me = _bingoMe();
      const player = (bingoGame.players||{})[me.uid];
      const myCard = (player?.cards||{})[cardIdx];
      if (!myCard || !myCard.includes(num)) return;
      if (myCard.indexOf(num) % 5 !== col) {
        showToast(`Solo puedes elegir un número de la columna ${'BINGO'[col]}.`,'error'); return;
      }
      bingoPowerForm = { rivalUid: ruid, rivalCardIdx, rivalNum, myCardIdx: cardIdx, myNum: num };
      _bingoPowerStep = null;
      doBingoRobo(); return;
    }
  }

  if (isRival && ownPowers.has(pw)) {
    showToast('Este poder se usa en tus propios cartones.','error'); return;
  }
  if (!isRival && rivalPowers.has(pw)) {
    showToast('Navega al cartón de un rival para usar este poder.','error'); return;
  }

  bingoPowerForm = { cardIndex: cardIdx, num, studentId: rivalUid||'' };
  const doFns = { sabotaje:doBingoSabotaje, congelar:doBingoCongelar };
  if (doFns[pw]) doFns[pw]();
}

function _bingoResetLocalState() {
  bingoChallengeIdx = 0; bingoChallengeAnswer = ''; bingoChallengeError = false;
  bingoBlockSelection = []; bingoActivePower = null; bingoPowerForm = {}; bingoPowerMsg = '';
  _prevBingoTierWinners = {}; _bingoRulesShown = false; _bingoPaused = false;
  _bingoExpandedPlayer = null; _bingoViewingPlayer = null; _bingoPowerStep = null;
  _bingoCloseModal();
}

// Identidad del jugador actual, reutilizando la misma convención uid que mensajería/FCM.
function _bingoMe() {
  if (isAdmin()) return { uid:'teacher', name: ADMIN.name.split(' ')[0], icon: ADMIN.icon, color: ADMIN.color };
  const s = getFullList().find(x => x.id === getLoggedId());
  return { uid:String(getLoggedId()), name:(s?.name||'Alumno').split(' ')[0], icon: s?.icon||'👤', color: s?.color||'#888888' };
}

// -- Firestore: listener en vivo + temporizador de sorteo/cuenta atrás --
function startBingoListener() {
  if (bingoUnsub) return; // ya activo (se queda corriendo toda la sesión, igual que startMsgsListeners)
  bingoUnsub = BINGO_REF.onSnapshot(snap => {
    // OJO: snap.exists===false significa "todavía nadie creó una partida" (estado normal, NO es
    // "sigo cargando") — por eso NO se setea a null aquí, sino a {status:'idle'}. bingoGame queda
    // en null SOLO antes de que llegue el primer snapshot (de ahí depende el "Cargando..." real).
    const prevStatus = bingoGame ? bingoGame.status : null;
    bingoGame = snap.exists ? snap.data() : { status:'idle' };
    // Si arrancó una partida nueva (o no hay ninguna) se limpia el estado efímero local del
    // reto/bloqueo/poderes — si no, podía quedar pegado el modal de un reto de la partida anterior.
    if (bingoGame.status==='idle' || (prevStatus==='ended' && bingoGame.status==='lobby')) _bingoResetLocalState();
    // Auto-navegar a /student/bingo (pantalla completa) en cuanto el host hace clic en
    // "Iniciar sorteo" — pedido explícito: que a todos los alumnos ya unidos se les cargue
    // automáticamente la pantalla del sorteo sin tener que entrar manualmente a GAMING.
    try {
      const me = _bingoMe();
      const amPlaying = !!(bingoGame.players && bingoGame.players[me.uid]);
      if (prevStatus === 'lobby' && bingoGame.status === 'playing' && amPlaying && currentView !== 'bingo') {
        go('bingo');
      }
      // Modal de reglas: mostrar una sola vez cuando arranca el sorteo
      if (prevStatus === 'lobby' && bingoGame.status === 'playing' && amPlaying) {
        _bingoRulesShown = false; // reset por si se reutiliza
      }
      if (bingoGame.status === 'playing' && amPlaying && !_bingoRulesShown) {
        _bingoRulesShown = true;
        setTimeout(_bingoShowRulesModal, 800);
      }
      // Detectar nuevo ganador de tier → modal de premio
      const curWinners = bingoGame.tierWinners || {};
      BINGO_TIER_ORDER.forEach(tier => {
        if (curWinners[tier] && !_prevBingoTierWinners[tier]) {
          const winnerUid = curWinners[tier].uid;
          const winnerPlayer = (bingoGame.players || {})[winnerUid];
          const winnerName = winnerPlayer ? (winnerPlayer.name || winnerUid) : winnerUid;
          setTimeout(() => _bingoShowTierWonModal(tier, winnerName), 400);
        }
      });
      _prevBingoTierWinners = Object.assign({}, curWinners);
    } catch (e) { console.error('bingo auto-nav', e); }
    _renderBingoPane();
  }, err => {
    console.error('bingo listener', err);
    showToast('No se pudo conectar al Bingo (' + (err.code||err.message||'error') + ')', 'error');
  });
}
function _bingoEnsureTimer() {
  const need = !!(bingoGame && (bingoGame.status === 'playing' || bingoGame.status === 'lobby'));
  if (need && !bingoTickTimer) bingoTickTimer = setInterval(_bingoTick, 1000);
  else if (!need && bingoTickTimer) { clearInterval(bingoTickTimer); bingoTickTimer = null; }
}
// -- v2: el host ahora maneja una pequeña máquina de estados por segundo, no solo "sortear o
// no sortear" — hay que intercalar las fases calc/mark de cada número y el Reto Matemático
// periódico (que pausa los sorteos mientras dura). Todos los demás clientes solo leen vía
// onSnapshot, exactamente igual que antes; nada de esto corre dos veces porque _bingoTick()
// solo actúa como host si bingoGame.hostId===me.uid. --
function _bingoTick() {
  if (!bingoGame || (bingoGame.status !== 'playing' && bingoGame.status !== 'lobby')) { _bingoEnsureTimer(); return; }
  _renderBingoPane(); // refresca cuenta atrás/temporizadores visibles para todos por igual; en lobby refresca lista de jugadores
  if (bingoGame.status !== 'playing') return; // en lobby no hay lógica de reto ni host
  _bingoCheckMyChallengeEnd();  // cada cliente resuelve LOCALMENTE el cierre de su propio reto
  _bingoCheckMyBlockTimeout();  // ...y el vencimiento de su propio bloqueo pendiente
  const me = _bingoMe();
  if (bingoGame.hostId !== me.uid) return; // solo el host avanza el reloj compartido
  const now = Date.now();
  if (bingoGame.challengeActive) {
    if (now >= (bingoGame.challengeEndsAt||0)) _bingoHostEndChallenge();
    return; // mientras dura el Reto Matemático, sorteos y fases quedan en pausa
  }
  if (bingoGame.numPhase === 'calc' || bingoGame.numPhase === 'mark') {
    if (now >= (bingoGame.phaseEndsAt||0)) _bingoHostAdvancePhase();
    return;
  }
  const drawn = bingoGame.drawnNumbers || [];
  if (drawn.length>0 && bingoGame.nextChallengeAtDraw!=null && drawn.length>=bingoGame.nextChallengeAtDraw) { _bingoHostStartChallenge(); return; }
  if (bingoGame.nextDrawAt && now >= bingoGame.nextDrawAt) _bingoHostDrawNext();
}
function _bingoHostDrawNext() {
  if (_bingoDrawing) return;
  // Guarda: no sortear mientras hay un modal de premio/reglas abierto
  if (_bingoPaused) { _bingoDrawing = false; return; }
  // Guarda defensiva: nunca sortear mientras el Reto Matemático está activo (challengeActive
  // puede llegar con hasta ~1s de retraso por el onSnapshot, así que este check evita que
  // un tick intermedio con estado obsoleto dispare el número siguiente antes de tiempo).
  if (bingoGame.challengeActive) { _bingoDrawing = false; return; }
  // Segunda guarda: si drawn.length ya alcanzó el umbral, arrancar el reto en vez de sortear.
  const _drawn0 = bingoGame.drawnNumbers || [];
  if (bingoGame.nextChallengeAtDraw != null && _drawn0.length >= bingoGame.nextChallengeAtDraw) {
    _bingoDrawing = false; _bingoHostStartChallenge(); return;
  }
  _bingoDrawing = true;
  const drawn = _drawn0;
  if (drawn.length >= 75) {
    BINGO_REF.update({ status:'ended', nextDrawAt:null, numPhase:null, phaseEndsAt:null, highlightCol:null, currentSum:null })
      .catch(e=>console.error('bingo end-draw',e)).finally(()=>{ _bingoDrawing=false; });
    return;
  }
  const drawnSet = new Set(drawn);
  let next; do { next = _bGetRandomInt(1,75); } while (drawnSet.has(next));
  const newDrawn = [...drawn, next];
  const col = _bingoColIndex(next);
  // directMode (default true si no está seteado en el doc): salta directo a la fase 'mark' sin
  // mostrar la suma — igual que en neon-bingo, donde directMode se salta la fase 'calc'.
  const directMode = bingoGame.directMode !== false;
  const patch = directMode ? {
    drawnNumbers: newDrawn, currentNumber: next, status: 'playing',
    numPhase: 'mark', phaseEndsAt: Date.now() + (bingoGame.markSeconds||10)*1000,
    highlightCol: col, currentSum: null, nextDrawAt: null
  } : {
    drawnNumbers: newDrawn, currentNumber: next, status: 'playing',
    numPhase: 'calc', phaseEndsAt: Date.now() + (bingoGame.calcSeconds||5)*1000,
    highlightCol: col, currentSum: _bingoMakeSum(next), nextDrawAt: null
  };
  BINGO_REF.update(patch).catch(e=>console.error('bingo draw',e)).finally(()=>{ _bingoDrawing=false; });
}
function _bingoHostAdvancePhase() {
  if (bingoGame.numPhase === 'calc') {
    BINGO_REF.update({ numPhase:'mark', phaseEndsAt: Date.now() + (bingoGame.markSeconds||10)*1000 })
      .catch(e=>console.error('bingo phase->mark',e));
  } else if (bingoGame.numPhase === 'mark') {
    const ended = (bingoGame.drawnNumbers||[]).length >= 75;
    BINGO_REF.update({
      numPhase:'done', phaseEndsAt:null, currentSum:null,
      nextDrawAt: ended ? null : Date.now() + (bingoGame.intervalMs||4500),
      status: ended ? 'ended' : 'playing'
    }).catch(e=>console.error('bingo phase->done',e));
  }
}
function _bingoHostStartChallenge() {
  const questions = _bingoGenQuestions(bingoGame.difficulty||1, 5);
  BINGO_REF.update({
    challengeActive:true, challengeId: Date.now(), questions,
    challengeEndsAt: Date.now() + (bingoGame.challengeSeconds||60)*1000,
    nextDrawAt: null
  }).catch(e=>console.error('bingo challenge-start',e));
}
function _bingoHostEndChallenge() {
  const drawn = bingoGame.drawnNumbers || [];
  const ended = drawn.length >= 75;
  const patch = {
    challengeActive:false, challengeEndsAt:null, questions:[],
    nextChallengeAtDraw: drawn.length + (bingoGame.challengeIntervalDraws||8),
    nextDrawAt: ended ? null : Date.now() + (bingoGame.intervalMs||4500),
    status: ended ? 'ended' : 'playing',
    retoCount: (bingoGame.retoCount||0) + 1
  };
  // Al terminar el reto: descongelar casillas saboteadas, limpiar escudos de columna
  Object.keys(bingoGame.players||{}).forEach(uid => {
    patch[`players.${uid}.frozenCells`] = [];
    patch[`players.${uid}.shieldedColumns`] = [];
  });
  BINGO_REF.update(patch).catch(e=>console.error('bingo challenge-end',e));
}

// -- acciones del jugador/host --
function _bingoNewPlayer(me, cardCount) {
  return {
    name: me.name, icon: me.icon, color: me.color,
    cards: _bingoNewCardsMap(cardCount||1),
    marks: [], blockedMarks: [], frozenCells: [],
    tiers: _bingoNewTiersMap(cardCount||1),
    powerCharges: 0, frozenUntilDraw: 0,
    unlockedPowers: {}, usedPowers: {}, shieldedColumns: [],
    lastChallengeId: null, pendingBlock: null
  };
}
function createBingoGame() {
  if (bingoCreating) return;
  if (bingoGame && bingoGame.status && bingoGame.status!=='idle') { showToast('Ya hay una partida activa, únete a esa.','error'); return; }
  bingoCreating = true;
  // OJO: todo el cuerpo va en try/catch — si algo revienta de forma síncrona (antes de
  // llegar al .then/.catch de Firestore) bingoCreating se quedaba en true para siempre y
  // el botón "Crear partida" dejaba de responder en todos los clicks futuros, en silencio.
  try {
    const me = _bingoMe();
    const cardCount = 1; // el host puede subirlo desde el lobby antes de iniciar el sorteo
    // El host se agrega como jugador en la MISMA escritura (no con un joinBingoGame()
    // encadenado después) — encadenarlo dependía de que el listener ya hubiera actualizado
    // la variable global bingoGame antes de que corriera el .then(), y esa carrera a veces
    // perdía, dejando al host sin unirse a su propia partida ("Aún no se unió nadie").
    BINGO_REF.set({
      status:'lobby', hostId: me.uid, hostName: me.name,
      createdAt: Date.now(), drawnNumbers:[], currentNumber:null,
      nextDrawAt:null, intervalMs:4500,
      directMode:true, difficulty:1, cardCount,
      calcSeconds:5, markSeconds:10, challengeSeconds:60, challengeIntervalDraws:8, blockSeconds:60,
      numPhase:null, phaseEndsAt:null, highlightCol:null, currentSum:null,
      challengeActive:false, challengeId:null, challengeEndsAt:null, questions:[], nextChallengeAtDraw:null,
      tierWinners:{}, retoCount:0,
      players:{ [me.uid]: _bingoNewPlayer(me, cardCount) }
    }).then(()=>{ bingoCreating=false; })
      .catch(e=>{
        bingoCreating=false;
        showToast('No se pudo crear la partida (' + (e.code||e.message||'error') + ').','error');
        console.error('bingo create', e);
      });
  } catch(e) {
    bingoCreating = false;
    showToast('No se pudo crear la partida (' + (e.message||'error') + ').','error');
    console.error('bingo create sync', e);
  }
}
function joinBingoGame() {
  if (!bingoGame || bingoGame.status==='idle' || bingoGame.status==='ended') return;
  const me = _bingoMe();
  if (bingoGame.players && bingoGame.players[me.uid]) return; // ya está dentro
  const player = _bingoNewPlayer(me, bingoGame.cardCount||1);
  BINGO_REF.update({ [`players.${me.uid}`]: player })
    .catch(e=>{ showToast('No se pudo unir a la partida.','error'); console.error(e); });
}
// Ajustes del lobby (solo host, solo antes de iniciar).
function setBingoConfig(field, value) {
  const me = _bingoMe();
  if (!bingoGame || bingoGame.hostId!==me.uid || bingoGame.status!=='lobby') return;
  const patch = { [field]: value };
  // Si se cambia cardCount, hay que re-dimensionar los cartones/tiers de TODOS los jugadores
  // ya unidos (incluido el host, que se autounie con 1 cartón al crear la partida) — si no,
  // se quedaban con la cantidad de cartones vieja para siempre aunque el host subiera el
  // número en el lobby. Es seguro regenerarlos acá porque en 'lobby' todavía no hay marcas
  // ni números sorteados (no se pierde ningún progreso real).
  if (field === 'cardCount') {
    const players = bingoGame.players || {};
    Object.keys(players).forEach(uid => {
      patch[`players.${uid}.cards`] = _bingoNewCardsMap(value);
      patch[`players.${uid}.tiers`] = _bingoNewTiersMap(value);
    });
  }
  BINGO_REF.update(patch).catch(e=>console.error('bingo config',e));
}
function startBingoDraw() {
  const me = _bingoMe();
  if (!bingoGame || bingoGame.hostId!==me.uid || bingoGame.status!=='lobby') return;
  if (!Object.keys(bingoGame.players||{}).length) { showToast('Espera a que se unan jugadores.','error'); return; }
  BINGO_REF.update({ status:'playing', nextDrawAt: Date.now()+1500, nextChallengeAtDraw: (bingoGame.challengeIntervalDraws||8), tierWinners:{} })
    .catch(e=>console.error('bingo start',e));
}
function endBingoGame() {
  const me = _bingoMe();
  if (!bingoGame) return;
  if (bingoGame.hostId!==me.uid && !isAdmin()) return;
  BINGO_REF.set({ status:'idle', updatedAt:Date.now() })
    .catch(e=>console.error('bingo end',e));
}
function markBingoCell(cardIdx, num) {
  if (!bingoGame || num===0) return;
  const me = _bingoMe();
  const player = (bingoGame.players||{})[me.uid];
  if (!player) return;
  if (_bingoAmFrozen(player)) { showToast('🥶 Estás congelado, no puedes marcar todavía.','error'); return; }
  if (!(bingoGame.drawnNumbers||[]).includes(num)) { showToast('Ese número aún no ha salido.','error'); return; }
  const isBlocked = (player.blockedMarks||[]).some(m=>m.c===cardIdx && m.n===num);
  const frozenEntry = (player.frozenCells||[]).find(f=>f.c===cardIdx && f.n===num);
  if (frozenEntry) {
    showToast(`❄️ ¡Te congelaron! ${frozenEntry.byName} bloqueó esta casilla hasta el próximo reto.`, 'error');
    return;
  }
  // Si tengo un bloqueo pendiente por resolver, tocar una casilla YA marcada mía sirve para
  // elegir cuáles bloquear, en vez de desmarcarla (mismo doble-uso del click que en neon-bingo).
  if (player.pendingBlock && (player.marks||[]).some(m=>m.c===cardIdx && m.n===num) && !isBlocked) {
    toggleBingoBlockSelection(cardIdx, num);
    return;
  }
  if (isBlocked) { showToast('Esa casilla está bloqueada.','error'); return; }
  const marks = player.marks || [];
  const exists = marks.some(m=>m.c===cardIdx && m.n===num);
  const newMarks = exists ? marks.filter(m=>!(m.c===cardIdx && m.n===num)) : [...marks, {c:cardIdx, n:num}];
  BINGO_REF.update({ [`players.${me.uid}.marks`]: newMarks })
    .catch(e=>console.error('bingo mark',e));
}
function claimBingoPrize(cardIdx, tier) {
  if (!bingoGame) return;
  const me = _bingoMe();
  const player = (bingoGame.players||{})[me.uid];
  if (!player) return;
  if (_bingoAmFrozen(player)) { showToast('🥶 Estás congelado, no puedes reclamar todavía.','error'); return; }
  const t = (player.tiers||{})[cardIdx] || { won:{}, failed:{} };
  if (t.won?.[tier] || t.failed?.[tier]) return; // ya resuelto, sin reintentos
  const card = (player.cards||{})[cardIdx];
  if (!card) return;
  const marksSet = new Set((player.marks||[]).filter(m=>m.c===Number(cardIdx)).map(m=>m.n));
  const { maxLine, isFull } = bingoEvaluate(card, marksSet);
  const ok = tier==='bingo' ? isFull : maxLine >= BINGO_TIER_REQ[tier];

  if (!ok) {
    // El jugador no tiene el tier — marcar como fallido directamente sin tocar tierWinners
    BINGO_REF.update({ [`players.${me.uid}.tiers.${cardIdx}.failed.${tier}`]: true })
      .then(()=> showToast(`❌ Todavía no tienes ${BINGO_TIER_LABEL[tier]}. Ya no podrás reclamarla.`, 'error'))
      .catch(e=>console.error('bingo claim', e));
    return;
  }

  // ok===true: verificar si el premio ya fue ganado por otro jugador
  const currentBall = bingoGame.currentNumber;
  const existingWinner = (bingoGame.tierWinners||{})[tier];

  if (existingWinner && existingWinner.ball !== currentBall) {
    // Otro jugador ganó este premio en un número anterior — reclamo denegado
    BINGO_REF.update({ [`players.${me.uid}.tiers.${cardIdx}.failed.${tier}`]: true })
      .then(()=> showToast(`❌ ${BINGO_TIER_LABEL[tier]} ya fue canjeada por otro jugador.`, 'error'))
      .catch(e=>console.error('bingo claim', e));
    return;
  }

  // Sin ganador previo (o reclamo simultáneo en el mismo número) → ¡gana!
  // Si aún no hay ganador registrado, este jugador se convierte en el primero
  const patch = { [`players.${me.uid}.tiers.${cardIdx}.won.${tier}`]: true };
  if (!existingWinner) {
    patch[`tierWinners.${tier}`] = { uid: me.uid, ball: currentBall };
  }
  BINGO_REF.update(patch)
    .then(()=> showToast(`🎉 ¡${BINGO_TIER_LABEL[tier]} validada!`, 'success'))
    .catch(e=>console.error('bingo claim', e));
}

// -- v2: respuesta a la suma de la fase 'calc' (marca automática de conveniencia — recordar que
// en neon-bingo el marcado manual NUNCA estuvo bloqueado por fase, así que esto es un atajo, no
// un candado: el alumno siempre puede tocar la casilla a mano en vez de resolver la suma). --
function submitBingoCalcAnswer(raw) {
  if (!bingoGame || bingoGame.numPhase!=='calc') return;
  const me = _bingoMe();
  const player = (bingoGame.players||{})[me.uid];
  if (!player || _bingoAmFrozen(player)) return;
  const val = Number(raw);
  if (Number.isNaN(val) || val !== bingoGame.currentNumber) { showToast('Esa no es la suma correcta.','error'); return; }
  const num = bingoGame.currentNumber;
  const newMarks = (player.marks||[]).slice();
  Object.keys(player.cards||{}).forEach(ci => {
    const cardIdx = Number(ci);
    const card = player.cards[ci];
    const already = newMarks.some(m=>m.c===cardIdx && m.n===num);
    const blocked = (player.blockedMarks||[]).some(m=>m.c===cardIdx && m.n===num);
    const frozen = (player.frozenCells||[]).some(f=>f.c===cardIdx && f.n===num);
    if (!already && !blocked && !frozen && card.includes(num)) newMarks.push({c:cardIdx, n:num});
  });
  BINGO_REF.update({ [`players.${me.uid}.marks`]: newMarks })
    .then(()=> showToast('✓ ¡Bien! Número marcado automáticamente.','success'))
    .catch(e=>console.error('bingo calc-answer',e));
}

// -- v2: Reto Matemático (gauntlet de 5 preguntas, "pop quiz" sincronizado: el host transmite
// las MISMAS 5 preguntas a todos por igual; cada cliente resuelve y reporta su propio resultado,
// igual de "confiado" que ya hacían markBingoCell/claimBingoPrize). --
function _bingoCheckMyChallengeEnd() {
  if (!bingoGame || !bingoGame.challengeActive) return;
  const me = _bingoMe();
  const player = (bingoGame.players||{})[me.uid];
  if (!player || player.lastChallengeId === bingoGame.challengeId) return; // ya resuelto este reto
  const allAnswered = bingoChallengeIdx >= (bingoGame.questions||[]).length;
  const timeUp = Date.now() >= (bingoGame.challengeEndsAt||0);
  if (allAnswered || timeUp) _bingoFinishChallenge(bingoChallengeIdx);
}
function submitBingoChallengeAnswer(raw) {
  if (!bingoGame || !bingoGame.challengeActive) return;
  const me = _bingoMe();
  const player = (bingoGame.players||{})[me.uid];
  if (!player || player.lastChallengeId === bingoGame.challengeId) return;
  const q = (bingoGame.questions||[])[bingoChallengeIdx];
  if (!q) return;
  const val = Number(raw);
  // Limpiar el campo ANTES de re-renderizar; si no, el mecanismo "salva/restaura foco"
  // de _renderBingoPane() reinyecta la respuesta anterior en la siguiente pregunta.
  const _clearInput = () => { const ci = document.getElementById('bingo-challenge-input'); if (ci) ci.value = ''; };
  if (Number.isNaN(val) || val !== q.a) {
    bingoChallengeError = true; bingoChallengeAnswer = '';
    _clearInput();
    _renderBingoPane();
    return; // respuesta incorrecta: NO avanza, repite la misma pregunta (igual que neon-bingo)
  }
  bingoChallengeError = false; bingoChallengeAnswer = '';
  bingoChallengeIdx += 1;
  _clearInput();
  if (bingoChallengeIdx >= bingoGame.questions.length) _bingoFinishChallenge(bingoChallengeIdx);
  else _renderBingoPane();
}
function _bingoFinishChallenge(correctCount) {
  const me = _bingoMe();
  const player = (bingoGame.players||{})[me.uid];
  if (!player || player.lastChallengeId === bingoGame.challengeId) return;
  const total = (bingoGame.questions||[]).length || 5;
  const perfect = correctCount >= total;
  const patch = { [`players.${me.uid}.lastChallengeId`]: bingoGame.challengeId };
  if (perfect) {
    const timeRemaining = Math.max(0, ((bingoGame.challengeEndsAt||0) - Date.now()) / 1000);
    const charges = timeRemaining > 30 ? 2 : 1;
    patch[`players.${me.uid}.blockedMarks`] = []; // reto perfecto: limpia todos los bloqueos
    patch[`players.${me.uid}.powerCharges`] = (player.powerCharges||0) + charges;
  } else {
    patch[`players.${me.uid}.pendingBlock`] = { challengeId: bingoGame.challengeId, fails: total-correctCount, deadline: Date.now() + (bingoGame.blockSeconds||60)*1000 };
  }
  const charges = patch[`players.${me.uid}.powerCharges`] !== undefined
    ? patch[`players.${me.uid}.powerCharges`] - (player.powerCharges||0) : 0;
  BINGO_REF.update(patch)
    .then(()=> showToast(perfect ? `🌟 ¡Reto perfecto! +${charges} carga${charges>1?'s':''} y bloqueos limpiados.` : `Fallaste ${total-correctCount}. Debes bloquear ${total-correctCount} casilla(s) marcada(s).`, perfect?'success':'error'))
    .catch(e=>console.error('bingo challenge-finish',e));
  bingoChallengeIdx = 0; bingoChallengeAnswer = ''; bingoChallengeError = false; bingoBlockSelection = [];
}

// -- v2: bloqueo (penalidad por reto imperfecto) --
function toggleBingoBlockSelection(c, n) {
  const me = _bingoMe();
  const player = (bingoGame.players||{})[me.uid];
  if (player) {
    const card = (player.cards||{})[c];
    const pos = card ? card.indexOf(n) : -1;
    if (pos !== -1 && (player.shieldedColumns||[]).some(s=>s.c===c && s.col===(pos%5))) {
      showToast('🛡️ Esta columna está protegida por el Escudo.','error'); return;
    }
  }
  const idx = bingoBlockSelection.findIndex(m=>m.c===c && m.n===n);
  if (idx>=0) bingoBlockSelection.splice(idx,1); else bingoBlockSelection.push({c,n});
  _renderBingoPane();
}
function applyBingoBlocks() {
  const me = _bingoMe();
  const player = (bingoGame.players||{})[me.uid];
  if (!player || !player.pendingBlock) return;
  const need = player.pendingBlock.fails || 0;
  const blockedAlready = player.blockedMarks || [];
  const shieldedCols = player.shieldedColumns || [];
  // Una marca está protegida si su columna (posición % 5 en la carta) está en shieldedColumns
  const isShielded = m => {
    const card = (player.cards||{})[m.c];
    if (!card) return false;
    const pos = card.indexOf(m.n);
    return pos !== -1 && shieldedCols.some(s=>s.c===m.c && s.col===(pos%5));
  };
  // Pool de candidatos: marcas no bloqueadas y no protegidas por escudo de columna
  const pool = (player.marks||[]).filter(m =>
    !blockedAlready.some(b=>b.c===m.c && b.n===m.n) && !isShielded(m)
  );
  let chosen = bingoBlockSelection.filter(sel => pool.some(p=>p.c===sel.c && p.n===sel.n)).slice(0, need);
  if (chosen.length < need) {
    const rest = pool.filter(p => !chosen.some(s=>s.c===p.c && s.n===p.n));
    while (chosen.length < need && rest.length) {
      const i = _bGetRandomInt(0, rest.length-1);
      chosen.push(rest.splice(i,1)[0]);
    }
  }
  const patch = {
    [`players.${me.uid}.blockedMarks`]: [...blockedAlready, ...chosen],
    [`players.${me.uid}.pendingBlock`]: null
  };
  BINGO_REF.update(patch)
    .then(()=> showToast(shieldedCols.length ? '🛡️ Tu Escudo protegió la columna del bloqueo.' : 'Casillas bloqueadas.', 'error'))
    .catch(e=>console.error('bingo apply-blocks',e));
  bingoBlockSelection = [];
}
function _bingoCheckMyBlockTimeout() {
  const me = _bingoMe();
  const player = bingoGame && (bingoGame.players||{})[me.uid];
  if (!player || !player.pendingBlock) return;
  if (Date.now() >= (player.pendingBlock.deadline||0)) applyBingoBlocks(); // se acabó el tiempo: autocompleta al azar
}

// -- v2: poderes entre alumnos reales (7, portados de neon-bingo) --
// Comprueba si un poder ya desbloqueado está disponible para usar ahora
function _bingoPowerAvailable(player, key) {
  if (!(player.unlockedPowers||{})[key]) return false;
  const pw = BINGO_POWER_DEFS.find(p=>p.key===key);
  if (!pw) return false;
  if (pw.limit === 'persistent') return true;
  const used = (player.usedPowers||{})[key];
  if (pw.limit === 'game') return !used;
  if (pw.limit === 'reto') return used !== (bingoGame.retoCount||0);
  return false;
}
// Gasta cargas para desbloquear un poder permanentemente
function unlockBingoPower(key) {
  const me = _bingoMe();
  const player = (bingoGame.players||{})[me.uid];
  if (!player) return;
  if (_bingoAmFrozen(player)) { showToast('🥶 Estás congelado.','error'); return; }
  const pw = BINGO_POWER_DEFS.find(p=>p.key===key);
  if (!pw) return;
  if ((player.unlockedPowers||{})[key]) { showToast(`${pw.icon} ${pw.label} ya está desbloqueado.`,'error'); return; }
  if ((player.powerCharges||0) < pw.cost) { showToast(`Necesitas ${pw.cost} carga(s) para desbloquear este poder.`,'error'); return; }
  BINGO_REF.update({
    [`players.${me.uid}.unlockedPowers.${key}`]: true,
    [`players.${me.uid}.powerCharges`]: (player.powerCharges||0) - pw.cost
  }).then(()=> showToast(`${pw.icon} ¡${pw.label} desbloqueado!`,'success'))
    .catch(e=>console.error('bingo unlock',e));
}
// Verifica que el poder esté desbloqueado y disponible para usar en este momento
function _bingoPowerUseGuard(key) {
  const me = _bingoMe();
  const player = (bingoGame.players||{})[me.uid];
  if (!player) return null;
  if (_bingoAmFrozen(player)) { showToast('🥶 Estás congelado, no puedes usar poderes.','error'); return null; }
  if (!(player.unlockedPowers||{})[key]) { showToast('Primero desbloquea este poder.','error'); return null; }
  if (!_bingoPowerAvailable(player, key)) {
    const pw = BINGO_POWER_DEFS.find(p=>p.key===key);
    showToast(pw?.limit==='game' ? 'Ya usaste este poder en esta partida.' : 'Ya usaste este poder — espera al próximo reto.','error');
    return null;
  }
  return player;
}
function _bingoPowerDone(msg, ok) {
  bingoActivePower = null; bingoPowerForm = {}; _bingoPowerStep = null;
  _renderBingoPane();
  if (msg) showToast(msg, ok===false?'error':'success');
}
function toggleBingoPower(key) {
  const me = _bingoMe();
  const player = (bingoGame.players||{})[me.uid];
  if (!player) return;
  // No desbloqueado → desbloquear (gasta cargas)
  if (!(player.unlockedPowers||{})[key]) { unlockBingoPower(key); return; }
  // Persistente → no requiere activación, ya está activo al estar desbloqueado
  const pw = BINGO_POWER_DEFS.find(p=>p.key===key);
  if (pw?.limit === 'persistent') { showToast(`${pw.icon} ${pw.label} ya está activo para toda la partida.`,'success'); return; }
  // No disponible → mostrar mensaje de cooldown
  if (!_bingoPowerAvailable(player, key)) {

  }

  bingoActivePower = (bingoActivePower===key) ? null : key;

  _renderBingoPane();
}

function doBingoSabotaje() {

function doBingoEscudo(cardIdx, col) {
  const me = _bingoMe();
  const player = _bingoPowerUseGuard('escudo');
  if (!player) return;
  const card = (player.cards||{})[cardIdx];
  if (!card) { showToast('Cartón no encontrado.','error'); return; }
  // Solo se puede proteger si los 5 números de la columna están marcados
  const marksSet = new Set((player.marks||[]).filter(m=>m.c===cardIdx).map(m=>m.n));
  const colNums = [col, col+5, col+10, col+15, col+20].map(p=>card[p]);
  const isComplete = colNums.every(n => n===0 || marksSet.has(n));
  if (!isComplete) { showToast('Solo puedes proteger columnas con los 5 números marcados.','error'); return; }
  const colLetter = 'BINGO'[col];
  const existing = player.shieldedColumns || [];
  if (existing.some(s=>s.c===cardIdx && s.col===col)) { showToast(`La columna ${colLetter} ya está protegida.`,'error'); return; }
  BINGO_REF.update({
    [`players.${me.uid}.shieldedColumns`]: [...existing, {c: cardIdx, col}],
    [`players.${me.uid}.usedPowers.escudo`]: bingoGame.retoCount||0
  }).then(()=>_bingoPowerDone(`🛡️ ¡Columna ${colLetter} del Cartón ${cardIdx+1} protegida! Inmune a todos los poderes.`))
    .catch(e=>console.error('bingo escudo',e));
}
function doBingoComodin() {
  const me = _bingoMe();
  const player = _bingoPowerUseGuard('comodin');
  if (!player) return;
  const drawn = new Set(bingoGame.drawnNumbers || []);
  const existingMarks = player.marks || [];
  const markedSet = new Set(existingMarks.map(m=>`${m.c}:${m.n}`));
  const blocked = new Set((player.blockedMarks||[]).map(m=>`${m.c}:${m.n}`));
  const frozenS = new Set((player.frozenCells ||[]).map(f=>`${f.c}:${f.n}`));
  const newMarks = [];
  Object.entries(player.cards||{}).forEach(([ci, card]) => {
    const ci2 = Number(ci);
    card.forEach(num => {
      if (!num) return;
      const k = `${ci2}:${num}`;
      if (drawn.has(num) && !markedSet.has(k) && !blocked.has(k) && !frozenS.has(k))
        newMarks.push({ c: ci2, n: num });
    });
  });
  if (newMarks.length === 0) { showToast('No hay números sin marcar que hayan salido.','error'); return; }
  BINGO_REF.update({
    [`players.${me.uid}.marks`]: [...existingMarks, ...newMarks],
    [`players.${me.uid}.usedPowers.comodin`]: true
  }).then(()=>_bingoPowerDone(`🎰 ¡Relleno! Marcaste ${newMarks.length} número(s) de golpe.`))
    .catch(e=>console.error('bingo comodin',e));
}
function doBingoCongelar() {

// Visión X es persistente: al desbloquearse queda activa para toda la partida (sin do-function)
function doBingoRobo() {
  const me = _bingoMe();
  const player = _bingoPowerUseGuard('robo');
  if (!player) return;
  const { rivalUid, rivalCardIdx, rivalNum, myCardIdx, myNum } = bingoPowerForm;
  if (!rivalUid || rivalNum==null || myNum==null || myCardIdx==null) { showToast('Selección incompleta.','error'); return; }
  const rivalPlayer = (bingoGame.players||{})[rivalUid];
  if (!rivalPlayer) { showToast('Rival no encontrado.','error'); return; }
  const myCard  = [...((player.cards||{})[myCardIdx]||[])];
  const rivCard = [...((rivalPlayer.cards||{})[rivalCardIdx]||[])];
  const myPos  = myCard.indexOf(myNum);
  const rivPos = rivCard.indexOf(rivalNum);
  if (myPos === -1 || rivPos === -1) { showToast('Número no encontrado en el cartón.','error'); return; }
  if ((bingoGame.drawnNumbers||[]).includes(myNum)) { showToast('No puedes ceder un número ya sorteado.','error'); return; }
  if (myPos % 5 !== rivPos % 5) { showToast(`Los números deben estar en la misma columna (${'BINGO'[rivPos%5]}).`,'error'); return; }
  // Chequear columna protegida por Escudo
  const _rivShielded = rivalPlayer.shieldedColumns||[];
  if (_rivShielded.some(s=>s.c===rivalCardIdx&&s.col===rivPos%5)) { showToast(`🛡️ La columna ${'BINGO'[rivPos%5]} de ${rivalPlayer.name} está protegida.`,'error'); return; }
  const _myShielded = player.shieldedColumns||[];
  if (_myShielded.some(s=>s.c===myCardIdx&&s.col===myPos%5)) { showToast(`🛡️ Tu columna ${'BINGO'[myPos%5]} está protegida — no puedes ceder ese número.`,'error'); return; }
  myCard[myPos]  = rivalNum;
  rivCard[rivPos] = myNum;
  const myMarks  = (player.marks||[]).filter(m=>!(m.c===myCardIdx    && m.n===myNum));
  const rivMarks = (rivalPlayer.marks||[]).filter(m=>!(m.c===rivalCardIdx && m.n===rivalNum));
  BINGO_REF.update({
    [`players.${me.uid}.cards.${myCardIdx}`]: myCard,
    [`players.${me.uid}.marks`]: myMarks,
    [`players.${me.uid}.usedPowers.robo`]: true,
    [`players.${rivalUid}.cards.${rivalCardIdx}`]: rivCard,
    [`players.${rivalUid}.marks`]: rivMarks,
  }).then(()=>_bingoPowerDone(`📋 Intercambiaste ${myNum}↔${rivalNum} con ${rivalPlayer.name}.`))
    .catch(e=>console.error('bingo robo',e));
}

// -- render --
function _renderBingoPane() {
  _bingoEnsureTimer();
  // Puede haber 0 o 1 contenedor montado a la vez (tab GAMING del dashboard, o la
  // pantalla completa /student/bingo) — el router reemplaza el DOM completo en cada vista.
  const hosts = document.querySelectorAll('.bingo-pane-host');
  if (!hosts.length) return; // Ninguna vista de Bingo está montada ahora; el listener sigue vivo igual
  // _bingoTick() llama acá cada 1s mientras status==='playing' (solo para refrescar la cuenta
  // atrás) — eso reemplazaba TODO el innerHTML del panel cada segundo, incluido el <input> donde
  // el alumno estaba escribiendo (respuesta del Reto Matemático, del cálculo, de un poder),
  // borrando lo escrito y el foco a mitad de tecleo ("no me deja escribir el número"). Se guarda
  // valor/cursor del input enfocado y se restaura después de volver a pintar.
  const active = document.activeElement;
  // Si el usuario tiene un <select> abierto dentro del panel, NO re-renderizar —
  // reemplazar innerHTML cierra el dropdown al instante e impide elegir una opción.
  if (active && active.tagName === 'SELECT' && Array.from(hosts).some(h => h.contains(active))) return;
  let savedInput = null;
  if (active && active.tagName === 'INPUT' && active.id && Array.from(hosts).some(h => h.contains(active))) {

    if (!player) return '';
    const shielded = player.shieldedColumns || [];
    const cardEntries = Object.entries(player.cards||{}).sort((a,b)=>Number(a[0])-Number(b[0]));
    const multiCard = cardEntries.length > 1;
    let pickerHtml = '<div class="bpx-col-picker">';
    cardEntries.forEach(([ci, card]) => {
      const cardIdx = Number(ci);
      const marksSet = new Set((player.marks||[]).filter(m=>m.c===cardIdx).map(m=>m.n));
      if (multiCard) pickerHtml += `<div class="bpx-col-card-lbl">Cartón ${cardIdx+1}</div>`;
      pickerHtml += `<div class="bpx-col-row">`;
      for (let col = 0; col < 5; col++) {
        const nums = [col,col+5,col+10,col+15,col+20].map(p=>card[p]);
        const isComplete = nums.every(n=>n===0||marksSet.has(n));
        const isShielded = shielded.some(s=>s.c===cardIdx&&s.col===col);
        const letter = 'BINGO'[col];
        if (isShielded) pickerHtml += `<button class="bpx-col-btn shielded" disabled>🔒</button>`;
        else if (isComplete) pickerHtml += `<button class="bpx-col-btn eligible" onclick="doBingoEscudo(${cardIdx},${col})">${letter}</button>`;
        else pickerHtml += `<button class="bpx-col-btn" disabled title="Columna incompleta">${letter}</button>`;
      }
      pickerHtml += `</div>`;
    });
    pickerHtml += `</div><div class="bpx-hint-text" style="margin-top:6px;font-size:10px">Solo columnas con los 5 números marcados pueden protegerse.</div>`;
    return `<div class="bpx-hint-box">${pickerHtml}${bingoPowerMsg?`<div class="bpx-msg">${bingoPowerMsg}</div>`:''}</div>`;
  }
  const hints = {
    sabotaje: '👁 Ve al cartón de un rival (toca su nombre arriba) y toca la casilla que quieres congelar.',
    congelar: '🥶 Toca el nombre de un rival en la barra de arriba para congelarlo — no podrá marcar ni reclamar el próximo turno.',
    robo:     _bingoPowerStep
      ? `✅ Objetivo: <b>${'BINGO'[_bingoPowerStep.col]}-${_bingoPowerStep.rivalNum}</b> — ahora ve a tus cartones y toca un número en la columna ${'BINGO'[_bingoPowerStep.col]} que quieras ceder.`
      : '👁 1.° ve al cartón de un rival y toca el número que quieres; 2.° vuelve a tus cartones y toca el número que cedes (misma columna).',
    comodin:  'Marcará de golpe todos los números ya sorteados que aún no tienes en tus cartones.',
  };
  const confirmBtn = key === 'comodin'
    ? `<button class="bcx-btn" style="margin-top:8px;width:100%" onclick="doBingoComodin()">🎰 Aplicar Relleno ahora</button>`
    : '';
  return `<div class="bpx-hint-box">
    <div class="bpx-hint-text">${hints[key]||''}</div>
    ${confirmBtn}
    ${bingoPowerMsg?`<div class="bpx-msg">${bingoPowerMsg}</div>`:''}
  </div>`;
}

function vTableroSetup() {
  const loggedId = getLoggedId();

  }
  renderAll(loggedId);
  if (loggedId !== null) _refreshHeaderAvatar(overrides[String(loggedId)]||{});
  startClock(loggedId);
  document.addEventListener('click', () => {
    document.querySelectorAll('.color-palette.open').forEach(p => p.classList.remove('open'));

function startClock(loggedId) {
  clearInterval(clockTimer);
  clockTimer = setInterval(() => tickClock(loggedId), 1000);
  tickClock(loggedId);
}
function tickClock(loggedId) {
  const clk = document.getElementById('live-clock');
  if (!clk) { clearInterval(clockTimer); return; }
  clk.textContent = new Date().toLocaleTimeString('es-ES',{ hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true });
  updateStatusBadge(loggedId);
  updateBoardOverlay(loggedId);
}
function updateStatusBadge(loggedId) {
  const badge = document.getElementById('status-badge'); if (!badge) return;
  const vs = getVotingStatus(loggedId);
  badge.className = 'status-badge';
  const sch = computeSorteoSchedule();
  const drawLabel = sch.draw.toLocaleDateString('es-ES',{day:'numeric',month:'short'}).toUpperCase();
  if (vs==='open')              { badge.classList.add('status-open');   badge.textContent='● Activo'; }
  else if (vs==='waiting_turn') { badge.classList.add('status-wait');   badge.textContent='🎲 Sorteo: ' + drawLabel; }
  else                          { badge.classList.add('status-closed'); badge.textContent='🎲 Sorteo: ' + drawLabel; }
}
function updateBoardOverlay(loggedId) {
  const vs = getVotingStatus(loggedId);
  const overlay = document.getElementById('board-overlay'); if (!overlay) return;
  const waitInfo = document.getElementById('overlay-wait-info');
  // El tablero (números) siempre debe verse — incluso con el sorteo cerrado.
  // El overlay de "pantalla completa" solo se usa para frenar a quien aún
  // no le toca su turno; cuando está cerrado simplemente no se permite elegir
  // (el badge de estado y el toast al tocar un número ya lo indican).
  const grid = document.getElementById('num-grid');
  const boardHdr = document.querySelector('.board-header');
  if (vs!=='waiting_turn') {
    overlay.classList.remove('show');
    if (grid) grid.style.display = '';
    if (boardHdr) boardHdr.style.display = '';
    const card = overlay.parentElement;
    if (card) card.style.minHeight = '';
    return;
  }
  overlay.classList.add('show');
  if (grid) grid.style.display = 'none';
  if (boardHdr) boardHdr.style.display = 'none';
  // Give the card a fixed height so the overlay is visible
  const card = overlay.parentElement;
  if (card) card.style.minHeight = '355px';
  document.getElementById('overlay-icon').textContent  = '⏳';
  document.getElementById('overlay-title').textContent = 'ESPERA TU TURNO';
  document.getElementById('overlay-sub').textContent   = 'Los turnos se habilitan de 3 PM a 9 PM.';
  waitInfo.style.display = 'block';
  document.getElementById('overlay-start-date').textContent = formatFullDate(getPersonalStart(loggedId));
}
function switchTab(tab) {
  document.getElementById('pane-board').style.display   = tab==='board'   ? 'block' : 'none';
  document.getElementById('pane-ranking').style.display = tab==='ranking' ? 'block' : 'none';
  document.getElementById('tab-board').classList.toggle('active',   tab==='board');
  document.getElementById('tab-ranking').classList.toggle('active', tab==='ranking');
  if (tab==='ranking') renderTableroRanking();
}
function renderGrid(loggedId) {
  const grid     = document.getElementById('num-grid'); if (!grid) return;
  const students = getStudents();
  grid.innerHTML = '';
  for (let n=1; n<=getTotal(); n++) {
    const ownerId = allocations[n];
    const owner   = students.find(s => String(s.id)===String(ownerId));
    const isMine  = String(ownerId)===String(loggedId);
    const btn     = document.createElement('button');
    btn.className = 'num-btn' + (isMine?' mine':(ownerId?' taken':''));
    btn.textContent = n;
    if (ownerId) {
      btn.style.background  = owner?.color || '#555';
      btn.style.borderColor = isMine ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.25)';
      const em = document.createElement('span');
      em.className = 'num-emoji'; em.textContent = owner?.icon||'👤';
      btn.appendChild(em);
    }
    btn.addEventListener('click', () => handleNumber(n, loggedId));
    grid.appendChild(btn);
  }
  document.getElementById('taken-count').textContent = Object.keys(allocations).length;
  document.getElementById('taken-total').textContent = ' / ' + getTotal();
}
function handleNumber(num, loggedId) {
  const active       = getFullList().find(s => s.id===loggedId);
  const currentOwner = allocations[num];
  if (active?.role==='admin') {
    if (!currentOwner) return;
    delete allocations[num]; renderAll(loggedId);
    saveAllocationChange(num,'delete',null)
      .then(()=>showToast('Número '+num+' liberado.','success'))
      .catch(e=>{ console.error(e); allocations[num]=currentOwner; renderAll(loggedId); showToast('Error al liberar.'); });
    return;
  }
  const vs = getVotingStatus(loggedId);
  if (vs!=='open') {
    if (vs==='waiting_turn') showToast('Tu turno: '+formatFullDate(getPersonalStart(loggedId)));
    else showToast('Sorteo cerrado.');
    return;
  }
  if (String(currentOwner)===String(loggedId)) {
    delete allocations[num]; renderAll(loggedId);
    saveAllocationChange(num,'delete',null)
      .catch(e=>{ console.error(e); allocations[num]=loggedId; renderAll(loggedId); showToast('Error al deseleccionar.'); });
  } else if (!currentOwner) {
    const counts = getPickCounts();
    if ((counts[loggedId]||0) >= (active?.max||0)) { showToast('Cupo lleno ('+(active?.max)+').'); return; }
    allocations[num] = loggedId; renderAll(loggedId);
    saveAllocationChange(num,'set',loggedId)
      .catch(e=>{
        delete allocations[num]; renderAll(loggedId);
        if (e.message?.startsWith('CUPO_LLENO:')) showToast('Cupo lleno ('+e.message.split(':')[1]+').');
        else showToast('Número ya ocupado, intenta otro.');
      });
  } else { showToast('Ya ocupado.'); }
}
function renderBoardProgress(loggedId) {
  const container = document.getElementById('progress-list'); if (!container) return;
  const me = getStudents().find(s => s.id===loggedId);
  if (!me) { container.innerHTML=''; return; }
  const count = getPickCounts()[me.id]||0;
  const max   = me.max||1;
  const pct   = Math.min(100,(count/max)*100);
  container.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px">
      ${makeAvatarHTML(me.icon,me.color,(overrides[String(me.id)]||{}).photo||null,getStudentFrame(me.id),36)}
      <div style="flex:1">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
          <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:900;text-transform:uppercase;color:${me.color||'#fff'}">${me.name}</span>
          <span style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:${count>=me.max?'#fb923c':'#e5e7eb'}">${count} / ${me.max||0}</span>
        </div>
        <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${pct}%;background:${me.color||'#84cc16'}"></div></div>
      </div>
    </div>`;
}
function renderTableroRanking() {
  const list=document.getElementById('ranking-list'); if(!list) return;
  const loggedId=getLoggedId();
  const students=getStudents(); const counts=getPickCounts();
  list.innerHTML='';
  students.forEach((s,idx) => {
    const count=counts[s.id]||0; const ps=getPersonalStart(s.id);
    const isMyTurn=ps&&new Date()>=ps&&getVotingStatus(loggedId)!=='closed';
    const isMe=loggedId===s.id;
    const junioPts=getTotalPts(s.id); const pct=Math.min(100,(junioPts/(s.max||1))*100);
    const div=document.createElement('div');
    div.className='rank-card'+(isMe?' me':'');
    div.innerHTML=`
      <div class="rank-row">
        <div style="display:flex;align-items:center;gap:10px">
          ${makeAvatarHTML(s.icon,s.color||'#555',(overrides[String(s.id)]||{}).photo||null,getStudentFrame(s.id),40)}
          <div>
            <div class="rank-name">${idx+1}. ${s.name}</div>
            <div class="rank-time" style="color:${isMyTurn?'#39ff7a':'#6b7280'}">${isMyTurn?'✓ Turno activo':formatFullDate(ps)}</div>
          </div>
        </div>
        <div class="rank-count" style="color:#e5e7eb">${junioPts} pts</div>
      </div>
      <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${pct}%;background:${s.color||'#555'}"></div></div>`;
    list.appendChild(div);
  });
}
function renderAll(loggedId) {
  renderGrid(loggedId); renderBoardProgress(loggedId);
  updateStatusBadge(loggedId); updateBoardOverlay(loggedId);
  renderStudentCronograma();
}

function setTotalNumbers(n) {
  if (!firestoreDataReady()) return;
  appConfig.totalNumbers=n;
  Object.keys(allocations).forEach(k=>{ if(parseInt(k)>n) delete allocations[k]; });
  // IMPORTANTE: usar merge:true y NO incluir 'lms' aquí. Sin merge, .set() reemplaza
  // TODO el documento — esto borraba pointsLog/pointsHistory/taskMultipliers/prompts
  // cada vez que se cambiaba el total de números (bug real que vació los Puntos).
  REF.set({ allocations, overrides, config:appConfig }, { merge:true })
    .catch(e=>{ console.error(e); showToast('Error.'); });
  updateAdminSummary(); renderAll(getLoggedId());
  showToast('Tablero actualizado a '+n+' números.','success');
}

// ── Detección automática de alumnos nuevos en /padres ───────────────────
// Ya no se agregan alumnos a mano: cuando un padre se registra (o el admin de
// /padres agrega un alumno) en emaths.me/padres, aparece aquí como "solicitud
// nueva" y el admin solo tiene que ACEPTARLA para crear su cuenta de sorteo
// (cupo, PIN, color, ícono). El nombre queda vinculado (padresId) y a partir
// de ahí se sincroniza en vivo desde /padres — no se vuelve a tocar aquí.
function syncPadresLinks() {
  const pStudents = padresRaw.students || {};
  let changed = false;
  getStudents().forEach(s => {
    const k = String(s.id);
    const hasLink = (overrides[k] && overrides[k].padresId !== undefined) ||
                    (DEFAULT_STUDENTS.find(d => d.id === s.id) || {}).padresId !== undefined;
    if (hasLink) return;
    const key = normName(s.name);
    if (!key) return;
    const matches = Object.keys(pStudents).filter(pid => pStudents[pid] && normName(pStudents[pid].name) === key);
    if (matches.length === 1) {
      if (!overrides[k]) overrides[k] = {};
      overrides[k].padresId = matches[0];
      changed = true;
    }
  });
  if (changed) saveMeta();
}
function getLinkedPadresIds() {
  const linked = new Set();
  Object.keys(overrides).forEach(k => { if (overrides[k] && overrides[k].padresId !== undefined && overrides[k].padresId !== null) linked.add(String(overrides[k].padresId)); });
  DEFAULT_STUDENTS.forEach(d => { if (d.padresId !== undefined && d.padresId !== null) linked.add(String(d.padresId)); });
  return linked;
}
// Alumnos de /padres que todavía no están vinculados a NINGUNA cuenta de sorteo
// (ni siquiera a una que esté con el vínculo roto). Sirve tanto para la lista de
// "solicitudes nuevas" como para el selector de "volver a vincular".
function getUnlinkedPadresStudents() {
  const pStudents = padresRaw.students || {};
  const linked    = getLinkedPadresIds();
  return Object.keys(pStudents)
    .filter(pid => pStudents[pid] && pStudents[pid].name && !linked.has(String(pid)))
    .map(pid => ({ pid: String(pid), name: pStudents[pid].name }));
}
function getPendingPadresRequests() {
  const dismissed = new Set((appConfig.dismissedPadresIds || []).map(String));
  return getUnlinkedPadresStudents().filter(r => !dismissed.has(r.pid));
}
// Si /padres borra al alumno vinculado, la cuenta de sorteo NO se borra ni se
// renombra silenciosamente — sigue activa (cupo, PIN, números, puntos) pero
// queda "libre" (vínculo roto). Esto la vuelve a conectar con un alumno de
// /padres (el mismo que se volvió a registrar, u otro) sin perder nada.
function relinkToPadres(studentId, pid) {
  if (!pid) return;
  const ps = (padresRaw.students || {})[String(pid)];
  if (!ps) { showToast('Ese alumno ya no existe en /padres.'); renderStudentList(); return; }
  const k = String(studentId);
  if (!overrides[k]) overrides[k] = {};
  overrides[k].padresId = String(pid);
  overrides[k].name     = ps.name; // se cachea como respaldo si vuelve a romperse el vínculo
  saveMeta(); renderStudentList(); renderPadresRequests(); renderAll(getLoggedId());
  showToast(`Vinculado con ${ps.name}.`, 'success');
}
// Cachea el nombre vigente de /padres en overrides[id].name mientras el vínculo
// esté sano, para que si luego se rompe (lo borran en /padres) la cuenta no
// vuelva a "Nuevo Alumno" sino que muestre el último nombre conocido.
function cacheLiveNames() {
  let changed = false;
  Object.keys(overrides).forEach(k => {
    const pid = overrides[k] && overrides[k].padresId;
    if (pid === undefined || pid === null) return;
    const ps = (padresRaw.students || {})[String(pid)];
    if (ps && ps.name && overrides[k].name !== ps.name) {
      overrides[k].name = ps.name;
      changed = true;
    }
  });
  if (changed) saveMeta();
}

function buildTimePicker(containerId,label,isoValue,onChangeFn) {

  const dateObj=isoValue?new Date(isoValue):new Date(); const valid=!isNaN(dateObj.getTime());
  let dateStr=valid?getLD(dateObj):getLD(new Date()); let h24=valid?dateObj.getHours():9;
  let ampm=h24>=12?'PM':'AM'; let h12=h24%12||12; let mins=valid?dateObj.getMinutes():0;
  const apply=()=>{ let h=h12; if(ampm==='PM'&&h<12)h+=12; if(ampm==='AM'&&h===12)h=0; onChangeFn(`${dateStr}T${String(h).padStart(2,'0')}:${String(mins).padStart(2,'0')}:00`); };

  const colon=document.createElement('span'); colon.className='tp-colon'; colon.textContent=':';
  const selM=document.createElement('select'); selM.className='tp-sel';
  [0,5,10,15,20,25,30,35,40,45,50,55].forEach(m=>{ const o=document.createElement('option'); o.value=o.textContent=String(m).padStart(2,'0'); if(m===mins)o.selected=true; selM.appendChild(o); });
  selM.addEventListener('change',()=>{ mins=parseInt(selM.value); apply(); });
  selWrap.append(selH,colon,selM);

  ['AM','PM'].forEach(p=>{ const b=document.createElement('button'); b.type='button'; b.className='tp-ampm-btn'+(ampm===p?' active':''); b.textContent=p; b.addEventListener('click',()=>{ ampm=p; ampmWrap.querySelectorAll('.tp-ampm-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); apply(); }); ampmWrap.appendChild(b); });
  row.append(selWrap,ampmWrap); wrap.appendChild(row);

  showToast('Backup completo descargado.','success');
}

let _pendingRestoreData = null;
function triggerBackupUpload() {
  document.getElementById('backup-file-input').click();
}
function handleBackupFileSelected(event) {
  const file = event.target.files && event.target.files[0];
  event.target.value = ''; // permite volver a elegir el mismo archivo más adelante
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); }
    catch (e) { showToast('El archivo no es un backup válido (JSON corrupto).'); return; }
    if (!data || typeof data !== 'object' || !('allocations' in data) || !('lms' in data)) {
      showToast('El archivo no tiene el formato esperado de un backup de emaths.');
      return;
    }
    _pendingRestoreData = data;
    const dateTxt = data.exportedAt ? new Date(data.exportedAt).toLocaleString('es-ES') : 'fecha desconocida';
    const sub = document.getElementById('restore-confirm-sub');
    if (sub) sub.textContent = `Vas a restaurar el backup del ${dateTxt}. Esto reemplazará TODOS los datos actuales (tablero, tareas, puntos, prompts) con los del archivo. Esta acción no se puede deshacer.`;
    closeReportModal();
    document.getElementById('restore-confirm-modal').classList.add('show');
  };
  reader.readAsText(file);
}
function closeRestoreConfirm() {
  document.getElementById('restore-confirm-modal').classList.remove('show');
  _pendingRestoreData = null;
}
function confirmRestoreBackup() {
  if (!_pendingRestoreData) return;
  const data = _pendingRestoreData;
  const lms  = data.lms || {};
  // OJO: aquí SÍ se usa .set() SIN merge a propósito — restaurar un backup significa reemplazar
  // todo el documento por el contenido del archivo, no combinarlo con lo que hay ahora. El
  // listener onSnapshot ya activo se encarga de refrescar todo el estado en memoria y la vista.
  REF.set({
    allocations: data.allocations || {},
    overrides:   data.overrides   || {},
    config:      data.config      || { startTime:'', endTime:'', totalNumbers: 200 },
    lms: {
      tasks:           Array.isArray(lms.tasks) ? lms.tasks : [],
      points:          lms.points          || {},
      pointsLog:       lms.pointsLog       || {},
      pointsHistory:   lms.pointsHistory   || {},
      taskMultipliers: lms.taskMultipliers || {},
      prompts:         lms.prompts         || {}
    }
  }).then(() => {
    showToast('Backup restaurado correctamente.','success');
    closeRestoreConfirm();
  }).catch(err => {
    console.error('[restore]', err);
    showToast('Error al restaurar el backup.');
  });
}

// ════════════════════════════════════════════════════════
// VIEW: TAREAS
// ════════════════════════════════════════════════════════
// Agrupa a los alumnos en `numGroups` grupos contiguos por orden alfabético de primer nombre,
// repartidos de forma pareja por CANTIDAD de alumnos (no por cantidad de letras), para que
// "Todos" + las etiquetas de grupo siempre quepan en una sola línea sin importar cuántos
// alumnos haya. Usa normName() para que acentos no afecten el orden ni el rótulo.
function computeAlphaGroups(students, numGroups) {
  const withFirst = students
    .map(s => ({ s, first: s.name.split(' ')[0] || '' }))
    .sort((a,b) => normName(a.first).localeCompare(normName(b.first)));
  const n = withFirst.length;
  const groups = [];
  let start = 0;
  for (let i = 0; i < numGroups && start < n; i++) {
    const remaining = numGroups - i;
    const size = Math.ceil((n - start) / remaining);
    const slice = withFirst.slice(start, start + size);
    const firstLetter = (normName(slice[0].first)[0] || '?').toUpperCase();
    const lastLetter  = (normName(slice[slice.length-1].first)[0] || '?').toUpperCase();
    groups.push({
      label: firstLetter === lastLetter ? firstLetter : `${firstLetter}-${lastLetter}`,
      students: slice.map(x => x.s)
    });
    start += size;
  }
  return groups;
}
// Acordeón reutilizable para listas "ASIGNAR A" / "AGREGAR TAMBIÉN A", mismo patrón EXACTO que
// FILTRAR POR ALUMNO en Tareas: "🌍 Todos" + las 3 etiquetas alfabéticas en una sola línea. Clic
// en "Todos" solo cierra el grupo abierto (no pasa nada si ya está cerrado). Clic en una etiqueta
// la expande, mostrando a la derecha un pill por cada alumno de ese rango — clic en un pill lo
// activa/desactiva (multi-selección). Clic de nuevo en la etiqueta (ahora con ✕) la contrae.
// Los marcados viven en `state.checked` (Set), no en el DOM, para no perderse al cambiar de grupo.
function _renderAssignAccordion(students, state, opts) {
  const alphaGroups = computeAlphaGroups(students, 3);
  const groupOpen = (state.groupOpen !== null && alphaGroups[state.groupOpen]) ? state.groupOpen : null;
  const pillOff = "cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;letter-spacing:0.06em;padding:5px 10px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5)";

// Filtra (por taskSort: activas/vencidas/alumno/aprobar, y búsqueda de título) y ordena
// la lista de tareas de un alumno/admin. ACTIVAS/VENCIDAS reemplazan a las antiguas
// pestañas Pendientes/Completadas: VENCIDAS ahora también incluye las completadas y las
// que esperan aprobación (ya no están "activas"). APROBAR reemplaza a la pestaña Aprobar.
function _computeSortedTasks(myTasks, loggedId) {
  const todayStr = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD en hora local
  let filtered;
  if (taskSort === 'review') {
    filtered = myTasks.filter(t => (t.pendingReview||[]).length > 0);
  } else if (taskSort === 'old') {
    filtered = myTasks.filter(t =>
      (t.completedBy||[]).includes(loggedId) ||
      (t.pendingReview||[]).includes(loggedId) ||
      (t.due && t.due < todayStr)
    );
  } else if (taskSort === 'student') {
    filtered = myTasks; // todas, sin filtrar por estado — el orden las agrupa por alumno
  } else {
    // 'recent' / ACTIVAS (default): ni completada, ni esperando aprobación, ni vencida
    filtered = myTasks.filter(t =>
      !(t.completedBy||[]).includes(loggedId) &&
      !(t.pendingReview||[]).includes(loggedId) &&
      (!t.due || t.due >= todayStr)
    );
  }

  if (taskSort !== 'review' && taskSearchQuery && taskSearchQuery.trim()) {
    const q = normName(taskSearchQuery);
    filtered = filtered.filter(t => normName(t.title).includes(q));
  }

  // VENCIDAS se agrupa en: 1) hechas (y esperando aprobación, que para el alumno ya cuenta como
  // hecha), 2) marcadas explícitamente como no hechas (notDoneBy), 3) vencidas sin marcar.
  const vencidasRank = t => {
    if ((t.completedBy||[]).includes(loggedId)) return 0;
    if ((t.pendingReview||[]).includes(loggedId)) return 1;
    if ((t.notDoneBy||[]).includes(loggedId)) return 2;
    return 3;
  };
  return [...filtered].sort((a,b) => {
    if (taskSort === 'student') {
      const getKey = t => !t.assignTo || t.assignTo==='all' ? 'zzz' : Array.isArray(t.assignTo) ? t.assignTo[0] : String(t.assignTo);
      return getKey(a).localeCompare(getKey(b)) || parseInt(b.id||0)-parseInt(a.id||0);
    }
    if (taskSort === 'old') {
      const r = vencidasRank(a) - vencidasRank(b);
      if (r !== 0) return r;
    }
    return parseInt(b.id||0) - parseInt(a.id||0);
  });
}

function renderTask(t, loggedId) {

  const progressLabel = singleAssignSid
    ? (() => { const st = studentMonthTaskStat(singleAssignSid); return `${st.done}/${st.total}`; })()

  const attHtml = t.att ? (t.att.type==='link' ? `<a href="${t.att.url}" target="_blank" rel="noopener" class="msg-att-link" style="margin-top:0;height:38px;box-sizing:border-box;display:flex;align-items:center">🔗 ${t.att.name||t.att.url}</a>` : t.att.type==='image' ? `<img src="${t.att.url}" class="msg-att-img" alt="${t.att.name||'imagen'}" onclick="openImgViewer('${t.att.url}','${(t.att.name||'imagen').replace(/'/g,'')}')" style="margin-top:0;width:38px;height:38px">` : `<a href="${t.att.url}" target="_blank" rel="noopener" class="msg-att-file" style="margin-top:0;height:38px;box-sizing:border-box;display:flex;align-items:center">📄 ${t.att.name||'Archivo'}</a>`) : '';
  const doneIcon = awaiting ? '⏳' : '✓';
  const doneTitle = done ? 'Completada' : awaiting ? 'Esperando aprobación' : 'Marcar como hecha';
  // Columna derecha fija que replica el ancho real del grupo de botones (38px c/u + 6px de gap),

  const btnsColWidth = 38 + (isAdmin() ? 2 * (38 + 6) : 0);
  const dueBadge = t.due ? `<span style="font-size:9px;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:rgba(234,179,8,0.12);color:#fbbf24;border:1px solid rgba(234,179,8,0.2);white-space:nowrap">📅 ${dueText}${timeText?' · '+timeText:''}</span>` : '';

  const perStudentBadgesHtml = isMultiAssign ? t.assignTo.map(id => {
    const name = getStudents().find(s=>String(s.id)===String(id))?.name?.split(' ')[0] || '?';
    const st = studentMonthTaskStat(String(id));
    return `<span style="font-size:9px;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:rgba(34,229,255,0.12);color:#7dd3ff;border:1px solid rgba(34,229,255,0.2);white-space:nowrap;flex-shrink:0">${name}</span><span style="font-size:9px;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:rgba(34,197,94,0.1);color:#39ff7a;border:1px solid rgba(34,197,94,0.15);white-space:nowrap;flex-shrink:0">✓ ${st.done}/${st.total}</span>`;
  }).join('') : '';
  const sideBadgesHtml = !isAdmin() ? '' : isMultiAssign ? perStudentBadgesHtml : `
      <span style="font-size:9px;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:rgba(34,229,255,0.12);color:#7dd3ff;border:1px solid rgba(34,229,255,0.2);white-space:nowrap;flex-shrink:0">${assignLabel}</span>
      <span style="font-size:9px;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:rgba(34,197,94,0.1);color:#39ff7a;border:1px solid rgba(34,197,94,0.15);white-space:nowrap;flex-shrink:0">✓ ${progressLabel}</span>
  `;
  return `
  <div class="task-card${done?' tdone':awaiting?' twait':notDone?' tnotdone':''}" id="tc-${t.id}">
    <div style="display:flex;align-items:flex-start;gap:6px">

    ${t.tag&&_tagInfo(t.tag)?`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">
      <div style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;background:rgba(186,255,41,0.12);border:1px solid rgba(186,255,41,0.3);color:#baff29;font-size:9px;font-weight:900;letter-spacing:0.1em;text-transform:uppercase">${_tagInfo(t.tag).icon} ${_tagInfo(t.tag).label}</div>

    <div style="display:flex;align-items:center;gap:6px;margin-top:8px">
      <div style="flex:1;min-width:0">${attHtml}</div>
      <div class="task-btns" style="margin-top:0;flex-shrink:0">
        <button class="btn-dg sq ${done?'on':awaiting?'wait':'off'}" ${awaiting?'disabled':''} title="${doneTitle}" onclick="toggleTaskDone('${t.id}')">${doneIcon}</button>
        ${isAdmin()?`<button class="btn-dt sq" style="background:rgba(79,182,255,0.1);border-color:rgba(79,182,255,0.25);color:#4fb6ff" title="Editar" onclick="openEditTask('${t.id}')">✏️</button>`:''}
        ${isAdmin()?`<button class="btn-dt sq${notDone?' on':''}" title="${notDone?'Quitar marca de no hecha':'Marcar como no hecha'}" onclick="markTaskUndone('${t.id}')">✕</button>`:''}
      </div>
    </div>

}
function renderReviewQueue(list) {
  const students = getStudents();

  });

function getMsgLastRead(k){ return parseInt(localStorage.getItem('msgRead_'+k)||'0'); }
function setMsgLastRead(k){ localStorage.setItem('msgRead_'+k, String(Date.now())); }
function msgsUnreadCount(arr, k){
  const lr = getMsgLastRead(k);
  const me = isAdmin() ? 'teacher' : String(getLoggedId());
  return arr.filter(m => m.ts > lr && m.from !== me).length;
}
function totalMsgsUnread(){
  if (!getLoggedId()) return 0;
  let n = msgsUnreadCount(msgsGroupArr, 'group');
  if (!isAdmin()){
    n += msgsUnreadCount(msgsDmObj[String(getLoggedId())]||[], 'dm_'+getLoggedId());
  } else {
    Object.entries(msgsDmObj).forEach(([sid,arr]) => { n += msgsUnreadCount(arr,'dm_'+sid); });
  }
  return n;
}
function refreshMsgsBadge(){
  const n = totalMsgsUnread();
  const el = document.getElementById('nav-badge-tareas');
  if (el){ el.textContent = n>9?'9+':String(n||''); el.style.display = n>0?'flex':'none'; }
}
// ── Notificaciones de mensajes ──
// Dos capas que se complementan: (1) aviso INSTANTÁNEO local (vía onSnapshot) que funciona ya
// mismo con solo el permiso del navegador concedido, sin depender de la Cloud Function — esto es
// lo que avisaba antes y dejó de avisar al pasar a depender solo de FCM; (2) push real por Firebase
// Cloud Messaging para que también llegue con la pestaña/navegador cerrado, una vez que esté
// desplegada la Cloud Function (functions/index.js) con una VAPID_KEY real. Ambas usan el mismo
// "tag" por mensaje, así que si algún día llegan a coincidir, el navegador las funde en una sola.
// El permiso del navegador NO se puede "desactivar" por código una vez concedido — por eso el
// botón usa además un interruptor propio (_notifEnabled, guardado en localStorage) que silencia
// ambas capas sin tocar el permiso real.
function _notifEnabled(){ return localStorage.getItem('notifEnabled') !== 'off'; }
function _setNotifEnabled(v){ localStorage.setItem('notifEnabled', v ? 'on' : 'off'); }
function _notifBtnHtml(){
  if (typeof Notification === 'undefined') return ''; // navegador sin soporte
  const perm = Notification.permission;
  if (perm === 'denied') return `<button class="msgs-notif-btn off" onclick="showToast('Las bloqueaste desde el navegador. Para activarlas: clic en el ícono 🔒 junto a la URL y permite las notificaciones.','info')">🔕 Notificaciones bloqueadas</button>`;
  if (perm === 'granted') return _notifEnabled()
    ? `<button class="msgs-notif-btn on" onclick="toggleMsgsNotif()" title="Clic para desactivar">🔔 Notificaciones activadas</button>`
    : `<button class="msgs-notif-btn" onclick="toggleMsgsNotif()" title="Clic para activar">🔕 Notificaciones desactivadas</button>`;
  return `<button class="msgs-notif-btn" onclick="requestMsgsNotifPermission()">🔔 Activar notificaciones</button>`;
}
async function _saveFcmToken(token){
  if (!token || !messaging) return;
  const me = isAdmin() ? 'teacher' : String(getLoggedId());
  await FCM_TOKENS_COL.doc(token).set({ uid: me, ts: Date.now() }, { merge:true });
}
async function _deleteFcmToken(){
  if (!messaging) return;
  try {
    const reg = await navigator.serviceWorker.getRegistration('/firebase-messaging-sw.js');
    if (!reg) return;
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg }).catch(()=>null);
    if (token) await FCM_TOKENS_COL.doc(token).delete().catch(()=>{});
  } catch(e){ console.error('[FCM]', e); }
}
async function requestMsgsNotifPermission(){
  if (typeof Notification === 'undefined'){ showToast('Tu navegador no soporta notificaciones.','info'); return; }
  try {
    const perm = await Notification.requestPermission();
    if (perm === 'granted'){
      _setNotifEnabled(true);
      if (messaging) {
        try {
          const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
          const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
          await _saveFcmToken(token);
        } catch(e){ console.error('[FCM]', e); } // sin push real por ahora, pero el aviso local ya funciona
      }
      showToast('🔔 Notificaciones activadas.','info');
    } else if (perm === 'denied') {
      showToast('Notificaciones bloqueadas.','info');
    }
  } catch(e){
    console.error('[Notification]', e);
    showToast('No se pudo activar. Revisa la consola del navegador.','info');
  }
  const wrap = document.getElementById('msgs-notif-wrap'); if (wrap) wrap.innerHTML = _notifBtnHtml();
}
// Botón funcional: si el permiso ya está concedido, alterna el interruptor propio (sin pedir
// permiso de nuevo); si todavía no se pidió permiso, hace lo mismo que activar por primera vez.
async function toggleMsgsNotif(){
  if (Notification.permission !== 'granted') return requestMsgsNotifPermission();
  const turningOn = !_notifEnabled();
  _setNotifEnabled(turningOn);
  if (turningOn) { await _silentlyRefreshFcmToken(); showToast('🔔 Notificaciones activadas.','info'); }
  else { await _deleteFcmToken(); showToast('🔕 Notificaciones desactivadas.','info'); }
  const wrap = document.getElementById('msgs-notif-wrap'); if (wrap) wrap.innerHTML = _notifBtnHtml();
}
// Si ya había permiso concedido (y el interruptor propio sigue en "on") en una sesión anterior,
// renueva el token en silencio cada vez que arrancan los listeners — los tokens de FCM rotan/expiran.
async function _silentlyRefreshFcmToken(){
  if (typeof Notification === 'undefined' || !messaging || Notification.permission !== 'granted' || !_notifEnabled()) return;
  try {
    const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    await _saveFcmToken(token);
  } catch(e){ console.error('[FCM]', e); }
}
// Mensaje push recibido con la pestaña abierta Y visible (Chrome no muestra notificación sola en
// este caso — hay que crearla a mano, igual que hacía el service worker para pestaña cerrada/oculta).
if (messaging) {
  messaging.onMessage(payload => {
    if (!_notifEnabled()) return;
    const data = payload.data || {};
    const key = data.key; if (!key) return;
    const sid = key==='group' ? null : key.slice(3);
    if (document.hasFocus() && taskFilter==='msgs' && msgsDmView===sid) return; // ya está viendo ese chat
    try {
      const n = new Notification(payload.notification?.title || 'Nuevo mensaje', {
        body: payload.notification?.body || '', icon:'/favicon.svg', tag: data.tag || key
      });
      n.onclick = () => { window.focus(); go('tareas'); setTaskFilter('msgs'); setMsgsDmView(sid===null?'null':sid); n.close(); };
    } catch(e){ console.error('[Notification]', e); }
  });
}
// Aviso local instantáneo (no depende de FCM ni de la Cloud Function): compara contra la última
// marca de tiempo conocida de cada canal para detectar SOLO mensajes realmente nuevos (la primera
// vez que se conecta el listener únicamente fija la base, no notifica).
let _notifBaseline = {}; // { 'group': tsÚltimoMsgConocido, 'dm_<sid>': ... }
function _checkNewMsgsForNotify(key, arr){
  const prevTs = _notifBaseline[key];
  const maxTs = arr.length ? arr[arr.length-1].ts : 0;
  _notifBaseline[key] = maxTs;
  if (prevTs === undefined || maxTs <= prevTs) return;
  const me = isAdmin() ? 'teacher' : String(getLoggedId());
  arr.filter(m => m.ts > prevTs && m.from !== me).forEach(m => _fireMsgNotification(key, m));
}
function _fireMsgNotification(key, m){
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted' || !_notifEnabled()) return;
  const sid = key==='group' ? null : key.slice(3);
  if (document.hasFocus() && taskFilter==='msgs' && msgsDmView===sid) return; // ya está viendo ese chat
  const title = (key==='group' ? '📢 ' : '💬 ') + (m.fromName || 'Mensaje nuevo');
  const body  = m.text || (m.att ? (m.att.type==='image' ? '📎 Envió una imagen' : m.att.type==='link' ? '🔗 Envió un enlace' : '📄 Envió un archivo') : '');
  try {
    const n = new Notification(title, { body, icon:'/favicon.svg', tag:key+'_'+m.id });
    n.onclick = () => { window.focus(); go('tareas'); setTaskFilter('msgs'); setMsgsDmView(sid===null?'null':sid); n.close(); };
  } catch(e){ console.error('[Notification]', e); }
}
function startMsgsListeners(){
  if (msgsListeners['group']) return;
  const loggedId = getLoggedId(); if (loggedId === null) return;
  _silentlyRefreshFcmToken();
  msgsListeners['group'] = MSGS_COL.doc('group').onSnapshot(snap => {
    msgsGroupArr = (snap.exists ? snap.data().msgs||[] : []).sort((a,b)=>a.ts-b.ts);
    _checkNewMsgsForNotify('group', msgsGroupArr);
    refreshMsgsBadge();
    if (taskFilter==='msgs' && msgsDmView===null) _renderMsgsInPlace();
  });
  if (!isAdmin()){
    const sid = String(loggedId);
    msgsListeners['dm_'+sid] = MSGS_COL.doc('dm_'+sid).onSnapshot(snap => {
      msgsDmObj[sid] = (snap.exists ? snap.data().msgs||[] : []).sort((a,b)=>a.ts-b.ts);
      _checkNewMsgsForNotify('dm_'+sid, msgsDmObj[sid]);
      refreshMsgsBadge();
      if (taskFilter==='msgs' && msgsDmView===sid) _renderMsgsInPlace();
    });
  } else {
    getStudents().forEach(s => {
      const sid = String(s.id);
      if (msgsListeners['dm_'+sid]) return;
      msgsListeners['dm_'+sid] = MSGS_COL.doc('dm_'+sid).onSnapshot(snap => {
        msgsDmObj[sid] = (snap.exists ? snap.data().msgs||[] : []).sort((a,b)=>a.ts-b.ts);
        _checkNewMsgsForNotify('dm_'+sid, msgsDmObj[sid]);
        refreshMsgsBadge();
        if (taskFilter==='msgs' && msgsDmView===sid) _renderMsgsInPlace();
      });
    });
  }
}
function _renderMsgsInPlace(){
  const el = document.getElementById('msgs-body'); if (!el) return;
  el.innerHTML = _buildMsgsBubbles(); _scrollMsgsToBottom(); refreshMsgsBadge();
}
function _scrollMsgsToBottom(){
  setTimeout(()=>{ window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); },60);
}
function _buildMsgsBubbles(){
  const me = isAdmin() ? 'teacher' : String(getLoggedId());
  const arr = msgsDmView===null ? msgsGroupArr : (msgsDmObj[msgsDmView]||[]);
  if (!arr.length) return `<div style="text-align:center;padding:40px 20px;color:rgba(255,255,255,0.25)"><div style="font-size:36px;margin-bottom:8px">💬</div><div style="font-size:13px">Sin mensajes aún</div></div>`;
  return arr.map(m => {
    const mine = m.from===me;
    const ts = new Date(m.ts);
    const timeStr = ts.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    const dateStr = ts.toLocaleDateString('es-ES',{day:'numeric',month:'short'});

// Compress image to base64 (max 900px, JPEG quality 0.72)
async function _compressImgB64(file, maxW=900, q=0.72){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url); let w=img.width,h=img.height; if(w>maxW){h=Math.round(h*maxW/w);w=maxW;} const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); res(cv.toDataURL('image/jpeg',q)); };
    img.onerror=rej; img.src=url;
  });
}
async function sendMsg(){
  if (msgsUploading) return;
  const text=(document.getElementById('msgs-text')?.value||'').trim();
  const linkUrl=(document.getElementById('msgs-link-url')?.value||'').trim();
  const linkName=(document.getElementById('msgs-link-name')?.value||'').trim();
  if (!text && !linkUrl && !_msgsFileObj){ showToast('Escribe un mensaje o adjunta algo.'); return; }
  const me = isAdmin() ? 'teacher' : String(getLoggedId());
  const myName = isAdmin() ? '👨‍🏫 Profe' : (getStudents().find(s=>String(s.id)===me)?.name||'Alumno');
  let att = null;
  if (_msgsFileObj){
    msgsUploading = true;
    const btn=document.getElementById('msgs-send-btn'); if(btn){btn.disabled=true;btn.textContent='⏳';}
    try {
      const isImg = _msgsFileObj.type.startsWith('image/');
      if (isImg){
        const b64 = await _compressImgB64(_msgsFileObj);
        // Firestore doc limit ~1MB; warn if base64 > 700KB
        if (b64.length > 700000){ showToast('Imagen muy grande. Usa una de menor resolución.'); msgsUploading=false; const b=document.getElementById('msgs-send-btn'); if(b){b.disabled=false;b.textContent='➤';} return; }
        att = { type:'image', url:b64, name:_msgsFileObj.name };
      } else {
        // Non-image: use Firebase Storage
        const ref = storage.ref('msgs/'+Date.now()+'_'+_msgsFileObj.name);
        const snap = await ref.put(_msgsFileObj);
        const url = await snap.ref.getDownloadURL();
        att = { type:'file', url, name:_msgsFileObj.name };
      }
    } catch(e){
      showToast('Error al procesar el archivo.');
      msgsUploading=false; const btn2=document.getElementById('msgs-send-btn'); if(btn2){btn2.disabled=false;btn2.textContent='➤';} return;
    }
    msgsUploading=false; const btn2=document.getElementById('msgs-send-btn'); if(btn2){btn2.disabled=false;btn2.textContent='➤';}
  } else if (linkUrl){
    att = { type:'link', url:/^https?:\/\//i.test(linkUrl)?linkUrl:'https://'+linkUrl, name:linkName||linkUrl };
  }
  const msg = { id:String(Date.now()), from:me, fromName:myName, text, att, ts:Date.now() };
  const docKey = msgsDmView===null ? 'group' : 'dm_'+msgsDmView;
  try {
    await MSGS_COL.doc(docKey).set({ msgs: firebase.firestore.FieldValue.arrayUnion(msg) }, { merge:true });
    const textEl=document.getElementById('msgs-text'); if(textEl) textEl.value='';
    cancelMsgsLink(); cancelMsgsFile();
  } catch(e){ showToast('Error al enviar mensaje.'); }
}
