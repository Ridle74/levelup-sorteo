<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MATHS LEVEL UP — Estudiante</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ── PALETA GAMER NEÓN (sobreescribe el tema base solo en /student) ── */
:root {
  --bg: #0a0b16;
  --surface: #15172c;
  --surface2: #1b1e3a;
  --border: rgba(34,229,255,0.16);
  --border2: rgba(176,107,255,0.4);
  --accent: #39ff7a;
  --orange: #ff8a3d;
  --red: #ff3860;
  --blue: #4fb6ff;
}
#initial-loading { background: #0a0b16 !important; }
#login-screen, #login-screen::before { background: var(--bg) !important; }
.login-card { box-shadow: 0 0 0 1px rgba(34,229,255,0.18) inset, 0 24px 70px -20px rgba(176,107,255,0.35); }

/* ── SPA SHELL ─────────────────────────────────────── */
#app { min-height: 100dvh; }
body.nav-visible { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
body.nav-visible .vw { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }

/* ── INITIAL LOADING ──────────────────────────────── */
#initial-loading {
  position: fixed; inset: 0; z-index: 9999;
  background: #050d1a; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
}
#initial-loading.hidden { display: none; }

/* ── VIEW TRANSITION ──────────────────────────────── */
.vw { animation: vIn 0.18s ease-out; }
@keyframes vIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

/* ── BOTTOM NAV ───────────────────────────────────── */
#bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: rgba(5,13,26,0.97); backdrop-filter: blur(16px) saturate(180%);
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-bottom: env(safe-area-inset-bottom);
}
#bottom-nav.visible { display: block; }

/* ── HISTORY BAR (atrás / inicio / adelante) ──────── */
#hist-bar { display:none; position: fixed; top: 0; left: 0; right: 0; z-index: 200; gap:8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; background: rgba(5,13,26,0.92); backdrop-filter: blur(16px) saturate(180%); border-bottom: 1px solid rgba(255,255,255,0.08); }
#hist-bar.visible { display:flex; }
.hist-btn { border:none; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); width:38px; height:34px; border-radius:10px; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition: background 0.15s, color 0.15s, opacity 0.15s; -webkit-tap-highlight-color: transparent; }
.hist-btn:not(:disabled):active { background: rgba(79,182,255,0.18); color:#4fb6ff; }
.hist-btn:disabled { opacity:0.3; cursor:default; }
#hist-home { background: rgba(79,182,255,0.12); color:#4fb6ff; }
.hist-em { background:#8cb800 !important; color:#fff !important; font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:13px; letter-spacing:-0.01em; margin-left:auto; }
body.hist-visible #app { padding-top: calc(50px + env(safe-area-inset-top)); }
.nav-row { display: flex; max-width: 600px; margin: 0 auto; }
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 10px 2px 8px; border: none; background: none; cursor: pointer;
  color: rgba(255,255,255,0.35); font-family: 'Barlow Condensed', sans-serif;
  font-size: 8px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase;
  transition: color 0.15s; -webkit-tap-highlight-color: transparent;
}
.nav-btn .ni { font-size: 22px; line-height: 1; display: block; }
.nav-btn.active { color: #4fb6ff; }
.nav-btn.active .ni { filter: drop-shadow(0 0 5px rgba(79,182,255,0.5)); }

/* ── DASHBOARD ────────────────────────────────────── */
.dash-hero {
  background: linear-gradient(115deg, #5b21b6 0%, #7c3aed 50%, #22e5ff 100%);
  border-radius: 20px; padding: 20px; margin-bottom: 10px;
  position: relative; overflow: hidden;
}
.dash-hero::before { content:''; position:absolute; inset:0; background:linear-gradient(115deg, rgba(5,7,14,0.58) 0%, rgba(5,7,14,0.34) 45%, rgba(5,7,14,0.58) 100%); }
.dash-hero > * { position: relative; z-index: 1; }
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.dash-stat { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:14px; }
.ds-lbl { font-size:8px; font-weight:900; color:#6b7280; letter-spacing:0.2em; text-transform:uppercase; margin-bottom:4px; }
.ds-val { font-family:'Barlow Condensed',sans-serif; font-size:30px; font-weight:900; line-height:1; }
.dash-link {
  display:flex; align-items:center; gap:12px;
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  border-radius:14px; padding:14px 16px; margin-bottom:8px; cursor:pointer;
  color:#fff; font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:900;
  text-transform:uppercase; letter-spacing:0.05em; transition:background 0.12s;
  -webkit-tap-highlight-color:transparent;
}
.dash-link:active { background:rgba(255,255,255,0.09); }
.dl-ico { font-size:24px; flex-shrink:0; }
.dl-arr { margin-left:auto; color:rgba(255,255,255,0.25); font-size:20px; }

/* ── TAREAS ───────────────────────────────────────── */
.task-hero {
  background: linear-gradient(115deg, #14532d 0%, #15803d 50%, #84cc16 100%);
  border-radius: 20px; padding: 18px 20px; margin-bottom: 10px;
  position: relative; overflow: hidden;
}
.task-hero::before { content:''; position:absolute; inset:0; background:linear-gradient(115deg, rgba(5,7,14,0.58) 0%, rgba(5,7,14,0.34) 45%, rgba(5,7,14,0.58) 100%); }
.task-hero > * { position: relative; z-index: 1; }
.task-card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:14px; margin-bottom:8px; }
.task-card.tdone { opacity:0.45; }
.task-card.tnotdone { opacity:0.45; }
.task-card.twait { opacity:0.8; border-color:rgba(234,179,8,0.3); }
.task-t { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:900; text-transform:uppercase; }
.task-t.tdt { text-decoration:line-through; }
.task-d { font-size:12px; color:rgba(255,255,255,0.55); margin-top:4px; line-height:1.5; }
.task-btns { display:flex; gap:6px; margin-top:10px; }
.btn-dg {
  flex:1; border:none; border-radius:10px; padding:9px; cursor:pointer;
  font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:12px;
  letter-spacing:0.1em; text-transform:uppercase;
}
.btn-dg.off { background:rgba(34,197,94,0.15); color:#39ff7a; border:2px solid rgba(34,197,94,0.25); }
.btn-dg.on  { background:#22c55e; color:#06170c; border:2px solid #22c55e; }
.btn-dg.wait{ background:rgba(234,179,8,0.18); color:#fbbf24; border:2px solid rgba(234,179,8,0.35); }
/* Variante cuadrada (icono) de marcar-como-hecha/editar/eliminar: mismo ancho y alto fijos (38px)
   para que las tres convivan en la línea del enlace/adjunto, alineadas y del mismo tamaño. */
.btn-dg.sq, .btn-dt.sq { flex:none; flex-shrink:0; width:38px; height:38px; padding:0; font-size:14px; font-weight:900; text-transform:none; letter-spacing:0; display:flex; align-items:center; justify-content:center; }
.btn-dt { background:rgba(239,68,68,0.1); border:2px solid rgba(239,68,68,0.2); color:#ff5c7a; border-radius:10px; padding:9px 12px; cursor:pointer; font-size:14px; flex-shrink:0; }
.btn-dt.on { background:#ef4444; color:#06170c; border:2px solid #ef4444; }
.add-task-box { background:rgba(34,229,255,0.07); border:1px solid rgba(34,229,255,0.2); border-radius:16px; padding:16px; margin-top:12px; }
.fsm { width:100%; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:9px 12px; color:#fff; font-family:'Barlow',sans-serif; font-size:13px; box-sizing:border-box; margin-bottom:8px; outline:none; }
.fsm::placeholder { color:rgba(255,255,255,0.4); font-family:'Barlow',sans-serif; font-size:13px; }
.fsm:focus { border-color:rgba(34,229,255,0.5); }
textarea.fsm { resize:none; height:64px; }
#t-due::-webkit-calendar-picker-indicator, #t-time::-webkit-calendar-picker-indicator { filter:invert(1); cursor:pointer; }
#t-due::-webkit-datetime-edit, #t-time::-webkit-datetime-edit { color:transparent; }
#t-due.dt-has-value::-webkit-datetime-edit, #t-time.dt-has-value::-webkit-datetime-edit { color:#fff; }
.dt-ph { position:absolute; left:12px; bottom:0; height:38px; display:flex; align-items:center; color:rgba(255,255,255,0.4); font-family:'Barlow',sans-serif; font-size:13px; pointer-events:none; }


/* ── PUNTOS ───────────────────────────────────────── */
.pts-hero {
  background: linear-gradient(115deg, #9d174d 0%, #b06bff 50%, #22e5ff 100%);
  border-radius:20px; padding:20px; margin-bottom:10px;
  position: relative; overflow: hidden;
}
.pts-hero::before { content:''; position:absolute; inset:0; background:linear-gradient(115deg, rgba(5,7,14,0.58) 0%, rgba(5,7,14,0.34) 45%, rgba(5,7,14,0.58) 100%); }
.pts-hero > * { position: relative; z-index: 1; }
.pts-row { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:14px; margin-bottom:8px; }
.vr-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.vr-lbl { font-size:9px; font-weight:900; color:#6b7280; letter-spacing:0.15em; text-transform:uppercase; width:74px; flex-shrink:0; }
.vr-bg  { flex:1; height:7px; background:rgba(0,0,0,0.4); border-radius:10px; overflow:hidden; }
.vr-fill{ height:100%; border-radius:10px; transition:width 0.7s ease; }
.vr-num { font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:900; width:30px; text-align:right; flex-shrink:0; }
.vr-inp { background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:3px 8px; color:#fff; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:900; width:54px; text-align:center; }

/* ── COTIZADOR ────────────────────────────────────── */
.cotiz-blk { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:16px; margin-bottom:10px; }
.cotiz-l { font-size:8px; font-weight:900; color:#6b7280; letter-spacing:0.2em; text-transform:uppercase; margin-bottom:10px; }
.pills { display:flex; flex-wrap:wrap; gap:6px; }
.pill { border:2px solid rgba(255,255,255,0.12); border-radius:12px; padding:8px 14px; cursor:pointer; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:900; text-transform:uppercase; color:rgba(255,255,255,0.5); transition:all 0.15s; -webkit-tap-highlight-color:transparent; }
.pill.psel { border-color:#22e5ff; color:#7dd3ff; background:rgba(34,229,255,0.12); box-shadow:0 0 14px -3px #22e5ff; }
.cotiz-res { background:linear-gradient(135deg,rgba(34,229,255,0.15),rgba(139,92,246,0.1)); border:1px solid rgba(34,229,255,0.3); border-radius:20px; padding:24px; text-align:center; margin-top:12px; }
.price-big { font-family:'Barlow Condensed',sans-serif; font-size:52px; font-weight:900; color:#7dd3ff; line-height:1; }
.price-lbl { font-size:10px; color:rgba(220,200,255,0.6); font-weight:700; letter-spacing:0.2em; text-transform:uppercase; margin-top:4px; }
.price-det { font-size:12px; color:rgba(255,255,255,0.5); margin-top:12px; line-height:1.8; }

/* ── RANKING / NUMEROS PAGE ────────────────────────── */
.pub-wrap { width:100%; max-width:480px; margin:12px auto; border-radius:24px; overflow:hidden; box-shadow:0 24px 80px rgba(0,0,0,0.7); }
.pub-hdr  { padding:18px 18px 14px; position:relative; overflow:hidden; }
.pub-hdr::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(255,255,255,0.025) 20px,rgba(255,255,255,0.025) 40px); }
.pub-list { padding:10px 12px 20px; display:flex; flex-direction:column; gap:8px; }

/* ── MISC ─────────────────────────────────────────── */
.sec-lbl { font-size:9px; font-weight:900; color:#6b7280; letter-spacing:0.2em; text-transform:uppercase; margin-bottom:8px; }
.btn-sm {
  border:none; border-radius:10px; padding:9px 16px; cursor:pointer;
  font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:12px;
  letter-spacing:0.1em; text-transform:uppercase;
}
.btn-primary { background:linear-gradient(135deg,#7c3aed,#22e5ff); color:#0a0b16; font-weight:900; box-shadow:0 0 18px -4px #22e5ff; }
.btn-primary:active { filter:brightness(0.9); }

/* ════════════════════════════════════════════════════════
   NEON GAMER · EDUCATIVO — paleta de luces y resplandores
   ════════════════════════════════════════════════════════ */
#app {
  --nc-cyan:#22e5ff; --nc-pink:#ff5cc8; --nc-purple:#b06bff;
  --nc-lime:#baff29; --nc-amber:#ffd23f; --nc-blue:#4fa8ff; --nc-orange:#ff8a3d;
  position: relative;
}
/* rejilla "arcade" sutil de fondo, no compite con el contenido */
#app::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.05;
  background-image:
    linear-gradient(rgba(34,229,255,0.6) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,229,255,0.6) 1px, transparent 1px);
  background-size: 40px 40px;
  -webkit-mask-image: radial-gradient(ellipse at top, #000 30%, transparent 75%);
  mask-image: radial-gradient(ellipse at top, #000 30%, transparent 75%);
}
#app > .vw { position: relative; z-index: 1; }

/* halos de color variado en las cabeceras de cada sección */
.dash-hero { box-shadow: 0 0 0 1px rgba(176,107,255,0.4) inset, 0 14px 44px -14px rgba(34,229,255,0.55); }
.task-hero { box-shadow: 0 0 0 1px rgba(132,204,22,0.35) inset, 0 14px 44px -14px rgba(57,255,122,0.5); }
.pts-hero  { box-shadow: 0 0 0 1px rgba(176,107,255,0.35) inset, 0 14px 44px -14px rgba(255,92,200,0.5); }
#ranking-card { box-shadow: 0 0 0 1px rgba(255,210,63,0.35) inset, 0 14px 44px -14px rgba(255,92,200,0.55) !important; }
#numbers-card { box-shadow: 0 0 0 1px rgba(34,229,255,0.35) inset, 0 14px 44px -14px rgba(176,107,255,0.55) !important; }

/* tarjetas con borde neón sutil y reacción al toque */
.dash-stat, .pts-row, .task-card, .cotiz-blk, .add-task-box {
  transition: box-shadow 0.18s ease, transform 0.12s ease, border-color 0.18s ease;
}
.dash-stat:active, .pts-row:active, .task-card:active { transform: scale(0.985); }
.dash-link:active { box-shadow: 0 0 24px -4px var(--nc-cyan); }
.btn-sm:active     { box-shadow: 0 0 20px -4px var(--nc-purple); }
.btn-dg.off { box-shadow: 0 0 0 1px rgba(186,255,41,0.16) inset; }
.btn-dg.on  { box-shadow: 0 0 18px -3px var(--nc-lime); }
.btn-dt:active { box-shadow: 0 0 18px -3px #ff5c5c; }
.btn-dt.on { box-shadow: 0 0 18px -3px #ff5c5c; }
.pill.psel { box-shadow: 0 0 16px -3px var(--nc-blue); }

/* números y títulos clave con resplandor tipo arcade (sutil, sin perder lectura) */
.ds-val, .price-big { text-shadow: 0 0 16px currentColor; }
.task-t { text-shadow: 0 0 8px rgba(255,255,255,0.15); }
[id^="pts-total-"] { text-shadow: 0 0 14px currentColor; }

/* barras de progreso con brillo de su propio color */
.vr-fill { box-shadow: 0 0 10px -1px currentColor; }

/* nav inferior — cada pestaña activa brilla con un color neón distinto (variedad) */
.nav-btn.active { text-shadow: 0 0 10px currentColor; }
.nav-btn:nth-child(1).active { color: var(--nc-blue); }
.nav-btn:nth-child(2).active { color: var(--nc-lime); }
.nav-btn:nth-child(3).active { color: var(--nc-amber); }
.nav-btn:nth-child(4).active { color: var(--nc-pink); }
.nav-btn:nth-child(5).active { color: var(--nc-purple); }

/* barra de historial */
#hist-home { text-shadow: 0 0 8px currentColor; }

/* ── TABLERO — celdas tipo "arcade" con brillo neón ── */
#app #num-grid { gap: 6px; }
#app .num-btn {
  background: linear-gradient(160deg, rgba(34,229,255,0.07), rgba(176,107,255,0.05));
  border: 2px solid rgba(34,229,255,0.16);
  color: rgba(255,255,255,0.65);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.25) inset;
}
#app .num-btn:active { box-shadow: 0 0 16px -2px var(--nc-cyan); border-color: var(--nc-cyan); }
#app .num-btn.taken {
  background: linear-gradient(160deg,#9d174d,#581c2e);
  border-color: rgba(255,92,200,0.35);
  box-shadow: 0 0 10px -2px rgba(255,92,200,0.5);
}
#app .num-btn.mine {
  background: linear-gradient(160deg,#0d9488,#39ff7a);
  color: #06281f; border-color: rgba(57,255,122,0.7);
  box-shadow: 0 0 22px -3px var(--nc-lime), 0 0 0 2px rgba(57,255,122,0.3);
  text-shadow: none;
}
#app .num-emoji { box-shadow: 0 0 8px -1px var(--nc-cyan); }
#app .board-title { text-shadow: 0 0 12px rgba(34,229,255,0.5); letter-spacing: 0.02em; }
#app .taken-box { background: rgba(34,229,255,0.06); border-color: rgba(34,229,255,0.18); }
#app .taken-count { color: var(--nc-amber); text-shadow: 0 0 14px currentColor; }
#app #status-badge.status-wait,
#app #status-badge.status-closed {
  font-size: 13px;
  padding: 6px 14px;
  background: rgba(251,146,60,0.18);
  border-color: rgba(251,146,60,0.45);
  color: #fb923c;
  text-shadow: 0 0 10px rgba(251,146,60,0.5);
  letter-spacing: 0.06em;
}
#app #board-overlay {
  background: rgba(15,17,38,0.96);
  border: 1px solid rgba(176,107,255,0.35);
  box-shadow: 0 0 50px -10px rgba(34,229,255,0.35) inset;
}
#app .overlay-title { text-shadow: 0 0 12px var(--nc-purple); }
#app .clock-box, #app .overlay-start { background: rgba(34,229,255,0.07); border: 1px solid rgba(34,229,255,0.2); border-radius: 12px; }

/* ── ENCABEZADO (#header) — base oscura "consola arcade" con borde y resplandor neón cian/morado (deja resaltar los acentos de cada elemento) ── */
#app #header {
  position: relative;
  overflow: hidden;
  margin: 12px 12px 10px;
  border-radius: 20px;
  padding: 16px 18px;
  background: linear-gradient(115deg, #7a1f1f 0%, #a8501a 55%, #b8861f 100%);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.05) inset,
    0 0 30px -10px rgba(255,138,61,0.45),
    0 16px 40px -18px rgba(0,0,0,0.6);
}
#app #header::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(115deg, rgba(5,7,14,0.66) 0%, rgba(5,7,14,0.40) 45%, rgba(5,7,14,0.62) 100%);
  pointer-events: none;
}
#app #header::after {
  content: '';
  position: absolute; left: 14px; right: 14px; bottom: 6px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35) 50%, transparent);
  filter: blur(0.3px);
  pointer-events: none;
}
#app #header > * { position: relative; z-index: 1; }
#app #header .admin-row { margin-top: 12px; }
#app #header .header-title { text-shadow: 0 0 14px rgba(57,255,122,0.55); }

/* ── PESTAÑAS (Tablero/Ranking) y RANKING DE TURNOS — arcade neón ── */
.tabs { display:flex; gap:6px; padding:6px; margin:10px 12px 10px; }
.tabs .tab-btn { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:900; letter-spacing:0.12em; text-transform:uppercase; padding:9px 4px; border-radius:10px; cursor:pointer; text-align:center; }
#app .tab-btn {
  background: linear-gradient(160deg, rgba(34,229,255,0.06), rgba(176,107,255,0.04));
  border: 2px solid rgba(34,229,255,0.18);
  color: rgba(255,255,255,0.55);
  transition: all 0.25s;
}

/* ── BOTONES ADMIN (CONFIG / REPORTE / RESET) — set "gamer" neón cohesivo ── */
#app .btn-admin { text-shadow: 0 0 8px currentColor; letter-spacing: 0.16em; }
#app .btn-neon-cfg {
  background: linear-gradient(135deg, rgba(34,229,255,0.16), rgba(57,255,122,0.10));

.bingo-create-btn{display:block;margin:14px auto 0;background:linear-gradient(135deg,#db2777,#7c3aed);color:#fff;font-weight:900;border:none;border-radius:14px;padding:14px 22px;font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 22px -4px #db2777}
/* Tarjeta de entrada como invitado al Bingo */
.bingo-guest-card{background:rgba(255,255,255,0.04);border:1px solid rgba(168,85,247,0.3);border-radius:18px;padding:22px 18px;margin:8px 0;font-family:'Barlow Condensed',sans-serif}
.bgc-title{font-size:20px;font-weight:900;color:#e2e8f0;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
.bgc-sub{font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:18px}
.bgc-name-row{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.bgc-name-input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:10px 14px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;outline:none}
.bgc-icon-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.bgc-icon-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;font-size:20px;width:38px;height:38px;cursor:pointer;transition:background .1s,border-color .1s}
.bgc-icon-btn.sel{background:rgba(168,85,247,0.3);border-color:#a855f7}
.bgc-color-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.bgc-color-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .1s,transform .1s}
.bgc-color-dot.sel{border-color:#fff;transform:scale(1.2)}
.bgc-enter-btn{width:100%;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;font-weight:900;border:none;border-radius:12px;padding:13px;font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer}
.bingo-host-badge{font-size:10px;color:#facc15;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;background:rgba(250,204,21,0.1);border:1px solid rgba(250,204,21,0.3);border-radius:20px;padding:4px 10px;display:inline-block}
.bingo-players-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.bingo-player-chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.05);border:1px solid rgba(132,204,22,0.25);border-radius:20px;padding:4px 10px 4px 4px;font-size:11px;font-weight:700;color:rgba(255,255,255,0.8)}
.bingo-player-chip .bpc-ico{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;overflow:hidden}
.bingo-player-chip .bpc-info{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.bingo-player-chip .bpc-name{font-size:11px;font-weight:700;white-space:nowrap}
.bingo-player-chip .bpc-status{font-size:9px;color:rgba(255,255,255,0.45);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.bingo-player-chip.bpc-bot{opacity:0.7;border-color:rgba(255,255,255,0.1)}
.bingo-status-input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:#e2e8f0;font-size:12px;padding:8px 12px;margin-top:7px;box-sizing:border-box;outline:none;font-family:inherit}
.bingo-status-input::placeholder{color:rgba(255,255,255,0.28)}
.bingo-status-input:focus{border-color:rgba(168,85,247,0.5);background:rgba(168,85,247,0.06)}
.bingo-start-btn{width:100%;background:linear-gradient(135deg,#84cc16,#16a34a);color:#06170c;font-weight:900;border:none;border-radius:16px;padding:22px;font-family:'Barlow Condensed',sans-serif;font-size:24px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;margin-top:10px;box-shadow:0 0 32px -4px #84cc16,0 4px 24px rgba(0,0,0,0.4)}
.bingo-end-btn{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.35);color:#f87171;border-radius:10px;padding:7px 13px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;flex-shrink:0}
.bingo-join-btn{width:100%;background:rgba(34,211,238,0.12);border:1px solid rgba(34,211,238,0.4);color:#67e8f9;border-radius:16px;padding:22px;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;margin-top:8px;box-shadow:0 0 28px -6px #22d3ee}
.bingo-full-btn{font-size:10px;color:rgba(255,255,255,0.55);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:20px;padding:5px 11px;cursor:pointer;flex-shrink:0}
/* Lobby redesign cards */
.blc-speed{display:grid;grid-template-columns:1fr 1fr;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,0.12);margin:10px 0 12px}
.blc-spd-btn{background:transparent;border:none;border-right:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.32);font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;padding:22px 10px;cursor:pointer;transition:background .2s,color .2s}
.blc-spd-btn:last-child{border-right:none}
.blc-spd-btn.on{background:rgba(168,85,247,0.18);color:#c084fc;text-shadow:0 0 22px rgba(192,132,252,0.7)}
.blc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px}
.blc-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
.blc-clickable{cursor:pointer;transition:border-color .2s,background .2s}
.blc-clickable:hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.2)}
.blc-card.active{border-color:rgba(74,222,128,0.6);background:rgba(74,222,128,0.07)}
.blc-clabel{font-size:10px;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.blc-cval{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:#fff;line-height:1.1}
.blc-cico{font-size:32px;line-height:1}
.blc-stepper{display:flex;align-items:center;gap:16px;margin-top:4px}
.blc-sbtn{background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.16);border-radius:50%;width:40px;height:40px;color:#fff;font-size:26px;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;line-height:1;padding:0;font-family:'Barlow Condensed',sans-serif}
.blc-sbtn:hover{background:rgba(255,255,255,0.18)}
.blc-sbtn:disabled{opacity:0.2;cursor:default}
.blc-snum{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:900;color:#fff;min-width:32px;text-align:center;line-height:1}
.blc-diff-row{display:flex;gap:7px;margin:0 0 10px}
.blc-diff-btn{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:14px;color:rgba(255,255,255,0.35);font-family:'Barlow Condensed',sans-serif;font-weight:700;padding:13px 4px;cursor:pointer;text-align:center;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:4px}
.blc-diff-btn.on{border-color:rgba(250,204,21,0.7);background:rgba(250,204,21,0.12);color:#facc15}
.blc-diff-ico{font-size:20px;line-height:1}
.blc-diff-lbl{font-size:11px;line-height:1}
.blc-botlvl{display:flex;gap:7px;margin-top:6px}
.blc-botlvl-btn{padding:9px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.35);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s}
.blc-botlvl-btn.on{border-color:rgba(168,85,247,0.7);background:rgba(168,85,247,0.15);color:#c084fc}
/* Caja consolidada de sorteo — calco 1:1 de neon-bingo_31.html (bg-gray-900 border-cyan-500/50 rounded-2xl p-6 gl-cyan-15) */
.bingo-head-box{background:#111827;border:1px solid rgba(6,182,212,0.5);border-radius:16px;padding:24px;box-shadow:0 0 25px rgba(6,182,212,0.15)}
.bdh-row{display:flex;flex-direction:column;align-items:stretch;gap:20px}
@media(min-width:1024px){.bdh-row{flex-direction:row}}
.bdh-ballbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#030712;border-radius:16px;border:2px solid #ec4899;box-shadow:0 0 30px -2px rgba(236,72,153,0.5);padding:20px 24px;text-align:center}
.bdh-label{color:#6b7280;font-size:10px;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px}
.bdh-num{color:#fff;font-size:36px;font-weight:900;letter-spacing:0.025em;white-space:nowrap;font-family:ui-monospace,Menlo,monospace}
.bdh-num .bdh-letter{color:#22d3ee}
@media(min-width:768px){.bdh-num{font-size:48px}}
.bdh-calc-row{display:flex;align-items:center;gap:8px;margin-top:8px;justify-content:center;flex-wrap:wrap}
.bdh-calc-input{width:96px;background:#111827;border:2px solid #374151;border-radius:12px;padding:10px;text-align:center;font-size:22px;font-weight:900;color:#fff;font-family:ui-monospace,Menlo,monospace}
.bdh-calc-input::-webkit-outer-spin-button,.bdh-calc-input::-webkit-inner-spin-button,.bcc-input::-webkit-outer-spin-button,.bcc-input::-webkit-inner-spin-button,#bingo-power-num-input::-webkit-outer-spin-button,#bingo-power-num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.bdh-calc-input,.bcc-input,#bingo-power-num-input{-moz-appearance:textfield}
.bdh-calc-input.ok{border-color:#a3e635;color:#bef264}
.bdh-calc-input.bad{border-color:#ef4444;color:#f87171}
.bdh-calc-btn{background:linear-gradient(to right,#06b6d4,#2563eb);color:#fff;font-weight:900;border:none;border-radius:10px;padding:10px 16px;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer}
.bdh-side{display:flex;flex-direction:column;gap:12px}
@media(min-width:1024px){.bdh-side{width:288px}}
.bdh-stats{display:flex;gap:12px}
.bdh-stat{flex:1;background:#030712;border:1px solid #1f2937;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;box-shadow:inset 0 2px 4px rgba(0,0,0,0.3)}
.bdh-stat-lbl{font-size:9px;color:#6b7280;text-transform:uppercase;font-weight:900;letter-spacing:0.1em}
.bdh-stat-val{font-family:ui-monospace,Menlo,monospace;font-weight:900;font-size:14px}
.bdh-stat-val.cyan{color:#22d3ee}
.bdh-stat-val.yellow{color:#facc15}
.bdh-bar{width:100%;background:#030712;border:1px solid #1f2937;border-radius:9999px;height:10px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,0.3)}
.bdh-bar-fill{height:100%;transition:width 1s linear}
.bdh-bar-fill.grad{background:linear-gradient(to right,#facc15,#ec4899)}
.bdh-bar-fill.pink{background:#ec4899}
.bdh-bar-fill.yellow{background:#facc15}
.bdh-bar-foot{display:flex;justify-content:space-between;font-size:9px;color:#4b5563;font-weight:700;text-transform:uppercase;letter-spacing:0.1em}
.bdh-bar-foot .on.pink{color:#ec4899}
.bdh-bar-foot .on.yellow{color:#eab308}
/* ── Bingo 3-col layout ── */
.bdh-three{display:grid;grid-template-columns:200px 1fr 220px;gap:14px;align-items:start}
@media(max-width:1023px){.bdh-three{grid-template-columns:1fr}}
.bdh-center{display:flex;flex-direction:column;gap:12px}
/* Players leaderboard (left col) */
.bdh-players-title{font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;margin-bottom:6px}
.bdh-player-row{background:#0a0e1a;border:1px solid #1f2937;border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .2s;margin-bottom:5px;font-family:'Barlow Condensed',sans-serif}
.bdh-player-row:hover{border-color:#374151}
.bdh-player-row.active{border-color:#a855f7;box-shadow:0 0 10px -2px rgba(168,85,247,0.3)}
.bdh-player-head{display:flex;align-items:center;gap:7px;padding:7px 10px}
.bdh-player-rank{font-size:9px;font-weight:900;color:#6b7280;width:18px;text-align:center;flex-shrink:0}
.bdh-player-name{flex:1;font-size:11px;font-weight:700;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdh-player-pct-lbl{font-size:9px;color:#a855f7;font-weight:700;flex-shrink:0}
.bdh-player-prog{width:calc(100% - 20px);height:3px;background:#1f2937;border-radius:9999px;overflow:hidden;margin:0 10px 6px}
.bdh-player-prog-fill{height:100%;background:linear-gradient(to right,#a855f7,#ec4899);border-radius:9999px}
/* Expanded card (mini horizontal) */
.bdh-card-expand{border-top:1px solid #1f2937;padding:7px 10px;overflow-x:auto}
.bdh-card-expand-title{font-size:9px;color:#6b7280;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px}
.bdh-card-grid{display:inline-flex;flex-direction:column;gap:2px}
.bdh-card-col-row{display:flex;align-items:center;gap:2px}
.bdh-col-letter{width:14px;font-size:8px;font-weight:900;text-align:center;flex-shrink:0}
.bdh-col-letter.B{color:#22d3ee}.bdh-col-letter.I{color:#a855f7}.bdh-col-letter.N{color:#f472b6}.bdh-col-letter.G{color:#34d399}.bdh-col-letter.O{color:#fb923c}
.bdh-cell-mini{width:24px;height:17px;border-radius:3px;border:1px solid #1f2937;display:flex;align-items:center;justify-content:center;font-size:6.5px;font-weight:700;font-family:ui-monospace,monospace;flex-shrink:0;color:#4b5563}
.bdh-cell-mini.marked{background:linear-gradient(135deg,#16a34a,#15803d);border-color:#22c55e;color:#dcfce7}
.bdh-cell-mini.drawn{background:#1f2937;border-color:#374151;color:#d1d5db}
.bdh-cell-mini.free{background:#1f2937;border-color:#4b5563;color:#9ca3af}
.bdh-cell-mini.frozen{background:linear-gradient(135deg,#0369a1,#0c4a6e);border-color:#38bdf8;color:#bae6fd}
/* ── Barra de navegación de jugadores (encima de la sección de cartones) ── */
.bingo-player-nav{display:flex;align-items:center;gap:7px;overflow-x:auto;padding:2px 0 62px;scrollbar-width:none;margin-top:18px}
.bingo-player-nav::-webkit-scrollbar{display:none}
/* Pill = contenedor invisible; .bpn-main = la etiqueta visual */
.bpn-pill{flex-shrink:0;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#6b7280;transition:color .15s;position:relative}
.bpn-main{display:flex;align-items:center;gap:6px;white-space:nowrap;background:#0a0e1a;border:1px solid #1f2937;border-radius:20px;padding:6px 16px;transition:background .15s,border-color .15s,box-shadow .15s}
.bpn-pill:hover{color:#d1d5db}
.bpn-pill:hover .bpn-main{border-color:#374151}
.bpn-pill.active{color:#e2e8f0}
.bpn-pill.active .bpn-main{background:linear-gradient(135deg,#1e1b4b,#0a0e1a);border-color:#a855f7;box-shadow:0 0 10px -3px rgba(168,85,247,0.4)}
.bpn-rank{font-size:11px;color:#6b7280;font-weight:900}
.bpn-pill.active .bpn-rank{color:#c084fc}
.bpn-pct{font-size:12px;color:#a855f7;font-weight:900}
.bpn-pill.active .bpn-pct{color:#e879f9}
/* ── BURBUJAS DE ESTADO ── position:absolute para no romper alineación flex ── */
.bpn-status-bubble{position:absolute;top:calc(100% + 17px);left:0;font-size:13px;font-family:'Barlow Condensed',sans-serif;font-weight:700;color:rgba(255,255,255,0.9);text-align:center;z-index:2;overflow:visible;padding:5px 13px}
.bpn-bubble-text{display:block;white-space:nowrap;max-width:155px;overflow:hidden;text-overflow:ellipsis}
/* RECTÁNGULO con cola triangular (bocadillo clásico) */
.bpn-bubble-rect{background:rgba(255,255,255,0.11);border:1px solid rgba(255,255,255,0.22);border-radius:10px}
.bpn-bubble-rect::before{content:'';position:absolute;bottom:100%;left:12px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:11px solid rgba(255,255,255,0.22)}
.bpn-bubble-rect::after{content:'';position:absolute;bottom:calc(100% - 1px);left:13px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:10px solid rgba(255,255,255,0.11)}
/* NUBE ESPONJOSA: blob orgánico + circulitos de pensamiento */
.bpn-bubble-cloud{background:rgba(255,255,255,0.11);border:1px solid rgba(255,255,255,0.22);border-radius:30% 70% 60% 40%/55% 45% 65% 50%}
.bpn-bubble-cloud::before{content:'';position:absolute;bottom:calc(100% + 3px);left:12px;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.13);border:1px solid rgba(255,255,255,0.28)}
.bpn-bubble-cloud::after{content:'';position:absolute;bottom:calc(100% + 15px);left:16px;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.13);border:1px solid rgba(255,255,255,0.28)}
/* ── Variante activa (mi pill) ── */
.bpn-pill.active .bpn-bubble-rect,.bpn-pill.active .bpn-bubble-cloud{background:rgba(168,85,247,0.18);border-color:rgba(168,85,247,0.5);color:#e9d5ff}
.bpn-pill.active .bpn-bubble-cloud::before,.bpn-pill.active .bpn-bubble-cloud::after{background:rgba(168,85,247,0.25);border-color:rgba(168,85,247,0.55)}
.bpn-pill.active .bpn-bubble-rect::before{border-bottom-color:rgba(168,85,247,0.5)}
.bpn-pill.active .bpn-bubble-rect::after{border-bottom-color:rgba(168,85,247,0.18)}
/* ── Selector de forma (en fila de estado) ── */
.bsr-shapes{display:flex;gap:5px;flex-shrink:0;align-items:center}
.bsr-shape{width:26px;height:26px;border:none;cursor:pointer;padding:0;opacity:0.38;transition:opacity .15s,filter .15s;flex-shrink:0;background:rgba(255,255,255,0.2)}
.bsr-shape:hover{opacity:0.7}
.bsr-shape.bsr-active{opacity:1;filter:drop-shadow(0 0 3px rgba(168,85,247,1))}
.bsr-shape-cloud{border-radius:30% 70% 60% 40%/55% 45% 65% 50%}
.bsr-shape-rect{border-radius:3px}
/* Botón toggle emoji */
.bep-toggle{font-size:17px;background:none;border:none;cursor:pointer;padding:0 2px;opacity:0.38;transition:opacity .15s;flex-shrink:0;line-height:1}
.bep-toggle:hover,.bep-toggle.active{opacity:1}
/* Strip de emojis con scroll propio */
.bep-strip{display:flex;overflow-x:hidden;flex:0 0 190px;align-items:center;gap:0;scroll-behavior:smooth}
.bep-btn{font-size:19px;background:none;border:none;cursor:pointer;padding:1px 2px;border-radius:4px;line-height:1;transition:background .1s;flex-shrink:0}
.bep-btn:hover{background:rgba(255,255,255,0.12)}
/* Botones circulares de navegación ◀ ▶ */
.bep-nav-btn{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;cursor:pointer;color:#e2e8f0;font-size:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s;padding:0}
.bep-nav-btn:hover{background:rgba(255,255,255,0.32)}
.bpn-bot{opacity:0.65}
/* Fila de estado editable en la partida */
.bingo-status-row{display:flex;align-items:center;gap:7px;margin:4px 0 10px;padding:2px 0}
.bsr-ico{font-size:13px;flex-shrink:0;opacity:0.6}
.bingo-status-input.bsr-inline{margin-top:0;width:110px;flex-shrink:0;font-size:11px;padding:5px 10px;height:auto;box-sizing:border-box}
.bingo-card-hdr.shielded{background:#fff;color:#111;border-radius:4px;font-weight:900}
.bingo-card-hdr.fortifiable{color:#4ade80;cursor:pointer;text-shadow:0 0 6px rgba(74,222,128,0.7);animation:twPulse 1.5s ease-in-out infinite}
.bingo-card-hdr.fortifiable:hover{background:rgba(74,222,128,0.15);border-radius:4px}
.bcb-camufle{border:1px dashed rgba(148,163,184,0.3);border-radius:14px;overflow:hidden}

.bdl-rank{font-size:10px;color:rgba(255,255,255,0.3);font-weight:900;text-align:right}

.bdl-time{font-size:12px;color:#facc15;font-weight:900;text-align:right}

.bpx-revenge-btn{background:linear-gradient(135deg,#b45309,#ea580c);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0}
.bpx-revenge-active{background:linear-gradient(135deg,rgba(234,179,8,0.25),rgba(239,68,68,0.15));border:1px solid rgba(234,179,8,0.6);border-radius:10px;padding:8px 14px;margin-bottom:8px;font-size:12px;font-weight:700;color:#fde68a;display:flex;align-items:center;flex-wrap:wrap;gap:6px;animation:twPulse 1.2s ease-in-out infinite}
.bpx-cat-lbl{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:0.08em;color:rgba(255,255,255,0.35);margin:10px 0 5px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06)}
.bpx-cat-lbl:first-child{margin-top:4px;padding-top:0;border-top:none}
.bpx-col-picker{margin-top:6px}
.bpx-col-card-lbl{font-size:10px;color:rgba(255,255,255,0.35);margin:6px 0 3px;text-transform:uppercase;letter-spacing:0.06em}
.bpx-col-row{display:flex;gap:6px}
.bpx-col-btn{width:36px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:#4b5563;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:900;cursor:not-allowed;transition:all .15s}
.bpx-col-btn.eligible{border-color:rgba(74,222,128,0.45);color:#4ade80;cursor:pointer;background:rgba(74,222,128,0.07)}
.bpx-col-btn.eligible:hover{background:rgba(74,222,128,0.18);border-color:#4ade80}
.bpx-col-btn.shielded{border-color:rgba(168,85,247,0.4);color:#a855f7;background:rgba(168,85,247,0.08);cursor:not-allowed}
.bpn-pill.locked{opacity:0.55;color:#4b5563;cursor:pointer}
.bpn-pill.locked .bpn-main{border-color:rgba(168,85,247,0.15)}
.bpn-pill.locked:hover{color:#7c3aed}
.bpn-pill.locked:hover .bpn-main{border-color:rgba(168,85,247,0.35)}
.bpn-pill.locked .bpn-pct{color:#4b5563}
.bpn-pill.power-target-pill{color:#93c5fd;cursor:crosshair}
.bpn-pill.power-target-pill .bpn-main{border-color:rgba(96,165,250,0.5);animation:twPulse 1.2s ease-in-out infinite}
.bpn-pill.power-target-pill:hover{color:#bfdbfe}
.bpn-pill.power-target-pill:hover .bpn-main{background:rgba(96,165,250,0.12);border-color:#60a5fa}
/* Historial de sorteo — pills tipo chip (rounded-lg px-3 py-1.5 font-mono font-bold text-sm border) */
.bingo-hist-wrap{margin-top:20px;padding-top:20px;border-top:1px solid #1f2937}
.bingo-hist-lbl{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;margin-bottom:12px}
.bingo-hist-row{display:flex;align-items:center;gap:8px}
.bingo-hist-arrow{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:#1f2937;border:1px solid #374151;color:#d1d5db;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bingo-drawn-strip{display:flex;gap:8px;overflow-x:auto;flex:1;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bingo-drawn-strip::-webkit-scrollbar{display:none}
.bingo-drawn-chip{flex-shrink:0;white-space:nowrap;padding:6px 12px;border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:14px;border:1px solid;background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:#f87171}
.bingo-drawn-chip.current{background:rgba(236,72,153,0.2);border-color:rgba(236,72,153,0.5);color:#f9a8d4}
.bingo-drawn-chip.marked-ok{background:rgba(132,204,22,0.2);border-color:rgba(132,204,22,0.5);color:#bef264}
.bingo-card{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 10px}
@media(min-width:768px){.bingo-card{gap:8px}}
.bingo-card-hdr{text-align:center;font-size:20px;font-weight:900;color:#fff;background:#030712;border-radius:4px;padding:8px 0;border-bottom:2px solid #84cc16;box-shadow:inset 0 2px 4px rgba(0,0,0,0.3)}
.bingo-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:8px;font-weight:700;font-size:16px;transition:all .2s;box-shadow:0 4px 6px rgba(0,0,0,0.3);background:#1f2937;color:#d1d5db;border:1px solid #374151;cursor:pointer}

.bingo-cell.free{cursor:default}
@keyframes twPulse{0%,100%{opacity:1}50%{opacity:.5}}
.bingo-claims-row{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.bingo-claim-btn{flex:1;min-width:70px;border-radius:10px;padding:10px 4px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:10px;letter-spacing:0.02em;text-transform:uppercase;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.12)}
.bingo-claim-btn.tier-terna{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a0f00;border-color:transparent;box-shadow:0 0 18px -4px #f59e0b}
.bingo-claim-btn.tier-cuaterna{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a0f00;border-color:transparent;box-shadow:0 0 18px -4px #f59e0b}
.bingo-claim-btn.tier-quina{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a0f00;border-color:transparent;box-shadow:0 0 18px -4px #f59e0b}
.bingo-claim-btn.tier-bingo{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a0f00;border-color:transparent;box-shadow:0 0 18px -4px #f59e0b}
.bingo-claim-btn.won{background:rgba(74,222,128,0.18)!important;border-color:rgba(74,222,128,0.5)!important;color:#4ade80!important;box-shadow:none!important}
.bingo-claim-btn.failed{background:rgba(248,113,113,0.1)!important;border-color:rgba(248,113,113,0.3)!important;color:#f87171!important;opacity:0.6;box-shadow:none!important}
.bingo-claim-btn:disabled{cursor:default}
.bingo-winners-box{margin-top:12px;padding:10px 12px;background:rgba(250,204,21,0.06);border:1px solid rgba(250,204,21,0.25);border-radius:12px}
.bingo-winners-box .bw-row{display:flex;gap:6px;align-items:baseline;margin-top:4px;font-size:11px;flex-wrap:wrap}
.bingo-winners-box .bw-tier{font-weight:900;color:#facc15;letter-spacing:0.05em;min-width:62px}
.bingo-ended-banner{text-align:center;padding:14px;background:linear-gradient(135deg,rgba(250,204,21,0.12),rgba(236,72,153,0.12));border:1px solid rgba(250,204,21,0.35);border-radius:14px;margin-bottom:10px;font-family:'Barlow Condensed',sans-serif;font-weight:900;letter-spacing:0.04em;font-size:13px}
.bingo-full-wrap{min-height:100vh;background:#030712;padding:14px}
.bingo-back-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;border-radius:10px;padding:8px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;margin-bottom:12px}
/* -- v2: retos matemáticos, bloqueo y poderes -- */
.bingo-settings-box{background:rgba(255,255,255,0.04);border:1px solid rgba(124,58,237,0.25);border-radius:14px;padding:10px 12px;margin:8px 0;display:flex;flex-direction:column;gap:8px}
.bs-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:rgba(255,255,255,0.7);font-weight:700}
.bs-row select{background:#0a0e1a;color:#fff;border:1px solid rgba(255,255,255,0.18);border-radius:8px;padding:5px 8px;font-size:11px;font-family:'Barlow Condensed',sans-serif}
.bs-toggle{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);border-radius:20px;padding:4px 12px;font-weight:900;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer}
.bs-toggle.on{background:rgba(74,222,128,0.18);border-color:#4ade80;color:#4ade80}
.bingo-cell.blocked{background:#dc2626;color:#fff;border:1px solid #f87171;cursor:not-allowed}
.bingo-cell.selecting{background:#ef4444;color:#fff;border:2px solid #fca5a5;animation:twPulse 2s cubic-bezier(.4,0,.6,1) infinite}
.bingo-cell.hl{background:rgba(234,179,8,0.3);color:#fef08a;border:1px solid rgba(234,179,8,0.6);animation:twPulse 2s cubic-bezier(.4,0,.6,1) infinite}
.bingo-cell.marked{border:none;color:#000}
.bingo-cell.marked.fire-1{background:linear-gradient(135deg,#a3e635,#4ade80);box-shadow:0 0 8px rgba(74,222,128,0.5)}
.bingo-cell.marked.fire-2{background:linear-gradient(135deg,#4ade80,#bef264);box-shadow:0 0 10px rgba(190,242,100,0.55);transform:scale(1.05)}
.bingo-cell.marked.fire-3{background:linear-gradient(135deg,#bef264,#facc15);box-shadow:0 0 12px rgba(250,204,21,0.65);transform:scale(1.05)}
.bingo-cell.marked.fire-4{background:linear-gradient(135deg,#facc15,#fb923c);box-shadow:0 0 16px rgba(251,146,60,0.8);transform:scale(1.05);color:#fff}
.bingo-cell.marked.fire-5{background:linear-gradient(135deg,#fb923c,#f97316,#dc2626);box-shadow:0 0 24px rgba(220,38,38,0.95);transform:scale(1.05);color:#fff}
.bingo-cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start}
.bingo-card-block{position:relative;max-width:420px;width:100%;margin:0 auto;background:#111827;border:1px solid rgba(132,204,22,0.3);border-radius:16px;padding:20px;box-shadow:0 0 15px rgba(132,204,22,0.1)}
.bingo-card-block.blocking{border-color:#ef4444}
.bcb-label{font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:12px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;color:#a3e635}
.bingo-card-block.blocking .bcb-label{color:#f87171}
.bingo-cards-section-lbl{color:#a3e635;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;font-size:14px;display:flex;align-items:center;gap:8px;margin-top:16px;margin-bottom:16px}
.bingo-frozen-banner{text-align:center;padding:10px;background:rgba(34,211,238,0.1);border:1px solid rgba(34,211,238,0.35);border-radius:12px;margin:8px 0;font-size:12px;font-weight:700;color:#67e8f9}
.bingo-block-banner{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.35);border-radius:14px;padding:10px 12px;margin:10px 0}
.bbb-title{font-size:12px;font-weight:900;color:#f87171}
.bbb-sub{font-size:10.5px;color:rgba(255,255,255,0.55);margin-top:4px}
.bbb-apply{width:100%;margin-top:8px;background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;font-weight:900;border:none;border-radius:10px;padding:10px;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer}
.bingo-modal-bg{position:fixed;inset:0;background:rgba(3,7,18,0.85);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
.bingo-challenge-card{width:100%;max-width:640px;background:#0a0e1a;border:1px solid rgba(168,85,247,0.4);border-radius:24px;padding:36px 44px;text-align:center;box-shadow:0 0 70px -10px rgba(168,85,247,0.5);font-family:'Barlow Condensed',sans-serif}
.bingo-challenge-card.err{border-color:#ef4444;box-shadow:0 0 50px -10px rgba(239,68,68,0.6);animation:bingoShake .3s}
@keyframes bingoShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bingo-cell.sabotaged{background:linear-gradient(135deg,#0369a1,#0c4a6e)!important;border-color:#38bdf8!important;color:#bae6fd!important;cursor:pointer;animation:bingoIcePulse 1.4s ease-in-out infinite}
.bingo-cell.power-target{cursor:crosshair!important;box-shadow:0 0 0 2px rgba(168,85,247,0.7),0 0 14px rgba(168,85,247,0.35)!important;border-color:rgba(168,85,247,0.7)!important;animation:twPulse 1.2s ease-in-out infinite}
.bingo-cell.power-source{cursor:crosshair!important;box-shadow:0 0 0 2px #fbbf24,0 0 14px rgba(251,191,36,0.5)!important;border-color:#fbbf24!important}
.bpx-hint-box{margin-top:8px;background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.3);border-radius:8px;padding:10px 12px}
.bpx-hint-text{font-size:11px;color:#c084fc;font-weight:600;line-height:1.6}
@keyframes bingoIcePulse{0%,100%{box-shadow:0 0 6px -1px #38bdf8,inset 0 0 8px rgba(56,189,248,0.2)}50%{box-shadow:0 0 18px -2px #7dd3fc,inset 0 0 18px rgba(56,189,248,0.35)}}
.bcc-title{font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:0.06em;background:linear-gradient(to right,#22d3ee,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.bcc-sub{font-size:10.5px;color:rgba(255,255,255,0.45);margin-top:4px}
.bcc-bar{height:7px;background:rgba(255,255,255,0.08);border-radius:4px;margin:14px 0 10px;overflow:hidden}
.bcc-bar-fill{height:100%;border-radius:4px;transition:width 1s linear,background .4s}
.bcc-bar-fill.ok{background:linear-gradient(to right,#4ade80,#22d3ee)}
.bcc-bar-fill.warn{background:linear-gradient(to right,#facc15,#ef4444)}
.bcc-dots{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.bcc-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.15)}
.bcc-dot.ok{background:#4ade80}
.bcc-dot.now{background:#facc15;box-shadow:0 0 8px -1px #facc15}
.bcc-question{font-family:ui-monospace,Menlo,monospace;font-size:36px;font-weight:900;color:#fff;margin:18px 0}
.bcc-lives{font-size:22px;letter-spacing:4px;margin-bottom:14px}
.bcc-mc-opts{display:flex;flex-direction:column;gap:10px;width:100%;margin-bottom:14px}
.bcc-mc-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.2);border-radius:12px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;padding:14px 18px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.bcc-mc-btn:hover{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.4)}
.bcc-mc-btn.bcc-mc-err{background:rgba(239,68,68,0.14);border-color:rgba(239,68,68,0.5);color:rgba(255,255,255,0.4);cursor:not-allowed}
.bcc-mc-btn:disabled{pointer-events:none}
.bcc-input{width:220px;text-align:center;background:#050810;color:#fff;border:1px solid rgba(255,255,255,0.25);border-radius:10px;padding:14px;font-size:24px;font-family:ui-monospace,Menlo,monospace;margin-bottom:14px}
.bcc-submit{display:block;width:100%;background:linear-gradient(135deg,#db2777,#7c3aed);color:#fff;font-weight:900;border:none;border-radius:12px;padding:14px;font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer}
.bcc-foot{font-size:10px;color:rgba(255,255,255,0.4);margin-top:10px}
/* ── Resultado del reto (overlay verde/amarillo/rojo) ── */
.bcc-result{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px;transition:background .3s}
.bcc-result-green{background:linear-gradient(135deg,rgba(21,128,61,0.35),rgba(34,197,94,0.15));border-color:#22c55e;box-shadow:0 0 60px -10px rgba(34,197,94,0.6)}
.bcc-result-yellow{background:linear-gradient(135deg,rgba(161,98,7,0.35),rgba(250,204,21,0.15));border-color:#facc15;box-shadow:0 0 60px -10px rgba(250,204,21,0.5)}
.bcc-result-red{background:linear-gradient(135deg,rgba(127,29,29,0.35),rgba(239,68,68,0.15));border-color:#ef4444;box-shadow:0 0 60px -10px rgba(239,68,68,0.5)}
.bcc-result-ico{font-size:56px;line-height:1;margin-bottom:12px}
.bcc-result-h{font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:0.06em;color:#fff;margin-bottom:10px}
.bcc-result-body{font-size:15px;color:rgba(255,255,255,0.8);line-height:1.4;max-width:340px}

.bingo-game-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;cursor:pointer;transition:background .15s,border-color .15s}

.bgc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}

.bgc-join-btn{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:none;border-radius:10px;padding:8px 18px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:0.04em;transition:opacity .15s}

function getTotal() { return appConfig.totalNumbers || 200; }

function getStudents() {
  const baseMap = {};
  DEFAULT_STUDENTS.forEach(s => { baseMap[s.id] = s; });
  const allIds = new Set([
    ...DEFAULT_STUDENTS.map(s => String(s.id)),
    ...Object.keys(overrides)
  ]);
  const list = [];
  allIds.forEach(idStr => {
    const id = parseInt(idStr);
    if (isNaN(id) || id === 0) return;
    const base = baseMap[id] || { id, name:"Nuevo Alumno", icon:"👤", max:0, pin:"1234", color:"#888888" };
    const ov   = overrides[idStr] || {};
    if (ov.deleted) return;
    // El nombre y apellido ya NO se editan desde /student. Si esta cuenta está vinculada
    // a un alumno de /padres (padresId, guardado al "aceptar" la solicitud), el nombre se
    // toma SIEMPRE en vivo de /padres — así una edición ahí se refleja aquí sin tocar nada.
    // Si todavía no hay vínculo (cuentas viejas migradas), se usa el nombre guardado en overrides.
    const padresId   = ov.padresId !== undefined ? ov.padresId : base.padresId;
    const pStudent   = (padresId !== undefined && padresId !== null) ? (padresRaw.students || {})[String(padresId)] : null;
    // linkBroken: tenía un padresId pero ese alumno ya no existe en /padres (lo borraron).
    // La cuenta de sorteo SIGUE ACTIVA (cupo, PIN, números, puntos) — solo queda "libre",
    // sin padre vinculado, hasta que el admin la vuelva a vincular manualmente.
    const linkBroken = (padresId !== undefined && padresId !== null) && !pStudent;
    const liveName   = (pStudent && pStudent.name) ? pStudent.name : (ov.name !== undefined ? ov.name : base.name);
    list.push({
      id,
      name:  toTitleCase(liveName),
      icon:  ov.icon  !== undefined ? ov.icon  : base.icon,
      // El cupo SIEMPRE es igual a los puntos actuales del mes (getTotalPts) — ya no es un
      // valor editable a mano. Así nunca se puede desincronizar del puntaje real del alumno.
      max:   getTotalPts(id),
      pin:   ov.pin   !== undefined ? ov.pin   : base.pin,
      color: ov.color !== undefined ? ov.color : base.color,
      padresId,
      linkBroken,
    });
  });
  // Orden: mayor puntaje del mes en curso primero.
  // Empate: quien llegó antes al puntaje va primero (orden cronológico del pointsLog).
  return list.sort((a,b) => {
    const pA=getTotalPts(a.id), pB=getTotalPts(b.id);
    if (pB!==pA) return pB-pA;
    return getDateReachedScore(a.id,pA) - getDateReachedScore(b.id,pB);
  });
}

// ════════════════════════════════════════════════════════
// FECHA DEL SORTEO (regla fin de mes)
//   mes termina lun/mar/mié → sorteo ese domingo
//   mes termina jue/vie/sáb/dom → sorteo domingo de la semana siguiente
// ════════════════════════════════════════════════════════
function getSorteoDate(year, month) {
  const lastDay = new Date(year, month + 1, 0);
  const dow = lastDay.getDay();
  let add;
  if      (dow === 0) add = 7;
  else if (dow <= 3)  add = 7 - dow;
  else                add = 14 - dow;
  return new Date(lastDay.getFullYear(), lastDay.getMonth(), lastDay.getDate() + add);
}

// ════════════════════════════════════════════════════════
// CRONOGRAMA DE ELECCIÓN DE NÚMEROS
// El sorteo es siempre el domingo determinado por getSorteoDate.
// La ventana de elección es la semana previa a ese domingo:
//   • Apertura → lunes (sorteo − 6 días), 3:00 PM
//   • Cierre   → sábado (sorteo − 1 día), 9:00 PM
//   • Sorteo   → domingo, mediodía
// Si la fecha actual ya pasó el cierre del ciclo actual,
// se usa el ciclo del mes siguiente.
// ════════════════════════════════════════════════════════
function computeSorteoSchedule(refDate) {
  const ref = refDate || new Date();
  const m = ref.getMonth(), y = ref.getFullYear();

  // Si el sorteo del ciclo del MES ANTERIOR todavía no ocurrió, ese ciclo sigue
  // siendo el vigente — aunque su ventana de elección (start–end) ya haya cerrado.
  // Esto cubre tanto los días en que la ventana sigue abierta y cae ya en el mes
  // nuevo (ej. ciclo de junio: abre 29 jun, cierra 4 jul 9pm) como las horas entre
  // ese cierre y el sorteo mismo (4 jul 9pm → 5 jul 12pm), para que el cupo/estado
  // no salte a julio antes de que se sepa el resultado del sorteo de junio.
  const pm = m === 0 ? 11 : m - 1;
  const py = m === 0 ? y - 1 : y;
  const prevSorteo = getSorteoDate(py, pm);
  const prevDraw   = new Date(prevSorteo); prevDraw.setHours(12, 0, 0, 0);
  if (ref <= prevDraw) {
    const prevEnd   = new Date(prevSorteo); prevEnd.setDate(prevEnd.getDate() - 1); prevEnd.setHours(21, 0, 0, 0);
    const prevStart = new Date(prevSorteo); prevStart.setDate(prevStart.getDate() - 6); prevStart.setHours(15, 0, 0, 0);
    return { start: prevStart, end: prevEnd, draw: prevDraw, ptsYear: py, ptsMonth: pm };
  }

  // sorteo del mes actual
  let sorteo  = getSorteoDate(y, m);
  let end     = new Date(sorteo); end.setDate(end.getDate() - 1); end.setHours(21, 0, 0, 0);
  let ptsYear = y, ptsMonth = m;
  // si ya pasó el cierre → usar mes siguiente
  if (ref > end) {
    const nm = m === 11 ? 0 : m + 1;
    const ny = m === 11 ? y + 1 : y;
    sorteo  = getSorteoDate(ny, nm);
    end     = new Date(sorteo); end.setDate(end.getDate() - 1); end.setHours(21, 0, 0, 0);
    ptsYear = ny; ptsMonth = nm;
  }
  const start = new Date(sorteo); start.setDate(start.getDate() - 6); start.setHours(15, 0, 0, 0);
  const draw  = new Date(sorteo); draw.setHours(12, 0, 0, 0);
  return { start, end, draw, ptsYear, ptsMonth };
}

// Offset (en meses, relativo al mes calendario real de "ahora") del mes de puntos
// que corresponde al ciclo de sorteo vigente — normalmente 0, pero -1 durante los
// días de traslape descritos arriba (ver computeSorteoSchedule). getStudentPoints
// usa esto como su offset por defecto, así que CUPO, ranking y "Puntos" se quedan
// mostrando el mes que se está sorteando hasta que el sorteo realmente ocurre.
function getCupoMonthOffset() {
  const now = new Date();
  const sch = computeSorteoSchedule(now);
  return (sch.ptsYear - now.getFullYear()) * 12 + (sch.ptsMonth - now.getMonth());
}

// true en los días de traslape: el mes anterior todavía no tuvo su sorteo, así que hay dos
// meses "candidatos" para mostrar en Ranking/Puntos — el oficial (congelado, el de CUPO) y
// el actual (en curso, vista previa de cómo van los puntos para el próximo sorteo).
function isTraslape() { return getCupoMonthOffset() !== 0; }

// Offset a usar en Ranking/Puntos: igual al oficial salvo que, durante el traslape, el
// usuario haya elegido explícitamente ver el mes actual (pubMonthChoice==='actual').
function getPubMonthOffset() {
  // Fuera de traslape no hay nada que elegir: se resetea la elección para que, la próxima
  // vez que haya traslape (el mes siguiente), vuelva a partir del oficial por defecto.
  if (!isTraslape()) { pubMonthChoice = null; return 0; }
  return pubMonthChoice === 'actual' ? 0 : getCupoMonthOffset();
}
function setPubMonthChoice(c) { pubMonthChoice = c; router(); }

// Misma lista de getStudents() (con su s.max = cupo oficial intacto, sin tocar) pero, si el
// offset pedido no es el oficial, reordenada por los puntos de ese otro mes — para que el
// "mes actual" en vista previa muestre el orden real de ese mes y no el del mes oficial.
function getStudentsForView(offset) {
  const students = getStudents();
  if (offset === getCupoMonthOffset()) return students;
  return [...students].sort((a,b) => {
    const pA = getTotalPts2(a.id, offset), pB = getTotalPts2(b.id, offset);
    if (pB !== pA) return pB - pA;
    return getDateReachedScore(a.id, pA, offset) - getDateReachedScore(b.id, pB, offset);
  });
}

// Reparte proporcionalmente (en horas enteras, sin decimales) la ventana total
// de selección — de lunes 3 PM a sábado 9 PM (6 días × 6h = 36h) — entre todos
// los alumnos, según el orden de la tabla de posiciones (quien va primero en
// el ranking elige primero). El sobrante de horas (36 % n) se reparte entre
// los primeros alumnos para que la suma cierre exacto en el cierre final.
function getPersonalStart(studentId) {
  const sch      = computeSorteoSchedule();
  const students = getStudents();
  const idx      = students.findIndex(s => s.id === studentId);
  if (idx === -1) return new Date(sch.start);
  const n = students.length || 1;
  const DAY_HOURS   = 6;          // ventana diaria: 3 PM – 9 PM
  const DAYS        = 6;          // lunes a sábado
  const TOTAL_HOURS = DAY_HOURS*DAYS; // 36 horas en total
  const base = Math.floor(TOTAL_HOURS/n);
  const rem  = TOTAL_HOURS % n;
  let offsetHours = 0;
  for (let i = 0; i < idx; i++) offsetHours += base + (i < rem ? 1 : 0);
  let t = new Date(sch.start);
  for (let h = 0; h < offsetHours; h++) {
    t.setHours(t.getHours()+1);
    if (t.getHours() >= 21) { t.setDate(t.getDate()+1); t.setHours(15,0,0,0); }
  }
  return t;
}

function getVotingStatus(loggedId) {
  const sch = computeSorteoSchedule();
  const now = new Date();
  if (now > sch.end) return 'closed';
  const active = getFullList().find(s => s.id === loggedId);
  if (active?.role === 'admin') return 'open';
  const ps = getPersonalStart(loggedId);
  if (!ps || now >= ps) return 'open';
  return 'waiting_turn';
}

function toTitleCase(str) {
  if (!str) return str;
  return str.split(' ').map(function(w){ return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase(); }).join(' ');
}
// Escapa comillas para insertar texto dentro de un atributo HTML delimitado por comillas dobles.
function escAttr(s) { return String(s==null?'':s).replace(/"/g,'&quot;'); }
// Asegura que un enlace tenga esquema (https://) — si no lo tiene, un <a href="meet.google.com/...">
// se interpreta como ruta RELATIVA a la página actual (ej: https://emaths.me/student/meet.google.com/...)
// en vez de abrir el sitio externo. Se usa al guardar y también al mostrar, por si quedó algún
// enlace viejo guardado sin esquema.
function normalizeLinkUrl(u) {
  u = String(u==null?'':u).trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}
function formatFullDate(d) {
  if (!d) return 'No definida';
  const dt = d instanceof Date ? d : new Date(d);
  if (isNaN(dt)) return 'Fecha Inválida';
  const ds = dt.toLocaleDateString('es-ES',{ weekday:'long', day:'numeric', month:'long' });
  const ts = dt.toLocaleTimeString('es-ES',{ hour:'2-digit', minute:'2-digit', hour12:true });
  return `${ds.charAt(0).toUpperCase()+ds.slice(1)} a las ${ts.toUpperCase()}`;
}

function getSorteoMonth() {
  const dt = computeSorteoSchedule().start;
  const m = dt.toLocaleDateString('es-ES',{ month:'long' });
  return m.charAt(0).toUpperCase()+m.slice(1);
}

// Cuenta las marcas (true) del mes actual en pointsLog para un alumno: { hours, progress, tasks }
// Cada entrada de hours/progress/tasks ahora es un arreglo de booleanos (uno por cuadradito).
// Para Joanna Prado, cada cuadradito de Tareas marcado vale ×3 (cursos de nivel más avanzado).
function getStudentPoints(id, monthOffset=getCupoMonthOffset()) {
  const log = pointsLog[String(id)] || {};
  const taskMult = getTaskMult(id);
  const base = new Date(); base.setMonth(base.getMonth()+monthOffset);
  const ym = `${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}`;
  let hours=0, progress=0, tasks=0;
  // arrToBool: soporta formato nuevo (array de booleanos) y formato viejo (un solo booleano por fecha)
  const arrToBool = v => Array.isArray(v) ? v : (v ? [true] : []);
  Object.entries(log).forEach(([dateKey, marks]) => {
    if (!dateKey.startsWith(ym) || !marks || marks.absent) return;
    arrToBool(marks.hours).forEach(v => { if (v) hours++; });
    arrToBool(marks.progress).forEach(v => { if (v) progress++; });
    arrToBool(marks.tasks).forEach(v => { if (v) tasks += taskMult; });
  });
  return { hours, progress, tasks };
}
function getTotalPts(id) { const p=getStudentPoints(id); return p.hours+p.progress+p.tasks; }

// Devuelve la fecha (ms) en que el alumno llegó por primera vez a targetScore este mes.
// Usa pointsLog[id][dateKey] ordenado cronológicamente.
// Si nunca llegó → Number.MAX_SAFE_INTEGER (queda último en desempate).
function getDateReachedScore(id, targetScore, monthOffset=getCupoMonthOffset()) {
  if (targetScore <= 0) return 0;
  const now = new Date(); now.setMonth(now.getMonth()+monthOffset);
  const prefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const log = pointsLog[id] || {};
  const keys = Object.keys(log).filter(k => k.startsWith(prefix)).sort();
  let cum = 0;
  for (const key of keys) {
    const e = log[key]; if (!e || e.absent) continue;
    cum += (e.hours?1:0) + (e.progress?1:0) + (e.tasks?1:0);
    if (cum >= targetScore) return new Date(key).getTime();
  }
  return Number.MAX_SAFE_INTEGER;
}

let _tt;

}

// ════════════════════════════════════════════════════════
// FIREBASE SAVE
// ════════════════════════════════════════════════════════
// Bloquea cualquier guardado mientras no se haya recibido al menos un snapshot real de
// Firestore en esta sesión (ver lmsDataLoaded arriba). Sin esto, un fallo de conexión al
// cargar (típico en un dispositivo/red nueva) deja las variables locales en su valor por
// defecto vacío, y un guardado en ese momento borraría los datos reales en la nube.
function firestoreDataReady() {
  if (!lmsDataLoaded) {
    showToast('Sin conexión con la base de datos todavía — espera unos segundos y vuelve a intentar. (Esto evita borrar datos por accidente.)');
    return false;
  }
  return true;
}
function saveMeta() {
  if (!firestoreDataReady()) return;
  REF.set({ overrides, config: appConfig }, { merge:true })
    .catch(e => { console.error(e); showToast('Error al guardar.'); });
}
let _sd = null;
function saveDebounced() { clearTimeout(_sd); _sd = setTimeout(saveMeta, 600); }
function setOverride(id, field, value) {
  const k = String(id); if (!overrides[k]) overrides[k]={};
  overrides[k][field] = value; saveDebounced();
}
// ── Vínculo alumno ←→ /padres ────────────────────────────────────────────
// IMPORTANTE: los ids de alumno de /student y de /padres son espacios de
// numeración INDEPENDIENTES (el mismo alumno puede tener id distinto en cada
// sistema) — nunca vincular por id. El vínculo se guarda UNA SOLA VEZ como
// overrides[id].padresId (string = id del alumno en /padres), ya sea por el
// auto-link de nombres (syncPadresLinks) o al "aceptar" una solicitud nueva
// (acceptPadresStudent). A partir de ahí el nombre y apellido se editan
// SOLO desde /padres — /student ya no escribe nombres hacia /padres.

function saveAllocationChange(num, action, ownerId) {
  return db.runTransaction(async tx => {
    const snap = await tx.get(REF);
    const data = snap.exists ? snap.data() : {};
    const cur  = Object.assign({}, data.allocations||{});
    if (action === 'delete') {
      delete cur[num];
    } else {
      if (ownerId !== 0) {
        const s = getStudents().find(s => s.id === ownerId);
        if (s) {
          const cnt = Object.values(cur).filter(i => String(i)===String(ownerId)).length;
          if (cnt >= (s.max||0)) throw new Error('CUPO_LLENO:'+s.max);
        }
      }
      cur[num] = ownerId;
    }
    tx.set(REF,{ allocations:cur, overrides:data.overrides||{}, config:data.config||{}, lms:data.lms||{} });
  });
}

// Guarda SOLO un sub-campo puntual de "lms" (notación de punto de Firestore: 'lms.tasks',
// 'lms.prompts', etc.), en vez de reescribir el mapa "lms" completo de una sola vez.
// ANTES: saveLms() mandaba {tasks, points, pointsLog, taskMultipliers, pointsHistory, prompts}
// juntos en un solo bloque. Firestore reemplaza ese bloque entero al recibirlo así (merge:true
// no protege sub-campos dentro de un mismo valor de campo) — si CUALQUIERA de esas 6 variables
// estaba desactualizada en memoria al guardar (ej. por otra pestaña/dispositivo conectado al
// mismo tiempo), se sobreescribían también las otras 5, aunque el usuario solo hubiera tocado
// una. Eso causó episodios reales de pérdida de datos donde editar Puntos borraba Tareas y
// Prompts sin relación lógica entre sí — solo estaban "pegados" en el mismo paquete de guardado.
// AHORA cada función guarda únicamente el sub-campo que realmente cambió, Y ADEMÁS lo hace
// dentro de una TRANSACCIÓN de Firestore (igual patrón que ya usa saveAllocationChange arriba):
// en vez de escribir directo lo que esta pestaña tiene en memoria, primero vuelve a LEER
// (tx.get(REF)) el valor más reciente de ese campo en el servidor, y aplica la modificación
// del usuario sobre ESE dato fresco — nunca sobre la copia local, que pudo quedarse atrás si
// otro dispositivo guardó algo mientras esta pestaña todavía no había recibido esa actualización
// (el caso típico: dejar una sesión abierta varios días en un dispositivo, mientras se edita
// desde otro). Esto cierra el hueco de raíz: aunque la copia local esté desactualizada, nunca se
// pisa con datos viejos lo que ya quedó guardado en el servidor.
// "transformFn" recibe el valor ACTUAL en el servidor (no el de esta pestaña) y devuelve el
// nuevo valor a guardar; al terminar, sincroniza también la variable local con el resultado
// real, por si el servidor tenía algo más nuevo que la copia local no tenía.
function saveLmsFieldTx(field, transformFn) {
  if (!firestoreDataReady()) return Promise.resolve();
  return db.runTransaction(async tx => {
    const snap  = await tx.get(REF);
    const data  = snap.exists ? snap.data() : {};
    const fresh = (data.lms || {})[field];
    const updated = transformFn(fresh);
    tx.update(REF, { ['lms.'+field]: updated });
    return updated;
  }).catch(e => { console.error(e); showToast('Error al guardar.'); });
}
function saveTasks(transformFn) {
  return saveLmsFieldTx('tasks', fresh => {
    const updated = transformFn(Array.isArray(fresh) ? fresh : []);
    tasks = updated;
    return updated;
  });
}
function savePointsLog(transformFn) {
  return saveLmsFieldTx('pointsLog', fresh => {
    const updated = transformFn((fresh && typeof fresh==='object') ? fresh : {});
    pointsLog = updated;
    return updated;
  });
}
function saveTaskMultipliers(transformFn) {
  return saveLmsFieldTx('taskMultipliers', fresh => {
    const updated = transformFn((fresh && typeof fresh==='object') ? fresh : {});
    taskMultipliers = updated;
    return updated;
  });
}
function savePointsHistory(transformFn) {
  return saveLmsFieldTx('pointsHistory', fresh => {
    const updated = transformFn((fresh && typeof fresh==='object') ? fresh : {});
    pointsHistory = updated;
    return updated;
  });
}
function savePrompts(transformFn) {
  return saveLmsFieldTx('prompts', fresh => {
    const updated = transformFn((fresh && typeof fresh==='object') ? fresh : {});
    prompts = updated;
    return updated;
  });
}

// Devuelve [{date:Date, key:'YYYY-MM-DD', hours:N, slots}] de las fechas del mes (con offset) en que
// el alumno tiene clase, junto con el total de horas de clase ese día — calculado fecha por fecha desde
// las sesiones crudas sincronizadas desde /padres (classSessByName), respetando excepciones puntuales:
// una sesión de una sola vez (recurring:false + date) solo cuenta en su fecha exacta, y una sesión
// semanal se omite en cualquier fecha presente en su propio skipDates (porque esa fecha ya quedó
// cancelada/movida a una sesión de una sola vez en otro lugar). Si no hay match, devuelve [].
function getClassDatesForStudent(studentName, monthOffset=0) {
  const nn = normName(studentName);
  const mySessions = classSessByName[nn] || [];
  if (!mySessions.length) return [];
  const base = new Date();
  base.setMonth(base.getMonth()+monthOffset);
  const y = base.getFullYear(), m = base.getMonth();
  const last = new Date(y, m+1, 0).getDate();
  const out = [];
  for (let d=1; d<=last; d++) {
    const dt = new Date(y, m, d);
    const key = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const todays = mySessions.filter(s => {
      const isOneTime = s.recurring === false && s.date;
      if (isOneTime) return s.date === key;
      if (Array.isArray(s.skipDates) && s.skipDates.includes(key)) return false;
      return Number(s.day) === dt.getDay();
    });
    if (todays.length) {
      const h = todays.reduce((sum,s) => sum + Math.max(1, Math.round((s.dur||60)/60)), 0);
      const slots = todays.map(s => ({ start: s.start || '', dur: s.dur || 60, modality: s.modality || '' }))
        .sort((a,b) => (a.start||'').localeCompare(b.start||''));
      out.push({ date:dt, key, hours:h, slots });
    }
  }
  return out;
}

const PUBLIC_ROUTES = new Set(['login','ranking','numeros','ganadores','bingo']);
const ADMIN_ROUTES  = new Set([]);
// Rutas "inmersivas": pantalla completa sin nav inferior ni barra atrás/inicio/adelante
// (pedido explícito: que /student/bingo "solo se vea el sorteo").
const IMMERSIVE_ROUTES = new Set(['bingo']);

function go(view) {
  currentView = view;
  var path = view === 'dashboard' ? '/student' : '/student/' + view;
  if (location.pathname !== path) history.pushState({ view: view }, '', path);
  router();
}

// Botones de navegación (atrás / inicio / adelante) — usan el historial real
// del navegador, que ya mantenemos sincronizado vía pushState/popstate.
function navBack()    { history.back(); }
function navForward() { history.forward(); }
function navHome()    { go('dashboard'); }

function router() {
  if (!appReady) return;
  const hash     = currentView || 'login';
  const loggedId = getLoggedId();
  const app      = document.getElementById('app');
  const nav      = document.getElementById('bottom-nav');

  // Auth guards
  if (!PUBLIC_ROUTES.has(hash) && loggedId === null) { go('login'); return; }
  if (hash === 'login' && loggedId !== null) { go('dashboard'); return; }
  if (ADMIN_ROUTES.has(hash) && !isAdmin()) { go('dashboard'); return; }

  clearInterval(clockTimer);

  const views = {
    login: vLogin, dashboard: vDashboard, tablero: vTablero,
    ranking: vRankingPage, numeros: vNumerosPage, ganadores: vGanadoresPage,
    tareas: vTareas, puntos: vPuntos, horarios: vHorarios, perfil: vPerfil,
    bingo: vBingoFull
  };
  app.innerHTML = `<div class="vw">${(views[hash]||vLogin)()}</div>`;

  const showNav = loggedId !== null && !IMMERSIVE_ROUTES.has(hash);
  if (showNav) {
    buildNav(hash);
    nav.classList.add('visible');
    document.body.classList.add('nav-visible');
  } else {
    nav.classList.remove('visible');
    document.body.classList.remove('nav-visible');
  }

  // Barra atrás/inicio/adelante: visible cuando hay sesión y no estamos en el inicio (dashboard)
  const histBar = document.getElementById('hist-bar');
  if (histBar) {
    const showHist = loggedId !== null && hash !== 'dashboard' && !IMMERSIVE_ROUTES.has(hash);
    histBar.classList.toggle('visible', showHist);
    document.body.classList.toggle('hist-visible', showHist);
  }

  const setup = {
    login:vLoginSetup, dashboard:vDashboardSetup, tablero:vTableroSetup,
    ranking:vRankingSetup, numeros:vNumerosSetup, ganadores:vGanadoresSetup,
    tareas:vTareasSetup, puntos:vPuntosSetup, horarios:vHorariosSetup, perfil:()=>{},
    bingo: vBingoFullSetup
  };
  if (setup[hash]) setup[hash]();

  // Mantiene la URL sincronizada con la vista resuelta (p.ej. si el guard
  // de autenticación cambió la vista a 'login'), sin crear historial extra.
  var syncedPath = hash === 'dashboard' ? '/student' : '/student/' + hash;
  if (location.pathname !== syncedPath) {
    history.replaceState({ view: hash }, '', syncedPath);
  }
}

// BINGO MULTIJUGADOR EN VIVO (tab GAMING)
// — Una sola partida compartida (BINGO_REF): cualquiera (alumno o profe)
//   puede crearla; el host la dirige (sortea los números) y todos los demás
//   son simples espectadores/jugadores via onSnapshot, así que el timing de
//   cada número sale exactamente igual para todos. Sin retos ni poderes (v1).
