<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MATHS LEVEL UP — Horarios</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; min-height:100dvh; background:#f5f5f3; color:#111; font-family:'Barlow',sans-serif; padding-top:calc(50px + env(safe-area-inset-top)); }

/* HEADER BAR */
#hist-bar {
  position:fixed; top:0; left:0; right:0; z-index:200;
  display:flex; align-items:center; gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:rgba(255,255,255,0.95); backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(0,0,0,0.08);
}
.hist-btn {
  border:none; background:rgba(0,0,0,0.06); color:#111;
  width:38px; height:34px; border-radius:10px; font-size:14px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background 0.15s;
}
.hist-btn:active { background:rgba(0,0,0,0.14); }
.hist-em {
  background:#8cb800 !important; color:#fff !important;
  font-family:'Barlow Condensed',sans-serif; font-weight:900;
  font-size:13px; letter-spacing:-0.01em; margin-left:auto;
}

/* APP CONTAINER */
#app { height:calc(100dvh - 50px - env(safe-area-inset-top)); overflow:hidden; display:flex; flex-direction:column; }
.pcal-outer { display:flex; flex-direction:column; height:100%; overflow:hidden; }

/* TOOLBAR */
.pcal-toolbar { flex-shrink:0; display:flex; align-items:center; gap:8px; padding:10px 14px 6px; }
.pcal-toggle { display:flex; border:1px solid rgba(0,0,0,0.14); border-radius:10px; overflow:hidden; background:#fff; }
.pcal-toggle button {
  border:none; background:transparent; color:rgba(0,0,0,0.4);
  font-family:'Barlow Condensed',sans-serif; font-weight:900;
  font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
  padding:7px 14px; cursor:pointer; transition:background 0.15s,color 0.15s;
}
.pcal-toggle button.on { background:#111; color:#fff; }
.pcal-today-btn {
  border:1px solid rgba(0,0,0,0.2); background:#fff; color:rgba(0,0,0,0.6);
  font-family:'Barlow Condensed',sans-serif; font-weight:900;
  font-size:10px; letter-spacing:0.12em; text-transform:uppercase;
  padding:7px 12px; border-radius:8px; cursor:pointer;
}
.pcal-nav { margin-left:auto; display:flex; gap:6px; }
.pcal-nav button {
  border:1px solid rgba(0,0,0,0.14); background:#fff; color:#111;
  border-radius:8px; width:32px; height:32px; font-size:15px; cursor:pointer;
}
.pcal-range-bar {
  flex-shrink:0; padding:0 14px 6px;
  font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700;
  color:rgba(0,0,0,0.4); letter-spacing:0.08em; text-transform:uppercase;
}
.pcal-legend {
  flex-shrink:0; padding:0 14px 8px; display:flex; gap:14px; flex-wrap:wrap;
}
.pcal-leg-item { display:flex; align-items:center; gap:5px; font-size:10px; font-weight:700; color:rgba(0,0,0,0.5); }
.pcal-leg-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }

/* HEAD ROW */
.pcal-head-row { flex-shrink:0; display:flex; border-bottom:1px solid rgba(0,0,0,0.08); background:#f2f2f2; }
.pcal-gutter { flex-shrink:0; width:42px; }
.pcal-days-hdr { display:flex; overflow:hidden; flex:0 0 auto; }
.pcal-dh { flex-shrink:0; text-align:center; padding:5px 2px 7px; border-left:1px solid rgba(0,0,0,0.06); }
.pcal-dh-name { font-size:9px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; color:rgba(0,0,0,0.35); }
.pcal-dh-num  { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:900; line-height:1.1; color:rgba(0,0,0,0.6); }
.pcal-dh-hoy  { font-size:7px; font-weight:900; letter-spacing:0.1em; text-transform:uppercase; background:#111; color:#fff; padding:1px 6px; border-radius:5px; display:inline-block; margin-top:1px; }
.pcal-dh.is-today .pcal-dh-name { color:#111; }
.pcal-dh.is-today .pcal-dh-num  { color:#111; font-weight:900; }
.pcal-dh.is-past .pcal-dh-name,.pcal-dh.is-past .pcal-dh-num { opacity:0.25; }

/* BODY */
.pcal-body-scroll {
  flex:1; min-height:0; overflow-y:scroll; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  scrollbar-width:thin; scrollbar-color:rgba(0,0,0,0.1) transparent; background:#fff;
}
.pcal-body-inner { display:flex; }
.pcal-tl { flex-shrink:0; width:42px; background:#f8f8f8; border-right:1px solid rgba(0,0,0,0.06); }
.pcal-tl-slot {
  display:flex; align-items:flex-start; justify-content:flex-end;
  padding-right:7px; padding-top:3px;
  font-size:9px; font-weight:700; color:rgba(0,0,0,0.25); letter-spacing:0.03em;
}
.pcal-days-body { display:flex; position:relative; flex:0 0 auto; }
.pcal-day-col { flex-shrink:0; position:relative; border-left:1px solid rgba(0,0,0,0.05); }
.pcal-hour-line { border-bottom:1px solid rgba(0,0,0,0.05); }
.pcal-day-col.is-today { background:rgba(0,0,0,0.02); border-left:1px solid rgba(0,0,0,0.2); }
.pcal-day-col.is-past  { opacity:0.35; }

/* EVENTS */
.pcal-ev { position:absolute; border-radius:8px; padding:4px 6px 3px; overflow:hidden; }
.pcal-ev-name  { font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:900; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pcal-ev-time  { font-size:8px; font-weight:700; color:rgba(0,0,0,0.55); margin-top:1px; white-space:nowrap; }
.pcal-ev-badge { font-size:7px; font-weight:900; letter-spacing:0.06em; text-transform:uppercase; color:rgba(0,0,0,0.35); margin-top:1px; }

/* FREE SLOTS */
.pcal-free-slot {
  position:absolute; border-radius:8px; padding:4px 6px 3px; overflow:hidden;
  background:rgba(133,200,0,0.07); border:1.5px dashed rgba(133,200,0,0.55);
}
.pcal-free-lbl  { font-size:8px; font-weight:900; letter-spacing:0.12em; color:rgba(80,140,0,0.7); text-transform:uppercase; }
.pcal-free-time { font-size:8px; font-weight:700; color:rgba(0,0,0,0.45); margin-top:1px; }

/* NOW LINE */
.pcal-now { position:absolute; z-index:10; pointer-events:none; display:flex; align-items:center; }
.pcal-now-dot  { flex-shrink:0; width:8px; height:8px; border-radius:50%; background:#111; margin-left:-4px; }
.pcal-now-line { flex:1; height:1px; background:rgba(0,0,0,0.35); }

.pcal-empty { padding:40px; text-align:center; color:rgba(0,0,0,0.3); font-size:13px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; }

/* ── New Event Modal ── */
.ev-ov { position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center; padding:16px; }
.ev-card { background:#fff; border-radius:16px; width:100%; max-width:420px; box-shadow:0 8px 40px rgba(0,0,0,0.22); overflow:hidden; }
.ev-card-top { padding:20px 20px 0; border-bottom:1px solid rgba(0,0,0,0.07); }
.ev-title-inp { width:100%; border:none; border-bottom:2px solid #1a73e8; outline:none; font-family:'Barlow',sans-serif; font-size:20px; color:#111; padding:4px 0 10px; background:transparent; }
.ev-title-inp::placeholder { color:rgba(0,0,0,0.32); }
.ev-row { display:flex; align-items:flex-start; gap:14px; padding:10px 20px; }
.ev-row-ico { width:20px; flex-shrink:0; color:rgba(0,0,0,0.42); font-size:17px; margin-top:2px; text-align:center; }
.ev-row-body { flex:1; min-width:0; }
.ev-sel { border:none; background:transparent; font-family:'Barlow',sans-serif; font-size:13px; color:#111; cursor:pointer; padding:4px 6px; border-radius:6px; outline:none; max-width:100%; -webkit-appearance:none; }
.ev-sel:hover { background:rgba(0,0,0,0.06); }
.ev-inp { border:none; border-bottom:1px solid rgba(0,0,0,0.15); background:transparent; font-family:'Barlow',sans-serif; font-size:13px; color:#111; padding:4px 0; width:100%; outline:none; }
.ev-inp:focus { border-bottom-color:#1a73e8; }
.ev-mod-row { display:flex; gap:8px; margin-top:2px; }
.ev-mod-btn { flex:1; border:1px solid rgba(0,0,0,0.15); background:#fff; border-radius:8px; padding:7px 0; font-family:'Barlow',sans-serif; font-size:12px; font-weight:700; color:rgba(0,0,0,0.5); cursor:pointer; transition:all .15s; }
.ev-mod-btn.on { background:rgba(26,115,232,0.09); border-color:#1a73e8; color:#1a73e8; }
.ev-footer { display:flex; justify-content:flex-end; gap:8px; padding:12px 20px 18px; }
.ev-btn-cancel { border:none; background:transparent; font-family:'Barlow',sans-serif; font-size:13px; font-weight:700; color:rgba(0,0,0,0.55); padding:8px 16px; border-radius:8px; cursor:pointer; }
.ev-btn-cancel:hover { background:rgba(0,0,0,0.06); }
.ev-btn-save { border:none; background:#1a73e8; color:#fff; font-family:'Barlow',sans-serif; font-size:13px; font-weight:700; padding:8px 22px; border-radius:8px; cursor:pointer; transition:background .15s; }
.ev-btn-save:hover { background:#1557b0; }
.ev-divider { border:none; border-top:1px solid rgba(0,0,0,0.07); margin:2px 0; }

/* Custom recurrence sub-dialog */
.ev-rec-ov { position:fixed; inset:0; z-index:600; background:rgba(0,0,0,0.25); display:flex; align-items:center; justify-content:center; padding:16px; }
.ev-rec-card { background:#fff; border-radius:16px; width:100%; max-width:360px; padding:24px; box-shadow:0 8px 40px rgba(0,0,0,0.26); }
.ev-rec-title { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:900; color:#111; margin-bottom:18px; }
.ev-rec-row { display:flex; align-items:center; gap:10px; margin-bottom:16px; font-size:13px; color:#111; }
.ev-rec-num { border:1px solid rgba(0,0,0,0.2); border-radius:6px; padding:5px 8px; font-family:'Barlow',sans-serif; font-size:13px; width:54px; text-align:center; outline:none; }
.ev-rec-num:focus { border-color:#1a73e8; }
.ev-rec-unit { border:1px solid rgba(0,0,0,0.2); border-radius:6px; padding:5px 8px; font-family:'Barlow',sans-serif; font-size:13px; background:#fff; cursor:pointer; outline:none; }
.ev-days-row { display:flex; gap:6px; margin-bottom:16px; }
.ev-day-btn { width:34px; height:34px; border-radius:50%; border:1px solid rgba(0,0,0,0.18); background:#fff; font-family:'Barlow',sans-serif; font-size:11px; font-weight:700; color:rgba(0,0,0,0.5); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; }
.ev-day-btn.on { background:#1a73e8; border-color:#1a73e8; color:#fff; }
.ev-end-row { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
.ev-end-opt { display:flex; align-items:center; gap:10px; font-size:13px; color:#111; cursor:pointer; }
.ev-end-opt input[type=radio] { accent-color:#1a73e8; }
.ev-end-inp { border:1px solid rgba(0,0,0,0.2); border-radius:6px; padding:4px 8px; font-family:'Barlow',sans-serif; font-size:13px; width:120px; outline:none; }
.ev-end-inp:focus { border-color:#1a73e8; }
.ev-rec-footer { display:flex; justify-content:flex-end; gap:8px; }
</style>
</head>
<body>

<div id="hist-bar">
  <button class="hist-btn" onclick="history.back()">&#9664;</button>
  <button class="hist-btn" id="hist-home" onclick="location.href='/'">&#127968;</button>
  <button class="hist-btn" onclick="history.forward()">&#9654;</button>
  <button class="hist-btn hist-em" onclick="window.location.href='/'" title="easyMaths">
    <img src="/favicon.svg" style="width:22px;height:22px;border-radius:4px;display:block">
  </button>
</div>

<div id="app">
  <div class="pcal-empty">Cargando&hellip;</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="calendar-utils.js"></script>
<script>
firebase.initializeApp({
  apiKey:    "AIzaSyB8M29ujqCEatEZMaNHbGEyDmfygipG_Y0",
  authDomain:"maths-level-up.firebaseapp.com",
  projectId: "maths-level-up",
  appId:     "1:854549565666:web:2613613306c6cb16b30ebb"
});
var db = firebase.firestore();

/* ── State ─────────────────────────────────────────── */
var DATA     = { sessions:[], freeSlots:[], cycleEnd:null, cycles:[], students:{} };
// Por defecto: semana completa en ordenador (ancho de ventana ancho), 4 días en celular.
var calMode  = (window.innerWidth||390) >= 768 ? 'week' : '4dias';
var calAnchor;
var ROW_H    = 56;
var DAY_SHORT = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

/* ── Helpers ────────────────────────────────────────── */
function startOfWeek(d) {
  var r = new Date(d); r.setHours(0,0,0,0);
  var day = r.getDay();
  r.setDate(r.getDate() - (day === 0 ? 6 : day - 1));
  return r;
}
function addDays(d,n) { var r=new Date(d); r.setDate(r.getDate()+n); return r; }
function todayMidnight() { var d=new Date(); d.setHours(0,0,0,0); return d; }
// En "Semana" siempre se ancla al lunes (de lunes a domingo). En "4 días" se ancla a hoy
// mismo, para que la primera columna sea siempre el día actual y las otras 3 sean las que
// le siguen (ej. si hoy es sábado 20: sáb 20, dom 21, lun 22, mar 23).
function defaultAnchor(mode) { return mode==='week' ? startOfWeek(new Date()) : todayMidnight(); }
function fmtDM(d) { return d.toLocaleDateString('es-PE',{day:'numeric',month:'short'}); }
// toH, addM, dStr, getCycleHorizon, cycleCutoffDate, cycleStartDate → calendar-utils.js
function toH(t)  { return calToH(t); }
function addM(t,m){ return calAddM(t,m); }
function dStr(d) { return calDStr(d); }
function slotNames(studentIds) {
  var names=(studentIds||[]).map(function(id){
    var st=DATA.students[id]||DATA.students[String(id)];
    return st&&st.name?st.name:null;
  }).filter(Boolean);
  if(!names.length) return 'Clase';
  if(names.length===1) return names[0];
  return names.slice(0,-1).join(', ')+' y '+names[names.length-1];
}

calAnchor = defaultAnchor(calMode);
var _calMinH = 8;

/* ── New Event Modal ─────────────────────────────────────── */
var _newEv = null;
var _DAY_LONG = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var _DAY_S    = ['D','L','M','X','J','V','S'];
var _MONTHS   = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function _evClickCol(e, dateStr) {
  if (e.target.closest && e.target.closest('.pcal-ev,.pcal-free-slot')) return;
  var col = e.currentTarget;
  var rect = col.getBoundingClientRect();
  var y = e.clientY - rect.top;
  var hourFloat = _calMinH + y / ROW_H;
  var totalMins = Math.round(hourFloat * 2) * 30;
  var h = Math.max(0, Math.min(23, Math.floor(totalMins / 60)));
  var m = totalMins % 60;
  openNewEvent(dateStr, String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'));
}

function openNewEvent(dateStr, timeStr) {
  var d = new Date(dateStr + 'T12:00:00');
  var dow = d.getDay();
  _newEv = {
    date: d, dateStr: dateStr,
    time: timeStr, dur: 60,
    title: '',
    rec: 'none',
    customRec: { every:1, unit:'week', days:[dow], endType:'never', endDate:'', endCount:13 },
    showCustomRec: false,
    studentId: Object.keys(DATA.students||{})[0]||'',
    parentName: '',
    modality: 'Virtual',
  };
  _renderModal();
}

function closeModal() {
  _newEv = null;
  var ov = document.getElementById('ev-ov');
  if (ov) ov.remove();
  var rov = document.getElementById('ev-rec-ov');
  if (rov) rov.remove();
}

function _fmtTime(t) {
  var p = t.split(':'), h = parseInt(p[0]), m = p[1];
  var a = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
  return h + (m !== '00' ? ':' + m : '') + a;
}
function _addMin2(t, mins) {
  var p = t.split(':').map(Number), tot = p[0]*60+p[1]+mins;
  return String(Math.floor(tot/60)%24).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');
}

function _renderModal() {
  if (!_newEv) return;
  var d = _newEv.date, dow = d.getDay();
  var dateLabel = _DAY_LONG[dow]+', '+d.getDate()+' de '+_MONTHS[d.getMonth()];
  var endTime = _addMin2(_newEv.time, _newEv.dur);
  var timeLabel = _fmtTime(_newEv.time) + ' – ' + _fmtTime(endTime);

  var studentOpts = '<option value="">— Sin alumno —</option>'
    + Object.entries(DATA.students||{}).map(function(e){
        return '<option value="'+e[0]+'"'+(String(_newEv.studentId)===String(e[0])?' selected':'')+'>'+(e[1].name||e[0])+'</option>';
      }).join('');

  var html = '<div class="ev-card" onclick="event.stopPropagation()">'
    +'<div class="ev-card-top">'
    +'<input class="ev-title-inp" id="ev-title" type="text" placeholder="Agregar título" autocomplete="off">'
    +'</div>'
    +'<div class="ev-row" style="padding-top:14px">'
    +'<div class="ev-row-ico">🕐</div>'
    +'<div class="ev-row-body">'
    +'<div style="font-size:13px;color:#111;font-weight:600;margin-bottom:3px">'+dateLabel+'</div>'
    +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
    +'<span style="font-size:13px;color:rgba(0,0,0,0.6)">'+timeLabel+'</span>'
    +'<select class="ev-sel" id="ev-dur" style="font-size:12px;color:rgba(0,0,0,0.5)">'
    +'<option value="30"'+(+_newEv.dur===30?' selected':'')+'>30 min</option>'
    +'<option value="60"'+(+_newEv.dur===60?' selected':'')+'>1 hora</option>'
    +'<option value="90"'+(+_newEv.dur===90?' selected':'')+'>1 h 30 min</option>'
    +'<option value="120"'+(+_newEv.dur===120?' selected':'')+'>2 horas</option>'
    +'</select></div></div></div>'
    +'<hr class="ev-divider">'
    +'<div class="ev-row">'
    +'<div class="ev-row-ico">🔄</div>'
    +'<div class="ev-row-body">'
    +'<select class="ev-sel" id="ev-rec">'
    +'<option value="none"'+(_newEv.rec==='none'?' selected':'')+'>No se repite</option>'
    +'<option value="daily"'+(_newEv.rec==='daily'?' selected':'')+'>Todos los días</option>'
    +'<option value="weekly"'+(_newEv.rec==='weekly'?' selected':'')+'>Cada semana, el '+_DAY_LONG[dow]+'</option>'
    +'<option value="weekdays"'+(_newEv.rec==='weekdays'?' selected':'')+'>Días hábiles (lun – vie)</option>'
    +'<option value="custom"'+(_newEv.rec==='custom'?' selected':'')+'>Personalizado...</option>'
    +'</select></div></div>'
    +'<hr class="ev-divider">'
    +'<div class="ev-row">'
    +'<div class="ev-row-ico">👤</div>'
    +'<div class="ev-row-body"><input class="ev-inp" id="ev-parent" type="text" placeholder="Padre / apoderado" autocomplete="off"></div>'
    +'</div>'
    +'<div class="ev-row">'
    +'<div class="ev-row-ico">🎒</div>'
    +'<div class="ev-row-body"><select class="ev-sel" id="ev-student">'+studentOpts+'</select></div>'
    +'</div>'
    +'<hr class="ev-divider">'
    +'<div class="ev-row">'
    +'<div class="ev-row-ico">📍</div>'
    +'<div class="ev-row-body">'
    +'<div class="ev-mod-row">'
    +'<button class="ev-mod-btn'+(_newEv.modality==='Virtual'?' on':'')+'" id="ev-mod-v">💻 Virtual</button>'
    +'<button class="ev-mod-btn'+(_newEv.modality==='Domicilio'?' on':'')+'" id="ev-mod-d">🏠 A domicilio</button>'
    +'</div></div></div>'
    +'<div class="ev-footer">'
    +'<button class="ev-btn-cancel" onclick="closeModal()">Cancelar</button>'
    +'<button class="ev-btn-save" onclick="_evSave()">Guardar</button>'
    +'</div></div>';

  var ov = document.getElementById('ev-ov');
  if (!ov) { ov = document.createElement('div'); ov.id='ev-ov'; ov.className='ev-ov'; ov.onclick=function(e){ if(e.target===ov) closeModal(); }; document.body.appendChild(ov); }
  ov.innerHTML = html;

  var titleEl = document.getElementById('ev-title');
  if (titleEl) { titleEl.value = _newEv.title||''; titleEl.oninput = function(){ _newEv.title=this.value; }; titleEl.focus(); }
  var durEl = document.getElementById('ev-dur');
  if (durEl) durEl.onchange = function(){ _newEv.dur=parseInt(this.value); _renderModal(); };
  var recEl = document.getElementById('ev-rec');
  if (recEl) recEl.onchange = function(){ _evSetRec(this.value); };
  var parentEl = document.getElementById('ev-parent');
  if (parentEl) { parentEl.value=_newEv.parentName||''; parentEl.oninput=function(){ _newEv.parentName=this.value; }; }
  var stuEl = document.getElementById('ev-student');
  if (stuEl) stuEl.onchange = function(){ _newEv.studentId=this.value; };
  var modV = document.getElementById('ev-mod-v');
  if (modV) modV.onclick = function(){ _newEv.modality='Virtual'; _renderModal(); };
  var modD = document.getElementById('ev-mod-d');
  if (modD) modD.onclick = function(){ _newEv.modality='Domicilio'; _renderModal(); };

  if (_newEv.showCustomRec) _renderCustomRec();
}

function _evSetRec(val) {
  _newEv.rec = val;
  _newEv.showCustomRec = (val === 'custom');
  _renderModal();
}

function _renderCustomRec() {
  var cr = _newEv.customRec;
  var daysHtml = _DAY_LONG.map(function(_, i){
    return '<button class="ev-day-btn'+(cr.days.indexOf(i)!==-1?' on':'')+'" onclick="_evToggleDay('+i+')" title="'+_DAY_LONG[i]+'">'+_DAY_S[i]+'</button>';
  }).join('');
  var html = '<div class="ev-rec-card" onclick="event.stopPropagation()">'
    +'<div class="ev-rec-title">Recurrencia personalizada</div>'
    +'<div class="ev-rec-row"><span>Repetir cada</span>'
    +'<input class="ev-rec-num" id="rc-every" type="number" min="1" max="52" value="'+cr.every+'">'
    +'<select class="ev-rec-unit" id="rc-unit">'
    +'<option value="day"'+(cr.unit==='day'?' selected':'')+'>día</option>'
    +'<option value="week"'+(cr.unit==='week'?' selected':'')+'>semana</option>'
    +'<option value="month"'+(cr.unit==='month'?' selected':'')+'>mes</option>'
    +'</select></div>'
    +(cr.unit==='week'?'<div style="font-size:11px;color:rgba(0,0,0,0.45);font-weight:700;margin-bottom:8px;letter-spacing:.05em;text-transform:uppercase">Repetir el</div><div class="ev-days-row">'+daysHtml+'</div>':'')
    +'<div style="font-size:11px;color:rgba(0,0,0,0.45);font-weight:700;margin-bottom:10px;letter-spacing:.05em;text-transform:uppercase">Finaliza</div>'
    +'<div class="ev-end-row">'
    +'<label class="ev-end-opt"><input type="radio" name="ev-end" value="never"'+(cr.endType==='never'?' checked':'')+' onchange="_newEv.customRec.endType=\'never\';_renderCustomRec()"> Nunca</label>'
    +'<label class="ev-end-opt"><input type="radio" name="ev-end" value="date"'+(cr.endType==='date'?' checked':'')+' onchange="_newEv.customRec.endType=\'date\';_renderCustomRec()"> El &nbsp;<input class="ev-end-inp" id="rc-end-date" type="date" value="'+cr.endDate+'" '+(cr.endType!=='date'?'disabled':'')+' oninput="_newEv.customRec.endDate=this.value"></label>'
    +'<label class="ev-end-opt"><input type="radio" name="ev-end" value="count"'+(cr.endType==='count'?' checked':'')+' onchange="_newEv.customRec.endType=\'count\';_renderCustomRec()"> Después de &nbsp;<input class="ev-end-inp" id="rc-end-count" type="number" min="1" max="999" value="'+cr.endCount+'" '+(cr.endType!=='count'?'disabled':'')+' style="width:60px" oninput="_newEv.customRec.endCount=Math.max(1,parseInt(this.value)||1)"> ocurrencias</label>'
    +'</div>'
    +'<div class="ev-rec-footer">'
    +'<button class="ev-btn-cancel" onclick="_evCancelCustomRec()">Cancelar</button>'
    +'<button class="ev-btn-save" onclick="_evSaveCustomRec()">Listo</button>'
    +'</div></div>';

  var rov = document.getElementById('ev-rec-ov');
  if (!rov) { rov = document.createElement('div'); rov.id='ev-rec-ov'; rov.className='ev-rec-ov'; document.body.appendChild(rov); }
  rov.innerHTML = html;
  var evEl = document.getElementById('rc-every');
  if (evEl) evEl.oninput = function(){ _newEv.customRec.every=Math.max(1,parseInt(this.value)||1); };
  var unitEl = document.getElementById('rc-unit');
  if (unitEl) unitEl.onchange = function(){ _newEv.customRec.unit=this.value; _renderCustomRec(); };
}

function _evToggleDay(i) {
  var days=_newEv.customRec.days, idx=days.indexOf(i);
  if (idx===-1) days.push(i); else if (days.length>1) days.splice(idx,1);
  _renderCustomRec();
}

function _evCancelCustomRec() {
  _newEv.showCustomRec = false;
  if (_newEv.rec==='custom') _newEv.rec='none';
  var rov=document.getElementById('ev-rec-ov'); if(rov) rov.remove();
  _renderModal();
}

function _evSaveCustomRec() {
  var evEl=document.getElementById('rc-every'); if(evEl) _newEv.customRec.every=Math.max(1,parseInt(evEl.value)||1);
  var unitEl=document.getElementById('rc-unit'); if(unitEl) _newEv.customRec.unit=unitEl.value;
  _newEv.showCustomRec=false;
  var rov=document.getElementById('ev-rec-ov'); if(rov) rov.remove();
  _renderModal();
}

function _evSave() {
  if (!_newEv) return;
  var titleEl=document.getElementById('ev-title'), parentEl=document.getElementById('ev-parent'), stuEl=document.getElementById('ev-student');
  if (titleEl) _newEv.title=titleEl.value.trim();
  if (parentEl) _newEv.parentName=parentEl.value.trim();
  if (stuEl) _newEv.studentId=stuEl.value;
  var d=_newEv.date, dow=d.getDay();
  var session={ start:_newEv.time, dur:_newEv.dur, modality:_newEv.modality, day:dow };
  if (_newEv.title) session.title=_newEv.title;
  if (_newEv.parentName) session.parentName=_newEv.parentName;
  if (_newEv.studentId) session.studentId=_newEv.studentId;
  if (_newEv.rec!=='none') {
    session.recurring=true;
    session.recPattern=(_newEv.rec==='custom')?JSON.parse(JSON.stringify(_newEv.customRec)):{type:_newEv.rec};
  } else {
    session.recurring=false; session.date=_newEv.dateStr;
  }
  DATA.sessions.push(session);
  closeModal(); render();
  db.collection('padres').doc('main').get().then(function(doc){
    var existing=doc.exists?(doc.data().sessions||[]):[];
    existing.push(session);
    return doc.ref.set({sessions:existing},{merge:true});
  }).catch(function(e){ console.error('save session',e); });
}

/* ── Controls ───────────────────────────────────────── */
function setCalMode(m) {
  // Si se cambia a "Semana" desde "4 días", hay que realinear el ancla al lunes de esa
  // semana (calAnchor pudo haber quedado en cualquier día por la navegación en modo "4 días").
  if (m === 'week' && calMode !== 'week') calAnchor = startOfWeek(calAnchor);
  calMode = m;
  render();
}
function calStep(dir) {
  var span = calMode==='week' ? 7 : 4;
  calAnchor = addDays(calAnchor, dir*span);
  render();
}
function calGoToday() {
  calAnchor = defaultAnchor(calMode);
  render();
  setTimeout(function(){
    var sc=document.getElementById('pcal-scroll');
    if(sc){ var h=new Date().getHours(); sc.scrollTop=Math.max(0,(Math.max(8,h-1)-8)*ROW_H); }
  },80);
}

/* ── Build nav ──────────────────────────────────────── */
function buildNav(rs,re) {
  var m4=calMode==='4dias'?' on':'', mw=calMode==='week'?' on':'';
  return '<div class="pcal-toolbar">'
    +'<div class="pcal-toggle">'
    +'<button class="'+m4+'" onclick="setCalMode(\'4dias\')">4 días</button>'
    +'<button class="'+mw+'" onclick="setCalMode(\'week\')">Semana</button>'
    +'</div>'
    +'<button class="pcal-today-btn" onclick="calGoToday()">Hoy</button>'
    +'<div class="pcal-nav"><button onclick="calStep(-1)">‹</button><button onclick="calStep(1)">›</button></div>'
    +'</div>'
    +'<div class="pcal-range-bar">'+fmtDM(rs)+' — '+fmtDM(re)+'</div>'
    +'<div class="pcal-legend">'
    +'<div class="pcal-leg-item"><span class="pcal-leg-dot" style="background:rgba(239,68,68,0.55)"></span>A domicilio</div>'
    +'<div class="pcal-leg-item"><span class="pcal-leg-dot" style="background:rgba(79,182,255,0.55)"></span>Virtual</div>'
    +'<div class="pcal-leg-item"><span class="pcal-leg-dot" style="background:rgba(133,200,0,0.4);border:1.5px dashed rgba(133,200,0,0.7)"></span>Disponible</div>'
    +'</div>';
}

/* ── Build grid ─────────────────────────────────────── */
function buildGrid(dayList) {
  var today=new Date(); today.setHours(0,0,0,0);

  /* Deduplicate sessions by day+start */
  var slotMap={};
  DATA.sessions.forEach(function(s){
    var isOne=s.recurring===false && s.date;
    var key=isOne?(s.date+'|'+s.start):('d'+s.day+'|'+s.start);
    if(!slotMap[key]) slotMap[key]={day:Number(s.day),oneTimeDate:isOne?s.date:null,start:s.start,dur:s.dur||60,modality:s.modality||'Virtual',studentIds:[],students:[]};
    if((s.dur||60)>slotMap[key].dur) slotMap[key].dur=s.dur||60;
    if((s.modality||'').toLowerCase().includes('dom')) slotMap[key].modality='Domicilio';
    if(s.studentId!==undefined && s.studentId!==null){
      if(slotMap[key].studentIds.indexOf(s.studentId)===-1) slotMap[key].studentIds.push(s.studentId);
      // se guarda por separado (no solo el id) para poder excluir SOLO a este alumno en una
      // fecha puntual si su sesión tiene una excepción (skipDates) para ese día — el resto de
      // alumnos que comparten el mismo horario día+hora no se ven afectados.
      slotMap[key].students.push({ sid:s.studentId, skipDates:Array.isArray(s.skipDates)?s.skipDates:[], cycleId:s.cycleId, nWeeks:s.nWeeks||0, weekStart:s.weekStart||null });
    }
  });

  var freeList=DATA.freeSlots||[];
  var hasSlots=Object.keys(slotMap).length>0||freeList.length>0;
  if(!hasSlots) return '<div class="pcal-head-row"><div class="pcal-gutter"></div></div><div class="pcal-empty">Sin horarios registrados</div>';

  /* Smart time range */
  var dynMin=23,dynMax=0;
  Object.values(slotMap).forEach(function(sl){
    var h=toH(sl.start); if(h<dynMin)dynMin=h;
    var e=h+sl.dur/60; if(e>dynMax)dynMax=e;
  });
  freeList.forEach(function(fs){
    var h=toH(fs.start); if(h<dynMin)dynMin=h;
    var e=h+(fs.dur||60)/60; if(e>dynMax)dynMax=e;
  });
  var MIN_H=Math.max(0,Number.isInteger(dynMin)?dynMin-1:Math.floor(dynMin));
  _calMinH = MIN_H;
  var MAX_H=Math.min(24,Math.ceil(dynMax));
  var HOURS=[]; for(var i=MIN_H;i<MAX_H;i++) HOURS.push(i);
  var totalH=HOURS.length*ROW_H;

  var appEl=document.getElementById('app');
  var appW=appEl?appEl.offsetWidth:(window.innerWidth||390);
  // Medimos el ancho REAL del contenedor con scroll (pcal-scroll, que viene del render
  // anterior y sigue en el DOM en este punto), no el de #app. pcal-scroll usa
  // overflow-y:scroll, así que reserva siempre el espacio de su scrollbar vertical —
  // su clientWidth ya excluye ese espacio de forma estable. Si no existe aún (primera
  // carga), restamos un margen de seguridad equivalente al de un scrollbar típico para
  // evitar que las columnas queden más anchas de lo que cabe (recortando un poquito el
  // último día, ej. domingo, y forzando un scroll horizontal mínimo para verlo completo).
  var scrollElPrev=document.getElementById('pcal-scroll');
  var containerW=(scrollElPrev&&scrollElPrev.clientWidth)?scrollElPrev.clientWidth:(appW-16);
  var numCols=dayList.length;
  // El mínimo de columna era fijo en 58px sin importar cuántos días se muestran. En vista
  // "Semana" (7 columnas) eso fuerza un ancho total mayor al disponible en la mayoría de
  // celulares (7×58=406px + 42px de gutter = 448px, más de lo que cabe en pantallas típicas
  // de ~360-410px), y como no hay scroll horizontal, el último día (domingo) queda recortado
  // y no se puede ver. El mínimo ahora se escala según la cantidad de columnas para que las
  // 7 siempre quepan sin necesidad de scroll.
  var minColW = numCols>=6 ? 40 : 58;
  var colW=Math.max(Math.floor((containerW-42)/numCols),minColW);

  /* Day headers */
  var hdrs=dayList.map(function(d){
    var isPast=d<today,isTod=d.getTime()===today.getTime();
    var cls='pcal-dh'+(isTod?' is-today':'')+(isPast?' is-past':'');
    return '<div class="'+cls+'" style="width:'+colW+'px">'
      +'<div class="pcal-dh-name">'+DAY_SHORT[d.getDay()]+'</div>'
      +'<div class="pcal-dh-num">'+d.getDate()+'</div>'
      +(isTod?'<div><span class="pcal-dh-hoy">HOY</span></div>':'')
      +'</div>';
  }).join('');

  /* Time labels */
  var tls=HOURS.map(function(h){
    return '<div class="pcal-tl-slot" style="height:'+ROW_H+'px">'+String(h).padStart(2,'0')+'h</div>';
  }).join('');

  /* Columns */
  var cols=dayList.map(function(d){
    var dow=d.getDay(), ds=dStr(d);
    var isPast=d<today,isTod=d.getTime()===today.getTime();
    var cls='pcal-day-col'+(isTod?' is-today':'')+(isPast?' is-past':'');
    var lines=HOURS.map(function(){ return '<div class="pcal-hour-line" style="height:'+ROW_H+'px"></div>'; }).join('');

    /* Session cards */
    var cards=Object.values(slotMap).filter(function(sl){
      if(sl.oneTimeDate) return sl.oneTimeDate===ds;
      return sl.day===dow;
    }).map(function(slot){
      // Si la sesión es recurrente, se excluye en esta fecha a los alumnos cuya sesión
      // tiene este día puntual en skipDates (porque ese alumno tiene una excepción —
      // se editó solo para esta fecha y ya aparece como tarjeta de una sola vez aparte),
      // o cuyo propio ciclo (cycleId) ya terminó antes de esta fecha.
      var activeIds = slot.oneTimeDate ? slot.studentIds
        : slot.students.filter(function(st){ return calIsStudentActive(st, d, ds); })
            .map(function(st){ return st.sid; });
      if(!activeIds.length) return '';
      var topPx=(toH(slot.start)-MIN_H)*ROW_H;
      var hPx=Math.max((slot.dur/60)*ROW_H-3,28);
      var end=addM(slot.start,slot.dur);
      var isDom=slot.modality.toLowerCase().includes('dom');
      var short=hPx<42;
      var bg  =isDom?'rgba(239,68,68,0.10)':'rgba(79,182,255,0.10)';
      var brd =isDom?'rgba(239,68,68,0.45)':'rgba(79,182,255,0.45)';
      var nameC=isDom?'#b91c1c':'#1d6fa4';
      return '<div class="pcal-ev" style="top:'+topPx+'px;height:'+hPx+'px;left:2px;width:'+(colW-4)+'px;background:'+bg+';border:1px solid '+brd+'">'
        +'<div class="pcal-ev-name" style="color:'+nameC+'">'+slotNames(activeIds)+'</div>'
        +(short?'':'<div class="pcal-ev-time">'+slot.start+'–'+end+'</div>')
        +(short?'':'<div class="pcal-ev-badge">'+slot.modality+'</div>')
        +'</div>';
    }).join('');

    var activeSessIntervals = calActiveSessIntervals(
      Object.values(slotMap).filter(function(sl){
        return sl.oneTimeDate ? sl.oneTimeDate===ds : sl.day===dow;
      }), d, ds);

    /* Free slot cards */
    var freeCards=freeList.filter(function(fs){
      if(fs.bookedBy) return false;
      return calShouldShowFreeSlot(fs, d, ds, dow, activeSessIntervals);
    }).map(function(fs){
      var topPx=Math.max((toH(fs.start)-MIN_H)*ROW_H,0);
      var hPx=Math.max(((fs.dur||60)/60)*ROW_H-3,28);
      var end=addM(fs.start,fs.dur||60);
      var short=hPx<42;
      return '<div class="pcal-free-slot" style="top:'+topPx+'px;height:'+hPx+'px;left:2px;width:'+(colW-4)+'px">'
        +'<div class="pcal-free-lbl">Disponible</div>'
        +(short?'':'<div class="pcal-free-time">'+fs.start+'–'+end+'</div>')
        +'</div>';
    }).join('');

    return '<div class="'+cls+'" style="width:'+colW+'px;height:'+totalH+'px;cursor:crosshair" onclick="_evClickCol(event,\''+ds+'\')">'+lines+cards+freeCards+'</div>';
  }).join('');

  /* Now indicator */
  var nowHtml='';
  var now=new Date(); var curH=now.getHours()+now.getMinutes()/60;
  if(curH>=MIN_H && curH<MAX_H){
    var todayIdx=-1;
    dayList.forEach(function(d,i){ if(d.getTime()===today.getTime()) todayIdx=i; });
    if(todayIdx!==-1){
      var topNow=(curH-MIN_H)*ROW_H;
      nowHtml='<div class="pcal-now" style="top:'+topNow+'px;left:'+(todayIdx*colW)+'px;width:'+colW+'px">'
        +'<div class="pcal-now-dot"></div><div class="pcal-now-line"></div></div>';
    }
  }

  return '<div class="pcal-head-row"><div class="pcal-gutter"></div>'
    +'<div class="pcal-days-hdr" style="width:'+(colW*numCols)+'px">'+hdrs+'</div></div>'
    +'<div class="pcal-body-scroll" id="pcal-scroll">'
    +'<div class="pcal-body-inner" style="padding-bottom:24px">'
    +'<div class="pcal-tl">'+tls+'</div>'
    +'<div class="pcal-days-body" style="width:'+(colW*numCols)+'px">'+cols+nowHtml+'</div>'
    +'</div></div>';
}

/* ── Render ─────────────────────────────────────────── */
function render() {
  var days=calMode==='week'?7:4;
  var rs=calAnchor, re=addDays(calAnchor,days-1);
  var dayList=[]; for(var i=0;i<days;i++) dayList.push(addDays(rs,i));
  document.getElementById('app').innerHTML=
    '<div class="pcal-outer">'+buildNav(rs,re)+buildGrid(dayList)+'</div>';
  setTimeout(function(){
    var sc=document.getElementById('pcal-scroll');
    if(sc){ var h=new Date().getHours(); sc.scrollTop=Math.max(0,(Math.max(8,h-1)-8)*ROW_H); }
  },60);
}

/* ── Load ───────────────────────────────────────────── */
db.collection('padres').doc('main').get().then(function(doc){
  if(doc.exists){
    var d=doc.data();
    DATA.sessions =d.sessions ||[];
    DATA.freeSlots=d.freeSlots||[];
    DATA.cycleEnd =d.cycleEnd ||null;
    DATA.cycles   =d.cycles  ||[];
    DATA.students =d.students ||{};
  }
  render();
}).catch(function(){ render(); });
</script>
